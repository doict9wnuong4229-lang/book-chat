        if (isFinal) {
          headEl.className = 'ok-t';
          headEl.innerHTML = `✅ ${isArUi ? 'اكتمل اختبار التفكير بنجاح!' : 'ทดสอบ Think สำเร็จ!'} (${(st.ms / 1000).toFixed(2)}s · Model: ${escA(st.model)})`;
        } else if (st.phase === 'thinking') {
          headEl.innerHTML = `🧠 ${isArUi ? 'النموذج يفكر الآن بشكل حيّ…' : 'โมเดลกำลังคิดวิเคราะห์แบบเรียลไทม์ (Thinking)…'}`;
        } else if (st.phase === 'answering') {
          headEl.innerHTML = `✍️ ${isArUi ? 'جاري كتابة الإجابة مباشرة…' : 'กำลังสตรีมคำตอบแบบเรียลไทม์…'}`;
        } else if (st.phase === 'fallback' || st.phase === 'retry') {
          headEl.innerHTML = `🔄 ${isArUi ? 'جاري التوافق مع المزود…' : 'กำลังปรับโหมดความเข้ากันได้กับ Relay…'}`;
        }
        if (cfgEl && st.configSent) {
          cfgEl.innerHTML = `Config: <code>${escA(JSON.stringify(st.configSent))}</code>${st.fallbackUsed ? ` <span style="color:#d97706;font-weight:700">(Relay ใช้ค่าเริ่มต้นของโมเดล)</span>` : ''}`;
        }
        const u = st.usage || {};
        if (toksEl && (u.promptTokens || u.thoughtTokens || u.completionTokens || isFinal)) {
          toksEl.innerHTML = `
            <span style="padding:2px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line)">Prompt: <b>${u.promptTokens || 0}</b> tok</span>
            <span style="padding:2px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);font-weight:700">🧠 Thought: <b>${u.thoughtTokens || 0}</b> tok</span>
            <span style="padding:2px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line)">Output: <b>${u.completionTokens || 0}</b> tok</span>
          `;
        }
        if (thoughtEl && st.thoughtText) {
          thoughtEl.style.display = 'block';
          thoughtEl.innerHTML = `<b>💭 ${isArUi ? 'مسار التفكير (Live Thought):' : 'กระบวนการคิด (Live Thought):'}</b>
${escA(st.thoughtText)}`;
          thoughtEl.scrollTop = thoughtEl.scrollHeight;
        }
        if (ansEl && (st.answerText || isFinal)) {
          ansEl.style.display = 'block';
          ansEl.innerHTML = `<b>📝 ${isArUi ? 'الإجابة:' : 'คำตอบที่ได้:'}</b>
${escA(st.answerText || '(ไม่มีข้อความตอบกลับ)')}`;
        }
      };

      try {
        const res = await eng.testThinkConnection(inpPrompt.value, {
          thinkEnabled: curEn,
          thinkMode: curMd,
          onProgress: st => paintLiveProgress(st, false),
        });
        clearInterval(iv);
        if (timerEl) timerEl.textContent = `${(res.ms / 1000).toFixed(2)}s`;
        paintLiveProgress(res, true);
      } catch (e) {
        clearInterval(iv);
        outBox.innerHTML = `<div class="bad-t">✗ ทดสอบ Think ไม่สำเร็จ: ${escA(e.message || String(e))}</div>`;
      } finally {
        clearInterval(iv);
        btn.disabled = false;
      }
    };

    q('#thk-open-set').onclick = () => {
      closeSheet();
      setTimeout(() => openSettings(true), 60);
    };
    q('#thk-save').onclick = async () => {
      eng?.setThinkEnabled?.(curEn);
      eng?.setThinkMode?.(curMd);
      await __gmFlush();
      closeSheet();
    };
  }
  window.__bcOpenThinkTestModal = openThinkTestModal;

  function openSettings(focusCurrentKey = false) {
    const curR = getFont('bc_font_reader', 'kitab');
    const curC = getFont('bc_font_chat', 'scheh');
    const oldProv = getActiveProv();
    const oldModel = getProvModel(oldProv);
    const oldProxy = localStorage.getItem('bc_proxy') || '';
    const oldPKey = localStorage.getItem('bc_proxy_key') || '';
    const oldAll = localStorage.getItem('bc_proxy_all') === '1';
    const t = T();
    const provOptionsHtml = selProv => {
      const map = getAllProvsMap();
      return Object.entries(map).map(([k, v]) =>
        `<option value="${escA(k)}"${k === selProv ? ' selected' : ''}>${escA(v.label || k)}</option>`
      ).join('');
    };
    const modelOptionsHtml = selModel => {
      const all = getModelsAll();
      if (selModel && !all.includes(selModel)) all.push(selModel);
      return all.map(m => `<option value="${escA(m)}"${m === selModel ? ' selected' : ''}>${escA(m)}${BUILTIN_MODELS.includes(m) ? '' : ' (custom)'}</option>`).join('');
    };
    const initProvObj = getAllProvsMap()[oldProv] || { shortLabel: oldProv };

    openSheet(`<h3>${t.mSet}</h3>
      <label>${t.langTitle}</label>
      <select id="s-uilang" style="width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:600 14px var(--ui)">
        ${Object.entries(UI_LANGS).map(([k, v]) => `<option value="${k}"${k === uiLang ? ' selected' : ''}>${v.name}</option>`).join('')}
      </select>

      <label>${t.apiProviderLbl}</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="s-provider" dir="ltr" style="flex:1;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:600 14px var(--ui)">
          ${provOptionsHtml(oldProv)}
        </select>
        <button type="button" id="s-del-provider" title="ลบ API Provider ที่เพิ่มเอง" style="border:1px solid var(--line-strong);background:var(--bg);color:#dc2626;border-radius:12px;padding:11px 12px;font:600 13px var(--ui);cursor:pointer">🗑</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap">
        <input type="text" id="s-new-provider" dir="ltr" placeholder="เพิ่ม API Provider เช่น https://my-api.com/v1" style="flex:1;min-width:170px">
        <select id="s-new-provider-type" dir="ltr" style="padding:10px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:600 13px var(--ui)">
          <option value="auto">Auto</option>
          <option value="gemini">Gemini</option>
          <option value="openai">OpenAI / Claude (/v1)</option>
        </select>
        <button type="button" id="s-add-provider" style="border:1.5px solid var(--pri);background:var(--pri2);color:var(--pri);border-radius:12px;padding:10px 14px;font:600 13px var(--ui);cursor:pointer;white-space:nowrap">+ เพิ่ม Provider</button>
      </div>

      <label id="lbl-key">API Key — ${escA(initProvObj.shortLabel || oldProv)}</label>
      <input type="password" id="s-key" value="${escA(getRawProvKey(oldProv))}" placeholder="ใส่ API Key สำหรับ ${escA(initProvObj.shortLabel || oldProv)}...">
      <div class="chk"><input type="checkbox" id="s-show"> Show Key / แสดงคีย์</div>

      <label>${t.modelLbl}</label>
      <div style="display:flex;gap:6px;align-items:center">
        <select id="s-model" dir="ltr" style="flex:1;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:600 14px var(--ui)">
          ${modelOptionsHtml(oldModel)}
        </select>
        <button type="button" id="s-del-model" title="ลบโมเดลที่เพิ่มเอง" style="border:1px solid var(--line-strong);background:var(--bg);color:#dc2626;border-radius:12px;padding:11px 12px;font:600 13px var(--ui);cursor:pointer">🗑</button>
      </div>
      <div style="display:flex;gap:6px;margin-top:6px">
        <input type="text" id="s-new-model" dir="ltr" placeholder="พิมพ์ชื่อโมเดลใหม่ เช่น claude-opus-4-6" style="flex:1">
        <button type="button" id="s-add-model" style="border:1.5px solid var(--pri);background:var(--pri2);color:var(--pri);border-radius:12px;padding:0 14px;font:600 13px var(--ui);cursor:pointer;white-space:nowrap">+ เพิ่มโมเดล</button>
      </div>

      <label>Tavily Search API Key (สำหรับปุ่ม 🌐 Search ทั้งใน باحث และ تأليف)</label>
      <div style="display:flex;gap:6px;align-items:center">
        <input type="password" id="s-tavily-key" value="${escA(window.__bcAuthorEngine?.getTavilyKey?.() || GM_getValue('tavilyKey', '') || '')}" placeholder="tvly-..." style="flex:1">
        <button type="button" id="s-test-tavily" style="border:1.5px solid var(--gold);background:var(--gold-soft);color:#8c6518;border-radius:12px;padding:10px 12px;font:600 12.5px var(--ui);cursor:pointer;white-space:nowrap">🧪 ทดสอบ Search</button>
        <button type="button" id="s-test-think" style="border:1.5px solid var(--pri);background:var(--pri2);color:var(--pri);border-radius:12px;padding:10px 12px;font:600 12.5px var(--ui);cursor:pointer;white-space:nowrap">🧠 ทดสอบ Think</button>
      </div>

      <label>${t.qcLabel || 'จำนวนคำค้นหา (البحث بـ / Search Queries)'}</label>
      <select id="s-query-count" style="width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:600 14px var(--ui)">
        <option value="1">1 ${t.qc_unit || 'คำ'} (เร็วที่สุด / ค้นตรงตัว)</option>
        <option value="2">2 ${t.qc_unit || 'คำ'}</option>
        <option value="3">3 ${t.qc_unit || 'คำ'} (เร็ว / กระชับ)</option>
        <option value="4">4 ${t.qc_unit || 'คำ'}</option>
        <option value="5">5 ${t.qc_unit || 'คำ'} (ค่าเริ่มต้น / แนะนำ)</option>
        <option value="6">6 ${t.qc_unit || 'คำ'}</option>
        <option value="7">7 ${t.qc_unit || 'คำ'} (ครอบคลุมกว้าง)</option>
        <option value="8">8 ${t.qc_unit || 'คำ'}</option>
        <option value="10">10 ${t.qc_unit || 'คำ'} (ละเอียดเข้มข้นสูงสุด)</option>
        <option value="12">12 ${t.qc_unit || 'คำ'} (เจาะลึกพิเศษ)</option>
        <option value="15">15 ${t.qc_unit || 'คำ'} (สูงสุด 15 คำ)</option>
      </select>
      <div class="hint" style="margin-top:2px;font-size:11.5px;color:var(--txt-3)">${t.qcHint || 'กำหนดจำนวนคำค้นที่ AI สร้างขึ้นเพื่อสืบค้นในคลัง (البحث بـ:) ยิ่งมากยิ่งกวาดเนื้อหาได้ละเอียดและครอบคลุม'}</div>

      <label>CORS Proxy</label>
      <input type="text" id="s-proxy" value="${escA(oldProxy)}" placeholder="https://your-worker.workers.dev/?url={url}">
      <div class="mini"><button id="s-cfx">Corsfix</button><button id="s-clr">No Proxy / ไม่ใช้ proxy</button></div>

      <label>Corsfix API Key</label>
      <input type="password" id="s-pkey" value="${escA(oldPKey)}" placeholder="cfx_...">

      <div class="chk"><input type="checkbox" id="s-all" ${oldAll ? 'checked' : ''}> Proxy Gemini API</div>
      <div class="hint">Origin: <b dir="ltr">${escA(location.origin)}</b></div>
      <div class="mini"><button id="s-test">🔍 Test Proxy (Turath)</button></div>
      <div id="s-test-out"></div>
      <label>${t.fontReaderLbl}</label>
      <select id="s-rfont" style="width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:inherit">${fontOpts(curR)}</select>
      <label>${t.fontChatLbl}</label>
      <select id="s-cfont" style="width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line-strong);background:var(--bg);color:var(--txt);font:inherit">${fontOpts(curC)}</select>
      <div id="s-fprev" dir="rtl" style="margin:10px 6px;padding:12px 14px;border:1px dashed var(--line-strong);background:var(--bg);border-radius:12px;font-size:22px;line-height:2.1;text-align:right;font-family:${AR_FONTS[curR].stack}">الشَّرْطُ الثَّامِنُ: الْإِمْسَاكُ عَنِ الْأَكْلِ. فَلَوْ أَكَلَ شَيْئًا، وَإِنْ قَلَّ، بَطَلَتْ صَلَاتُهُ</div>
      <div class="btns"><button id="s-cancel">${t.cancelBtn}</button><button class="ok" id="s-save">${t.saveBtn}</button></div>`);

    const q = id => sheet.querySelector(id);
    const selProv = q('#s-provider');
    const inpNewProv = q('#s-new-provider');
    const selNewProvType = q('#s-new-provider-type');
    const btnDelProv = q('#s-del-provider');
    const kInput = q('#s-key');
    const lblKey = q('#lbl-key');
    const selMod = q('#s-model');
    const inpNewMod = q('#s-new-model');
    const btnDelMod = q('#s-del-model');

    const tempKeysByProv = {};
    const tempModelsByProv = {};
    for (const pk of Object.keys(getAllProvsMap())) {
      tempKeysByProv[pk] = getRawProvKey(pk);
      tempModelsByProv[pk] = getProvModel(pk);
    }
    let curProvInModal = oldProv;

    const syncDelProvBtn = () => {
      btnDelProv.disabled = !!BUILTIN_PROVIDERS[curProvInModal];
      btnDelProv.style.opacity = btnDelProv.disabled ? '.35' : '1';
    };
    const syncDelModBtn = () => {
      btnDelMod.disabled = BUILTIN_MODELS.includes(selMod.value);
      btnDelMod.style.opacity = btnDelMod.disabled ? '.35' : '1';
    };
    const syncKeyFieldForProv = pv => {
      const pMap = getAllProvsMap();
      const pName = pMap[pv]?.shortLabel || pv;
      lblKey.textContent = `API Key — ${pName}`;
      kInput.value = tempKeysByProv[pv] ?? getRawProvKey(pv) ?? '';
      kInput.placeholder = `ใส่ API Key สำหรับ ${pName}...`;
    };
    syncDelProvBtn();
    syncDelModBtn();

    kInput.addEventListener('input', () => {
      tempKeysByProv[curProvInModal] = kInput.value.trim();
    });

    const switchModalProvider = pv => {
      tempKeysByProv[curProvInModal] = kInput.value.trim();
      tempModelsByProv[curProvInModal] = selMod.value;
      curProvInModal = pv;
      selProv.value = pv;
      const mForPv = tempModelsByProv[pv] || getProvModel(pv);
      selMod.innerHTML = modelOptionsHtml(mForPv);
      syncKeyFieldForProv(pv);
      syncDelProvBtn();
      syncDelModBtn();
    };

    selProv.onchange = () => {
      switchModalProvider(selProv.value);
    };

    const addCustomProviderFromInput = () => {
      const raw = inpNewProv.value.trim();
      if (!raw) return false;
      const cp = parseNewProvider(raw, selNewProvType.value);
      if (!cp) return false;
      tempKeysByProv[curProvInModal] = kInput.value.trim();
      tempModelsByProv[curProvInModal] = selMod.value;
      if (!BUILTIN_PROVIDERS[cp.id]) {
        setCustProviders([...getCustProviders().filter(x => x.id !== cp.id), cp]);
      }
      if (!(cp.id in tempKeysByProv)) tempKeysByProv[cp.id] = getRawProvKey(cp.id);
      if (!(cp.id in tempModelsByProv)) tempModelsByProv[cp.id] = getProvModel(cp.id);
      curProvInModal = cp.id;
      selProv.innerHTML = provOptionsHtml(cp.id);
      selMod.innerHTML = modelOptionsHtml(tempModelsByProv[cp.id]);
      inpNewProv.value = '';
      syncKeyFieldForProv(cp.id);
      syncDelProvBtn();
      syncDelModBtn();
      window.__bcSyncProviderAndModels?.();
      return true;
    };
    q('#s-add-provider').onclick = () => {
      if (!addCustomProviderFromInput()) inpNewProv.focus();
      else kInput.focus();
    };
    inpNewProv.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        if (addCustomProviderFromInput()) kInput.focus();
      }
    });
    btnDelProv.onclick = () => {
      if (BUILTIN_PROVIDERS[curProvInModal]) return;
      const delId = curProvInModal;
      setCustProviders(getCustProviders().filter(x => x.id !== delId));
      delete tempKeysByProv[delId];
      delete tempModelsByProv[delId];
      curProvInModal = 'api.relayrouter.ai';
      GM_setValue('apiProvider', curProvInModal);
      try { localStorage.setItem('bc_api_provider', curProvInModal); } catch (_) {}
      selProv.innerHTML = provOptionsHtml(curProvInModal);
      selMod.innerHTML = modelOptionsHtml(tempModelsByProv[curProvInModal] || getProvModel(curProvInModal));
      syncKeyFieldForProv(curProvInModal);
      syncDelProvBtn();
      syncDelModBtn();
      window.__bcSyncProviderAndModels?.();
    };

    selMod.onchange = () => {
      tempModelsByProv[curProvInModal] = selMod.value;
      syncDelModBtn();
    };
    const addCustomModelFromInput = () => {
      const v = inpNewMod.value.trim();
      if (!v) return false;
      if (!BUILTIN_MODELS.includes(v)) {
        setCustModels([...getCustModels(), v]);
      }
      tempModelsByProv[curProvInModal] = v;
      selMod.innerHTML = modelOptionsHtml(v);
      inpNewMod.value = '';
      syncDelModBtn();
      window.__bcSyncProviderAndModels?.();
      return true;
    };
    q('#s-add-model').onclick = () => {
      if (!addCustomModelFromInput()) inpNewMod.focus();
    };
    inpNewMod.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        addCustomModelFromInput();
      }
    });
    btnDelMod.onclick = () => {
      const m = selMod.value;
      if (BUILTIN_MODELS.includes(m)) return;
      setCustModels(getCustModels().filter(x => x !== m));
      const fallback = getAllProvsMap()[curProvInModal]?.defaultModel || 'gemini-3.8-flash';
      tempModelsByProv[curProvInModal] = fallback;
      setProvModel(curProvInModal, fallback);
      selMod.innerHTML = modelOptionsHtml(fallback);
      syncDelModBtn();
      window.__bcSyncProviderAndModels?.();
    };
    const tavKeyInput = q('#s-tavily-key');
    const selQc = q('#s-query-count');
    if (selQc) selQc.value = String(window.__bcGetQueryCount ? window.__bcGetQueryCount() : (GM_getValue('queryCount', 5) || 5));
    q('#s-show').onchange = e => {
      kInput.type = e.target.checked ? 'text' : 'password';
      if (tavKeyInput) tavKeyInput.type = e.target.checked ? 'text' : 'password';
    };
    q('#s-test-tavily')?.addEventListener('click', () => {
      if (tavKeyInput) window.__bcAuthorEngine?.setTavilyKey?.(tavKeyInput.value.trim());
      closeSheet();
      setTimeout(() => openTavilyTestModal(), 60);
    });
    q('#s-test-think')?.addEventListener('click', () => {
      closeSheet();
      setTimeout(() => openThinkTestModal(), 60);
    });
    if (focusCurrentKey) {
      setTimeout(() => kInput?.focus(), 60);
    }
    q('#s-cfx').onclick = () => { q('#s-proxy').value = CORSFIX; };
    q('#s-clr').onclick = () => { q('#s-proxy').value = ''; };
    q('#s-cancel').onclick = closeSheet;

    q('#s-uilang').onchange = () => {
      applyUiLang(q('#s-uilang').value);
    };

    const fprev = q('#s-fprev');
    const onFont = e => {
      const rv = q('#s-rfont').value;
      const cv = q('#s-cfont').value;
      setFontPref('bc_font_reader', rv);
      setFontPref('bc_font_chat', cv);
      applyFonts();
      const sel = e && e.target && e.target.id === 's-cfont' ? q('#s-cfont') : q('#s-rfont');
      fprev.style.fontFamily = AR_FONTS[sel.value].stack;
    };
    q('#s-rfont').onchange = onFont;
    q('#s-cfont').onchange = onFont;

    q('#s-test').onclick = async () => {
      const out = q('#s-test-out');
      out.className = ''; out.textContent = 'Testing…';
      const target = 'https://api.turath.io/search?q=' + encodeURIComponent('الصلاة') + '&ver=3';
      const p = q('#s-proxy').value.trim(), pk = q('#s-pkey').value.trim();
      const url = !p ? target : (p.includes('{url}') ? p.replace('{url}', encodeURIComponent(target)) : p + encodeURIComponent(target));
      const headers = { Accept: 'application/json' };
      if (p && pk) headers['x-corsfix-key'] = pk;
      try {
        const r = await fetch(url, { headers });
        const tx = await r.text();
        if (r.ok && /"data"/.test(tx)) { out.className = 'ok-t'; out.textContent = `✓ OK (HTTP ${r.status})`; }
        else { out.className = 'bad-t'; out.textContent = `✗ HTTP ${r.status}: ${tx.slice(0, 200)}`; }
      } catch (e) {
        out.className = 'bad-t';
        out.textContent = `✗ ${e.message || e}`;
      }
    };

    q('#s-save').onclick = async () => {
      addCustomProviderFromInput();
      addCustomModelFromInput();
      const newProv = selProv.value;
      tempKeysByProv[curProvInModal] = kInput.value.trim();
      tempModelsByProv[newProv] = selMod.value;
      const newProxy = q('#s-proxy').value.trim();
      const newPKey = q('#s-pkey').value.trim();
      const newAll = q('#s-all').checked;

      applyUiLang(q('#s-uilang').value);
      setFontPref('bc_font_reader', q('#s-rfont').value);
      setFontPref('bc_font_chat', q('#s-cfont').value);
      applyFonts();

      for (const [pk, kv] of Object.entries(tempKeysByProv)) {
        setProvKey(pk, kv);
      }
      for (const [pk, mv] of Object.entries(tempModelsByProv)) {
        if (mv) setProvModel(pk, mv);
      }
      GM_setValue('apiProvider', newProv);
      localStorage.setItem('bc_api_provider', newProv);
      window.__bcSyncProviderAndModels?.();
      sr.querySelector(`#options-panel [data-provider="${CSS.escape(newProv)}"]`)?.click();
      refreshWelcomeKey();

      if (tavKeyInput) window.__bcAuthorEngine?.setTavilyKey?.(tavKeyInput.value.trim());
      const newQc = q('#s-query-count')?.value;
      if (newQc) {
        if (window.__bcSetQueryCount) window.__bcSetQueryCount(newQc);
        else GM_setValue('queryCount', +newQc || 5);
        window.__bcPaintQcButtons?.();
      }
      localStorage.setItem('bc_proxy', newProxy);
      localStorage.setItem('bc_proxy_key', newPKey);
      localStorage.setItem('bc_proxy_all', newAll ? '1' : '0');
      await __gmFlush();

      if (newProxy !== oldProxy || newPKey !== oldPKey || newAll !== oldAll) {
        location.reload();
      } else {
        closeSheet();
      }
    };
  }

  // ---------- เมนูตั้งค่าระบบ (เปิดจากปุ่ม الإعدادات ด้านล่าง) & ปุ่มหมุนสลับโหมด تأليف الكتاب ด้านบนซ้าย ----------

Origin: ${location.origin}\nProxy: ${localStorage.getItem('bc_proxy') || '(ไม่ใช้)'}\nCorsfix key: ${localStorage.getItem('bc_proxy_key') ? 'ตั้งแล้ว' : '-'}\nธีม: ${THEMES[themeMode()]}`);

  // ---------- ยังไม่มีคีย์ → เปิดหน้าตั้งค่าแทน prompt ----------

  // ---------- หน้าต้อนรับ + ปุ่มเลื่อนลงล่างสุดของหน้าแชท ----------
  const msgs = $('#msgs');

  const refreshWelcomeKey = () => {

  const paintWelcome = () => {

    if (has && w) w.remove();
    if (!has && !w) {
      const t = T();
      const dir = UI_LANGS[uiLang]?.dir || 'ltr';

  // ---------- textarea ยืดตามข้อความ ----------
  const inp = $('#inp');

  inp.addEventListener('input', fit);
  $('#send').addEventListener('click', () => setTimeout(fit, 0));

  // ---------- เลขหน้าตามเล่มพิมพ์ (ج/ص) ใน reader ----------
  (() => {
    const rpg = $('#rpg'), rtot = $('#rtot'), rtitle = $('#rtitle'), rlink = $('#rlink');
    const en = s => String(s || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
      .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim();
    const isT = () => /app\.turath\.io\/book\//.test(rlink.href || '');
    const curLoc = () => {
      const m = en(rtitle.textContent).match(/(?:ج\s*(\d+)\s*)?ص\s*(\d+)\s*$/);
      return m ? { v: m[1] || '', p: m[2] } : null;
    };
    const idx = () => (rlink.href.match(/[?&]page=(\d+)/) || [])[1] || '';

    const vb = document.createElement('button');
    vb.className = 'vbadge';
    vb.hidden = true;
    vb.title = 'แตะเพื่อไป เล่ม/หน้า ตามเล่มพิมพ์';
    rpg.before(vb);

    const paint = () => setTimeout(() => {
      const l = isT() && curLoc();
      vb.hidden = !l || !l.v;
      if (!l) return;
      vb.textContent = `ج${l.v}`;
      if (sr.activeElement !== rpg) rpg.value = l.p;
      const tot = (rtot.textContent.match(/\/\s*([\d,]+)/) || [])[1];
      rtot.textContent = `· #${idx()}${tot ? ' / ' + tot : ''}`;
      rtot.title = 'ลำดับหน้าในไฟล์ Turath';
    }, 0);
    new MutationObserver(paint).observe(rtitle, { childList: true, characterData: true, subtree: true });

    const bookId = () => (rlink.href.match(/\/book\/(\d+)/) || [])[1];
    const readTotal = () => +((rtot.textContent.match(/\/\s*([\d,]+)/) || [])[1] || '').replace(/,/g, '') || 0;
    const metaAt = i => new Promise(res => GM_xmlhttpRequest({
      method: 'GET', timeout: 20000,
      url: `https://api.turath.io/page?book_id=${bookId()}&pg=${i}&ver=3`,
      onload: r => {
        if (r.status === 404) return res({ i, out: true });
        try {
          const j = JSON.parse(r.responseText);
          if (!j || (!j.meta && !j.text)) return res({ i, out: true });
          const m = typeof j.meta === 'string' ? JSON.parse(j.meta) : (j.meta || {});
          const p = parseInt(en(m.page));
          res({ i, v: parseInt(en(m.vol)) || 1, p: Number.isFinite(p) ? p : NaN });
        } catch { res(null); }
      },
      onerror: () => res(null), ontimeout: () => res(null),
    }));
    const cmp = (a, b) => (a.v - b.v) || (a.p - b.p);

    async function findPrinted(T, total) {
      let lo = { i: 0, v: -Infinity, p: -Infinity }, hi = { i: total + 1, v: Infinity, p: Infinity };
      const l = curLoc(), here = +idx() || 1, lv = +(l?.v) || 1;
      let guess = l && lv === T.v ? here + (T.p - +l.p)
                : T.v > lv ? (here + total) >> 1 : here >> 1;
      const seen = new Set();
      for (let n = 0; n < 30 && hi.i - lo.i > 1; n++) {
        guess = Math.min(hi.i - 1, Math.max(lo.i + 1, guess));
        if (seen.has(guess)) guess = (lo.i + hi.i) >> 1;
        if (seen.has(guess)) break;
        seen.add(guess);
        const m = await metaAt(guess);
        if (!m) return { err: true };
        if (m.out) { hi = { i: guess, v: Infinity, p: Infinity }; guess = (lo.i + guess) >> 1; continue; }
        if (!Number.isFinite(m.p)) { guess++; continue; }
        const c = cmp(m, T);
        if (c === 0) return { i: m.i, v: m.v, p: m.p };
        if (c < 0) lo = m; else hi = m;
        guess = lo.v === T.v ? lo.i + (T.p - lo.p)
              : hi.v === T.v ? hi.i - (hi.p - T.p)
              : (lo.i + hi.i) >> 1;
      }
      const ok = x => Number.isFinite(x.p);
      const near = [hi, lo].find(x => ok(x) && x.v === T.v) || [hi, lo].find(ok) || null;
      return { near };
    }

    let want = null, busy = false, syncRaf = 0;
    const syncPg = () => {
      cancelAnimationFrame(syncRaf);
      syncRaf = requestAnimationFrame(() => {
        if (busy || !isT()) return;
        if (want && +idx() === want.i) { rpg.value = String(want.p); want = null; return; }
        if (sr.activeElement === rpg) return;
        const l = curLoc();
        if (l && Number.isFinite(+l.p)) rpg.value = String(l.p);
      });
    };
    const mo = new MutationObserver(syncPg);
    mo.observe(rtot, { childList: true, characterData: true, subtree: true });
    const rt = sr.querySelector('#rtitle');
    if (rt) mo.observe(rt, { childList: true, characterData: true, subtree: true });

    const goIdx = (i, p) => {
      want = { i, p };
      rpg.value = String(i);
      const ev = new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true });
      ev.bcPass = true;
      rpg.dispatchEvent(ev);
      rpg.blur();
      setTimeout(syncPg, 800);
    };

    sr.addEventListener('keydown', async e => {
      if (e.target !== rpg || e.key !== 'Enter' || !isT() || e.bcPass) return;
      const v = en(rpg.value);
      if (/^#\s*\d+$/.test(v)) { rpg.value = v.replace(/\D/g, ''); return; }
      const m = v.match(/^(\d+)\s*[/\-:،,]\s*(\d+)$/);
      const T = m ? { v: +m[1], p: +m[2] } : /^\d+$/.test(v) ? { v: +(curLoc()?.v || 1), p: +v } : null;
      if (!T) return;
      e.preventDefault(); e.stopImmediatePropagation();
      const total = readTotal() || 99999;
      const old = rtot.textContent;
      busy = true; rtot.textContent = '· …';
      const r = await findPrinted(T, total);
      rtot.textContent = old; busy = false;
      if (r.i) return goIdx(r.i, r.p);
      if (r.err) return alert('โหลดข้อมูลหน้าไม่สำเร็จ ลองใหม่อีกครั้ง');
      if (r.near && confirm(`ไม่พบ ج${T.v} ص${T.p} ตรง ๆ\nไปหน้าที่ใกล้ที่สุด ج${r.near.v} ص${r.near.p} ไหม?`))
        goIdx(r.near.i, r.near.p);
    }, true);

    // ---- เลือกข้อความในหนังสือ → คัดลอก / คัดลอกพร้อมอ้างอิง (v3) ----
    (() => {
      try { window.__bcCopyOff && window.__bcCopyOff(); } catch {}
      const AR_NUM = false;
      const num = n => AR_NUM ? String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]) : String(n);
      const safe = (f, d) => { try { return f(); } catch { return d; } };

      const st = document.createElement('style');
      st.textContent = `
  #rbody, #rbody * { -webkit-user-select: text !important; user-select: text !important; -webkit-touch-callout: default !important; }
  #bc-cpbar{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:2147483647;
    transform:translate(-50%,16px);opacity:0;pointer-events:none;
    transition:transform .2s cubic-bezier(.2,.9,.3,1.2),opacity .18s;
    display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;direction:var(--ui-dir,ltr);
    background:var(--card,#fff);color:var(--txt,#1d2421);border:1px solid var(--line-strong,#d8d2c5);
    box-shadow:0 14px 36px rgba(0,0,0,.28);font-family:var(--ui,'IBM Plex Sans Arabic','Noto Sans Thai',sans-serif);
    backdrop-filter:blur(12px)}
  #bc-cpbar.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
  #bc-cpbar button{border:1px solid var(--line,#e8e3d6);background:transparent;color:inherit;border-radius:999px;
    padding:10px 16px;font:600 14px var(--ui,sans-serif);white-space:nowrap;cursor:pointer;transition:transform .1s}
  #bc-cpbar button:active{transform:scale(.94)}
  #bc-cpbar button.pri{background:var(--pri-g,#0d5c53);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(13,92,83,.35)}
  #bc-cpbar button[data-k="x"]{width:40px;padding:10px 0;color:var(--mut,#7a837f)}
  #bc-cptoast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);
    z-index:2147483647;background:#111d1bf2;color:#fff;padding:10px 20px;border-radius:999px;white-space:nowrap;
    font:600 14px var(--ui,'Noto Sans Thai',sans-serif);opacity:0;transition:opacity .2s;pointer-events:none;
    box-shadow:0 10px 26px rgba(0,0,0,.3)}`;
      sr.appendChild(st);

      document.getElementById('bc-cpbar')?.remove();
      document.getElementById('bc-cptoast')?.remove();
      sr.querySelector('#bc-cpbar')?.remove();
      sr.querySelector('#bc-cptoast')?.remove();
      const bar = document.createElement('div');
      bar.id = 'bc-cpbar';
      bar.innerHTML = `<button data-k="plain">${T().cpPlain}</button><button data-k="cite" class="pri">${T().cpCite}</button><button data-k="x">✕</button>`;
      const tst = document.createElement('div');
      tst.id = 'bc-cptoast';
      sr.append(bar, tst);
      const mount = () => { if (sr.lastElementChild !== tst) sr.append(bar, tst); };

      let tTimer = 0;
      const toast = s => {
        mount();
        tst.textContent = s; tst.classList.add('on');
        clearTimeout(tTimer); tTimer = setTimeout(() => tst.classList.remove('on'), 1600);
      };

      const metaCache = {};
      const bookMeta = id => metaCache[id] || (metaCache[id] = new Promise(res => GM_xmlhttpRequest({
        method: 'GET', timeout: 15000, url: `https://api.turath.io/book?id=${id}&include=indexes&ver=3`,
        onload: r => {
          try {
            const j = JSON.parse(r.responseText);
            const m = typeof j.meta === 'string' ? JSON.parse(j.meta) : (j.meta || {});
            res({ name: (m.name || '').trim(), vols: (j.indexes?.volumes || []).length });
          } catch { res({}); }
        },
        onerror: () => res({}), ontimeout: () => res({}),
      })));

      const titleText = () => {
        const t = sr.querySelector('#rtitle');
        return t ? t.textContent.replace(/\s*[·|–—-]?\s*(ج\s*[\d٠-٩]+\s*)?ص\s*[\d٠-٩]+.*$/, '').replace(/…$/, '').trim() : '';
      };

      const cite = async () => {
        let name = '', vols = 0, v, p;
        if (safe(() => isT(), false)) {
          const id = safe(() => bookId(), '');
          if (id) ({ name = '', vols = 0 } = await bookMeta(id));
          const l = safe(() => curLoc(), null); v = l?.v; p = l?.p;
        }
        const parts = [name || titleText() || 'كتاب'];
        if (v && vols !== 1) parts.push(`ج${num(v)}`);
        if (p !== undefined && p !== '' && Number.isFinite(+p)) parts.push(`ص${num(p)}`);
        else { const i = safe(() => idx(), ''); if (i) parts.push(`#${num(i)}`); }
        return parts.join('، ');
      };

      const clean = s => s.replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();

      const copy = async s => {
        try { await navigator.clipboard.writeText(s); return true; } catch {}
        const ta = document.createElement('textarea');
        ta.value = s; ta.style.cssText = 'position:fixed;top:0;opacity:0';
        document.body.appendChild(ta); ta.select();
        let ok = false; try { ok = document.execCommand('copy'); } catch {}
        ta.remove(); return ok;
      };

      const rbody = () => sr.querySelector('#rbody');
      const readerOpen = () => { const b = rbody(); return !!(b && b.getClientRects().length); };
      const selText = () => {
        if (!readerOpen()) return '';
        for (const get of [() => sr.getSelection && sr.getSelection(), () => document.getSelection()]) {
          const s = safe(get, null);
          if (!s || s.isCollapsed || !s.rangeCount) continue;
          const t = safe(() => s.toString(), '');
          if (t.trim()) return t;
        }
        return '';
      };

      let picked = '', hideT = 0, holding = false, holdT = 0;
      const show = () => { clearTimeout(hideT); mount(); bar.classList.add('on'); };
      const hide = clear => {
        bar.classList.remove('on'); picked = '';
        if (clear) {
          safe(() => sr.getSelection?.()?.removeAllRanges());
          safe(() => document.getSelection()?.removeAllRanges());
        }
      };
      const check = () => {
        if (holding) return;
        const t = selText();
        if (t.trim()) {
          picked = t; show();
          safe(() => { if (isT() && bookId()) bookMeta(bookId()); });
        } else if (bar.classList.contains('on')) {
          clearTimeout(hideT);
          hideT = setTimeout(() => { if (!holding && !selText().trim()) hide(false); }, 700);
        }
      };
      const later = () => setTimeout(check, 80);
      const unhold = () => { clearTimeout(holdT); holdT = setTimeout(() => { holding = false; }, 60); };

      document.addEventListener('selectionchange', check);
      document.addEventListener('pointerup', unhold, true);
      document.addEventListener('pointercancel', unhold, true);
      sr.addEventListener('touchend', later, true);
      sr.addEventListener('pointerup', later, true);
      sr.addEventListener('contextmenu', later, true);
      const poll = setInterval(() => {
        if (readerOpen()) check();
        else if (bar.classList.contains('on')) hide(false);
      }, 350);

      bar.addEventListener('pointerdown', e => {
        holding = true; e.preventDefault();
        clearTimeout(holdT); holdT = setTimeout(() => { holding = false; }, 2000);
      });
      bar.addEventListener('click', async e => {
        const k = e.target.closest('button')?.dataset.k;
        holding = false;
        if (!k) return;
        clearTimeout(hideT);
        if (k === 'x') return hide(true);
        const t = clean(picked || selText());
        if (!t) return hide(true);
        const out = k === 'cite' ? `${t}\n\n— ${await cite()}` : t;
        toast(await copy(out) ? '✓' : '!');
        hide(true);
      });

      window.__bcCopyOff = () => {
        clearInterval(poll);
        document.removeEventListener('selectionchange', check);
        document.removeEventListener('pointerup', unhold, true);
        document.removeEventListener('pointercancel', unhold, true);
        sr.removeEventListener('touchend', later, true);
        sr.removeEventListener('pointerup', later, true);
        sr.removeEventListener('contextmenu', later, true);
        bar.remove(); tst.remove(); st.remove();
      };
    })();

    vb.onclick = () => {
      const l = curLoc();
      const a = prompt('ج / ص (2/15) · #37:', l ? `${l.v || 1}/${l.p}` : '');
      if (!a) return;
      rpg.value = en(a);
      rpg.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, composed: true }));
    };
  })();

  // ===================== UI สไตล์ Nuqaya / Faida (Navigation & Segmented Switcher) =====================
  (() => {
    sr.querySelectorAll('.libbar input').forEach(i => { i.focus = () => {}; });

    const S = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
    const IC = {
      chat: S('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'),
      lib:  S('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>'),
      hist: S('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
      menu: S('<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>'),
    };
    const SRC_LABEL = { turath: 'Turath · تراث', usul: 'Usul · أصول', golden: 'Golden · الشاملة' };

    const bsrc = $('#bsrc');
    let paintSeg = () => {};
    if (bsrc && !$('.seg')) {
      const seg = document.createElement('div');
      seg.className = 'seg';
      seg.innerHTML = [...bsrc.options].map(o => `<button data-v="${o.value}">${SRC_LABEL[o.value] || o.textContent}</button>`).join('');
      $('#lib').prepend(seg);
      paintSeg = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === bsrc.value));
      seg.onclick = e => {
        const b = e.target.closest('button');
        if (!b || b.dataset.v === bsrc.value) return;
        bsrc.value = b.dataset.v;
        bsrc.dispatchEvent(new Event('change'));
        paintSeg();
      };
      paintSeg();
    }

    if (!$('#bnav')) {
      const tabs = [...sr.querySelectorAll('.hd .tab')];
      const nav = document.createElement('nav');
      nav.id = 'bnav';
      const t = T();
      const NAME = { chat: t.tabChat, lib: t.tabLib, hist: t.tabHist };
