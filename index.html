<!-- ===================== 1) GM SHIM (แทน Tampermonkey) ===================== -->
<script>
(() => {
  'use strict';
  // ---------- storage: IndexedDB + แคชในหน่วยความจำ (GM_getValue ต้องเป็น sync) ----------
  const STORE = new Map();
  let db = null;
  const clone = v => (v && typeof v === 'object')
    ? (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v))) : v;

  const openDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('bookchat-gm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });

  async function preload() {
    try {
      db = await openDB();
      await new Promise(res => {
        const rq = db.transaction('kv').objectStore('kv').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { STORE.set(c.key, c.value); c.continue(); } else res(); };
        rq.onerror = () => res();
      });
    } catch (e) {
      console.warn('IndexedDB ใช้ไม่ได้ → ใช้ localStorage แทน', e);
      db = null;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('gm:')) try { STORE.set(k.slice(3), JSON.parse(localStorage.getItem(k))); } catch {}
      }
    }
  }

  function persist(k, v) {
    if (db) {
      try {
        const st = db.transaction('kv', 'readwrite').objectStore('kv');
        v === undefined ? st.delete(k) : st.put(v, k);
        return;
      } catch (e) { console.warn(e); }
    }
    try { v === undefined ? localStorage.removeItem('gm:' + k) : localStorage.setItem('gm:' + k, JSON.stringify(v)); }
    catch (e) { console.warn('บันทึกไม่สำเร็จ (พื้นที่เต็ม?)', k, e); }
  }

  window.__gmFlush = () => db ? new Promise(r => {
    const tx = db.transaction('kv', 'readwrite'); tx.oncomplete = r; tx.onerror = r; tx.onabort = r;
  }) : Promise.resolve();

  window.GM_getValue = (k, def) => STORE.has(k) ? clone(STORE.get(k)) : def;
  window.GM_setValue = (k, v) => {
    if (v === undefined) return GM_deleteValue(k);
    const c = clone(v); STORE.set(k, c); persist(k, clone(c));
  };
  window.GM_deleteValue = k => { STORE.delete(k); persist(k, undefined); };
  window.GM_listValues = () => [...STORE.keys()];

  // ---------- แก้ Usul: บังคับ page เป็นตัวเลข (ชั้นล่างสุด ทุกคำขอต้องผ่าน) ----------
  const fixUsulUrl = s => {
    try {
      if (!/\/\/api\.usul\.ai\//i.test(s || '')) return s;
      const u = new URL(s), p = u.searchParams;
      if (!/search/i.test(u.pathname) && !p.has('q')) return s;
      const n = Number(p.get('page'));
      if (!p.has('page') || !Number.isInteger(n) || n < 1) {
        const lim = Number(p.get('limit')) || 20, off = Number(p.get('offset'));
        p.set('page', String(Number.isFinite(off) && off > 0 ? Math.floor(off / lim) + 1 : 1));
      }
      ['limit', 'offset'].forEach(k => {
        const v = p.get(k);
        if (v !== null && (v === '' || !Number.isFinite(Number(v)))) p.delete(k);
      });
      const out = u.toString();
      if (out !== s) console.log('[usul] แก้ URL →', out);
      return out;
    } catch { return s; }
  };
  window.__bcFixUsulUrl = fixUsulUrl;

  // ---------- proxy (Cloudflare Worker / Corsfix / Local Server) ----------
  const proxify = u => {
    u = fixUsulUrl(u);
    if (typeof u === 'string' && u.startsWith('/proxy?url=')) return u;
    const p = (localStorage.getItem('bc_proxy') || '').trim();
    if (p) {
      const isBookApi = /turath\.io|usul\.ai|goldenshamela\.com/.test(u);
      const isAiApi = !isBookApi || /relayrouter\.ai|itkk\.lol|gcli2api-lea8\.onrender\.com|generativelanguage|tavily\.com/.test(u);
      if (isAiApi && localStorage.getItem('bc_proxy_all') !== '1') return u;
      return p.includes('{url}') ? p.replace('{url}', encodeURIComponent(u)) : p + encodeURIComponent(u);
    }
    const isLocalServer = typeof location !== 'undefined' && (location.hostname === '127.0.0.1' || location.hostname === 'localhost');
    if (isLocalServer && /turath\.io|usul\.ai|goldenshamela\.com/.test(u)) {
      return '/proxy?url=' + encodeURIComponent(u);
    }
    return u;
  };
  window.__bcProxify = proxify;
  window.__bcProxyHeaders = (url, orig, h) => {
    const headers = { ...(h || {}) };
    const pk = (localStorage.getItem('bc_proxy_key') || '').trim();
    if (url !== orig && pk) headers['x-corsfix-key'] = pk;
    return headers;
  };

  // ---------- network: GM_xmlhttpRequest → fetch (รองรับ streaming) ----------
  window.GM_xmlhttpRequest = o => {
    const ctrl = new AbortController();
    let done = false, timer = null;
    const base = { finalUrl: o.url, status: 0, statusText: '', responseHeaders: '', readyState: 4 };
    const fin = () => { done = true; clearTimeout(timer); };
    if (o.timeout) timer = setTimeout(() => {
      if (done) return; fin(); ctrl.abort(); (o.ontimeout || o.onerror)?.({ ...base, error: 'timeout' });
    }, o.timeout);

    (async () => {
      try {
        const m = (o.method || 'GET').toUpperCase();
        const url = proxify(o.url);
        const headers = window.__bcProxyHeaders(url, o.url, o.headers);
        const res = await fetch(url, {
          method: m, headers, signal: ctrl.signal,
          body: (m !== 'GET' && m !== 'HEAD' && o.data != null) ? (typeof o.data === 'string' ? o.data : JSON.stringify(o.data)) : undefined,
        });
        const info = { ...base, status: res.status, statusText: res.statusText, finalUrl: res.url || o.url,
          responseHeaders: [...res.headers].map(([k, v]) => `${k}: ${v}`).join('\r\n') };

        // โหมด stream (คำตอบ Gemini ทยอยขึ้น)
        if (o.responseType === 'stream' && res.ok && res.body && o.onloadstart) {
          clearTimeout(timer);
          o.onloadstart({ ...info, readyState: 2, response: res.body });
          return;
        }
        let text = '';
        if (res.body && o.onprogress) {
          const rd = res.body.getReader(), dec = new TextDecoder();
          for (;;) {
            const { done: d, value } = await rd.read(); if (d) break;
            text += dec.decode(value, { stream: true });
            if (!done) o.onprogress({ ...info, readyState: 3, responseText: text });
          }
          text += dec.decode();
        } else text = await res.text();
        if (done) return; fin();
        if (res.status >= 400 && /turath\.io|usul\.ai/.test(o.url || '')) {
          const via = res.headers.get('x-bc-target');
          console.warn('[net] error', res.status, url);
          text += `\n[ปลายทาง] ${fixUsulUrl(o.url)}` +
            (via ? `\n[Worker ส่งต่อไปที่] ${via}` : `\n[ไม่มี x-bc-target → error มาจาก Worker เอง หรือไม่ได้ผ่าน Worker]`);
        }
        const r = { ...info, responseText: text, response: text };
        o.onload?.(r); o.onloadend?.(r);
      } catch (e) {
        if (done) return; fin();
        o.onerror?.({ ...base, error: `${e?.message || e} — อาจติด CORS: ลองตั้ง Proxy ในเมนู ⋮ → ตั้งค่า` });
      }
    })();
    return { abort() { fin(); ctrl.abort(); } };
  };

  // ---------- กัน 429: จำกัดคำขอพร้อมกัน + รอแล้วลองใหม่ + แคชหน้าที่เคยโหลด ----------
  (() => {
    const raw = window.GM_xmlhttpRequest;
    const isBook = u => /\/\/(api\.turath\.io|files\.turath\.io|api\.usul\.ai|api\.goldenshamela\.com)\//.test(u || '');

    // แก้ Usul: API บังคับ page เป็นตัวเลข (ไม่ส่ง/ส่ง undefined → 400 "received nan")
    const fixUsul = o => {
      if (!/\/\/api\.usul\.ai\/.*search/i.test(o.url || '')) return o;
      try {
        const u = new URL(o.url), p = u.searchParams;
        const n = Number(p.get('page'));
        if (!p.has('page') || !Number.isInteger(n) || n < 1) {
          const lim = Number(p.get('limit')) || 20;
          const off = Number(p.get('offset'));
          p.set('page', String(Number.isFinite(off) && off > 0 ? Math.floor(off / lim) + 1 : 1));
        }
        for (const k of ['limit', 'offset']) {
          const v = p.get(k);
          if (v !== null && !Number.isFinite(Number(v))) p.delete(k);
        }
        const url = u.toString();
        if (url !== o.url) console.log('[usul] แก้ URL →', url);
        return url === o.url ? o : { ...o, url };
      } catch { return o; }
    };
    const LIMIT = 3, MAX_TRY = 4, GAP = 180;    // อัตรายิงปลอดภัยไม่เกิน 3 คำขอพร้อมกัน ป้องกัน Cloudflare 429     // พร้อมกันสูงสุด 3, ลองใหม่ 4 ครั้ง, เว้นระยะ 150ms
    const CACHE = new Map(), CACHE_MAX = 300;
    const queue = [];
    let active = 0, last = 0;

    const pump = () => {
      if (active >= LIMIT || !queue.length) return;
      const wait = Math.max(0, last + GAP - Date.now());
      if (wait) return setTimeout(pump, wait);
      last = Date.now(); active++; queue.shift()(); pump();
    };

    window.GM_xmlhttpRequest = o => {
      o = fixUsul(o);                                    // แก้ page ของ Usul ก่อนเข้าแคช/คิว
      if (!isBook(o.url)) return raw(o);                 // Gemini ไม่ผ่านชั้นนี้

      const ck = (o.method || 'GET').toUpperCase() === 'GET' ? o.url : null;
      if (ck && CACHE.has(ck)) {                       // หน้าที่เคยเปิดแล้ว ไม่ต้องยิงซ้ำ
        const r = CACHE.get(ck);
        setTimeout(() => { o.onload?.(r); o.onloadend?.(r); }, 0);
        return { abort() {} };
      }
      let aborted = false, cur = null, tries = 0, rel = null;

      const attempt = () => {
        if (aborted) { active--; pump(); return; }
        let freed = false, retry = false;
        rel = () => { if (!freed) { freed = true; active--; pump(); } };
        cur = raw({ ...o,
          ...(o.onloadstart && { onloadstart: r => { rel(); o.onloadstart(r); } }),
          onload: r => {
            rel();
            if (r.status === 429 && tries < MAX_TRY) {
              retry = true; tries++;
              const ra = parseFloat((/retry-after:\s*([\d.]+)/i.exec(r.responseHeaders || '') || [])[1]);
              const wait = (ra > 0 ? ra * 1000 : 1500 * 2 ** (tries - 1)) + Math.random() * 500;
              console.warn(`[429] รอ ${Math.round(wait)}ms แล้วลองใหม่ (${tries}/${MAX_TRY})`, o.url);
              setTimeout(() => { queue.push(attempt); pump(); }, wait);
              return;
            }
            if (ck && r.status === 200) {
              CACHE.set(ck, r);
              if (CACHE.size > CACHE_MAX) CACHE.delete(CACHE.keys().next().value);
            }
            o.onload?.(r);
          },
          onloadend: r => { if (!retry) o.onloadend?.(r); },
          onerror: e => { rel(); o.onerror?.(e); },
          ontimeout: e => { rel(); (o.ontimeout || o.onerror)?.(e); },
        });
      };

      queue.push(attempt); pump();
      return { abort() { aborted = true; cur?.abort(); rel?.(); } };
    };
  })();

  // ---------- menu / element ----------
  window.__gmMenu = [];
  window.GM_registerMenuCommand = (name, fn) => { __gmMenu.push({ name, fn }); return name; };
  window.GM_addElement = (parent, tag, attrs = {}) => {
    if (typeof parent === 'string') { attrs = tag || {}; tag = parent; parent = document.head; }
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'textContent' ? (el.textContent = v) : el.setAttribute(k, v);
    (parent || document.head).appendChild(el);
    return el;
  };

  // ---------- export ไฟล์: ดาวน์โหลดไฟล์จริงโดยตรง (.pdf / .html / .doc / .md / .json) ----------
  const blobs = new Map();
  const oCreate = URL.createObjectURL.bind(URL);
  URL.createObjectURL = b => { const u = oCreate(b); if (b instanceof Blob) blobs.set(u, b); return u; };
  const oClick = HTMLAnchorElement.prototype.click;
  window.__bcNativeAnchorClick = oClick;
  HTMLAnchorElement.prototype.click = function () {
    const b = blobs.get(this.href);
    if (!b) return oClick.call(this);
    const name = this.download || 'book-chat.txt', a = this;
    const isWv = /\bwv\b|Android.*Version\/[\d.]+/i.test(navigator.userAgent || '');
    if (!isWv || this.dataset.directDownload === '1') {
      try {
        oClick.call(this);
        return;
      } catch (_) {}
    }
    try {
      const f = new File([b], name, { type: (b.type || 'application/octet-stream').split(';')[0] });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: name }).catch(() => { oClick.call(a); });
        return;
      }
    } catch {}
    oClick.call(a);
  };

  window.__gmReady = preload();
})();
</script>

<!-- ===================== 2) วางสคริปต์ Book Chat เดิมทั้งไฟล์ระหว่างแท็กนี้ ===================== -->
<script type="text/plain" id="userscript">
// ==UserScript==
// @name         Book Chat (Usul-style) — Gemini 3.8 Flash + Turath + Usul
// @namespace    https://book-chat.local/
// @version      2.9.0
// @description  ถามตอบจากหนังสือที่เลือก (หลายเล่ม, ผสม Turath + Usul/OpenITI) แบบ usul.ai ใช้ gemini-3.8-flash • แนบรูป (ตัวบท/หน้ากีตาบ) → อ่านข้อความในรูป → หา شرح จากหนังสือที่ติ๊ก/ทั้งคลัง • เลือกภาษาตอบ: อัตโนมัติ(ตามเนื้อหา)/ยาวี/อาหรับ/ไทย • ไม่เลือกหนังสือ = ค้นทั้งคลัง → หาเล่มที่มีเนื้อหาจริง → ค้นเจาะ → ให้ Gemini คัดข้อความที่สอดคล้องที่สุด • เรียบเรียงร้อยแก้วต่อเนื่อง + อ้างอิงวงกลม • ค้น/อ่านหนังสือพร้อมสารบัญ ค้นในเล่ม ไปหน้า จำหน้าล่าสุด • บันทึกประวัติแชท + export • เพิ่มหนังสือเข้าหมวด Favorites ได้
// @match        *://*/*
// @grant        GM_xmlhttpRequest
// @grant        GM_getValue
// @grant        GM_setValue
// @grant        GM_registerMenuCommand
// @grant        GM_addElement
// @connect      api.relayrouter.ai
// @connect      itkk.lol
// @connect      gcli2api-lea8.onrender.com
// @connect      api.goldenshamela.com
// @connect      api.tavily.com

// @connect      api.turath.io
// @connect      files.turath.io
// @connect      api.usul.ai
// @connect      assets.usul.ai
// @run-at       document-idle
// @noframes
// ==/UserScript==

(function () {
  'use strict';

  // ================= CONFIG =================
  const DEFAULT_MODELS = ['gemini-3.8-flash', 'gemini-3.8-flash-high', 'claude-opus-4-6'];
  const DEFAULT_PROVIDERS = {
    'api.relayrouter.ai': {
      label: 'api.relayrouter.ai',
      url: 'https://api.relayrouter.ai/v1beta/models',
      type: 'gemini',
      defaultModel: 'gemini-3.8-flash',
      title: 'ใช้ API จาก api.relayrouter.ai',
    },
    'itkk.lol': {
      label: 'itkk.lol',
      url: 'https://itkk.lol/v1beta/models',
      type: 'gemini',
      defaultModel: 'gemini-3.8-flash',
      title: 'ใช้ API จาก itkk.lol',
    },
    'gcli2api-lea8.onrender.com/antigravity': {
      label: 'gcli2api/antigravity',
      url: 'https://gcli2api-lea8.onrender.com/antigravity/v1/models',
      type: 'gemini',
      defaultModel: 'gemini-3.8-flash-high',
      title: 'ใช้ Gemini API จาก https://gcli2api-lea8.onrender.com/antigravity',
    },
    'gcli2api-lea8.onrender.com/antigravity/v1': {
      label: 'Claude (gcli2api/v1)',
      url: 'https://gcli2api-lea8.onrender.com/antigravity/v1',
      type: 'openai',
      defaultModel: 'claude-opus-4-6',
      title: 'ใช้ Claude API จาก https://gcli2api-lea8.onrender.com/antigravity/v1',
    },
  };
  const API_PROVIDERS = { ...DEFAULT_PROVIDERS };
  const buildCustomProvider = (rawInput, typeHint = 'auto') => {
    let customLabel = '', rawUrl = String(rawInput || '').trim();
    if (!rawUrl) return null;
    if (rawUrl.includes('|')) {
      const parts = rawUrl.split('|').map(x => x.trim()).filter(Boolean);
      if (parts.length >= 2) {
        customLabel = parts[0];
        rawUrl = parts.slice(1).join('|');
      }
    }
    let u = rawUrl.replace(/\s+/g, '');
    if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
    u = u.replace(/\/+$/, '');
    let type = (typeHint === 'openai' || typeHint === 'gemini') ? typeHint : '';
    if (!type) {
      if (/\/chat\/completions$/i.test(u) || /\/v1$/i.test(u) || /openai|openrouter|anthropic|claude|deepseek|groq|mistral|together|fireworks|x\.ai/i.test(u)) {
        type = 'openai';
      } else {
        type = 'gemini';
      }
    }
    let cleanBase = u
      .replace(/\/models\/[^/]+:(?:stream)?generateContent.*$/i, '/models')
      .replace(/:(?:stream)?generateContent.*$/i, '');
    let finalUrl = cleanBase;
    if (type === 'gemini') {
      if (/\/models$/i.test(cleanBase)) {
        finalUrl = cleanBase;
      } else if (/\/v1beta$/i.test(cleanBase) || /\/v1$/i.test(cleanBase)) {
        finalUrl = cleanBase + '/models';
      } else if (/\/antigravity$/i.test(cleanBase)) {
        finalUrl = cleanBase + '/v1/models';
      } else {
        finalUrl = cleanBase + '/v1beta/models';
      }
    } else {
      if (/\/chat\/completions$/i.test(cleanBase)) {
        finalUrl = cleanBase.replace(/\/chat\/completions$/i, '');
      } else {
        try {
          const parsed = new URL(cleanBase);
          if (!parsed.pathname || parsed.pathname === '/') {
            finalUrl = cleanBase + '/v1';
          }
        } catch (_) {}
      }
    }
    let id = rawUrl.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
    if (!id) id = finalUrl.replace(/^https?:\/\//i, '');
    const label = customLabel || id;

    if (hits.length) {
      let best = -1;
      for (const h of hits) {
        const s = Math.max(0, Math.min(Math.floor(h - max * 0.3), clean.length - max));
        const cnt = hits.filter(x => x >= s && x < s + max).length;
        if (cnt > best) {

    if (/gcli2api|antigravity/i.test(u) || isOpenAIMode(p) || !DEFAULT_PROVIDERS[p]) {
      return { Authorization: `Bearer ${k}`, 'x-goog-api-key': k };
    }
    return { 'x-goog-api-key': k };
  };
  const toGemini = m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] });
  const textOf = res => {
    if (res?.choices?.length) {
      const msg = res.choices[0]?.message;
      if (typeof msg?.content === 'string') return msg.content;
      if (Array.isArray(msg?.content)) return msg.content.map(x => x?.text || '').join('');
    }
    return (res?.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
  };
  const parseJSONLoose = txt => {
    const raw = String(txt || '').trim();
    if (!raw) return {};
    try { return JSON.parse(raw) || {}; } catch (_) {}
    const stripped = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
    try { return JSON.parse(stripped) || {}; } catch (_) {}
    const i = stripped.indexOf('{'), j = stripped.lastIndexOf('}');
    if (i >= 0 && j > i) {
      try { return JSON.parse(stripped.slice(i, j + 1)) || {}; } catch (_) {}
    }
    return {};
  };
  const contentsToOAI = (system, contents) => {
    const msgs = [];
    if (system) msgs.push({ role: 'system', content: String(system) });
    for (const c of contents || []) {
      const role = c.role === 'model' || c.role === 'assistant' ? 'assistant' : 'user';
      const parts = c.parts || [];
      const hasImg = parts.some(p => p?.inlineData);
      if (!hasImg) {
        msgs.push({ role, content: parts.map(p => p?.text || '').join('') });
      } else {
        msgs.push({
          role,
          content: parts.map(p => p?.inlineData
            ? { type: 'image_url', image_url: { url: `data:${p.inlineData.mimeType};base64,${p.inlineData.data}` } }
            : { type: 'text', text: p?.text || '' }),
        });
      }
    }
    return msgs;
  };
  const usageOf = u => ({
    promptTokens: u?.promptTokenCount ?? u?.prompt_tokens ?? u?.input_tokens ?? 0,
    completionTokens: u?.candidatesTokenCount ?? u?.completion_tokens ?? u?.output_tokens ?? 0,
    thoughtTokens: u?.thoughtsTokenCount ?? u?.completion_tokens_details?.reasoning_tokens ?? 0,
    cachedTokens: u?.cachedContentTokenCount ?? u?.prompt_tokens_details?.cached_tokens ?? 0,
    totalTokens: u?.totalTokenCount ?? u?.total_tokens ?? 0,
  });
  let noThink = false;
  // helper = งานเบื้องหลัง (คิดคำค้น / rerank) → ใช้ระดับต่ำสุดเสมอ ประหยัด token
  // ใช้ thinkingLevel อย่างเดียว (thinkingBudget เป็นของรุ่น 2.5)
  const thinkCfg = (helper = false) => {
    if (!thinkEnabled || noThink) return {};
    const ok = levelsForModel(getActiveModel());
    const mn = ok[0], md = mn === 'minimal' ? 'low' : 'medium';
    const want = thinkMode === 'off' ? mn : thinkMode === 'low' ? md : 'high';
    const lv = helper ? mn : want;
    return { thinkingConfig: { thinkingLevel: ok.includes(lv) ? lv : mn } };
  };
  const thinkFallback = () => {
    if (noThink) return false;
    noThink = true;
    logRaw(`! relay ไม่รับ thinkingConfig → ส่งโดยไม่ใส่ (โมเดลจะคิดระดับค่าเริ่มต้น ซึ่งใช้ token มากขึ้น)`);
    return true;
  };
  // cap ของคำตอบ = ความยาวที่ต้องการ + ส่วนเผื่อให้การคิด
  const capCfg = len => {
    if (!thinkEnabled) return { maxOutputTokens: LENGTH[len].maxOut };
    const ex = THINK[thinkMode].extra;
    if (ex == null || noThink) return {};   // โหมดลึก หรือคุมการคิดไม่ได้ → ไม่จำกัด กันโดนตัด
    return { maxOutputTokens: LENGTH[len].maxOut + ex };
  };

  async function testThinkConnection(customPrompt = '', opts = {}) {
    const p = getActiveProvider();
    const m = getActiveModel();
    const key = getProviderKey(p);
    if (!key) throw new Error(`ยังไม่ได้ตั้งค่า API Key สำหรับ ${p}`);
    const testEn = opts.thinkEnabled !== undefined ? !!opts.thinkEnabled : thinkEnabled;
    const testMd = opts.thinkMode && THINK[opts.thinkMode] ? opts.thinkMode : thinkMode;
    const onProgress = typeof opts.onProgress === 'function' ? opts.onProgress : null;
    const promptText = String(customPrompt || '').trim() || 'ما الفرق الدقيق بين الركن والشرط في الفقه الإسلامي باختصار شديد؟';
    const t0 = performance.now();
    let fallbackUsed = false;
    let configSent = {};
    let thoughtText = '';
    let answerText = '';
    let usage = usageOf(null);

    const notify = (phase = 'streaming') => {
      onProgress?.({
        phase,
        ms: Math.round(performance.now() - t0),
        provider: p,
        model: m,
        thinkEnabled: testEn,
        thinkMode: testMd,
        configSent,
        fallbackUsed,
        thoughtText,
        answerText,
        usage,
      });
    };

    if (isOpenAIMode(p, m)) {
      const eff = testMd === 'high' ? 'high' : testMd === 'low' ? 'medium' : 'low';
      const oaiBody = {
        model: m,
        messages: [
          { role: 'system', content: testEn ? 'Think carefully step by step before answering concisely.' : 'Answer directly and concisely without extended reasoning.' },
          { role: 'user', content: promptText },
        ],
        stream: true,
        ...(testEn ? { reasoning_effort: eff } : {}),
      };
      configSent = testEn ? { reasoning_effort: eff } : { thinking: 'disabled' };
      notify('connecting');
      let events = 0;
      const feed = sseParser(ev => {
        events++;
        if (ev.choices?.length) {
          const ch = ev.choices[0];
          const dReason = ch?.delta?.reasoning_content ?? ch?.delta?.thinking ?? '';
          const dAns = ch?.delta?.content ?? (events === 1 && typeof ch?.message?.content === 'string' ? ch.message.content : '');
          if (dReason) thoughtText += dReason;
          if (dAns) answerText += dAns;
        }
        if (ev.usage || ev.usageMetadata) usage = usageOf(ev.usage || ev.usageMetadata);
        notify(answerText ? 'answering' : 'thinking');
      });
      const runOai = async () => {
        events = 0;
        thoughtText = '';
        answerText = '';
        const raw = await gmStream(getChatCompletionsUrl(p), oaiBody, gHeaders(), feed);
        if (!events && raw) {
          const parsed = parseJSONLoose(raw);
          const msg = parsed?.choices?.[0]?.message || {};
          thoughtText = String(msg.reasoning_content || msg.thinking || '').trim();
          answerText = textOf(parsed).trim();
          if (parsed?.usage || parsed?.usageMetadata) usage = usageOf(parsed.usage || parsed.usageMetadata);
          notify('done');
        }
      };
      try {
        await runOai();
      } catch (e) {
        if (testEn && /reasoning|thinking|unknown|invalid|parameter/i.test(String(e.message || e))) {
          fallbackUsed = true;
          delete oaiBody.reasoning_effort;
          notify('fallback');
          await runOai();
        } else {
          throw e;
        }
      }
    } else {
      const ok = levelsForModel(m);
      const mn = ok[0], md = mn === 'minimal' ? 'low' : 'medium';
      const want = testMd === 'off' ? mn : testMd === 'low' ? md : 'high';
      const lv = ok.includes(want) ? want : mn;
      const tConfig = testEn ? { thinkingConfig: { thinkingLevel: lv, includeThoughts: true } } : {};
      configSent = testEn ? { thinkingConfig: { thinkingLevel: lv } } : { thinking: 'disabled (direct)' };
      const body = {
        systemInstruction: { parts: [{ text: testEn ? 'You are a scholarly Islamic assistant. Reason carefully and answer concisely.' : 'Answer directly and concisely. Keep internal reasoning to an absolute minimum.' }] },
        contents: [{ role: 'user', parts: [{ text: promptText }] }],
        generationConfig: { ...tConfig },
      };
      notify('connecting');
      let events = 0;
      const feed = sseParser(ev => {
        events++;
        const c = ev.candidates?.[0];
        for (const pt of (c?.content?.parts || [])) {
          if (!pt.text) continue;
          if (pt.thought) thoughtText += pt.text;
          else answerText += pt.text;
        }
        if (ev.usageMetadata || ev.usage) usage = usageOf(ev.usageMetadata || ev.usage);
        notify(answerText ? 'answering' : 'thinking');
      });
      const runGem = async () => {
        events = 0;
        thoughtText = '';
        answerText = '';
        const raw = await gmStream(`${getGeminiUrl()}/${m}:streamGenerateContent?alt=sse`, body, gHeaders(), feed);
        if (!events && raw) {
          const parsed = parseJSONLoose(raw);
          const parts = parsed?.candidates?.[0]?.content?.parts || [];
          thoughtText = parts.filter(pt => pt.thought && pt.text).map(pt => pt.text).join('\n').trim();
          answerText = parts.filter(pt => !pt.thought && pt.text).map(pt => pt.text).join('').trim();
          if (parsed?.usageMetadata || parsed?.usage) usage = usageOf(parsed.usageMetadata || parsed.usage);
          notify('done');
        }
      };
      try {
        await runGem();
      } catch (e) {
        const emsg = String(e.message || e);
        if (testEn && /includeThoughts|thinking/i.test(emsg)) {
          try {
            body.generationConfig = { thinkingConfig: { thinkingLevel: lv } };
            notify('retry');
            await runGem();
          } catch (e2) {
            if (/thinking/i.test(String(e2.message || e2))) {
              fallbackUsed = true;
              body.generationConfig = {};
              notify('fallback');
              await runGem();
            } else {
              throw e2;
            }
          }
        } else {
          throw e;
        }
      }
    }

    const ms = Math.round(performance.now() - t0);
    return {
      ok: true,
      ms,
      provider: p,
      model: m,
      thinkEnabled: testEn,
      thinkMode: testMd,
      thinkLabel: testEn ? (THINK[testMd]?.label || testMd) : 'ปิด (Off)',
      configSent,
      fallbackUsed,
      thoughtText: thoughtText.trim(),
      answerText: answerText.trim(),
      usage,
    };
  }

  const TAVILY_API_URL = 'https://api.tavily.com/search';
  const domainOfUrl = u => {
    try { return new URL(u).hostname.replace(/^www\./i, ''); } catch { return ''; }

  async function tavilySearchRaw(query, opts = {}) {
    const key = String(opts.apiKey ?? getTavilyKey()).trim();
    if (!key) throw new Error('ยังไม่ได้ตั้งค่า Tavily API Key (tvly-...)');
    const q = String(query || '').trim();
    if (!q) throw new Error('กรุณาระบุคำค้นหา (Query)');
    const depth = opts.searchDepth || tavilyDepth || 'basic';
    const maxResults = opts.maxResults || 5;
    const payload = {
      api_key: key,
      query: q,
      search_depth: depth,
      max_results: maxResults,
      include_answer: true,
    };
    const onProgress = typeof opts.onProgress === 'function' ? opts.onProgress : null;
    const t0 = performance.now();
    onProgress?.({ phase: 'connecting', ms: 0, query: q, depth });
    let resJson = null;
    try {
      onProgress?.({ phase: 'searching', ms: Math.round(performance.now() - t0), query: q, depth });
      resJson = await postJSON(TAVILY_API_URL, payload, { Accept: 'application/json' });
    } catch (e) {
      // Fallback: try direct fetch or proxy if configured
      const p = (localStorage.getItem('bc_proxy') || '').trim();
      if (p) {
        const purl = p.includes('{url}') ? p.replace('{url}', encodeURIComponent(TAVILY_API_URL)) : p + encodeURIComponent(TAVILY_API_URL);
        const headers = window.__bcProxyHeaders ? window.__bcProxyHeaders(purl, TAVILY_API_URL, { 'Content-Type': 'application/json', Accept: 'application/json' }) : { 'Content-Type': 'application/json', Accept: 'application/json' };
        const r = await fetch(purl, { method: 'POST', headers, body: JSON.stringify(payload) });
        const tx = await r.text();
        if (!r.ok) throw new Error(`HTTP ${r.status}: ${tx.slice(0, 220)}`);
        resJson = JSON.parse(tx);
      } else {
        throw e;
      }
    }
    const ms = Math.round(performance.now() - t0);
    const results = Array.isArray(resJson?.results) ? resJson.results : [];
    return {
      ok: true,
      ms,
      query: q,
      depth,
      answer: String(resJson?.answer || '').trim(),
      results,
    };
  }

  function normTavily(item, q, idx = 0) {
    const url = String(item?.url || '').trim();
    const dom = domainOfUrl(url) || 'web';
    const title = squash(stripTags(item?.title || dom || 'Tavily Web Result'));
    const rawContent = squash(stripTags(item?.content || item?.raw_content || ''));
    const marked = markTerms(rawContent, q);
    const rawScore = Number(item?.score);
    return {
      key: `tavily:${url || idx}`,
      bookKey: `tavily:${dom}:${idx}`,
      marked: marked || rawContent,
      tScore: Number.isFinite(rawScore) ? rawScore : 0.7,
      base: {
        id: `tavily-${idx}-${rid(8)}`,
        text: stripEm(rawContent),
        metadata: {
          src: 'tavily',
          bookId: url || String(idx),
          url,
          sourceAndVersion: `tavily:${dom}`,
          pages: [{ index: idx + 1, page: idx + 1, volume: '', label: `🌐 ${dom}`, url }],
          chapters: [title],
        },
        book: {
          primaryName: title,
          authorName: `🌐 ${dom}`,
        },
      },
    };
  }

  async function tavilySearchMulti(queries, fallbackQuestion = '') {
    if (!useTavily) return { entries: [], answer: '' };
    const key = getTavilyKey();
    if (!key) {
      logRaw('! เปิดใช้ Tavily Search แต่ยังไม่ได้ใส่ Tavily API Key');
      return { entries: [], answer: '' };
    }
    const qList = [...new Set([
      ...(Array.isArray(queries) ? queries.slice(0, 2) : []),
      String(fallbackQuestion || '').trim(),
    ].filter(Boolean))].slice(0, 2);
    if (!qList.length) return { entries: [], answer: '' };
    logRaw(`· Tavily Search (${tavilyDepth}): ค้นด้วย [${qList.join(' | ')}]`);
    const seenUrls = new Set();
    const entries = [];
    let firstAnswer = '';
    const lists = await Promise.all(qList.map(q =>
      tavilySearchRaw(q, { apiKey: key, searchDepth: tavilyDepth, maxResults: 5 })
        .catch(e => { logRaw(`! Tavily search error (${q}): ${e.message}`); return null; })
    ));
    lists.forEach(res => {
      if (!res) return;
      if (!firstAnswer && res.answer) firstAnswer = res.answer;
      (res.results || []).forEach((it, idx) => {
        const u = String(it?.url || '').trim();
        if (!u || seenUrls.has(u) || !(it?.content || '').trim()) return;
        seenUrls.add(u);
        const e = normTavily(it, res.query, entries.length);
        e.score = 12 / (idx + 1) + (e.tScore || 0.5) * 4;
        entries.push(e);
      });
    });
    logRaw(`· Tavily Search พบ ${entries.length} รายการเว็บ`);
    return { entries, answer: firstAnswer };
  }

  async function geminiJSON(system, contents, schema) {
    if (isOpenAIMode()) {
      const sysWithSchema = `${system}

IMPORTANT: Return ONLY a valid raw JSON object matching this schema (no markdown code block, no extra text): ${JSON.stringify(schema)}`;
      const oaiBody = {
        model: getActiveModel(),
        messages: contentsToOAI(sysWithSchema, contents),
        stream: false,
      };
      const res = await withRetry(() => postJSON(getChatCompletionsUrl(), oaiBody, gHeaders()));
      const j = parseJSONLoose(textOf(res));
      return { j, usage: usageOf(res.usage || res.usageMetadata) };
    }
    const body = {
      systemInstruction: { parts: [{ text: system }] },
      contents,
      generationConfig: {
        responseMimeType: 'application/json',
        responseSchema: schema,
        ...thinkCfg(true),
      },
    };
    const call = () => withRetry(() => postJSON(`${getGeminiUrl()}/${getActiveModel()}:generateContent`, body, gHeaders()));
    let res;
    for (;;) {
      try {
        res = await call();
        break;
      } catch (e) {
        if (!/thinking/i.test(e.message) || !thinkFallback()) throw e;
        delete body.generationConfig.thinkingConfig;
        Object.assign(body.generationConfig, thinkCfg(true));
      }
    }
    const j = parseJSONLoose(textOf(res));
    return { j, usage: usageOf(res.usageMetadata || res.usage) };
  }

  (2) Include 2-3 diverse primary sources/commentaries from different centuries or scholars${img ? ', and direct commentaries (شروح / حواشي) of the text in the image when it is a matn' : ''}.

  async function generateQueries(history, question, books, auto, images = [], ownOk = true) {
    const qCount = getQueryCount();
    const img = images.length > 0;
    const props = { qtype: { type: 'STRING', enum: QTYPES }, queries: { type: 'ARRAY', items: { type: 'STRING' } } };
    const req = ['qtype', 'queries'];
    if (auto) {
      props.books = { type: 'ARRAY', items: { type: 'OBJECT', properties: { title: { type: 'STRING' }, author: { type: 'STRING' } }, required: ['title'] } };
      req.push('books');
    }
    if (img) {
      props.image_text = { type: 'STRING' };
      req.push('image_text');
    }
    const userParts = [...images.map(imgPart), { text: question }];
    try {
      const { j, usage } = await geminiJSON(
        QUERY_PROMPT(books, auto, img, qCount),
        [...compactHistory(history, HIST_TURNS_QUERY, HIST_ANS_CHARS_Q).map(toGemini), { role: 'user', parts: userParts }],
        { type: 'OBJECT', properties: props, required: req });
      const qs = Array.isArray(j.queries) ? j.queries : [];
      const qtype = QTYPES.includes(j.qtype) ? j.qtype : 'general';
      const suggested = Array.isArray(j.books) ? j.books.filter(b => b && b.title).slice(0, 15) : [];
      const imageText = img ? squash(String(j.image_text || '')) : '';
      if (img) logRaw(`· อ่านรูปได้ (${imageText.length} ตัวอักษร, ${scriptOf(imageText) || '-'}): ${clip(imageText, 200)}`);
      const own = (ownOk && isAr(question)) ? [question] : [];
      const imgQ = (imageText && isAr(imageText) && !hasJawiChars(imageText)) ?
        [imageText.replace(new RegExp(AR_MARKS, 'g'), '').replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 6).join(' ')].filter(s => s.split(' ').length >= 2) :
        [];
      const maxLimit = Math.max(qCount, 1) + (own.length ? 1 : 0) + imgQ.length;
      const queries = [...new Set([...qs, ...imgQ, ...own].map(s => String(s).trim()).filter(Boolean))].slice(0, maxLimit);
      if (!queries.length) queries.push(question);
      return { queries, qtype, suggested, imageText, usage, failed: false };
    } catch (e) {
      logRaw(`! generateQueries failed → ใช้คำถามตรง ๆ: ${e.message}${img ? ' (ถ้าเกี่ยวกับ inlineData แปลว่า relay ไม่รับรูป)' : ''}`);
      return { queries: [question], qtype: 'general', suggested: [], imageText: '', usage: usageOf(null), failed: true, error: e.message };
    }
  }

  const RERANK_PROMPT = (qtype, k, auto, img) => `You select evidence passages for a scholarly answer written from classical books.
You get the user's question${img ? ' (including the text read from an image the user attached, whose شرح is wanted)' : ''} and numbered candidate passages (#0, #1, …) found by keyword search over ${auto ? 'the whole library' : 'the user\'s selected books'}; many of them only share words with the question and are NOT really about it.
Return JSON {"picked":[...]} with the numbers of at most ${k} passages that:
- actually contain information answering the question (the event, ruling, explanation… itself — not a passing mention, an index line or an unrelated chapter)${img ? ';\n- for the image text: prefer passages that quote and explain THAT text (its words, «قوله: …»), then passages explaining its topic' : ''};
- together cover the WHOLE answer from beginning to end, with little redundancy (if two passages say the same thing keep the clearer, fuller, earlier or more primary one${auto ? `; at most ${AUTO_MAX_PER_BOOK} passages from the same book` : ''});
- prefer full narrations and primary sources over late summaries;
- if the answer is a set of items (conditions, pillars, types, causes…), prefer a passage that lists ALL the items in one place over passages that mention single items.
Order the list in the order the passages should be used when writing the answer${RERANK_ORDER[qtype] || ''}.
Return fewer than ${k} if fewer are relevant, and {"picked":[]} if none is. No explanations.`;

  async function rerank(question, queries, qtype, cand, k, auto, img) {
    const list = cand.map((e, i) => `#${i} «${e.base.book.primaryName || ''}»${e.base.book.authorName ? ' — ' + e.base.book.authorName : ''} (${loc(e.base.metadata.pages[0])})\n${stripEm(makeExcerpt(e.marked, RERANK_CHARS))}`).join('\n---\n');
    const { j, usage } = await geminiJSON(
      RERANK_PROMPT(qtype, k, auto, img),
      [{ role: 'user', parts: [{ text: `<question>${question}</question>\n<search_terms>${queries.join(' | ')}</search_terms>\n<candidates>\n${list}\n</candidates>` }] }],
      { type: 'OBJECT', properties: { picked: { type: 'ARRAY', items: { type: 'INTEGER' } } }, required: ['picked'] });
    const picked = (Array.isArray(j.picked) ? j.picked : []).map(Number).filter(i => Number.isInteger(i) && i >= 0 && i < cand.length);
    logRaw(`· rerank ${cand.length} ผู้สมัคร → เลือก [${picked.join(',')}]`);
    return { picked, usage };
  }

  const IMG_RULE = `IMAGE
- The user attached an image (it is included with the question); the text the app read from it is in <image_text> when present. Your task: present the شرح (explanation) of THIS text from the sources.
- After the title, first quote the text (or the phrase being explained) briefly, then explain it phrase by phrase in its own order, the way the commentators do in the sources (قوله: «…» أي …), with citations. If the LANGUAGE differs from the language of the image text, also translate the quoted text.
- If the sources do not explain this exact text, say so clearly in one sentence, then give only what the sources say about its topic. Never explain it from your own knowledge.`;

  const answerPrompt = (sources, len, qtype, auto, lm, lang, img) => {
    const books = [...new Map(sources.map(s => [`${s.metadata.src}:${s.metadata.bookId}`, s.book])).values()];
    return `You are a scholarly Islamic research assistant writing answers for a library app. Answer ONLY from the numbered excerpts in <sources>, taken from:
${books.map(b => `- «${b.primaryName}»${b.authorName ? ' — ' + b.authorName : ''}`).join('\n')}
${auto
    ? 'These excerpts were found by searching the WHOLE library and then selected as the most relevant: synthesize across them, prefer primary and earlier sources over later summaries, and silently ignore anything off-topic.'
    : 'These are from the books the user selected: rely on them only.'}

LANGUAGE
- ${LANG_RULE[lang] || LANG_RULE.ar}
- The Arabic sample wordings in the rules below (titles, transitions, «وهكذا…», «وشروط الصلاة تسعة، هي:») only illustrate the style — write their equivalents in the chosen LANGUAGE. Verses and hadiths always stay in Arabic.

GROUNDING
- Put citation markers [n] (n = source number) at the end of the sentence or paragraph they support, AFTER the final punctuation: «…فأذن له. [1]» or «…ومساكنه. [1][6]». Every factual paragraph (and every list item) needs at least one. Never invent numbers.
- If sources disagree, present both views with their citations. If they do not contain the answer (or part of it), say so briefly. Never invent content, narrations, page numbers or citations.
- Excerpts may be trimmed ("…"); do not speculate about missing parts.

FLOW (most important)
- Write ONE continuous, well-connected text, like a short article by a scholar — never "book A says…, then book B says…" one after the other. When several sources describe the same point, merge them into one sentence or paragraph and cite them together.
- The sources are already ordered in the best reading order; follow it where sensible. You do not need to use every source.
- Each paragraph = one idea or one stage. Link paragraphs with natural transitions (ثم، وبعد ذلك، فلما…، وفي تلك الأثناء…، ولهذا…). Never repeat a fact; vary the openings of sentences.
- Short, clear sentences. No filler such as «ومن الجدير بالذكر» or «وفي الختام».

STYLE (follow strictly)
- First line (except SHORT): the topic as a bold title on its own line, e.g. **قصة هجرة النبي ﷺ إلى المدينة** — never use "#" for the title.
- Then prose paragraphs separated by a blank line, 2–4 sentences each. For lists follow the LISTS rule below exactly.
- Honorifics: ﷺ after the Prophet (النبي ﷺ، رسول الله ﷺ); رضي الله عنه / عنها / عنهما / عنهم after Companions; رحمه الله optionally after scholars.
- Words of the Prophet ﷺ (hadith or his direct speech): wrap in <hadith>…</hadith> with no quotation marks inside.
- Qur'an: wrap in <ayah>…</ayah> (no brackets inside), then the reference in parentheses, e.g. (التوبة: 40). Copy verse wording exactly; quote only verses that appear in the sources or in the narrated event itself. If words spoken in a story are themselves a Qur'anic verse (e.g. لا تحزن إن الله معنا), use <ayah>, never <hadith>.
- Speech of other people: «…» in plain text.
- Add diacritics to names that could be misread (e.g. عبد الله بن أُرَيْقِط، سُراقة بن مالك).
- Attribute naturally (ذكر ابن هشام في السيرة…، قال الإمام النووي…).
- Do NOT write a references or bibliography list — the app displays the sources itself.

LISTS
${LIST_RULE(lm)}${TABLE_RULE(lm)}
${img ? `\n${IMG_RULE}\n` : ''}
CONTENT TYPE
- ${QTYPE_GUIDE[qtype] || QTYPE_GUIDE.general}

- ${LENGTH[len].rule}`;
  };

  async function streamAnswer(history, question, sources, len, qtype, auto, opts, onDelta) {
    const { lang = 'ar', images = [], imageText = '' } = opts || {};
    const img = images.length > 0;
    const ctx = sources.map((s, i) => `[${i + 1}] «${s.book.primaryName}»${s.book.authorName ? ' — ' + s.book.authorName : ''} (${loc(s.metadata.pages[0])})\n${s.excerpt || s.text}`).join('\n---\n');
    const lm = listMode(question, sources);
    logRaw(`· รูปแบบรายการ: ${lm.user || lm.src.length ? `เป็นข้อ (ผู้ใช้ขอ=${lm.user}, แหล่งที่แจกแจง=[${lm.src.join(',')}])` : 'ร้อยแก้ว (ไม่ใช้ 1,2,3)'}${lm.table ? ' · ตาราง=true' : ''} · ภาษาตอบ=${lang}${img ? ` · รูป ${images.length}` : ''}`);
    const userText = `<sources>\n${ctx}\n</sources>\n\n${imageText ? `<image_text>\n${imageText}\n</image_text>\n\n` : ''}<question>${question}</question>`;
    const mkBody = cap => ({
      systemInstruction: { parts: [{ text: answerPrompt(sources, len, qtype, auto, lm, lang, img) +
        ((!thinkEnabled || thinkMode === 'off') ? '\n\nTHINKING: keep internal reasoning to a minimum. The sources are already selected and ordered; start writing the answer right away.' : '') }] },
      contents: [...compactHistory(history, HIST_TURNS_ANSWER, HIST_ANS_CHARS).map(toGemini),
        { role: 'user', parts: [...images.map(imgPart), { text: userText }] }
      ],
      generationConfig: {
        ...thinkCfg(),
        ...(cap ? capCfg(len) : {}),
      },
    });

    let usage = usageOf(null),
      finishReason = 'stop',
      events = 0,
      textEvents = 0;
    const run = async cap => {
      events = 0;
      textEvents = 0;
      const feed = sseParser(ev => {
        events++;
        if (events === 1 && (ev.modelVersion || ev.model)) logRaw('· modelVersion: ' + (ev.modelVersion || ev.model));
        if (ev.choices?.length) {
          const ch = ev.choices[0];
          const delta = ch?.delta?.content ?? (!textEvents && typeof ch?.message?.content === 'string' ? ch.message.content : '');
          if (delta) {
            textEvents++;
            onDelta(delta);
          }
          if (ch?.finish_reason) finishReason = String(ch.finish_reason).toLowerCase();
          if (ev.usage) usage = usageOf(ev.usage);
          return;
        }
        const c = ev.candidates?.[0];
        for (const p of (c?.content?.parts || [])) {
          if (p.text && !p.thought) {
            textEvents++;
            onDelta(p.text);
          }
        }
        if (c?.finishReason) finishReason = String(c.finishReason).toLowerCase();
        if (ev.usageMetadata || ev.usage) usage = usageOf(ev.usageMetadata || ev.usage);
      });
      const body = mkBody(cap);
      if (isOpenAIMode()) {
        const sysTxt = body.systemInstruction?.parts?.map(p => p.text || '').join('') || '';
        const oaiBody = {
          model: getActiveModel(),
          messages: contentsToOAI(sysTxt, body.contents),
          stream: true,
          ...(cap && LENGTH[len]?.maxOut ? { max_tokens: LENGTH[len].maxOut } : {}),
        };
        logRaw(`· [${apiProvider}] ส่ง OpenAI/Claude stream model=${oaiBody.model}`);
        const raw = await gmStream(getChatCompletionsUrl(), oaiBody, gHeaders(), feed);
        if (!events) {
          try {
            const parsed = JSON.parse(raw);
            const txt = textOf(parsed);
            if (txt) {
              events = 1;
              textEvents = 1;
              onDelta(txt);
              if (parsed.usage) usage = usageOf(parsed.usage);
              return;
            }
          } catch (_) {}
          throw new Error('Claude/API: ' + String(raw).slice(0, 400));
        }
        return;
      }
      logRaw(`· [${apiProvider}] ส่ง generationConfig: ${JSON.stringify(body.generationConfig)}`);

      const raw = await gmStream(`${getGeminiUrl()}/${getActiveModel()}:streamGenerateContent?alt=sse`, body, gHeaders(), feed);
      if (!events) throw new Error('Gemini: ' + String(raw).slice(0, 400));
    };

    const wantCap = USE_MAX_OUT && !noMaxOut;
    let cap = wantCap;
    for (let attempt = 0;; attempt++) {
      try {
        await run(cap);
        break;
      } catch (e) {
        if (textEvents || attempt >= 4) throw e;
        const msg = String(e.message || e);
        if (/thinking/i.test(msg) && thinkFallback()) continue;
        if (cap) {
          cap = false;
          logRaw(`! stream failed with maxOutputTokens → retry without: ${msg}`);
          continue;
        }
        if (isRetryable(e)) {
          await sleep(900 * (attempt + 1));
          continue;
        }
        throw e;
      }
    }
    if (wantCap && !cap) {
      noMaxOut = true;
      GM_setValue('noMaxOut', true);
    }
    return { finishReason, usage, ctxChars: ctx.length };
  }

  // ================= USUL API =================
  function pickVersion(versions = []) {

  const mapVersions = vs => (vs || []).map(v => ({ id: v.id, source: v.source, value: String(v.value ?? ''), kw: !!v.keywordSupported, ai: !!v.aiSupported }));

  const goldenYear = x => {

    return Number.isFinite(n) && n > 0 ? n : '';

  function gSortLocal(list) {

  const gMeta = new Map();

  async function goldenSearchBooks(q) {
    const t = arDigits(q).trim();
    if (/^\d+$/.test(t)) {
      const d = await goldenMeta(t).catch(() => null);
      return d?.bookid ? { found: 1, hits: [goldenBookFrom(d)] } : { found: 0, hits: [] };
    }
    const rs = await Promise.all([`filter[bookname]=${enc(q)}`, `filter[author.authorname]=${enc(q)}`]
      .map(f => getJSON(`${GOLDEN}/guest/book?${f}&per_page=50&page=1${gSortParam()}`)
        .catch(e => { logRaw(`! Golden ค้นชื่อ: ${e.message}`); return null; })));
    if (rs.every(r => !r)) throw new Error('เชื่อมต่อ goldenshamela ไม่ได้');
    const seen = new Set(), hits = [];
    rs.forEach(r => (r?.data || []).forEach(x => { if (!seen.has(x.bookid)) { seen.add(x.bookid); hits.push(goldenBookFrom(x)); } }));
    const found = rs.reduce((n, r) => n + (r?.meta?.total || 0), 0);
    return { found: Math.max(found, hits.length), hits: gSortLocal(hits) };

  // ---------- หมวดหมู่ (กันชื่อซ้ำ + จัดกลุ่มแบบต้นฉบับ) ----------
  let goldenCatsP = null;
  const gcKey = s => String(s || '')
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .split(/\s+/).filter(Boolean).map(w => w.replace(/^ال(?=..)/, '')).join('');

  function gcName(x, parent) {
    const fix = s => {
      s = String(s || '').replace(/\s+/g, ' ').trim();
      // "التفاسيرعربي" → "التفاسير عربي"
      if (parent && s.length > parent.length && s.startsWith(parent) && s[parent.length] !== ' ')
        s = parent + ' ' + s.slice(parent.length);
      return s;
    };
    const cands = [x.translate?.categorynametrans?.ar, x.categoryname].map(fix).filter(Boolean);
    if (!parent) return cands[0] || `#${x.categoryid}`;
    return cands.find(s => gcKey(s) !== gcKey(parent)) || '';   // '' = ซ้ำกับหมวดแม่ทุกช่อง
  }

  function gcBuild(arr, parent) {
    const out = [], list = (arr || []).filter(x => x && x.status !== false);
    for (const x of list) {
      const n = +x.books_count || 0, name = gcName(x, parent?.name);
      // ซ้ำหมวดแม่ (ชื่อเหมือน หรือเป็นลูกเดี่ยวจำนวนเท่ากัน) → ไม่แสดง ยกลูกของมันขึ้นมาแทน
      if (parent && (!name || (list.length === 1 && n === parent.n))) {
        out.push(...gcBuild(x.children, parent));
        continue;
      }
      const node = { id: x.categoryid, name, n };
      node.kids = gcBuild(x.children, node);
      out.push(node);
    }
    const cnt = {};                                          // ชื่อซ้ำกันเองในระดับเดียวกัน → ต่อ #ID
    out.forEach(c => { const k = gcKey(c.name); cnt[k] = (cnt[k] || 0) + 1; });
    out.forEach(c => { if (cnt[gcKey(c.name)] > 1) c.name += ` #${c.id}`; });
    return out;
  }

  function goldenCatTree() {
    const c = GM_getValue('goldenCats3', null);
    if (c && Array.isArray(c.tree) && Date.now() - c.t < 7 * 864e5) return Promise.resolve(c.tree);   // แคช 7 วัน

  let jszipP = null;
  const loadJSZip = () => jszipP ||= new Promise((res, rej) => {
    if (window.JSZip) return res(window.JSZip);
    const s = GM_addElement(document.head, 'script', { src: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js' });
    s.onload = () => window.JSZip ? res(window.JSZip) : rej(new Error('JSZip โหลดไม่ขึ้น'));
    s.onerror = () => { jszipP = null; rej(new Error('โหลด JSZip ไม่ได้')); };
  });
  async function unzip(buf) {
    if (typeof DecompressionStream === 'undefined') {
      const z = await (await loadJSZip()).loadAsync(buf);
      return { names: Object.keys(z.files), read: n => z.file(n)?.async('string') ?? Promise.resolve(null) };
    }
    const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder('utf-8');
    let e = buf.byteLength - 22;
    const stop = Math.max(0, e - 65557);
    while (e >= stop && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < stop) throw new Error('ไฟล์ไม่ใช่ EPUB/ZIP');
    const files = new Map();
    let p = dv.getUint32(e + 16, true);
    for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      files.set(td.decode(u8.subarray(p + 46, p + 46 + nl)),
        { m: dv.getUint16(p + 10, true), cs: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) });
      p += 46 + nl + xl + cl;
    }
    const read = async name => {
      const f = files.get(name) || files.get([...files.keys()].find(k => k.toLowerCase() === String(name).toLowerCase()));
      if (!f) return null;
      const s = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = u8.subarray(s, s + f.cs);
      if (f.m === 0) return td.decode(data);
      if (f.m !== 8) throw new Error('EPUB บีบอัดแบบที่ไม่รองรับ (' + f.m + ')');
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    return { names: [...files.keys()], read };
  }

  function goldenBlocks(html) {
    const d = new DOMParser().parseFromString(html || '', 'text/html');
    d.querySelectorAll('script,style,head').forEach(x => x.remove());
    const root = d.body || d.documentElement, blocks = [];
    const BLK = /^(P|H[1-6]|LI|BLOCKQUOTE|TR|PRE)$/;
    const walk = el => {
      for (const n of el.children) {
        const leafDiv = n.tagName === 'DIV' && !n.querySelector('p,div,h1,h2,h3,h4,h5,h6,li,table,blockquote');
        if (BLK.test(n.tagName) || leafDiv) {
          n.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
          const h = /^H/.test(n.tagName) || /title|head|عنوان/i.test(n.className || '');
          squash(n.textContent).split('\n').forEach(t => { t = t.trim(); if (t) blocks.push({ h, t }); });
        } else walk(n);
      }
    };
    walk(root);
    const all = squash(root.textContent || '');
    if (blocks.reduce((n, b) => n + b.t.length, 0) < all.length * 0.5) {
      blocks.length = 0;
      all.split('\n').forEach(t => { t = t.trim(); if (t) blocks.push({ h: false, t }); });
    }
    return blocks;
  }

  const gEpubs = new Map();
  function goldenEpub(id) {
    id = String(id);
    if (gEpubs.has(id)) return gEpubs.get(id);
    const p = (async () => {
      const zip = await unzip(await goldenFile(id));
      const xml = s => new DOMParser().parseFromString(s || '', 'application/xml');
      const res = (href, base) => { try { return decodeURIComponent(new URL(href, 'http://e/' + base).pathname.slice(1)); } catch { return base + href; } };
      const dirOf = path => path.includes('/') ? path.replace(/[^/]+$/, '') : '';
      const opfPath = xml(await zip.read('META-INF/container.xml')).querySelector('rootfile')?.getAttribute('full-path') ||
        zip.names.find(n => /\.opf$/i.test(n));
      if (!opfPath) throw new Error('EPUB ไม่มีไฟล์ .opf');
      const opf = xml(await zip.read(opfPath)), dir = dirOf(opfPath);
      const man = new Map();
      opf.querySelectorAll('manifest > item').forEach(it => {
        const href = it.getAttribute('href') || '';
        man.set(it.getAttribute('id'), { href, path: res(href, dir), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || '' });
      });
      const spine = [...opf.querySelectorAll('spine > itemref')].map(r => man.get(r.getAttribute('idref')))
        .filter(m => m && /html|xml/i.test(m.type)).map(m => ({ path: m.path, rel: m.href }));
      if (!spine.length) throw new Error('EPUB ไม่มีเนื้อหา');
      const idxOf = new Map(spine.map((s, i) => [s.path, i]));
      const indexOf = href => {
        const clean = String(href || '').split('#')[0];
        if (!clean) return -1;
        const full = res(clean, dir);
        if (idxOf.has(full)) return idxOf.get(full);
        const base = clean.split('/').pop();
        return spine.findIndex(s => s.path.split('/').pop() === base);
      };

      const toc = [];
      const navItem = [...man.values()].find(m => /\bnav\b/.test(m.props));
      if (navItem) {
        const d = new DOMParser().parseFromString(await zip.read(navItem.path) || '', 'text/html');
        const nav = [...d.querySelectorAll('nav')].find(n => /toc/i.test(n.getAttribute('epub:type') || n.id || '')) || d.querySelector('nav');
        const nd = dirOf(navItem.path);
        const walk = (ol, lv) => {
          for (const li of ol?.children || []) {
            if (li.tagName !== 'LI') continue;
            const a = li.querySelector('a');
            const i = a ? idxOf.get(res((a.getAttribute('href') || '').split('#')[0], nd)) : null;
            if (a && i != null && squash(a.textContent)) toc.push({ title: squash(a.textContent), level: lv, index: i });
            walk(li.querySelector(':scope > ol'), lv + 1);
          }
        };
        walk(nav?.querySelector('ol'), 1);
      }
      if (!toc.length) {
        const ncx = man.get(opf.querySelector('spine')?.getAttribute('toc')) || [...man.values()].find(m => /ncx/.test(m.type));
        if (ncx) {
          const d = xml(await zip.read(ncx.path)), nd = dirOf(ncx.path);
          const walk = (el, lv) => {
            for (const np of el.children) {
              if (np.localName !== 'navPoint') continue;
              const t = squash(np.querySelector('navLabel text')?.textContent || '');
              const i = idxOf.get(res((np.querySelector('content')?.getAttribute('src') || '').split('#')[0], nd));
              if (t && i != null) toc.push({ title: t, level: lv, index: i });
              walk(np, lv + 1);
            }
          };
          const nm = d.querySelector('navMap');
          if (nm) walk(nm, 1);
        }
      }
      const tocSorted = [...toc].sort((a, z) => a.index - z.index);
      const titleAt = i => {
        let t = '';
        for (const h of tocSorted) { if (h.index <= i) t = h.title; else break; }
        return t ? clip(t, 60) : `ق${i + 1}`;
      };

      const cache = new Map();
      const chapter = async i => {
        if (!cache.has(i)) cache.set(i, zip.read(spine[i].path).then(h => ({ blocks: goldenBlocks(h) })));
        return cache.get(i);
      };
      let chunkP = null;
      const chunks = () => chunkP ||= (async () => {
        const out = [];
        for (let i = 0; i < spine.length; i++) {
          const { blocks } = await chapter(i);
          let buf = '', ci = 0;
          const push = () => {
            const text = buf.trim();
            if (text) out.push({ idx: i, ci: ci++, text, n: norm(text).replace(/\s+/g, ' ') });
            buf = '';
          };
          for (const b of blocks) { if (buf && buf.length + b.t.length > GOLDEN_CHUNK) push(); buf += b.t + '\n'; }
          push();
        }
        logRaw(`· Golden #${id}: เตรียมค้นใน EPUB ${spine.length} ส่วน → ${out.length} ช่วง`);
        return out;
      })();
      return { spine, toc, titleAt, indexOf, chapter, chunks };
    })();
    p.catch(() => gEpubs.delete(id));
    gEpubs.set(id, p);
    if (gEpubs.size > GOLDEN_MEM) gEpubs.delete(gEpubs.keys().next().value);
    return p;
  }

  const GOLD_STOP = new Set('من في على عن الى الي ما هل او ثم مع هو هي ان لا لم كان التي الذي ذلك هذا هذه كيف ماذا لماذا متي اين قال قد وقد'.split(' '));
  const goldenToks = q => [...new Set(norm(q).replace(/[^\u0621-\u064A\u06A0-\u06FF\s]/g, ' ').split(/\s+/)
    .map(t => t.length > 4 ? t.replace(/^(?:وال|بال|فال|كال|لل|ال)/, '') : t)
    .filter(t => t.length >= 2 && !GOLD_STOP.has(t)))].slice(0, 8);
  const AR_FOLD = { 'ا': '[اأإآٱ]', 'ه': '[هة]', 'ي': '[يى]' };
  const termRx = (t, f = 'g') => new RegExp([...t].map(c =>
    (c === ' ' ? '\\s+' : (AR_FOLD[c] || c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))) + AR_MARKS + '*').join(''), f);
  const markTerms = (text, q) => {
    const toks = goldenToks(q).sort((a, b) => b.length - a.length);
    if (!toks.length) return String(text || '');
    return String(text || '').replace(new RegExp(toks.map(t => termRx(t).source).join('|'), 'g'), '<em>$&</em>');
  };

  async function goldenLocalRaw(id, q, limit = PER_QUERY) {
    const toks = goldenToks(q);
    if (!toks.length) return [];
    const ep = await goldenEpub(id);
    const chunks = await ep.chunks();
    const nq = norm(q).replace(/[^\u0621-\u064A\u06A0-\u06FF\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const phrase = nq.includes(' ') && nq.length <= 60 ? nq : '';
    const scan = minHit => {
      const arr = [];
      for (const c of chunks) {
        let hit = 0, s = 0;
        for (const t of toks) {
          const n = c.n.split(t).length - 1;
          if (n) { hit++; s += 1 + Math.log(n); }
        }
        if (hit < minHit) continue;
        s *= hit / toks.length;
        if (phrase && c.n.includes(phrase)) s += 3;
        arr.push({ c, s });
      }
      return arr;
    };
    let out = scan(toks.length >= 3 ? 2 : 1);
    if (!out.length && toks.length >= 3) out = scan(1);
    out.sort((a, z) => z.s - a.s);
    return out.slice(0, limit).map(({ c }) =>
      ({ idx: c.idx, ci: c.ci, href: '', text: c.text, marked: markTerms(c.text, q), title: ep.titleAt(c.idx) }));
  }

  function normGolden(b, h) {

  const parseCount = r => {

    return {

  // ================= SEARCH (Turath + Usul) =================
  function normTurath(r) {
    const meta = typeof r.meta === 'string' ? JSON.parse(r.meta) : r.meta;
    return {
      key: `turath:${r.book_id}:${meta.page_id}`,
      bookKey: `turath:${r.book_id}`,

      base: {

  function normUsul(b, r) {
    const p = r.metadata?.pages?.[0] || {};
    const marked = stripTags((r.highlights?.length ? r.highlights.join(' … ') : r.text) || '');
    return {
      key: `usul:${b.id}:${b.versionId}:${p.index}`,

  function normUsulGlobal(x) {
    const b = x.book || {}, n = x.node || {}, m = n.metadata || {};
    const book = {
      src: 'usul', id: b.id || m.bookId, slug: b.slug || '', versionId: x.versionId || '',
      vsrc: String(m.sourceAndVersion || '').split(':')[0], vval: '',
      name: arabicOf(b.secondaryName, b.primaryName),
      author: arabicOf(b.author?.secondaryName, b.author?.primaryName),
    };
    const e = normUsul(book, { ...n, metadata: m });
