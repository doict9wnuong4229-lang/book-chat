  async function fetchHits({ b, q, type }) {
    if (b.src === 'golden') return goldenHits(b, q);
    if (b.src === 'usul') {
      if (!b.versionId) return [];
      const r = await withRetry(() => getJSON(`${USUL}/search/content?q=${enc(q)}&bookId=${enc(b.id)}&versionId=${enc(b.versionId)}&type=${type}&limit=${PER_QUERY}`));
      return (r.results || []).map(x => normUsul(b, x));
    }
    const r = await withRetry(() => getJSON(`${TURATH}/search?q=${enc(q)}&book=${b.id}&ver=3`));
    return (r.data || []).map(normTurath);
  }

  function localRank(entries, queries) {
    const terms = buildTerms(queries);
    for (const e of entries) {
      const t = norm(stripEm(e.marked));
      const hit = terms.filter(x => t.includes(x)).length;
      const cov = terms.length ? hit / terms.length : 0;
      e.score = e.score * (0.6 + cov) + Math.min(ems(e.marked), 6) * 0.4;
    }
    return entries.sort((a, b) => b.score - a.score);
  }
  function diversify(sorted, max, maxPerBook = Infinity) {
    const picked = [],
      seen = new Set(),
      per = new Map();
    for (const e of sorted) {
      if (picked.length >= max) break;
      if (seen.has(e.bookKey)) continue;
      seen.add(e.bookKey);
      picked.push(e);
      per.set(e.bookKey, 1);
    }
    for (const e of sorted) {
      if (picked.length >= max) break;
      if (picked.includes(e)) continue;
      const n = per.get(e.bookKey) || 0;
      if (n >= maxPerBook) continue;
      per.set(e.bookKey, n + 1);
      picked.push(e);
    }
    return picked.sort((a, b) => b.score - a.score);
  }
  const toSource = (e, ctxChars) => ({ ...e.base, score: +e.score.toFixed(4), excerpt: makeExcerpt(e.marked, ctxChars) });

  async function finalizeSources(entries, queries, question, qtype, auto, maxSources, ctxChars, img = false) {
    const maxPerBook = auto ? AUTO_MAX_PER_BOOK : Infinity;
    const sorted = localRank(entries, queries);
    let cand = diversify(sorted, auto ? AUTO_POOL : SEL_POOL, auto ? POOL_PER_BOOK : Infinity);
    if (auto && autoScope === 'all') {
      for (const src of ['golden', 'usul', 'turath']) {
        const topSrc = sorted.filter(e => e.base?.metadata?.src === src).slice(0, 4);
        for (const e of topSrc) {
          if (!cand.includes(e)) cand.push(e);
        }
      }
    }
    if (useTavily) {
      const topTav = sorted.filter(e => e.base?.metadata?.src === 'tavily').slice(0, 4);
      for (const e of topTav) {
        if (!cand.includes(e)) cand.push(e);
      }
    }
    let usage = usageOf(null),
      picked = null;
    if (RERANK && cand.length > 2) {
      try {
        const rCand = cand.slice(0, 90);
        const r = await rerank(question, queries, qtype, rCand, maxSources, auto, img);
        usage = r.usage;
        const out = [],
          per = new Map();
        for (const i of r.picked) {
          const e = (typeof rCand !== 'undefined' ? rCand : cand)[i];
          if (!e || out.includes(e)) continue;
          const n = per.get(e.bookKey) || 0;
          if (n >= maxPerBook) continue;
          per.set(e.bookKey, n + 1);
          out.push(e);
          if (out.length >= maxSources) break;
        }
        if (out.length) picked = out;
        else logRaw('· rerank: ไม่มีชิ้นที่ตรงคำถาม → ใช้คะแนนแทน');
      } catch (e) {
        logRaw(`! rerank ไม่สำเร็จ → ใช้คะแนน: ${e.message}`);
      }
    }
    const list = picked || diversify(sorted, maxSources, maxPerBook);
    if (useTavily && !list.some(e => e.base?.metadata?.src === 'tavily')) {
      const bestTav = sorted.filter(e => e.base?.metadata?.src === 'tavily').slice(0, 2);
      if (bestTav.length) {
        if (list.length >= maxSources) list.splice(Math.max(0, list.length - bestTav.length), bestTav.length, ...bestTav);
        else list.push(...bestTav);
      }
    }
    return { sources: list.map(e => toSource(e, ctxChars)), usage, reranked: !!picked, pool: cand.length };
  }

  async function searchBooks(queries, books) {
    const dups = books.filter(b => dupOfTurath(b, books));
    if (dups.length) logRaw(`! ข้ามเล่มซ้ำ (Usul ที่เป็น version Turath เดียวกัน): ${dups.map(keyOf).join(', ')}`);
    books = books.filter(b => !dups.includes(b));

    // เมื่อติ๊กหนังสือจำนวนมาก ให้ปรับคำค้นให้เหมาะสม เพื่อไม่ให้เกิดคำขอหลายร้อยรอบจนเน็ตหรือเบราว์เซอร์ค้าง
    const qPref = getQueryCount();
    const effQueries = books.length > 60 ? queries.slice(0, Math.max(2, Math.min(qPref, 4)))
                     : books.length > 30 ? queries.slice(0, Math.max(3, Math.min(qPref, 6)))
                     : queries;

    const tasks = [];
    const semQ = effQueries.find(q => q.trim().split(/\s+/).length >= 4) || effQueries[effQueries.length - 1];
    for (const b of books) {
      for (const q of effQueries) tasks.push({ b, q, type: 'keyword' });
      if (USUL_SEMANTIC && b.src === 'usul') tasks.push({ b, q: semQ, type: 'semantic' });
    }

    let done = 0;
    const total = tasks.length;
    let foundHits = 0;
    const updateProgress = () => {
      const st = $('#status');
      if (st) st.textContent = `กำลังค้นใน ${books.length} เล่ม (${done}/${total} คำค้น · พบแล้ว ${foundHits} ข้อความ)…`;
    };

    // หากเลือกหนังสือ Turath จำนวนมาก (>15 เล่ม): ใช้การค้นกวาดส่วนกลาง 1-2 ครั้ง แล้วกรองเฉพาะเล่มที่เลือก
    // เพื่อไม่ให้โดน Cloudflare บล็อก 429 และค้นหาได้เร็วกว่าเดิม 10 เท่า
    let tGlobalHits = [];
    const tSelectedIds = new Set(books.filter(b => b.src === 'turath').map(b => +b.id));
    if (tSelectedIds.size > 15) {
      logRaw(`· มีหนังสือ Turath ${tSelectedIds.size} เล่ม → ใช้การค้นกวาดรวมเพื่อความเร็วและกันโดนบล็อก`);
      const gResults = await pool(effQueries, 2, q =>
        withRetry(() => getJSON(`${TURATH}/search?q=${enc(q)}&ver=3`))
          .then(r => (r.data || []).map(normTurath).filter(h => tSelectedIds.has(+h.base.metadata.bookId)))
          .catch(e => { logRaw(`! turath batch search: ${e.message}`); return []; }));
      tGlobalHits = gResults.flat();
      foundHits += tGlobalHits.length;
      logRaw(`· ค้นกวาด Turath พบ ${tGlobalHits.length} ชิ้นในเล่มที่ติ๊ก`);
    }

    const lists = await pool(tasks, CONCURRENCY, async t => {
      // ถ้าเล่มนี้เป็น Turath และมีเล่ม Turath เกิน 15 เล่ม: ให้เจาะเฉพาะ 12 เล่มแรก เพื่อกัน 429
      if (tSelectedIds.size > 15 && t.b.src === 'turath') {
        const tIndex = books.filter(b => b.src === 'turath').indexOf(t.b);
        if (tIndex >= 12) {
          done++;
          return [];
        }
      }
      try {
        const hits = await fetchHits(t);
        done++;
        if (hits?.length) foundHits += hits.length;
        if (done % 4 === 0 || done === total) updateProgress();
        return hits || [];
      } catch (e) {
        done++;
        if (done % 4 === 0 || done === total) updateProgress();
        logRaw(`! search ${keyOf(t.b)} [${t.type}] ${e.message}`);
        return [];
      }
    });

    if (tGlobalHits.length) lists.push(tGlobalHits);

    const map = new Map();
    lists.forEach(list => (list || []).slice(0, PER_QUERY).forEach((h, rank) => {
      const e = map.get(h.key) || { ...h, score: 0 };
      e.score += 10 / (rank + 1);
      if (ems(h.marked) > ems(e.marked)) {
        e.marked = h.marked;
        e.base = h.base;
      }
      map.set(h.key, e);
    }));
    return [...map.values()];
  }

  const STOP = new Set(['في', 'من', 'علي', 'عن', 'الي', 'و', 'كتاب', 'شرح', 'ابو', 'بن']);
  const cleanTitle = s => norm(s).replace(/[^\u0621-\u064Aa-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  function matchBooks(list, cat) {
    const out = [],
      seen = new Set();
    for (const s of list || []) {
      const title = cleanTitle(String(s.title || s).split(/\s[—–|]\s/)[0]);
      if (title.length < 3) continue;
      const toks = title.split(' ').filter(t => t.length >= 2 && !STOP.has(t));
      if (!toks.length) continue;
      const authToks = cleanTitle(s.author || '').split(' ').filter(t => t.length >= 3 && !STOP.has(t)).slice(0, 2);
      let best = null,
        bestScore = -Infinity;
      for (const b of cat.books) {
        if (!toks.every(t => b.key.includes(t))) continue;
        let sc = 0;
        if (b.nn === title) sc += 100;
        else if (b.nn.startsWith(title)) sc += 50;
        if (authToks.length && authToks.every(t => b.key.includes(t))) sc += 40;
        sc -= b.nn.length / 10;
        sc += Math.min(b.pc || 0, 3000) / 1000;
        if (sc > bestScore) {
          bestScore = sc;
          best = b;
        }
      }
      if (best && !seen.has(best.id)) {
        seen.add(best.id);
        out.push(best);
      }
      if (out.length >= AUTO_SUGGEST) break;
    }
    return out;
  }

  const QTYPE_GOLDEN_POOL = {
    sira: ['السيرة النبوية', 'زاد المعاد', 'البداية والنهاية', 'الرحيق المختوم', 'سبل الهدى والرشاد', 'عيون الأثر'],
    tafsir: ['تفسير الطبري', 'تفسير ابن كثير', 'تفسير القرطبي', 'تفسير السعدي', 'التحرير والتنوير', 'فتح القدير'],
    hadith: ['فتح الباري', 'شرح النووي على مسلم', 'رياض الصالحين', 'عون المعبود', 'تحفة الأحوذي', 'سبل السلام'],
    fiqh: ['المجموع شرح المهذب', 'إعانة الطالبين', 'مغني المحتاج', 'تحفة المحتاج', 'أسنى المطالب', 'كفاية الأخيار', 'الحاوي الكبير', 'المغني'],
    aqeedah: ['شرح العقيدة الطحاوية', 'لوامع الأنوار', 'فتح المجيد', 'تيسير العزيز الحميد', 'اعتقاد أهل السنة'],
    lugha: ['لسان العرب', 'القاموس المحيط', 'مقاييس اللغة', 'فقه اللغة', 'المزهر'],
    akhlaq: ['رياض الصالحين', 'الأذكار', 'إحياء علوم الدين', 'صيد الخاطر', 'الداء والدواء'],
    general: ['فتح الباري', 'رياض الصالحين', 'البداية والنهاية', 'المجموع شرح المهذب'],
  };

  const GENERIC_BOOK_WORDS = new Set(['حكم', 'ما', 'هل', 'في', 'من', 'على', 'عن', 'اليه', 'فقه', 'مذهب', 'عند', 'مسألة', 'بيان', 'باب', 'كتاب', 'شرح', 'حاشية', 'صلاة', 'الصلاة', 'الشافعي', 'الشافعية', 'الحنفي', 'المالكي', 'الحنبلي']);

  async function discoverGoldenBooks(queries, qtype, suggested, maxBooks = 5) {
    const cands = new Map(); // id -> { book, score }
    const qAllNorm = norm(queries.join(' '));
    const qToks = goldenToks(queries.slice(0, 3).join(' '));
    const specificToks = qToks.filter(t => t.length >= 3 && !GENERIC_BOOK_WORDS.has(t));

    const addCand = (x, baseScore) => {
      if (!x || !x.bookid || x.isdownloadable === false) return;
      const b = goldenBookFrom(x);
      const id = +b.id;
      if (!id) return;
      const descNorm = norm(`${b.name} ${b.author} ${x.bookdsecription || ''}`);
      let kwBonus = 0;
      for (const tk of specificToks) {
        if (descNorm.includes(tk)) kwBonus += 18;
      }
      for (const tk of qToks) {
        if (descNorm.includes(tk)) kwBonus += 6;
      }
      const prev = cands.get(id);
      const total = baseScore + kwBonus;
      if (!prev || total > prev.score) {
        cands.set(id, { book: b, score: total });
      }
    };

    const searchByTitle = async ({ t, a, weight = 50 }) => {
      try {
        const r = await getJSON(`${GOLDEN}/guest/book?filter[bookname]=${enc(t)}&per_page=8&page=1${gSortParam()}`);
        const rows = (r?.data || []).filter(x => x && x.bookid && x.isdownloadable !== false);
        if (!rows.length) return;
        const nt = cleanTitle(t), na = cleanTitle(a || '').split(' ').filter(w => w.length >= 3)[0] || '';
        for (let idx = 0; idx < rows.length; idx++) {
          const x = rows[idx];
          const nb = cleanTitle(goldenName(x.bookname));
          let sc = weight - idx * 3;
          if (nb === nt) sc += 60;
          else if (nb.startsWith(nt)) sc += 35;
          else if (nb.includes(nt)) sc += 15;
          if (na && cleanTitle(goldenAuthor(x)).includes(na)) sc += 35;
          sc -= Math.min(nb.length, 80) * 0.15;
          addCand(x, sc);
        }
      } catch {}
    };

    // 1) ค้นหนังสือในคลัง Golden ที่ชื่อเรื่องตรงกับ "หัวข้อเฉพาะของคำถาม" (เช่น السواك, الإمامة, الصبي ฯลฯ)
    const topicSearches = [];
    for (const tk of specificToks.slice(0, 4)) {
      topicSearches.push({ t: tk, a: '', weight: 75 });
    }
    for (const q of queries.slice(0, 3)) {
      const cleanQ = norm(q).replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !GENERIC_BOOK_WORDS.has(w)).slice(0, 2).join(' ');
      if (cleanQ.length >= 4 && !topicSearches.some(x => x.t === cleanQ)) {
        topicSearches.push({ t: cleanQ, a: '', weight: 80 });
      }
    }

    // 2) ค้นหนังสือจากรายชื่อที่ Gemini แนะนำสำหรับคำถามนี้โดยเฉพาะ (suggested)
    const sugSearches = [];
    for (let i = 0; i < (suggested || []).length; i++) {
      const s = suggested[i];
      const full = String(s?.title || s || '').split(/\s[—–|]\s/)[0].trim();
      const auth = String(s?.author || '').trim();
      const w = 90 - i * 4;
      if (full.length >= 3) sugSearches.push({ t: full, a: auth, weight: w });
      const short = full.replace(/^(?:كتاب|صحيح|سنن|مسند|تفسير|حاشية|فتح|شرح)\s+/, '').split(/\s+/).slice(0, 3).join(' ');
      if (short.length >= 4 && short !== full) sugSearches.push({ t: short, a: auth, weight: w - 5 });
    }

    await pool([...topicSearches.slice(0, 4), ...sugSearches.slice(0, 8)], 5, searchByTitle);

    // 3) ถ้ายังได้ผู้สมัครน้อยกว่า maxBooks จึงค่อยดึงจากคลังสำรองตามหมวดวิชา (สุ่มสลับลำดับไม่ให้ซ้ำเดิม)
    if (cands.size < maxBooks) {
      const poolList = [...(QTYPE_GOLDEN_POOL[qtype] || QTYPE_GOLDEN_POOL.general)];
      // หมุนลำดับตามความยาวคำถามเพื่อให้หลากหลายหากต้องใช้ตัวสำรอง
      const shift = qAllNorm.length % Math.max(1, poolList.length);
      const rotated = [...poolList.slice(shift), ...poolList.slice(0, shift)];
      await pool(rotated.slice(0, 3).map(t => ({ t, a: '', weight: 25 })), 3, searchByTitle);
    }

    // จัดอันดับผู้สมัครตามคะแนนความเกี่ยวข้องกับคำถาม แล้วเลือกหลากหลายผู้แต่ง
    const sorted = [...cands.values()].sort((a, b) => b.score - a.score);
    const picked = [], seenAuth = new Map();
    for (const item of sorted) {
      if (picked.length >= maxBooks) break;
      const au = cleanTitle(item.book.author || '').slice(0, 18);
      const cnt = au ? (seenAuth.get(au) || 0) : 0;
      if (cnt >= 2) continue;
      if (au) seenAuth.set(au, cnt + 1);
      picked.push(item.book);
    }
    return picked;
  }

  async function autoSearch(queries, qtype, suggested) {
    const scope = AUTO_SCOPES[autoScope] ? autoScope : 'all';
    const useT = scope === 'all' || scope === 'turath';
    const useU = (scope === 'all' && AUTO_USUL) || scope === 'usul';
    const useG = (scope === 'all' && AUTO_GOLDEN) || scope === 'golden';
    logRaw(`· autoSearch scope=${scope} (Turath=${useT}, Usul=${useU}, Golden=${useG})`);

    // ---------- 1) TURATH ----------
    let cat = null, picks = [], pickIds = new Set(), gLists = [], found = [], sLists = [];
    const nameOf = new Map();
    const nameFor = id => cat?.byId.get(+id)?.name || nameOf.get(+id) || `#${id}`;
    const catRx = CAT_RX[qtype] || null;
    const catOk = id => {
      const b = cat?.byId.get(+id);
      return !!(b && catRx && catRx.test(cat.catsN[b.cid] || ''));
    };
    const catW = (id, good, bad) => (cat && catRx) ? (catOk(id) ? good : bad) : 1;

    if (useT) {
      try {
        cat = await loadCatalog();
      } catch (e) {
        logRaw(`! โหลดแคตตาล็อก Turath ไม่สำเร็จ: ${e.message}`);
      }
      picks = cat ? matchBooks(suggested, cat) : [];
      pickIds = new Set(picks.map(b => +b.id));

      const runT = t => withRetry(() => getJSON(`${TURATH}/search?q=${enc(t.q)}${t.book ? `&book=${t.book}` : ''}&ver=3`))
        .then(r => (r.data || []).map(normTurath))
        .catch(e => {
          logRaw(`! auto search ${t.book ? '#' + t.book : 'all'} ${e.message}`);
          return [];
        });

      gLists = await pool(queries.map(q => ({ q, book: null })), CONCURRENCY, runT);

      const freq = new Map();
      gLists.forEach(list => list.slice(0, AUTO_GLOBAL_TOP).forEach((h, rank) => {
        const id = +h.bookKey.split(':')[1];
        freq.set(id, (freq.get(id) || 0) + (10 / (rank + 1)) * catW(id, 1.5, 0.7));
        if (h.base.book.primaryName) nameOf.set(id, h.base.book.primaryName);
      }));
      found = [...freq.entries()].filter(([id]) => !pickIds.has(id))
        .sort((a, b) => b[1] - a[1]).slice(0, scope === 'turath' ? 6 : AUTO_DISCOVER).map(([id]) => id);
      logRaw(`· auto Turath qtype=${qtype} · แนะนำ ${suggested.length} → จับคู่ได้ ${picks.length}: ${picks.map(b => `${b.name}#${b.id}`).join(' | ')}`);
      logRaw(`· auto Turath พบเนื้อหาในเล่ม: ${found.map(id => `${nameFor(id)}#${id}`).join(' | ') || '-'}`);

      const sTasks = [];
      for (const id of [...pickIds, ...found])
        for (const q of queries.slice(0, AUTO_SCOPED_QUERIES)) sTasks.push({ q, book: id });
      sLists = await pool(sTasks, CONCURRENCY, runT);
    }

    // ---------- 2) USUL ----------
    let uLists = [], uFound = [], uScoped = [];
    if (useU) {
      uLists = await pool(queries, CONCURRENCY, q =>
        withRetry(() => getJSON(`${USUL}/search?q=${enc(q)}&locale=ar`))
          .then(r => (r.content?.results || [])
            .filter(x => !(AUTO_USUL_SKIP_TURATH && useT && /^turath:/.test(x.node?.metadata?.sourceAndVersion || '')))
            .map(normUsulGlobal))
          .catch(e => { logRaw(`! usul global ${e.message}`); return []; }));
      const uFreq = new Map();
      uLists.forEach(l => l.slice(0, AUTO_GLOBAL_TOP).forEach((h, rank) => {
        const o = uFreq.get(h.bookKey) || { b: h.ubook, s: 0 };
        o.s += 10 / (rank + 1);
        uFreq.set(h.bookKey, o);
      }));
      const uMax = scope === 'usul' ? 5 : AUTO_USUL_DISCOVER;
      uFound = [...uFreq.values()].sort((a, b) => b.s - a.s).slice(0, uMax).map(o => o.b);

      if (scope === 'usul' && uFound.length < uMax && suggested?.length) {
        const sugU = await pool(suggested.slice(0, 5), 3, s => usulSearchBooks(s.title).then(r => r.hits?.[0]).catch(() => null));
        for (const b of sugU) {
          if (b && b.versionId && !uFound.some(x => x.id === b.id)) uFound.push(b);
          if (uFound.length >= uMax) break;
        }
      }
      uScoped = await pool(
        uFound.flatMap(b => queries.slice(0, AUTO_SCOPED_QUERIES).map(q => ({ b, q, type: 'keyword' }))),
        CONCURRENCY, t => fetchHits(t).catch(() => []));
      logRaw(`· auto Usul พบเนื้อหาในเล่ม: ${uFound.map(b => b.name).join(' | ') || '-'}`);
    }

    // ---------- 3) GOLDEN SHAMELA ----------
    let gsLists = [], gFound = [], gScoped = [];
    if (useG) {
      gsLists = await pool(queries, CONCURRENCY, q => goldenGlobal(q).catch(() => []));
      const maxGBooks = scope === 'golden' ? 5 : 3;
      gFound = await discoverGoldenBooks(queries, qtype, suggested, maxGBooks);
      if (gFound.length) {
        logRaw(`· auto Golden เลือกค้นในเล่ม: ${gFound.map(b => `${b.name}#${b.id}`).join(' | ')}`);
        $('#status').textContent = `กำลังค้นใน Golden Shamela (${gFound.map(b => b.name).slice(0, 3).join('، ')})…`;
        const combinedKw = goldenToks(queries.join(' ')).slice(0, 6).join(' ');
        const gQueries = [...new Set([...queries.slice(0, AUTO_SCOPED_QUERIES), combinedKw].filter(Boolean))];
        gScoped = await pool(
          gFound.flatMap(b => gQueries.map(q => ({ b, q }))),
          2,
          ({ b, q }) => goldenHits(b, q).catch(e => { logRaw(`! auto Golden #${b.id}: ${e.message}`); return []; })
        );
      }
      const gsN = gsLists.reduce((n, l) => n + l.length, 0) + gScoped.reduce((n, l) => n + l.length, 0);
      logRaw(`· auto Golden พบ ${gsN} ชิ้น`);
    }

    // ---------- 4) MERGE & SCORE ----------
    const foundSet = new Set(found);
    const uFoundKeys = new Set(uFound.map(keyOf));
    const gFoundKeys = new Set(gFound.map(keyOf));
    const map = new Map();
    const add = (list, scoped) => list.slice(0, scoped ? PER_QUERY : AUTO_GLOBAL_TOP).forEach((h, rank) => {
      const e = map.get(h.key) || { ...h, score: 0 };
      const isT = h.bookKey.startsWith('turath:');
      const id = isT ? +h.bookKey.split(':')[1] : NaN;
      let s = 10 / (rank + 1);
      if (scoped) s *= 0.85;
      if (isT) {
        s *= catW(id, 1.45, 0.7);
        if (pickIds.has(id)) s *= 1.3;
        if (foundSet.has(id)) s *= 1.2;
      } else {
        if (uFoundKeys.has(h.bookKey) || gFoundKeys.has(h.bookKey)) s *= 1.35;
      }
      e.score += s;
      if (ems(h.marked) > ems(e.marked)) {
        e.marked = h.marked;
        e.base = h.base;
      }
      map.set(h.key, e);
    });
    gLists.forEach(l => add(l, false));
    sLists.forEach(l => add(l, true));
    uLists.forEach(l => add(l, false));
    uScoped.forEach(l => add(l, true));
    gsLists.forEach(l => add(l, false));
    gScoped.forEach(l => add(l, true));

    const entries = [...map.values()];
    for (const e of entries) {
      if (e.base.metadata.src !== 'turath') continue;
      const b = cat?.byId.get(+e.base.metadata.bookId);
      if (b) {
        e.base.book.primaryName = e.base.book.primaryName || b.name;
        e.base.book.authorName = e.base.book.authorName || b.author;
      }
    }

    // จัดอันดับรายชื่อหนังสือที่แสดงใน "เล่มที่แนะนำ/พบเนื้อหา" จากเล่มที่พบเนื้อหาตรงคำถามจริง (คะแนนสูงสุดขึ้นก่อน)
    const bookScores = new Map();
    for (const e of entries) {
      const bk = e.bookKey;
      const src = e.base?.metadata?.src || 'turath';
      const rawName = e.base?.book?.primaryName || (src === 'turath' ? nameFor(e.base?.metadata?.bookId) : '');
      if (!rawName) continue;
      const label = src === 'golden' ? `${rawName} (Golden)` : src === 'usul' ? `${rawName} (Usul)` : rawName;
      const curBest = bookScores.get(bk);
      const sc = (curBest ? curBest.score : 0) + e.score;
      bookScores.set(bk, { label, score: sc });
    }
    const rankedBooks = [...bookScores.values()]
      .sort((a, b) => b.score - a.score)
      .slice(0, 8)
      .map(x => x.label);

    return {
      entries,
      books: rankedBooks,
    };
  }

  // ================= CATALOG (Turath) =================
  let catalog = null;

  function buildIndex(slim) {
    const books = slim.books.map(([id, name, aid, cid, pc, hp]) => {
      const author = slim.authors[aid] || '';
      return { src: 'turath', id, name, aid, cid, pc, hp: !!hp, author, key: norm(`${name} ${author} ${id}`), nn: cleanTitle(name) };
    });
    return {
      cats: slim.cats,
      catsN: Object.fromEntries(Object.entries(slim.cats).map(([k, v]) => [k, norm(v)])),
      books,
      byId: new Map(books.map(b => [+b.id, b])),
    };
  }
  async function loadCatalog() {
    if (catalog) return catalog;
    const cached = GM_getValue('catalogV3', null);
    if (cached && Date.now() - cached.t < 7 * 864e5) return (catalog = buildIndex(cached.d));
    const data = JSON.parse(await gmRequest({ method: 'GET', url: CATALOG_URL }));
    const slim = { cats: {}, books: [], authors: {} };
    for (const c of Object.values(data.cats || {})) slim.cats[c.id] = c.name;
    for (const b of Object.values(data.books || {})) slim.books.push([b.id, b.name, b.author_id, b.cat_id, b.page_count || 0, b.has_pdf ? 1 : 0]);
    for (const [k, a] of Object.entries(data.authors || {})) slim.authors[a?.id ?? k] = typeof a === 'string' ? a : (a?.name || '');
    GM_setValue('catalogV3', { t: Date.now(), d: slim });
    return (catalog = buildIndex(slim));
  }

  // ================= BOOK INFO (สารบัญ / จำนวนหน้า) =================
  const infoCache = new Map();

  function pmEntry(x) {
    if (x == null) return null;
    if (Array.isArray(x)) return [+x[0], +x[1]];
    if (typeof x === 'object') return [+(x.vol ?? x.volume ?? 1), +(x.page ?? x.pg)];
    const s = String(x).split(/[,\-:/]/);
    return s.length > 1 ? [+s[0], +s[1]] : [1, +s[0]];
  }

  function lookupPm(pm, v, p) {
    if (!Array.isArray(pm)) return null;
    for (let i = 0; i < pm.length; i++) {
      const e = pmEntry(pm[i]);
      if (e && e[0] === +v && e[1] === +p) return i + 1;
    }
    return null;
  }

  async function turathInfo(id) {
    if (reader.src === 'golden' && String(id) === String(reader.bookId)) return goldenInfo(id);
    // ต้องมี include=indexes ไม่งั้น API ส่งมาแค่ meta (ไม่มี headings / print_pg_to_pg)
    const r = await getJSON(`${TURATH}/book?id=${enc(id)}&include=indexes&ver=3`);
    const ix = r.indexes || {};
    const pm = Array.isArray(ix.page_map) ? ix.page_map : [];
    const hs = [ix.headings, r.headings, r.toc].find(x => Array.isArray(x) && x.length) || [];
    const pgOf = h => {
      const n = numOr(h.page?.id, h.page?.pg, h.page_id, h.pg, h.page);
      if (Number.isFinite(n)) return n;
      if (h.page && typeof h.page === 'object') {
        const m = lookupPm(pm, h.page.vol ?? h.page.volume ?? 1, h.page.page);
        if (m != null) return m;
      }
      return NaN;
    };
    const toc = hs.map(h => ({
      title: stripEm(stripTags(h.title || h.name || '')).trim(),
      level: +h.level || 1,
      index: pgOf(h),
    })).filter(h => h.title && Number.isFinite(h.index));
    tocDebug('turath', { headings: hs.length, ok: toc.length, sample: hs[0], pageMap: pm.length, mapSample: pm[0] });
    const pc = catalog?.byId.get(+id)?.pc;
    const p2p = ix.print_pg_to_pg && typeof ix.print_pg_to_pg === 'object' ? ix.print_pg_to_pg : null;
    const p2pMax = p2p ? Math.max(0, ...Object.values(p2p).map(v => +(v?.id ?? v)).filter(Number.isFinite)) : 0;
    const total = pm.length || pc || p2pMax || null;
    return { toc, p2p, pm, total, vols: (ix.volumes || []).length, name: r.meta?.name || '', pdf: pdfOf(r.meta) };
  }

  // PDF ของเล่ม (มีเฉพาะบางเล่ม): meta.pdf_links = { root, files:["htmsm01.pdf", "htmsm00.pdf|الغلاف", ...] }
  function pdfOf(meta) {
    const pl = meta?.pdf_links;
    if (!pl || !Array.isArray(pl.files) || !pl.files.length) return null;
    const base = 'https://files.turath.io/pdf/' +
      (pl.root ? String(pl.root).split('/').map(enc).join('/') + '/' : '');
    const files = pl.files.map(f => {
      const [file, label = ''] = String(f).split('|');
      const vol = label ? NaN : +(file.match(/(\d+)\D*\.pdf$/i) || [])[1];   // htmsm03.pdf → 3
      return { file, label, vol, url: base + enc(file) };
    });
    return { files, main: files.filter(f => !f.label) };
  }

  async function usulInfo(slug, versionId) {
    if (!slug && reader.src === 'golden') return goldenInfo(reader.bookId);
    const v = versionId ? `&versionId=${enc(versionId)}` : '';
    let r = {};
    try {
      r = await getJSON(`${USUL}/book/page/${enc(slug)}?index=0${v}&fields=headings,pdf&includeBook=true&locale=ar`);
    } catch (e) {
      logRaw(`! Usul page/headings: ${e.message} → ใช้ details แทน`);
    }
    let hs = r.content?.headings || r.headings || [];
    let book = r.book;
    if (!hs.length || !book) {
      const d = await getJSON(`${USUL}/book/details/${enc(slug)}?locale=ar`);
      if (!hs.length) hs = d.headings || [];
      book = book || d.book;
    }
    const curId = r.content?.id || versionId;
    const ver = (book?.versions || []).find(x => x.id === curId);
    const pdfUrl = r.content?.pdfUrl || r.content?.pdf?.url || ver?.pdfUrl || '';
    const toc = hs.map(h => ({
      title: stripEm(stripTags(h.title ?? h.text ?? h.content ?? '')).trim(),
      level: +h.level || 1,
      index: numOr(h.pageIndex, h.page?.index, h.index),
      vol: +arDigits(h.page?.vol ?? h.page?.volume ?? 1) || 1,
      pg: +arDigits(h.page?.page ?? ''),
    })).filter(h => h.title && Number.isFinite(h.index));
    tocDebug('usul', { want: versionId, got: curId, headings: hs.length, ok: toc.length, total: r.pagination?.total, pdf: !!pdfUrl });
    const f = pdfUrl ? { file: 'usul.pdf', label: '', vol: NaN, url: pdfUrl } : null;
    return {
      toc,
      versions: mapVersions(book?.versions),
      total: r.pagination?.total ?? null,
      mismatch: false,
      pdf: f ? { files: [f], main: [f] } : null,
    };
  }

  function lookupPrinted(info, v, p) {
    const map = info?.p2p;
    if (map && typeof map === 'object') {
      const val = x => {
        const n = +(x?.id ?? x?.page_id ?? x);
        return Number.isFinite(n) ? n : null;
      };
      for (const k of [`${v},${p}`, `${v}-${p}`, `${v}:${p}`, `${v}/${p}`])
        if (map[k] != null) return val(map[k]);
      const sub = map[v];
      if (sub && sub[p] != null) return val(sub[p]);
    }
    return lookupPm(info?.pm, v, p);
  }

  async function addFiles(files) {
    const list = [...(files || [])].filter(f => f && (/^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp|gif|bmp)$/i.test(f.name || '')));
    if (!list.length) return;
    for (const f of list) {
      if (attach.length >= MAX_IMAGES) {
        $('#status').textContent = `แนบได้สูงสุด ${MAX_IMAGES} รูปต่อคำถาม`;
        break;
      }
      try {
        $('#status').textContent = 'กำลังเตรียมรูป…';
        attach.push(await prepImage(f));
      } catch (e) {
        alert(`แนบรูปไม่สำเร็จ: ${e.message}`);
      }
    }
    if (/กำลังเตรียมรูป/.test($('#status').textContent)) $('#status').textContent = '';

    $('#inp').focus();

  $('#att').onclick = () => $('#file').click();
  $('#file').addEventListener('change', e => {
    addFiles(e.target.files);
    e.target.value = '';
  });
  $('#thumbs').addEventListener('click', e => {

    if (!b) return;
    attach.splice(+b.dataset.rmimg, 1);
    renderThumbs();
  });
  $('#inp').addEventListener('paste', e => {
    const fs = [...(e.clipboardData?.items || [])]
      .filter(it => it.kind === 'file' && /^image\//.test(it.type)).map(it => it.getAsFile()).filter(Boolean);
    if (!fs.length) return;
    if (!e.clipboardData.getData('text/plain')) e.preventDefault();
    addFiles(fs);
  });
  $('#panel').addEventListener('dragover', e => {
    if (![...(e.dataTransfer?.types || [])].includes('Files')) return;
    e.preventDefault();
    $('#panel').classList.add('drag');
  });
  $('#panel').addEventListener('dragleave', e => {
    if (e.target === $('#panel')) $('#panel').classList.remove('drag');
  });
  $('#panel').addEventListener('drop', e => {
    $('#panel').classList.remove('drag');
    const fs = e.dataTransfer?.files;
    if (!fs?.length) return;

  const badgeOf = b => b.src === 'usul' ?
    `U·${esc(srcLabel(b.vsrc))}` :

  function renderChips() {
    $('#selcount').textContent = selected.length;
    const scopeBar = `<span class="scope-pills">${Object.entries(AUTO_SCOPES).map(([k, v]) =>
      `<button class="sc-pill ${autoScope === k && !selected.length ? 'on' : ''}" data-scope="${k}" title="${esc(v.title)}">${esc(v.label)}</button>`).join('')}</span>`;
    $('#chips').innerHTML = (selected.length ?
        selected.map(b => {
          const dup = dupOfTurath(b, selected);
          return `<span class="chip ${dup ? 'dup' : ''}" title="${esc(b.name)}">${badgeOf(b)}<span>${esc(b.name)}</span><button data-rm="${keyOf(b)}">×</button></span>`;
        }).join('') + `<button class="sc-pill auto-back" data-scope="${autoScope}" title="ล้างเล่มที่ติ๊กแล้วสลับเป็นโหมดค้นทั้งคลังอัตโนมัติ">✨ ค้นอัตโนมัติ</button>` :
        `<span class="chip auto">✨ อัตโนมัติ · ค้นจาก ${esc(AUTO_SCOPES[autoScope]?.full || 'ทุกคลัง')} แล้วคัดข้อความที่สอดคล้องที่สุด</span>${scopeBar}`) +
      `<span class="chip add" data-go="lib">${selected.length ? '+ เพิ่มหนังสือ' : '+ หรือเลือกหนังสือเอง'}</span>`;

  $('#chips').addEventListener('click', e => {

    if (sc) {
      setAutoScope(sc.dataset.scope);
      return;
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      selected = selected.filter(b => keyOf(b) !== rm.dataset.rm);
      saveSelected();
      renderChips();
      syncListCheck(rm.dataset.rm);
      return;
    }
    if (e.target.closest('[data-go]')) showTab('lib');
  });

  function toggleBook(b, on) {
    const k = keyOf(b),
      has = selected.some(x => keyOf(x) === k);
    if (on && !has) {
      if (Number.isFinite(MAX_BOOKS) && selected.length >= MAX_BOOKS) {
        alert(`เลือกได้สูงสุด ${MAX_BOOKS} เล่ม`);
        return false;
      }
      if (b.src === 'usul') {
        if (!b.versionId) {
          alert('เล่มนี้ไม่มี version ที่ค้นได้ใน Usul');
          return false;
        }
        const nb = slimBook(b);
        if (dupOfTurath(nb, selected) && !confirm('เล่มนี้ใน Usul ใช้ version จาก Turath ซึ่งคุณติ๊กไว้แล้ว (ข้อความเดียวกัน) — จะถูกข้ามตอนค้น\nยังจะเพิ่มอยู่ไหม? (แนะนำให้เปลี่ยน version เป็น OpenITI ถ้ามี)')) return false;
        selected.push(nb);
      } else {
        selected.push(slimBook(b));
        if (b.src === 'golden' && !b.author) goldenMeta(b.id).then(d => {
          const s = selected.find(x => keyOf(x) === k), au = goldenAuthor(d);
          if (s && au) { s.author = au; saveSelected(); renderChips(); }
        }).catch(() => {});
      }
    } else if (!on && has) selected = selected.filter(x => keyOf(x) !== k);
    saveSelected();
    renderChips();
    return true;
  }

  function syncListCheck(k) {
    const on = selected.some(x => keyOf(x) === k);
    root.querySelectorAll('#blist input[data-key]').forEach(cb => {
      if (cb.dataset.key !== k) return;
      cb.checked = on;
      cb.closest('.bk')?.classList.toggle('sel', on);
    });
    const bc = $('#bcount');
    bc.textContent = bc.textContent.replace(/ติ๊กแล้ว \d+/, `ติ๊กแล้ว ${selected.length}`);
  }
  renderChips();

  const urlBook = location.host === 'app.turath.io' && location.pathname.match(/\/book\/(\d+)/);
  if (urlBook && !selected.some(b => keyOf(b) === `turath:${+urlBook[1]}`)) {
    getJSON(`${TURATH}/book?id=${urlBook[1]}&ver=3`).then(r => {
      toggleBook({ src: 'turath', id: +urlBook[1], name: r.meta?.name || `#${urlBook[1]}`, author: '' }, true);
    }).catch(() => {});
  }
  const urlUsul = /(^|\.)usul\.ai$/.test(location.host) && location.pathname.match(/\/t\/([^/]+)/);
  if (urlUsul) {
    getJSON(`${USUL}/book/details/${enc(decodeURIComponent(urlUsul[1]))}?locale=ar`).then(r => {
      const bk = r.book;
      if (!bk || selected.some(b => keyOf(b) === `usul:${bk.id}`)) return;
      toggleBook(usulBookFrom({ ...bk, author: { primaryName: bk.author?.primaryName } }), true);
    }).catch(() => {});
  }

  let libReady = false,

    $('#bstat').textContent = `จำนวนหนังสือ · Turath ${t} เล่ม · Usul ${u} เล่ม` +

  }

  // ---------- ป๊อปอัปจัดการหมวดรายการโปรด ----------

  const favCatSave = cats => GM_setValue('favCats', cats.filter(c => c && c !== FAV_DEF));

        border-radius:50%;font-size:11px;font-weight:700;color:#dc2626;background:rgba(220,38,38,.12);transition:.15s}

      .fvd-ok{background:var(--pri);color:#fff;border-color:var(--pri);border-radius:12px;font-weight:600}

      .fvd-act button:hover{background:var(--bg);color:var(--txt)}
      .fvd-act .fvd-del{color:#dc2626}
      .fvd-act .fvd-del:hover{background:rgba(220,38,38,.1);color:#dc2626}

      .fvd-act .fvd-save:hover{background:var(--pri-g,var(--pri));color:#fff;filter:brightness(1.06)}
    </style>
    <div class="fvd-name" dir="auto">${esc(b.name || '')}</div>
    ${b.author ? `<div class="fvd-auth" dir="auto">${esc(b.author)}</div>` : ''}
    <div class="fvd-lbl">เลือกหมวดหมู่:</div>
    <div class="fvd-chips"></div>
    <div class="fvd-new"><button class="fvd-add">＋ สร้างหมวดใหม่</button></div>
    <div class="fvd-act">
      ${had ? '<button class="fvd-del">ลบออกจากโปรด</button>' : ''}
      <span style="flex:1"></span>
      <button class="fvd-cancel">ยกเลิก</button>
      <button class="fvd-save">บันทึก</button>
    </div>`;

    const chips = body.querySelector('.fvd-chips');
    const paint = () => {
      const used = {};
      favBooks.forEach(f => { used[f.cat] = (used[f.cat] || 0) + 1; });
      chips.innerHTML = cats.map(c =>
        `<span class="fvd-chip${c === cur ? ' on' : ''}" data-c="${esc(c)}" dir="auto">` +
        `${c === cur ? '✓ ' : ''}${esc(c)}${used[c] ? ` <small>(${used[c]})</small>` : ''}` +
        `${c !== FAV_DEF ? `<b class="fvd-x" data-x="${esc(c)}" title="ลบหมวดนี้">✕</b>` : ''}</span>`).join('');
    };
    paint();

    chips.onclick = e => {
      const x = e.target.closest('[data-x]');
      if (x) {                                            // ลบหมวด
        e.stopPropagation();
        const c = x.dataset.x, n = favBooks.filter(f => f.cat === c).length;
        if (n && !confirm(`หมวด «${c}» มีหนังสือ ${n} เล่ม\nลบหมวดแล้วย้ายหนังสือไป «${FAV_DEF}»?`)) return;
        favBooks.forEach(f => { if (f.cat === c) f.cat = FAV_DEF; });
        cats.splice(cats.indexOf(c), 1);
        favCatSave(cats);
        if (GM_getValue('favLastCat', '') === c) GM_setValue('favLastCat', '');
        if (cur === c) cur = FAV_DEF;
        saveFavs(); updateFavCats(); renderBookList();

    const nw = body.querySelector('.fvd-new');

    const addCat = () => {
      const v = (inp?.value || '').trim().replace(/\s+/g, ' ');
      if (!v) return false;
      if (!cats.includes(v)) { cats.push(v); favCatSave(cats); }
      cur = v; inp.value = ''; paint();
      return true;

        favBooks.unshift({ key: k, cat: cur, book: bookToSave });
      }
      GM_setValue('favLastCat', cur);
      favCatSave(cats);
      done();
    };
  }




  function updateFavCats() {
    const cats = [...new Set(favBooks.map(f => f.cat).filter(Boolean))].sort();
    const cur = $('#favcat').value;
    $('#favcat').innerHTML = '<option value="">ทุกหมวด</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (cats.includes(cur)) $('#favcat').value = cur;
  }

  async function initLibrary() {
    updateFavCats();
    $('#bsrc').value = libSrc;
    $('#bcat').hidden = libSrc === 'usul';
    if (libSrc === 'golden') goldenFillCats();
    else if (libSrc === 'turath' && catalog?.cats && $('#bcat').dataset.src !== 'turath') {
      $('#bcat').innerHTML = '<option value="">كل التصنيفات</option>' +
        Object.entries(catalog.cats).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
      $('#bcat').dataset.src = 'turath';
    }
    $('#bq').placeholder = ({ usul: 'ค้นใน Usul เช่น نهاية المطلب', golden: 'ค้นใน Golden: ชื่อหนังสือ / ผู้แต่ง / ID' })[libSrc] ||
      'ค้นชื่อหนังสือ / ผู้แต่ง / ID เช่น فتح الباري';
    paintStats();
    usulCount().then(d => {
      if (d) {
        usulStat = d;
        paintStats();
      }
    });

    if (libSrc === 'turath' && !libReady) {
      $('#blist').innerHTML = 'กำลังโหลดรายชื่อหนังสือ Turath (~1.7MB ครั้งแรกครั้งเดียว)…';
      try {
        const c = await loadCatalog();
        $('#bcat').innerHTML = '<option value="">كل التصنيفات</option>' +
          Object.entries(c.cats).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
        $('#bcat').dataset.src = 'turath';
        libReady = true;
        paintStats();
      } catch (e) {
        $('#blist').innerHTML = `โหลดไม่สำเร็จ: ${esc(e.message)}`;
        return;
      }
    }
    renderBookList();
  }
  $('#bsrc').onchange = () => {

  $('#bq').addEventListener('input', () => {

  $('#onlyfav').onchange = () => {

  $('#favcat').onchange = renderBookList;
  $('#onlysel').onchange = () => {

  $('#selall').className = $('#clearsel').className;      // ให้หน้าตาเหมือนปุ่มล้างที่ติ๊ก
  $('#selall').onclick = () => {
    const boxes = [...$('#blist').querySelectorAll('input[data-key]')].filter(cb => !cb.checked);
    if (!boxes.length) return alert('ไม่มีเล่มที่ยังไม่ได้ติ๊กในรายการนี้');

      if (Number.isFinite(MAX_BOOKS) && selected.length >= MAX_BOOKS) break;

      if (!b || (b.src === 'usul' && (!b.versionId || dupOfTurath(slimBook(b), selected)))) { skipped++; continue; }

  function recentHtml() {
    const items = Object.entries(lastRead).filter(([, r]) => r?.book).sort((a, b) => b[1].t - a[1].t).slice(0, 8);
    if (!items.length) return '';
    return '<div class="rec"><div class="h">อ่านต่อจากครั้งก่อน</div>' + items.map(([k, r]) =>
      `<button class="recb" data-resume="${esc(k)}"><span><span class="badge ${r.book.src === 'usul' ? 'usul' : ''}">${badgeOf(r.book)}</span> ${esc(r.book.name || k)}</span> <i>${esc(r.loc || '')}</i></button>`).join('') + '</div>';
  }

  function renderBookList() {
    try { gSortUI2(false); } catch (e) { console.warn('gSortUI2', e); }
    const isFavOnly = $('#onlyfav').checked;
    $('#favcat').style.display = isFavOnly ? 'inline-block' : 'none';

    if (isFavOnly) {
      const catFilter = $('#favcat').value;
      let list = favBooks;
      if (catFilter) list = list.filter(f => f.cat === catFilter);
      let books = list.map(f => {
        const b = f.book;
        return (b.src === 'turath' && catalog) ? { ...(catalog.byId.get(+b.id) || b), src: 'turath' } : b;
      });
      return paintList(books, books.length);
    }

    if ($('#onlysel').checked) {
      const list = selected.map(s => (s.src === 'turath' && catalog) ?
        { ...(catalog.byId.get(+s.id) || { ...s, cid: '', pc: 0 }), src: 'turath' } : s);
      return paintList(list, list.length);
    }
    if (libSrc === 'usul') return renderUsulList();
    if (libSrc === 'golden') return renderGoldenList();
    if (!libReady) return;
    const q = norm($('#bq').value),
      cat = $('#bcat').value;
    if (!q && !cat) {
      $('#bcount').textContent = `${catalog.books.length.toLocaleString()} เล่มใน Turath`;
      $('#blist').innerHTML = recentHtml() + '<div class="empty">พิมพ์ชื่อหนังสือหรือผู้แต่ง หรือเลือกหมวด<br><br>(ถ้าไม่ติ๊กเล่มใดเลย แชทจะค้นทั้งคลังแล้วคัดอ้างอิงให้เองอัตโนมัติ)</div>';
      return;
    }
    const selKeys = new Set(selected.map(keyOf));
    const toks = q.split(/\s+/).filter(Boolean);
    const list = catalog.books.filter(b => (!cat || String(b.cid) === cat) && toks.every(t => b.key.includes(t)));
    list.sort((a, b) => (selKeys.has(keyOf(b)) - selKeys.has(keyOf(a))) ||
      (norm(b.name).startsWith(q) - norm(a.name).startsWith(q)) || a.name.length - b.name.length);
    paintList(list, list.length);
  }

  function srcToBook(s) {
    const m = s.metadata,
      [vsrc, vval] = String(m.sourceAndVersion || '').split(':');
    if (m.src === 'tavily') return { src: 'tavily', id: m.url || m.bookId, name: s.book.primaryName || '', author: s.book.authorName || '', url: m.url || m.bookId };
    if (m.src === 'golden') return { src: 'golden', id: +m.bookId, name: s.book.primaryName || '', author: s.book.authorName || '' };
    return m.src === 'usul' ?
      { src: 'usul', id: m.bookId, slug: m.slug || '', versionId: m.versionId || '', vsrc: vsrc || '', vval: vsrc === 'turath' ? (vval || '') : '', name: s.book.primaryName || '', author: s.book.authorName || '' } :
      { src: 'turath', id: +m.bookId, name: s.book.primaryName || '', author: s.book.authorName || '' };
  }

  function pinSources(list) {
    const seen = new Set();
    let added = 0;
    for (const s of list) {
      if (s?.metadata?.src === 'tavily') continue;
      const b = srcToBook(s),
        k = keyOf(b);
      if (seen.has(k)) continue;
      seen.add(k);
      if (selected.some(x => keyOf(x) === k)) continue;
      if (Number.isFinite(MAX_BOOKS) && selected.length >= MAX_BOOKS) break;
      if (toggleBook(b, true)) added++;
    }
    $('#status').textContent = added ?
      `ปักแล้ว ${added} เล่ม — คำถามต่อไปจะค้นเฉพาะเล่มเหล่านี้ (ลบออกทั้งหมดเพื่อกลับเป็นโหมดอัตโนมัติ)` :

  }

  function render(raw, n, ar) {
    let h = esc(raw);
    h = h.replace(/&lt;hadith&gt;([\s\S]*?)(?:&lt;\/hadith&gt;|$)/g, (_, t) =>
      `<span class="hadith">«${t.replace(/^(?:\s|«|&quot;)+|(?:\s|»|&quot;)+$/g, '')}»</span>`);
    h = h.replace(/&lt;ayah&gt;([\s\S]*?)(?:&lt;\/ayah&gt;|$)/g, (_, t) =>
      `<span class="ayah">﴿${t.replace(/^[\s﴿]+|[\s﴾]+$/g, '')}﴾</span>`);
    h = h.replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/\*\*/g, '');
    h = h.replace(/[ \t]((?:\[\d+(?:\s*[,،]\s*\d+)*\][ \t]*)+)([.!؟?؛])/g, (_, c, p) => `${p} ${c.replace(/\s+/g, '')}`);
    h = h.replace(/\[(\d+(?:\s*[,،]\s*\d+)*)\]/g, (_, nums) => nums.split(/[,،]/).map(x => x.trim())
      .map(x => (+x >= 1 && +x <= n) ? `<button class="cite" data-n="${x}">${ar ? toArNum(x) : x}</button>` : `[${x}]`).join(''));
    let out = '',
      list = '',
      tbl = [],
      first = true;
    const isTblRow = s => /^\|/.test(s) && s.indexOf('|', 1) > 0;
    const isSepCell = c => /^[\s:\-–—]+$/.test(c) && /[\-–—]/.test(c);
    const isSepRow = cells => cells.length > 0 && cells.every(isSepCell);
    const parseCells = rowStr => {
      let s = rowStr.trim().replace(/^\|/, '');
      s = s.replace(/\|\s*((?:<button class="cite"[^>]*>[\s\S]*?<\/button>\s*)+)$/, ' $1').replace(/\|$/, '');
      return s.split('|').map(c => c.trim().replace(/&lt;br\s*\/?&gt;/gi, '<br>'));
    };
    const flushTbl = () => {
      if (!tbl.length) return;
      const rows = tbl.map(parseCells);
      tbl = [];
      const sepIdx = rows.findIndex(isSepRow);
      let headRows = [], bodyRows = [], aligns = [];
      if (sepIdx >= 1) {
        headRows = rows.slice(0, sepIdx);
        aligns = rows[sepIdx].map(c => /^:.*:$/.test(c.trim()) ? 'center' : '');
        bodyRows = rows.slice(sepIdx + 1).filter(r => !isSepRow(r));
      } else if (sepIdx === 0) {
        aligns = rows[0].map(c => /^:.*:$/.test(c.trim()) ? 'center' : '');
        bodyRows = rows.slice(1).filter(r => !isSepRow(r));
      } else {
        headRows = [rows[0]];
        bodyRows = rows.slice(1);
      }
      const colCount = Math.max(1, ...headRows.map(r => r.length), ...bodyRows.map(r => r.length));
      let thHtml = '';
      for (const hr of headRows) {
        if (hr.every(c => !c)) continue;
        thHtml += '<tr>' + Array.from({ length: colCount }, (_, i) => {
          const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
          return `<th${al}>${hr[i] ?? ''}</th>`;
        }).join('') + '</tr>';
      }
      let tbHtml = '';
      for (const br of bodyRows) {
        if (br.every(c => !c)) continue;
        tbHtml += '<tr>' + Array.from({ length: colCount }, (_, i) => {
          const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
          return `<td${al}>${br[i] ?? ''}</td>`;
        }).join('') + '</tr>';
      }
      out += `<div class="tbl-wrap"><table class="atbl">${thHtml ? `<thead>${thHtml}</thead>` : ''}${tbHtml ? `<tbody>${tbHtml}</tbody>` : ''}</table></div>`;
    };
    const close = () => {
      if (list) {
        out += `</${list}>`;
        list = '';
      }
      flushTbl();
    };
    for (const ln of h.split('\n')) {
      if (!ln.trim()) continue;
      const t = ln.trim();
      if (isTblRow(t)) {
        if (list) {
          out += `</${list}>`;
          list = '';
        }
        tbl.push(t);
        first = false;
        continue;
      }
      if (tbl.length) flushTbl();
      const ol = ln.match(/^\s*\(?([0-9٠-٩]{1,2})\s*[.)\-–]\s+(.*)/);
      if (ol) {
        if (list !== 'ol') {
          close();
          out += '<ol>';
          list = 'ol';
        }
        out += `<li>${ol[2]}</li>`;
        first = false;
        continue;
      }
      const li = ln.match(/^\s*[-•]\s+(.*)/);
      if (li) {
        if (list !== 'ul') {
          close();
          out += '<ul>';
          list = 'ul';
        }
        out += `<li>${li[1]}</li>`;
        first = false;
        continue;
      }
      close();
      if (first && /^<b>[\s\S]*<\/b>:?$/.test(t)) {
        out += `<div class="atitle">${t.replace(/^<b>|<\/b>:?$/g, '')}</div>`;
      } else if (first && /^#+\s+/.test(t)) {
        out += `<div class="atitle">${t.replace(/^#+\s+/, '')}</div>`;
      } else {
        const hd = t.match(/^#{1,4}\s+(.*)/);
        if (hd) out += `<h4>${hd[1]}</h4>`;
        else out += `<p>${ln}</p>`;
      }
      first = false;
    }
    close();
    return out;
  }

  const QTYPE_I18N = {
    th: QTYPE_TH,
    ar: { sira: 'السيرة والتاريخ', tafsir: 'التفسير', hadith: 'الحديث', fiqh: 'الفقه', aqeedah: 'العقيدة', lugha: 'اللغة', akhlaq: 'الرقائق والآداب', general: 'عام' },
    jawi: { sira: 'سيره / تاريخ', tafsir: 'تفسير', hadith: 'حديث', fiqh: 'فقه', aqeedah: 'عقيدة', lugha: 'بهاس', akhlaq: 'أخلاق / ادب', general: 'عموم' },
  };
  const LANG_I18N = {
    th: { ar: 'อาหรับ', jawi: 'ยาวี', th: 'ไทย', reply: 'ตอบ', auto: 'อัตโนมัติ', qBy: 'ค้นด้วย:', picks: 'เล่มที่พบเนื้อหาตรงคำถาม:', autoMode: 'โหมดอัตโนมัติ:' },
    ar: { ar: 'العربية', jawi: 'الجاوية', th: 'التايلاندية', reply: 'الإجابة', auto: 'تلقائي', qBy: 'البحث بـ:', picks: 'الكتب المستخلص منها:', autoMode: 'بحث تلقائي:' },
    jawi: { ar: 'عربي', jawi: 'جاوي', th: 'تاءيلند', reply: 'جواڤن', auto: 'اوتوماتيک', qBy: 'چاري دڠن:', picks: 'کتاب يڠ دجومڤاءي نص:', autoMode: 'چاري اوتوماتيک:' },
  };
  const SCOPE_I18N = {
    th: { all: 'Turath + Usul + Golden', turath: 'เฉพาะคลัง Turath', usul: 'เฉพาะคลัง Usul', golden: 'เฉพาะคลัง Golden' },
    ar: { all: 'تراث + أصول + الشاملة', turath: 'مكتبة تراث', usul: 'مكتبة أصول', golden: 'الشاملة الذهبية' },
    jawi: { all: 'تراث + أصول + الشاملة', turath: 'مکتبة تراث', usul: 'مکتبة أصول', golden: 'الشاملة الذهبية' },
  };

  function paintQueries(c) {
    const ul = GM_getValue('bc_ui_lang', '') || localStorage.getItem('bc_ui_lang') || 'th';
    const L = LANG_I18N[ul] || LANG_I18N.th;
    const QT = QTYPE_I18N[ul] || QTYPE_TH;
    const SC = SCOPE_I18N[ul] || SCOPE_I18N.th;
    const parts = [];
    if (c.qtype) parts.push(`<span class="qt">${esc(QT[c.qtype] || c.qtype)}</span>`);
    if (c.usedTavily) parts.push(`<span class="qt" style="background:rgba(3,105,161,.14);color:#0284c7">🌐 Tavily Search${c.tavilyCount ? ` (${c.tavilyCount})` : ''}</span>`);
    if (c.thinkLabel) parts.push(`<span class="ql">🧠 Think: ${esc(c.thinkLabel)}</span>`);
    if (c.langShown) parts.push(`<span class="ql">${L.reply}: ${esc(L[c.lang] || c.lang)}${c.langAuto ? ` (${L.auto})` : ''}</span>`);
    if (c.queries?.length) parts.push(`<b class="qlbl">${L.qBy}</b> ` + c.queries.map(q => `<span>${esc(q)}</span>`).join(' '));
    if (c.failed) parts.push(`<span class="warn" title="${esc(c.err)}">⚠</span>`);
    if (c.auto) {
      const scLbl = SC[autoScope] || SC.all;
      parts.push(`<div class="auto"><span class="qt">${esc(scLbl)}</span> ${c.picks?.length
        ? `<b class="qlbl">${L.picks}</b> ` + c.picks.map(n => `<span>${esc(n)}</span>`).join('')
        : `${L.autoMode} ${esc(scLbl)}`}</div>`);
    }
    if (c.imageText) parts.push(`<div class="imgt"><b>ข้อความที่อ่านจากรูป</b>${esc(c.imageText)}</div>`);
    c.el.querySelector('.qs').innerHTML = parts.join(' ');
  }

  function renderSources(c) {
    const box = c.el.querySelector('.srcs');
    if (!c.sources.length) {
      box.hidden = true;
      return;
    }
    box.hidden = false;
    const num = x => (c.ar ? toArNum(x) : String(x));
    const names = [...new Set(c.sources.map(s => s.book.primaryName).filter(Boolean))];
    
    box.innerHTML =
      `<button class="refbar" data-reftoggle="1"><span class="ri">|||</span><b>المراجع</b><span class="rn">(${num(c.sources.length)})</span><span class="rl">${esc(names.join('، '))}</span><span class="chev">▾</span></button>`;
  }

  const STATUS_TH = {
    'reading-image': 'กำลังอ่านข้อความในรูปและคิดคำค้น…',
    'generating-queries': 'กำลังจำแนกคำถามและคิดคำค้น…',
    'searching': 'กำลังค้นในหนังสือที่เลือก…',
    'auto-searching': 'กำลังค้นทั้งคลังและหาเล่มที่มีเนื้อหาจริง…',
    'ranking': 'กำลังคัดข้อความที่สอดคล้องที่สุด…',
    'generating-response': 'กำลังเรียบเรียงคำตอบ…',
  };

  const slimSource = s => ({
    id: s.id,
    score: s.score,
    metadata: { ...s.metadata, chapters: undefined },
    book: s.book,
    excerpt: clip(s.excerpt || s.text || '', SRC_SAVE_CHARS),
  });
  const slimBookSource = s => ({
    id: s.id,
    score: s.score,
    metadata: { ...s.metadata, chapters: undefined },
    book: s.book,
    text: clip(s.text || s.excerpt || '', 4500),
    excerpt: clip(s.excerpt || s.text || '', 2200),
  });
  const setKey = list => list.map(keyOf).sort().join('|');

  function saveChat(books, auto) {
    if (!chatId || !transcript.length) return;
    let c = chats.find(x => x.id === chatId);
    if (!c) {
      c = { id: chatId, created: Date.now() };
      chats.unshift(c);
    }
    if (!c.title) c.title = clip(String(transcript.find(m => m.role === 'user')?.content || 'แชท').replace(/\s+/g, ' '), 80);
    c.updated = Date.now();
    c.msgs = transcript.slice();
    c.tok = sessionTok;
    if (auto) {
      c.auto = true;
      const m = new Map((c.books || []).map(b => [keyOf(b), b]));
      for (const s of cur?.sources || []) {
        if (s?.metadata?.src === 'tavily') continue;
        const b = slimBook(srcToBook(s));
        if (!m.has(keyOf(b))) m.set(keyOf(b), b);
      }
      c.books = [...m.values()].slice(0, 30);
    } else {
      c.auto = false;
      c.books = books.map(slimBook);
    }
    chats.sort((a, b) => (b.updated || 0) - (a.updated || 0));
    if (chats.length > MAX_CHATS) chats.length = MAX_CHATS;
    saveChats();
  }

  function openChat(c) {
    if (busy) {
      alert('รอให้ตอบเสร็จก่อนนะครับ');
      return;
    }
    resetChat();
    chatId = c.id;
    transcript = (c.msgs || []).slice();
    sessionTok = c.tok || 0;
    paintTok();
    history = transcript.map(m => ({ role: m.role, content: m.role === 'user' && m.imageText ? `${m.content}\n[image text: ${m.imageText}]` : m.content }));
    let lastUser = '';
    for (const m of transcript) {
      if (m.role === 'user') {
        addUser(m.content, m.images || 0);
        lastUser = m.content;
        continue;
      }
      const lang = m.lang || ((m.ar ?? isArQuestion(lastUser)) ? 'ar' : 'th');
      const a = newAssistant(!!m.auto, lang);
      a.raw = m.content || '';
      a.sources = a.el._sources = m.sources || [];
      a.queries = a.el._queries = m.queries || [];
      a.qtype = m.qtype || '';
      a.picks = m.picks || [];
      a.imageText = m.imageText || '';
      a.langShown = !!m.lang;
      a.langAuto = !!m.langAuto;
      a.el._c = a;
      paintQueries(a);
      a.el.querySelector('.body').innerHTML = render(a.raw, a.sources.length, a.ar);
      renderSources(a);
      a.el.querySelector('.meta').textContent = m.meta || '';
    }
    if (c.auto) {
      if (selected.length && confirm('แชทนี้ใช้โหมดหาหนังสืออัตโนมัติ — ล้างหนังสือที่เลือกไว้เพื่อคุยต่อแบบอัตโนมัติไหม?\n(กดยกเลิก = ค้นเฉพาะหนังสือที่เลือกอยู่ตอนนี้)')) {
        selected = [];
        saveSelected();
        renderChips();
      }
    } else {
      const books = (c.books || []);
      if (books.length && setKey(books) !== setKey(selected) &&
        (!selected.length || confirm(`ตั้งหนังสือที่เลือกให้ตรงกับแชทนี้ (${books.length} เล่ม) เพื่อคุยต่อไหม?\n(กดยกเลิก = ใช้หนังสือที่เลือกอยู่ตอนนี้)`))) {
        selected = books.map(b => ({ ...b }));
        saveSelected();
        renderChips();
      }
    }
    showTab('chat');
    scrollDown();
    $('#status').textContent = 'เปิดแชทเดิมแล้ว — พิมพ์ถามต่อได้เลย';
  }

  const srcUrl = s => s.metadata.src === 'tavily' ?
    (s.metadata.url || s.metadata.bookId || '') :
    s.metadata.src === 'usul' ?
    `https://usul.ai/t/${enc(s.metadata.slug || '')}` :
    s.metadata.src === 'golden' ? `https://goldenshamela.com/read-book/${s.metadata.bookId}` :
    `https://app.turath.io/book/${s.metadata.bookId}?page=${s.metadata.pages?.[0]?.index ?? ''}`;

  function chatToMd(c) {
    const out = [`# ${c.title}`, '',
      `- วันที่: ${fmtDate(c.created)} (อัปเดต ${fmtDate(c.updated)})`,
      `- โมเดล: ${MODEL}`,
      `- โหมด: ${c.auto ? 'หาหนังสืออัตโนมัติ' : 'เลือกหนังสือเอง'}`,
      `- หนังสือ: ${(c.books || []).map(b => `${b.name}${b.author ? ' — ' + b.author : ''} [${srcLabel(b.src)}]
`).join('; ')}`, ''
    ];
    for (const m of c.msgs || []) {
      if (m.role === 'user') {
        out.push('---', '', '## คำถาม', '', m.content, '');
        if (m.images) out.push(`(แนบรูป ${m.images} รูป)`, '');
        if (m.imageText) out.push('ข้อความในรูป:', '', '> ' + m.imageText.replace(/\n/g, '\n> '), '');
        continue;
      }
      out.push(`## คำตอบ${m.lang ? ` (${LANG_TH[m.lang] || m.lang})` : ''}`, '', String(m.content || '')
        .replace(/<hadith>([\s\S]*?)<\/hadith>/g, '«$1»').replace(/<ayah>([\s\S]*?)<\/ayah>/g, '﴿$1﴾'), '');
      if (m.sources?.length) {
        out.push('المراجع', '');
        m.sources.forEach((s, i) => out.push(`- [${i + 1}] «${s.book.primaryName}»${s.book.authorName ? ' — ' + s.book.authorName : ''} · ${loc(s.metadata.pages?.[0])} — ${srcUrl(s)}`));
        out.push('');
      }
    }
    return out.join('\n');
  }
  const fileName = (c, ext) => `book-chat-${new Date(c.updated || Date.now()).toISOString().slice(0, 10)}-${String(c.title || 'chat').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)}.${ext}`;

  function renderHistory() {
    const q = norm($('#hq').value);
    const list = chats.filter(c => !q || norm(`${c.title} ${(c.books || []).map(b => b.name).join(' ')} ${(c.msgs || []).filter(m => m.role === 'user').map(m => `${m.content} ${m.imageText || ''}`).join(' ')}`).includes(q));
    $('#hcount').textContent = `${chats.length} แชท${q ? ` · ตรงคำค้น ${list.length}` : ''}`;
    $('#hlist').innerHTML = list.length ? list.map(c => {
      const n = (c.msgs || []).filter(m => m.role === 'user').length;
      const bk = (c.books || []).map(b => b.name).join('، ');
      return `
      <div class="hi" data-id="${c.id}">
        <div class="ht" data-act="open">${esc(c.title)}</div>
        <div class="hs">${esc(fmtDate(c.updated))} · ${n} คำถาม${c.tok ? ` · ${Number(c.tok).toLocaleString()} tok` : ''}${c.auto ? ' · อัตโนมัติ' : ''}<br>${esc(clip(bk, 120))}</div>
        <div class="ha"><button class="go" data-act="open">เปิด / คุยต่อ</button><button data-act="ren">เปลี่ยนชื่อ</button>
          <button data-act="md">.md</button><button data-act="json">.json</button><button class="del" data-act="del">ลบ</button></div>
      </div>`;
    }).join('') : `<div class="empty">${chats.length ? 'ไม่พบแชทที่ตรงคำค้น' : 'ยังไม่มีประวัติแชท — ถามคำถามแรกแล้วระบบจะบันทึกให้อัตโนมัติ'}</div>`;
  }
  $('#hq').addEventListener('input', renderHistory);
  $('#hlist').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    const id = btn.closest('[data-id]')?.dataset.id,
      c = chats.find(x => x.id === id);
    if (!c) return;
    const act = btn.dataset.act;
    if (act === 'open') openChat(c);
    else if (act === 'ren') {
      const t = prompt('ชื่อแชท', c.title);
      if (t === null || !t.trim()) return;
      c.title = t.trim();
      saveChats();
      renderHistory();
    } else if (act === 'md') download(fileName(c, 'md'), chatToMd(c), 'text/markdown');
    else if (act === 'json') download(fileName(c, 'json'), JSON.stringify(c, null, 2), 'application/json');
    else if (act === 'del') {
      if (!confirm(`ลบแชท "${c.title}"?`)) return;
      chats = chats.filter(x => x !== c);
      saveChats();
      if (id === chatId) resetChat();
      renderHistory();
    }
  });
  $('#hexp').onclick = () => {
    if (!chats.length) {
      alert('ยังไม่มีแชทให้ export');
      return;
    }
    download(`book-chat-all-${new Date().toISOString().slice(0, 10)}.json`,
      JSON.stringify({ app: 'Book Chat', version: '2.9.0', exported: new Date().toISOString(), chats }, null, 2), 'application/json');
  };
  $('#hclear').onclick = () => {
    if (!chats.length || !confirm(`ลบประวัติแชททั้งหมด ${chats.length} แชท?`)) return;
    chats = [];
    saveChats();
    renderHistory();
  };

  const logSafe = (code, payload) => code === '8' ?
    JSON.stringify(payload.map(ev => ev.type === 'SOURCES' ?
      { type: 'SOURCES', value: ev.value.map(s => ({ id: s.id, score: s.score, metadata: s.metadata, book: s.book, excerptChars: s.excerpt.length, fullChars: (s.text || '').length })) } :
      ev)) :
    JSON.stringify(payload);

  function emit(code, payload) {
    logRaw(`${code}:${logSafe(code, payload)}`);
    consume(code, payload);
  }

  function consume(code, payload) {
    if (!cur) return;
    if (code === '8') {
      for (const ev of payload) {
        if (ev.type === 'CHAT_ID') chatId = ev.value;
        if (ev.type === 'STATUS') {
          $('#status').textContent = STATUS_TH[ev.value] || ev.value;
          if (ev.queries) {
            cur.queries = cur.el._queries = ev.queries;
            cur.qtype = ev.qtype || '';
            cur.failed = !!ev.queryFailed;
            cur.err = ev.queryError || '';
            cur.imageText = ev.imageText || '';
            paintQueries(cur);
          }
        }
        if (ev.type === 'AUTO_BOOKS') {
          cur.picks = ev.value || [];
          paintQueries(cur);
        }
        if (ev.type === 'LANG') {
          setLang(cur, ev.value);
          cur.langShown = true;
          cur.langAuto = !!ev.auto;
          paintQueries(cur);
        }
        if (ev.type === 'SOURCES') {
          cur.sources = cur.el._sources = ev.value;
          cur.el._c = cur;
          renderSources(cur);
        }
      }
    } else if (code === 'f') cur.messageId = payload.messageId;
    else if (code === '0') {
      cur.raw += payload;
      cur.el.querySelector('.body').innerHTML = render(cur.raw, cur.sources.length, cur.ar);
      updateChatFontSize();
      scrollDown();
    } else if (code === 'e') {
      const u = payload.usage,
        q = payload.queryUsage || {},
        rk = payload.rankUsage || {};
      const turn = (q.totalTokens || 0) + (rk.totalTokens || 0) + (u.totalTokens || (u.promptTokens + u.completionTokens + u.thoughtTokens));
      sessionTok += turn;
      paintTok();
      cur.metaText =
        `${getActiveModel()} (${apiProvider}) · ${payload.auto ? 'auto' : 'selected'}${payload.tavily ? ` · tavily(${payload.tavily})` : ''} · ${payload.qtype || '-'} · ${LENGTH[cur.len || answerLen].label} · lang ${cur.lang}${payload.images ? ` · img ${payload.images}` : ''} · query ${q.totalTokens || 0} ` +
        `· rank ${rk.totalTokens || 0} ${payload.ranked ? `(${payload.pool}→${cur.sources.length})` : '(score)'} ` +
        `· in ${u.promptTokens}${u.cachedTokens ? ` (cached ${u.cachedTokens})` : ''} · out ${u.completionTokens} · think[${thinkEnabled ? thinkMode : 'off'}] ${u.thoughtTokens}
 · รวม ${turn} · ${payload.finishReason}`;
      cur.el.querySelector('.meta').textContent = cur.metaText;
    } else if (code === 'd') $('#status').textContent = '';
    else if (code === '3') {
      cur.el.querySelector('.body').innerHTML += `<div class="err">⚠ ${esc(payload)}</div>`;
      $('#status').textContent = '';
    }
  }

  async function send() {
    const typed = $('#inp').value.trim();
    if ((!typed && !attach.length) || busy) return;
    if (!getProviderKey()) {
      const p = getActiveProvider();
      const k = prompt(`ใส่ Gemini API Key สำหรับ ${p} ก่อนนะครับ`);
      if (!k) return;
      setProviderKey(p, k);
      paintProvider();
    }
    const images = attach.slice();
    const img = images.length > 0;
    const text = typed || IMG_DEFAULT_Q;
    attach = [];
    renderThumbs();
    $('#inp').value = '';
    busy = true;
    const len = answerLen,
      langSetting = replyLang,
      books = selected.slice(),
      auto = !books.length;
    const lang0 = langSetting !== 'auto' ? langSetting : (isArQuestion(typed) || !typed ? 'ar' : (scriptOf(typed) === 'th' ? 'th' : 'ar'));
    addUser(typed || (img ? '(ขอ شرح ของข้อความในรูป)' : ''), images);
    cur = newAssistant(auto, lang0);
    cur.len = len;
    const prior = history.slice();
    history.push({ role: 'user', content: text });
    transcript.push({ role: 'user', content: typed || text, images: images.length || undefined });
    logRaw(`→ POST ${JSON.stringify({ id: auto ? 'book-chat-auto' : `book-chat-${books.map(keyOf).join('+')}`, length: len, lang: langSetting, images: images.length, auto, messages: compactHistory(history, HIST_TURNS_ANSWER, HIST_ANS_CHARS) })}`);

    try {
      if (!chatId) chatId = uuid();
      emit('8', [{ type: 'CHAT_ID', value: chatId }]);
      emit('8', [{ type: 'STATUS', value: img ? 'reading-image' : 'generating-queries' }]);
      const qr = await generateQueries(prior, text, books, auto, images, !!typed);
      const imageText = qr.imageText || '';
      if (imageText) {
        const u = transcript[transcript.length - 1];
        u.imageText = clip(imageText, IMG_TEXT_SAVE);
        history[history.length - 1].content = `${text}\n[image text: ${clip(imageText, IMG_TEXT_SAVE)}]`;
      }

      cur.thinkLabel = thinkEnabled ? (THINK[thinkMode]?.label || thinkMode) : 'ปิด';
      cur.usedTavily = !!useTavily;
      emit('8', [{ type: 'STATUS', value: auto ? 'auto-searching' : 'searching', queries: qr.queries, qtype: qr.qtype, queryFailed: qr.failed, queryError: qr.error, imageText }]);
      let entries;
      const tavPromise = useTavily ? tavilySearchMulti(qr.queries, text) : Promise.resolve({ entries: [], answer: '' });
      if (auto) {
        const [r, tv] = await Promise.all([autoSearch(qr.queries, qr.qtype, qr.suggested), tavPromise]);
        entries = [...r.entries, ...(tv.entries || [])];
        cur.tavilyCount = (tv.entries || []).length;
        emit('8', [{ type: 'AUTO_BOOKS', value: r.books }]);
      } else {
        const nT = books.filter(b => (b.src || 'turath') === 'turath').length,
          nU = books.filter(b => b.src === 'usul').length,
          nG = books.filter(b => b.src === 'golden').length;
        $('#status').textContent = `กำลังค้นใน ${books.length} เล่ม (Turath ${nT} · Usul ${nU} · Golden ${nG})${useTavily ? ' + Tavily Web' : ''}…`;
        const [bookEntries, tv] = await Promise.all([searchBooks(qr.queries, books), tavPromise]);
        entries = [...bookEntries, ...(tv.entries || [])];
        cur.tavilyCount = (tv.entries || []).length;
      }

      emit('8', [{ type: 'STATUS', value: 'ranking' }]);
      const rq = imageText ? `${text}\n${clip(imageText, 500)}` : text;
      const targetSources = auto
        ? LENGTH[len].sources
        : Math.max(LENGTH[len].sources, Math.min(80, books.length * 4));
      const targetCtxChars = auto ? LENGTH[len].ctxChars : Math.max(LENGTH[len].ctxChars, 2200);
      const fin = await finalizeSources(entries, qr.queries, rq, qr.qtype, auto, targetSources, targetCtxChars, img);
      const sources = fin.sources;
      if (auto && sources.length) {
        const pickedBooks = [...new Set(sources.map(s => {
          const n = s.book?.primaryName || '';
          if (!n) return '';
          return s.metadata?.src === 'tavily' ? `🌐 ${n} (Tavily)` : s.metadata?.src === 'golden' ? `${n} (Golden)` : s.metadata?.src === 'usul' ? `${n} (Usul)` : n;
        }).filter(Boolean))];
        if (pickedBooks.length) emit('8', [{ type: 'AUTO_BOOKS', value: pickedBooks }]);
      }

      const lang = resolveLang(langSetting, typed, sources, imageText);
      emit('8', [{ type: 'LANG', value: lang, auto: langSetting === 'auto' }]);
      emit('8', [{ type: 'STATUS', value: 'generating-response' }]);
      emit('8', [{ type: 'SOURCES', value: sources }]);
      emit('f', { messageId: 'msg-' + rid(24) });

      let result;
      if (sources.length) {
        result = await streamAnswer(prior, text, sources, len, qr.qtype, auto, { lang, images, imageText }, d => emit('0', d));
      } else {
        const nf = (NOT_FOUND[lang] || NOT_FOUND.ar)(auto);
        emit('0', lang === 'th' ? `${nf}\n${HINT_TH(auto)}` : `${nf}\n${HINT_TH(auto)}`);
        result = { finishReason: 'stop', usage: usageOf(null) };
      }
      emit('e', { ...result, queryUsage: qr.usage, rankUsage: fin.usage, ranked: fin.reranked, pool: fin.pool, qtype: qr.qtype, auto, tavily: cur.tavilyCount || 0, images: images.length, isContinued: false });
      emit('d', result);
      history.push({ role: 'assistant', content: cur.raw });
      transcript.push({
        role: 'assistant',
        content: cur.raw,
        sources: cur.sources.map(slimSource),
        queries: cur.queries || [],
        qtype: cur.qtype || '',
        auto,
        picks: cur.picks || [],
        ar: cur.ar,
        lang,
        langAuto: langSetting === 'auto',
        imageText: imageText ? clip(imageText, IMG_TEXT_SAVE) : undefined,
        meta: cur.metaText || '',
      });
      saveChat(books, auto);
    } catch (e) {
      logRaw(`! CHAT ERROR: ${String(e.message || e)}`);
      emit('3', String(e.message || e));
      history.pop();
      transcript.pop();
      if (images.length && !attach.length) {
        attach = images;
        renderThumbs();
      }
    } finally {
      busy = false;
    }
  }

  async function generateBookChapterQueries(bookTitle, chapterTitle, chapterPrompt, books, auto, seedQueries = [], science = 'auto', kind = 'talif') {
    const cleanSeeds = (Array.isArray(seedQueries) ? seedQueries : []).map(s => String(s || '').trim()).filter(Boolean);
    const props = { qtype: { type: 'STRING', enum: QTYPES }, queries: { type: 'ARRAY', items: { type: 'STRING' } } };
    const req = ['qtype', 'queries'];
    if (auto) {
      props.books = { type: 'ARRAY', items: { type: 'OBJECT', properties: { title: { type: 'STRING' }, author: { type: 'STRING' } }, required: ['title'] } };
      req.push('books');
    }
    const defaultQtype = QTYPES.includes(science) ? science : (science === 'usul_fiqh' ? 'fiqh' : 'general');
    try {
      const { j, usage } = await geminiJSON(
        BOOK_QUERY_PROMPT(books, auto, bookTitle, chapterTitle, chapterPrompt, science, kind),
        [{ role: 'user', parts: [{ text: `${chapterTitle}\n${chapterPrompt}${cleanSeeds.length ? '\nSeeds: ' + cleanSeeds.join(' ، ') : ''}` }] }],
        { type: 'OBJECT', properties: props, required: req }
      );
      const qs = Array.isArray(j.queries) ? j.queries : [];
      const qtype = (science !== 'auto' && QTYPES.includes(science)) ? science : (QTYPES.includes(j.qtype) ? j.qtype : defaultQtype);
      const suggested = Array.isArray(j.books) ? j.books.filter(b => b && b.title).slice(0, 10) : [];
      const queries = [...new Set([...cleanSeeds, ...qs].map(s => String(s).trim()).filter(Boolean))].slice(0, 10);
      if (!queries.length) queries.push(chapterTitle);
      return { queries, qtype, suggested, usage };
    } catch (e) {
      logRaw(`! generateBookChapterQueries fallback: ${e.message}`);
      const fallbackQs = [...new Set([...cleanSeeds, chapterTitle, chapterPrompt].map(s => String(s || '').trim()).filter(Boolean))].slice(0, 8);
      return { queries: fallbackQs.length ? fallbackQs : [chapterTitle], qtype: defaultQtype, suggested: [], usage: usageOf(null) };
    }
  }

  // إثراء بيانات المصادر (خصوصاً أسماء المؤلفين من الشاملة الذهبية وتراث) لضمان دقة قائمة المصادر والحواشي
  async function enrichBookSources(sources) {
    if (!Array.isArray(sources) || !sources.length) return sources;
    await pool(sources, 4, async s => {
      try {
        if (!s || !s.book) return;
        const src = s.metadata?.src || 'turath';
        const bid = s.metadata?.bookId;
        if (src === 'turath' && bid && !s.book.authorName && catalog?.byId) {
          const b = catalog.byId.get(+bid);
          if (b?.author) s.book.authorName = b.author;
        } else if (src === 'golden' && bid && !s.book.authorName) {
          const d = await goldenMeta(bid).catch(() => null);
          const au = d ? goldenAuthor(d) : '';
          if (au) s.book.authorName = au;
        }
      } catch (_) {}
    });
    return sources;
  }

  // ================= SELF-REVIEW & TARGETED REFINEMENT ENGINE (المرحلة الثامنة: المراجعة الذاتية قبل اعتماد كل فصل) =================
  const SELF_REVIEW_SCHEMA = {
    type: 'OBJECT',
    properties: {
      passed: { type: 'BOOLEAN' },
      score: { type: 'INTEGER' },
      summary_ar: { type: 'STRING' },
      issues_found: { type: 'ARRAY', items: { type: 'STRING' } },
      replacements: {
        type: 'ARRAY',
        items: {
          type: 'OBJECT',
