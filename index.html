            getItem: function (k) { return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null; },
            setItem: function (k, v) { mem[k] = String(v); },
            removeItem: function (k) { delete mem[k]; },
            key: function (i) { return Object.keys(mem)[i] || null; },
            get length() { return Object.keys(mem).length; }
          }

<!-- ===================== 1) GM SHIM (แทน Tampermonkey) ===================== -->
<script>
(() => {
  'use strict';
  // ---------- storage: IndexedDB + แคชในหน่วยความจำ (GM_getValue ต้องเป็น sync) ----------
  const STORE = new Map();
  let db = null;
  const clone = v => (v && typeof v === 'object')
    ? (typeof structuredClone === 'function' ? structuredClone(v) : JSON.parse(JSON.stringify(v))) : v;

  const openDB = () => new Promise((res, rej) => {
    const r = indexedDB.open('bookchat-gm', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });

  async function preload() {
    try {
      db = await openDB();
      await new Promise(res => {
        const rq = db.transaction('kv').objectStore('kv').openCursor();
        rq.onsuccess = () => { const c = rq.result; if (c) { STORE.set(c.key, c.value); c.continue(); } else res(); };
        rq.onerror = () => res();
      });
    } catch (e) {
      console.warn('IndexedDB ใช้ไม่ได้ → ใช้ localStorage แทน', e);
      db = null;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k.startsWith('gm:')) try { STORE.set(k.slice(3), JSON.parse(localStorage.getItem(k))); } catch {}
      }
    }
  }

  function persist(k, v) {
    if (db) {
      try {
        const st = db.transaction('kv', 'readwrite').objectStore('kv');
        v === undefined ? st.delete(k) : st.put(v, k);
        return;
      } catch (e) { console.warn(e); }
    }
    try { v === undefined ? localStorage.removeItem('gm:' + k) : localStorage.setItem('gm:' + k, JSON.stringify(v)); }
    catch (e) { console.warn('บันทึกไม่สำเร็จ (พื้นที่เต็ม?)', k, e); }
  }

  window.__gmFlush = () => db ? new Promise(r => {
    const tx = db.transaction('kv', 'readwrite'); tx.oncomplete = r; tx.onerror = r; tx.onabort = r;
  }) : Promise.resolve();

  window.GM_getValue = (k, def) => STORE.has(k) ? clone(STORE.get(k)) : def;
  window.GM_setValue = (k, v) => {
    if (v === undefined) return GM_deleteValue(k);
    const c = clone(v); STORE.set(k, c); persist(k, clone(c));
  };
  window.GM_deleteValue = k => { STORE.delete(k); persist(k, undefined); };
  window.GM_listValues = () => [...STORE.keys()];

  // ---------- แก้ Usul: บังคับ page เป็นตัวเลข (ชั้นล่างสุด ทุกคำขอต้องผ่าน) ----------
  const fixUsulUrl = s => {
    try {
      if (!/\/\/api\.usul\.ai\//i.test(s || '')) return s;
      const u = new URL(s), p = u.searchParams;
      if (!/search/i.test(u.pathname) && !p.has('q')) return s;
      const n = Number(p.get('page'));
      if (!p.has('page') || !Number.isInteger(n) || n < 1) {
        const lim = Number(p.get('limit')) || 20, off = Number(p.get('offset'));
        p.set('page', String(Number.isFinite(off) && off > 0 ? Math.floor(off / lim) + 1 : 1));
      }
      ['limit', 'offset'].forEach(k => {
        const v = p.get(k);
        if (v !== null && (v === '' || !Number.isFinite(Number(v)))) p.delete(k);
      });
      const out = u.toString();
      if (out !== s) console.log('[usul] แก้ URL →', out);
      return out;
    } catch { return s; }
  };
  window.__bcFixUsulUrl = fixUsulUrl;

  // ---------- proxy (Cloudflare Worker / Corsfix) ----------
  const proxify = u => {
    u = fixUsulUrl(u);
    const p = (localStorage.getItem('bc_proxy') || '').trim();
    if (!p) return u;
    const isGemini = /relayrouter\.ai|generativelanguage/.test(u);
    if (isGemini && localStorage.getItem('bc_proxy_all') !== '1') return u;
    return p.includes('{url}') ? p.replace('{url}', encodeURIComponent(u)) : p + encodeURIComponent(u);
  };
  window.__bcProxify = proxify;
  window.__bcProxyHeaders = (url, orig, h) => {
    const headers = { ...(h || {}) };
    const pk = (localStorage.getItem('bc_proxy_key') || '').trim();
    if (url !== orig && pk) headers['x-corsfix-key'] = pk;
    return headers;
  };

  // ---------- network: GM_xmlhttpRequest → fetch (รองรับ streaming) ----------
  window.GM_xmlhttpRequest = o => {
    const ctrl = new AbortController();
    let done = false, timer = null;
    const base = { finalUrl: o.url, status: 0, statusText: '', responseHeaders: '', readyState: 4 };
    const fin = () => { done = true; clearTimeout(timer); };
    if (o.timeout) timer = setTimeout(() => {
      if (done) return; fin(); ctrl.abort(); (o.ontimeout || o.onerror)?.({ ...base, error: 'timeout' });
    }, o.timeout);

    (async () => {
      try {
        const m = (o.method || 'GET').toUpperCase();
        const url = proxify(o.url);
        const headers = window.__bcProxyHeaders(url, o.url, o.headers);
        const res = await fetch(url, {
          method: m, headers, signal: ctrl.signal,
          body: (m !== 'GET' && m !== 'HEAD' && o.data != null) ? (typeof o.data === 'string' ? o.data : JSON.stringify(o.data)) : undefined,
        });
        const info = { ...base, status: res.status, statusText: res.statusText, finalUrl: res.url || o.url,
          responseHeaders: [...res.headers].map(([k, v]) => `${k}: ${v}`).join('\r\n') };

        // โหมด stream (คำตอบ Gemini ทยอยขึ้น)
        if (o.responseType === 'stream' && res.ok && res.body && o.onloadstart) {
          clearTimeout(timer);
          o.onloadstart({ ...info, readyState: 2, response: res.body });
          return;
        }
        let text = '';
        if (res.body && o.onprogress) {
          const rd = res.body.getReader(), dec = new TextDecoder();
          for (;;) {
            const { done: d, value } = await rd.read(); if (d) break;
            text += dec.decode(value, { stream: true });
            if (!done) o.onprogress({ ...info, readyState: 3, responseText: text });
          }
          text += dec.decode();
        } else text = await res.text();
        if (done) return; fin();
        if (res.status >= 400 && /turath\.io|usul\.ai/.test(o.url || '')) {
          const via = res.headers.get('x-bc-target');
          console.warn('[net] error', res.status, url);
          text += `\n[ปลายทาง] ${fixUsulUrl(o.url)}` +
            (via ? `\n[Worker ส่งต่อไปที่] ${via}` : `\n[ไม่มี x-bc-target → error มาจาก Worker เอง หรือไม่ได้ผ่าน Worker]`);
        }
        const r = { ...info, responseText: text, response: text };
        o.onload?.(r); o.onloadend?.(r);
      } catch (e) {
        if (done) return; fin();
        o.onerror?.({ ...base, error: `${e?.message || e} — อาจติด CORS: ลองตั้ง Proxy ในเมนู ⋮ → ตั้งค่า` });
      }
    })();
    return { abort() { fin(); ctrl.abort(); } };
  };

  // ---------- กัน 429: จำกัดคำขอพร้อมกัน + รอแล้วลองใหม่ + แคชหน้าที่เคยโหลด ----------
  (() => {
    const raw = window.GM_xmlhttpRequest;
    const isBook = u => /\/\/(api\.turath\.io|files\.turath\.io|api\.usul\.ai|api\.goldenshamela\.com)\//.test(u || '');

    // แก้ Usul: API บังคับ page เป็นตัวเลข (ไม่ส่ง/ส่ง undefined → 400 "received nan")
    const fixUsul = o => {
      if (!/\/\/api\.usul\.ai\/.*search/i.test(o.url || '')) return o;
      try {
        const u = new URL(o.url), p = u.searchParams;
        const n = Number(p.get('page'));
        if (!p.has('page') || !Number.isInteger(n) || n < 1) {
          const lim = Number(p.get('limit')) || 20;
          const off = Number(p.get('offset'));
          p.set('page', String(Number.isFinite(off) && off > 0 ? Math.floor(off / lim) + 1 : 1));
        }
        for (const k of ['limit', 'offset']) {
          const v = p.get(k);
          if (v !== null && !Number.isFinite(Number(v))) p.delete(k);
        }
        const url = u.toString();
        if (url !== o.url) console.log('[usul] แก้ URL →', url);
        return url === o.url ? o : { ...o, url };
      } catch { return o; }
    };
    const LIMIT = 3, MAX_TRY = 4, GAP = 150;     // พร้อมกันสูงสุด 3, ลองใหม่ 4 ครั้ง, เว้นระยะ 150ms
    const CACHE = new Map(), CACHE_MAX = 300;
    const queue = [];
    let active = 0, last = 0;

    const pump = () => {
      if (active >= LIMIT || !queue.length) return;
      const wait = Math.max(0, last + GAP - Date.now());
      if (wait) return setTimeout(pump, wait);
      last = Date.now(); active++; queue.shift()(); pump();
    };

    window.GM_xmlhttpRequest = o => {
      o = fixUsul(o);                                    // แก้ page ของ Usul ก่อนเข้าแคช/คิว
      if (!isBook(o.url)) return raw(o);                 // Gemini ไม่ผ่านชั้นนี้

      const ck = (o.method || 'GET').toUpperCase() === 'GET' ? o.url : null;
      if (ck && CACHE.has(ck)) {                       // หน้าที่เคยเปิดแล้ว ไม่ต้องยิงซ้ำ
        const r = CACHE.get(ck);
        setTimeout(() => { o.onload?.(r); o.onloadend?.(r); }, 0);
        return { abort() {} };
      }
      let aborted = false, cur = null, tries = 0, rel = null;

      const attempt = () => {
        if (aborted) { active--; pump(); return; }
        let freed = false, retry = false;
        rel = () => { if (!freed) { freed = true; active--; pump(); } };
        cur = raw({ ...o,
          ...(o.onloadstart && { onloadstart: r => { rel(); o.onloadstart(r); } }),
          onload: r => {
            rel();
            if (r.status === 429 && tries < MAX_TRY) {
              retry = true; tries++;
              const ra = parseFloat((/retry-after:\s*([\d.]+)/i.exec(r.responseHeaders || '') || [])[1]);
              const wait = (ra > 0 ? ra * 1000 : 1500 * 2 ** (tries - 1)) + Math.random() * 500;
              console.warn(`[429] รอ ${Math.round(wait)}ms แล้วลองใหม่ (${tries}/${MAX_TRY})`, o.url);
              setTimeout(() => { queue.push(attempt); pump(); }, wait);
              return;
            }
            if (ck && r.status === 200) {
              CACHE.set(ck, r);
              if (CACHE.size > CACHE_MAX) CACHE.delete(CACHE.keys().next().value);
            }
            o.onload?.(r);
          },
          onloadend: r => { if (!retry) o.onloadend?.(r); },
          onerror: e => { rel(); o.onerror?.(e); },
          ontimeout: e => { rel(); (o.ontimeout || o.onerror)?.(e); },
        });
      };

      queue.push(attempt); pump();
      return { abort() { aborted = true; cur?.abort(); rel?.(); } };
    };
  })();

  // ---------- menu / element ----------
  window.__gmMenu = [];
  window.GM_registerMenuCommand = (name, fn) => { __gmMenu.push({ name, fn }); return name; };
  window.GM_addElement = (parent, tag, attrs = {}) => {
    if (typeof parent === 'string') { attrs = tag || {}; tag = parent; parent = document.head; }
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) k === 'textContent' ? (el.textContent = v) : el.setAttribute(k, v);
    (parent || document.head).appendChild(el);
    return el;
  };

  // ---------- export ไฟล์: WebView มัก download blob ไม่ได้ → แชร์ไฟล์ / คัดลอกแทน ----------
  const blobs = new Map();
  const oCreate = URL.createObjectURL.bind(URL);
  URL.createObjectURL = b => { const u = oCreate(b); if (b instanceof Blob) blobs.set(u, b); return u; };
  const oClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    const b = blobs.get(this.href);
    if (!b) return oClick.call(this);
    const name = this.download || 'book-chat.txt', a = this;
    try {
      const f = new File([b], name, { type: (b.type || 'text/plain').split(';')[0] });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: name }).catch(() => {});
        return;
      }
    } catch {}
    b.text().then(t => navigator.clipboard?.writeText(t)
      .then(() => alert(`ดาวน์โหลดไฟล์ในแอปนี้ไม่ได้ เลยคัดลอกเนื้อหา "${name}" ไว้ในคลิปบอร์ดแล้ว\nเอาไปวางในแอปโน้ตหรือไฟล์ได้เลย`))
      .catch(() => oClick.call(a)) ?? oClick.call(a));
  };

  window.__gmReady = preload();
})();
</script>

<!-- ===================== 2) วางสคริปต์ Book Chat เดิมทั้งไฟล์ระหว่างแท็กนี้ ===================== -->
<script type="text/plain" id="userscript">
// ==UserScript==
// @name         Book Chat (Usul-style) — Gemini 3.8 Flash + Turath + Usul
// @namespace    https://book-chat.local/
// @version      2.9.0
// @description  ถามตอบจากหนังสือที่เลือก (หลายเล่ม, ผสม Turath + Usul/OpenITI) แบบ usul.ai ใช้ gemini-3.8-flash • แนบรูป (ตัวบท/หน้ากีตาบ) → อ่านข้อความในรูป → หา شرح จากหนังสือที่ติ๊ก/ทั้งคลัง • เลือกภาษาตอบ: อัตโนมัติ(ตามเนื้อหา)/ยาวี/อาหรับ/ไทย • ไม่เลือกหนังสือ = ค้นทั้งคลัง → หาเล่มที่มีเนื้อหาจริง → ค้นเจาะ → ให้ Gemini คัดข้อความที่สอดคล้องที่สุด • เรียบเรียงร้อยแก้วต่อเนื่อง + อ้างอิงวงกลม • ค้น/อ่านหนังสือพร้อมสารบัญ ค้นในเล่ม ไปหน้า จำหน้าล่าสุด • บันทึกประวัติแชท + export • เพิ่มหนังสือเข้าหมวด Favorites ได้
// @match        *://*/*
// @grant        GM_xmlhttpRequest
// @grant        GM_getValue
// @grant        GM_setValue
// @grant        GM_registerMenuCommand
// @grant        GM_addElement
// @connect      api.relayrouter.ai
// @connect      api.goldenshamela.com

// @connect      api.turath.io
// @connect      files.turath.io
// @connect      api.usul.ai
// @connect      assets.usul.ai
// @run-at       document-idle
// @noframes
// ==/UserScript==

(function () {
  'use strict';

  // ================= CONFIG =================
  const MODEL = 'gemini-3.8-flash';
  const GEMINI = 'https://api.relayrouter.ai/v1beta/models';
  const TURATH = 'https://api.turath.io';
  const USUL = 'https://api.usul.ai';
  const CATALOG_URL = 'https://files.turath.io/data-v3.json';
  const PER_QUERY = 5;
  const MAX_BOOKS = 20;
  const CONCURRENCY = 6;
  const USUL_SEMANTIC = true;
  const AUTO_USUL = true;              // โหมดอัตโนมัติ: ค้น Usul ทั้งคลังด้วย
  const AUTO_USUL_SKIP_TURATH = true;  // ข้ามผล Usul ที่เป็น version จาก Turath (ซ้ำกับผล Turath)
  const AUTO_USUL_DISCOVER = 2;        // เจาะค้นในเล่ม Usul ที่เจอเนื้อหามากที่สุดกี่เล่ม

  const AUTO_SUGGEST = 5;
  const AUTO_GLOBAL_TOP = 10;
  const AUTO_MAX_PER_BOOK = 3;
  const AUTO_SCOPED_QUERIES = 3;
  const AUTO_DISCOVER = 4;

  const RERANK = true;
  const AUTO_POOL = 36;
  const SEL_POOL = 24;
  const POOL_PER_BOOK = 6;
  const RERANK_CHARS = 360;

  const MAX_IMAGES = 3;
  const IMG_MAX_SIDE = 1600;
  const IMG_QUALITY = 0.85;
  const IMG_MAX_B64 = 9e6;
  const IMG_TEXT_SAVE = 600;
  const IMG_DEFAULT_Q = 'اشرح النص الذي في الصورة من الكتب.';

  const MAX_CHATS = 100;
  const SRC_SAVE_CHARS = 400;
  const MAX_LAST_READ = 60;
  const TOC_LIMIT = 800;
  const PAGE_CACHE = 40;

  const HIST_TURNS_ANSWER = 3;
  const HIST_TURNS_QUERY = 2;
  const HIST_ANS_CHARS = 600;
  const HIST_ANS_CHARS_Q = 250;
  const HIST_USER_CHARS = 500;
  const USE_MAX_OUT = true;
  let noMaxOut = GM_getValue('noMaxOut', false);

  // ระดับการคิดที่แต่ละโมเดลรับ (ai.google.dev/gemini-api/docs/thinking)
  const THINK_LEVELS = {
    'gemini-3.8-flash': ['low', 'medium', 'high'],                 // ปิดไม่ได้ ไม่มี minimal
    'gemini-3.6-flash': ['minimal', 'low', 'medium', 'high'],
    'gemini-3.5-flash-lite': ['minimal', 'low', 'medium', 'high'],
    'gemini-3-flash-preview': ['minimal', 'low', 'medium', 'high'],
  };
  const LEVELS_OK = THINK_LEVELS[MODEL] || ['low', 'medium', 'high'];
  const MIN_LEVEL = LEVELS_OK[0];
  const MID_LEVEL = MIN_LEVEL === 'minimal' ? 'low' : 'medium';
  // extra = token เผื่อให้การคิด (บวกเพิ่มจาก maxOut) · null = ไม่จำกัด
  const THINK = {
    off:  { label: 'ต่ำสุด', title: `คิดน้อยที่สุดที่ ${MODEL} รับได้ (${MIN_LEVEL})`, level: MIN_LEVEL, extra: 8192 },
    low:  { label: 'กลาง',  title: `คิดปานกลาง (${MID_LEVEL})`, level: MID_LEVEL, extra: 16384 },
    high: { label: 'ลึก',   title: 'คิดละเอียด: ช้ากว่าและใช้ token มากขึ้น', level: 'high', extra: null },
  };
  let noBudget0 = GM_getValue('noBudget0', false);
  let thinkMode = GM_getValue('thinkMode', 'low');
  if (!THINK[thinkMode]) thinkMode = 'low';

  const LENGTH = {
    short: {
      label: 'สั้น',
      sources: 5,
      ctxChars: 700,
      maxOut: 2048,
      rule: 'LENGTH = SHORT: no title line. 2–4 sentences (about 60–100 words) answering directly with the key citation(s). No headings, no long quotations. A short numbered list is allowed ONLY if the LISTS rule calls for it.',
    },
    medium: {
      label: 'กลาง',
      sources: 8,
      ctxChars: 1000,
      maxOut: 4096,
      rule: 'LENGTH = MEDIUM: a bold title line, then 4–6 short flowing paragraphs (2–4 sentences each, about 250–400 words in total), the last one a short closing paragraph.',
    },
    long: {
      label: 'ยาว',
      sources: 12,
      ctxChars: 1600,
      maxOut: 8192,
      rule: 'LENGTH = LONG: a bold title line, then a thorough answer (about 500–900 words) in 6–10 short paragraphs. Add "### " sub-headings only when the content has clearly distinct parts (e.g. stages of an event, or الحكم / الأدلة / الخلاف). When books differ, compare them, include 1–3 short verbatim quotations with citations, and end with a short closing paragraph.',
    },

        { role: 'user', parts: [...images.map(imgPart), { text: userText }] }
      ],
      generationConfig: {
        ...thinkCfg(),
        ...(cap ? capCfg(len) : {}),
      },
    });

    let usage = usageOf(null),
      finishReason = 'stop',
      events = 0,
      textEvents = 0;
    const run = async cap => {
      events = 0;
      textEvents = 0;
      const feed = sseParser(ev => {
        if (++events === 1 && ev.modelVersion) logRaw('· modelVersion: ' + ev.modelVersion);
        const c = ev.candidates?.[0];
        for (const p of (c?.content?.parts || [])) {
          if (p.text && !p.thought) {
            textEvents++;
            onDelta(p.text);
          }
        }
        if (c?.finishReason) finishReason = String(c.finishReason).toLowerCase();
        if (ev.usageMetadata) usage = usageOf(ev.usageMetadata);
      });
      const body = mkBody(cap);
      // relayrouter รู้จักแค่ thinkingBudget → แปลง level เป็นตัวเลข
      const tc = body.generationConfig?.thinkingConfig;
      if (/relayrouter/.test(GEMINI) && tc?.thinkingLevel) {
        const BUDGET = { minimal: 128, low: 512, medium: 4096, high: 12288 };
        body.generationConfig.thinkingConfig = { thinkingBudget: BUDGET[tc.thinkingLevel] || 512 };
      }
      logRaw(`· ส่ง generationConfig: ${JSON.stringify(body.generationConfig)}`);

      const raw = await gmStream(`${GEMINI}/${MODEL}:streamGenerateContent?alt=sse`, body, gHeaders(), feed);
      if (!events) throw new Error('Gemini: ' + String(raw).slice(0, 400));
    };

    const wantCap = USE_MAX_OUT && !noMaxOut;
    let cap = wantCap;
    for (let attempt = 0;; attempt++) {
      try {
        await run(cap);
        break;
      } catch (e) {
        if (textEvents || attempt >= 4) throw e;
        const msg = String(e.message || e);
        if (/thinking/i.test(msg) && thinkFallback()) continue;
        if (cap) {
          cap = false;
          logRaw(`! stream failed with maxOutputTokens → retry without: ${msg}`);
          continue;
        }
        if (isRetryable(e)) {
          await sleep(900 * (attempt + 1));
          continue;
        }
        throw e;
      }
    }
    if (wantCap && !cap) {
      noMaxOut = true;
      GM_setValue('noMaxOut', true);
    }
    return { finishReason, usage, ctxChars: ctx.length };
  }

  // ================= USUL API =================
  function pickVersion(versions = []) {
    const ok = v => v.kw || v.ai;
    return versions.find(v => ok(v) && v.source !== 'turath') || versions.find(ok) ||
      versions.find(v => v.source !== 'turath' && v.source !== 'pdf') || versions[0] || null;
  }
  const mapVersions = vs => (vs || []).map(v => ({ id: v.id, source: v.source, value: String(v.value ?? ''), kw: !!v.keywordSupported, ai: !!v.aiSupported }));

  function usulBookFrom(h) {
    const versions = mapVersions(h.versions);
    const v = pickVersion(versions);
    return {
      src: 'usul',
      id: h.id,
      slug: h.slug,
      name: arabicOf(h.secondaryName, h.primaryName),
      author: arabicOf(h.author?.secondaryName, h.author?.primaryName),
      year: h.year,
      versions,
      versionId: v?.id || '',
      vsrc: v?.source || '',
      vval: v?.value || '',
    };
  }
  async function usulSearchBooks(q) {
    const r = await getJSON(`${USUL}/search/books?q=${enc(q)}&limit=50&page=1`);
    return { found: r.results?.found || 0, hits: (r.results?.hits || []).map(usulBookFrom) };
  }

  // ================= GOLDEN SHAMELA =================
  const GOLDEN = 'https://api.goldenshamela.com/api';
  const GOLDEN_WEB = 'https://goldenshamela.com';
  const AUTO_GOLDEN = true;
  const GOLDEN_CHUNK = 900;
  const GOLDEN_EPUB_MAX = 80e6;
  const GOLDEN_EPUB_KEEP = 8;
  const GOLDEN_MEM = 3;
  let goldenRemote = null;
  let goldenWarned = false, goldenTotal = null, goldenSeq = 0;

  const goldenName = s => String(s || '').replace(/[\s\-–]+$/, '').trim();
  const goldenAuthor = d => {
    const a = d?.author ?? d?.authors, x = Array.isArray(a) ? a[0] : a;
    return (typeof x === 'string' ? x : (x?.authorname || x?.name || '')) ||
      ((/المؤلف\s*:\s*([^\r\n]+)/.exec(d?.bookdsecription || '') || [])[1] || '').trim();
  };
  // ปีเสียชีวิต: รายการให้ publisheryear (เฉพาะตอนส่ง sort ที่มี publisheryear) · หน้ารายละเอียดอยู่ใน publisher[0] · สำรองจาก «المتوفى: 264 هـ»
  const goldenYear = x => {
    const p = x?.publisher, py = Array.isArray(p) ? p[0]?.publisheryear : p?.publisheryear;
    let n = +(x?.publisheryear ?? py);
    if (!(Number.isFinite(n) && n > 0)) n = +arDigits((/المتوفى\s*:?\s*([\d٠-٩]+)/.exec(x?.bookdsecription || '') || [])[1] || '');
    return Number.isFinite(n) && n > 0 ? n : '';
  };
  const goldenBookFrom = x => ({ src: 'golden', id: +x.bookid, name: goldenName(x.bookname),
    author: (x.author || x.bookdsecription) ? goldenAuthor(x) : '', year: goldenYear(x) });

  // ---------- เรียงลำดับ Golden (ต้องส่ง publisheryear ใน sort เสมอ ไม่งั้น API ไม่ส่งปีมา) ----------
  const GOLDEN_SORT_Q = { name: 'bookname,publisheryear', death: 'publisheryear,bookname' };
  let goldenSort = GM_getValue('goldenSort', 'death');
  if (goldenSort !== '' && !GOLDEN_SORT_Q[goldenSort]) goldenSort = 'death';
  const GOLDEN_FILL_YEAR = true;   // ปิดทั้งสองอัน → ดึงปีเสียชีวิตทีละเล่มมาเติมท้ายชื่อ (false = ไม่ดึง)
  const gSortParam = () => GOLDEN_SORT_Q[goldenSort] ? `&sort=${GOLDEN_SORT_Q[goldenSort]}` : '';
  function gSortLocal(list) {
    if (!goldenSort) return list;
    const byName = (a, b) => norm(a.name).localeCompare(norm(b.name), 'ar');
    return [...list].sort(goldenSort === 'name' ? byName
      : (a, b) => ((+a.year || 1e9) - (+b.year || 1e9)) || byName(a, b));
  }
  const bookTitle = b => (b.src === 'golden' && b.year) ? `${b.name} ( ${b.year} هـ )` : b.name;

  // ===== ปุ่มเรียงลำดับ Golden (UI ของแอปอยู่ใน Shadow DOM → ต้องหา root จาก #blist) =====
  function gSortPaint2() {
    const l = $('#blist');
    if (!l) return;
    const R = l.getRootNode();
    R.querySelectorAll('#gsortp2 [data-gs]').forEach(i => { i.checked = i.dataset.gs === goldenSort; });

    if (lb) lb.textContent = goldenSort === 'name' ? 'ترتيب حسب الاسم' : goldenSort === 'death' ? 'ترتيب حسب تاريخ الوفاة' : '';
    R.querySelector('#gsortb2')?.style.setProperty('background', goldenSort ? '#ffffff55' : '#ffffff2e');
  }

  // ปิดการเรียงทั้งสอง → API ไม่ส่งปีมา → ดึงจากหน้ารายละเอียดทีละเล่ม (มีแคช) แล้วแก้ชื่อในหน้าจอตรง ๆ

    if (goldenSort || !GOLDEN_FILL_YEAR) return;
    const need = list.filter(b => b.src === 'golden' && !b.year).slice(0, 150);
    await pool(need, 2, async b => {
      if (seq !== goldenSeq || goldenSort) return;
      const d = await goldenMeta(b.id).catch(() => null);
      const y = d ? goldenYear(d) : '';
      if (!y || seq !== goldenSeq) return;
      b.year = y;
      const n = $('#blist')?.querySelector(`input[data-key="golden:${b.id}"]`)?.closest('.bk')?.querySelector('.n');
      if (n?.firstChild?.nodeType === 3) n.firstChild.nodeValue = bookTitle(b) + ' ';
    });
  }

  const gMeta = new Map();
  function goldenMeta(id) {
    id = String(id);
    if (!gMeta.has(id)) {
      const p = getJSON(`${GOLDEN}/guest/book/${enc(id)}`).then(r => r.data || r);
      p.catch(() => gMeta.delete(id));
      gMeta.set(id, p);
    }
    return gMeta.get(id);
  }

  async function goldenSearchBooks(q) {
    const t = arDigits(q).trim();
    if (/^\d+$/.test(t)) {
      const d = await goldenMeta(t).catch(() => null);
      return d?.bookid ? { found: 1, hits: [goldenBookFrom(d)] } : { found: 0, hits: [] };
    }
    const rs = await Promise.all([`filter[bookname]=${enc(q)}`, `filter[author.authorname]=${enc(q)}`]
      .map(f => getJSON(`${GOLDEN}/guest/book?${f}&per_page=50&page=1${gSortParam()}`)
        .catch(e => { logRaw(`! Golden ค้นชื่อ: ${e.message}`); return null; })));
    if (rs.every(r => !r)) throw new Error('เชื่อมต่อ goldenshamela ไม่ได้');
    const seen = new Set(), hits = [];
    rs.forEach(r => (r?.data || []).forEach(x => { if (!seen.has(x.bookid)) { seen.add(x.bookid); hits.push(goldenBookFrom(x)); } }));
    const found = rs.reduce((n, r) => n + (r?.meta?.total || 0), 0);
    return { found: Math.max(found, hits.length), hits: gSortLocal(hits) };
  }

  // ---------- หมวดหมู่ (กันชื่อซ้ำ + จัดกลุ่มแบบต้นฉบับ) ----------
  let goldenCatsP = null;
  const gcKey = s => String(s || '')
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .split(/\s+/).filter(Boolean).map(w => w.replace(/^ال(?=..)/, '')).join('');

  function gcName(x, parent) {
    const fix = s => {
      s = String(s || '').replace(/\s+/g, ' ').trim();
      // "التفاسيرعربي" → "التفاسير عربي"
      if (parent && s.length > parent.length && s.startsWith(parent) && s[parent.length] !== ' ')
        s = parent + ' ' + s.slice(parent.length);
      return s;
    };
    const cands = [x.translate?.categorynametrans?.ar, x.categoryname].map(fix).filter(Boolean);
    if (!parent) return cands[0] || `#${x.categoryid}`;
    return cands.find(s => gcKey(s) !== gcKey(parent)) || '';   // '' = ซ้ำกับหมวดแม่ทุกช่อง
  }

  function gcBuild(arr, parent) {
    const out = [], list = (arr || []).filter(x => x && x.status !== false);
    for (const x of list) {
      const n = +x.books_count || 0, name = gcName(x, parent?.name);
      // ซ้ำหมวดแม่ (ชื่อเหมือน หรือเป็นลูกเดี่ยวจำนวนเท่ากัน) → ไม่แสดง ยกลูกของมันขึ้นมาแทน
      if (parent && (!name || (list.length === 1 && n === parent.n))) {
        out.push(...gcBuild(x.children, parent));
        continue;
      }
      const node = { id: x.categoryid, name, n };
      node.kids = gcBuild(x.children, node);
      out.push(node);
    }
    const cnt = {};                                          // ชื่อซ้ำกันเองในระดับเดียวกัน → ต่อ #ID
    out.forEach(c => { const k = gcKey(c.name); cnt[k] = (cnt[k] || 0) + 1; });
    out.forEach(c => { if (cnt[gcKey(c.name)] > 1) c.name += ` #${c.id}`; });
    return out;
  }

  function goldenCatTree() {
    const c = GM_getValue('goldenCats3', null);
    if (c && Array.isArray(c.tree) && Date.now() - c.t < 7 * 864e5) return Promise.resolve(c.tree);   // แคช 7 วัน
    return goldenCatsP ||= getJSON(`${GOLDEN}/guest/categorytree?filter[categoryname]=`).then(r => {
      const tree = gcBuild(r.data);
      if (!tree.length) throw new Error('ไม่มีหมวด');
      GM_setValue('goldenCats3', { t: Date.now(), tree });
      return tree;
    }).finally(() => { goldenCatsP = null; });
  }

  // รายการแบน {id,name,n,lv} เหมือนเดิม เผื่อส่วนอื่นเรียกใช้
  async function goldenCats() {
    const list = [];
    const walk = (ns, lv) => ns.forEach(c => { list.push({ id: c.id, name: c.name, n: c.n, lv }); walk(c.kids, lv + 1); });
    walk(await goldenCatTree(), 0);
    return list;
  }

  async function goldenFillCats() {
    const sel = $('#bcat');
    if (sel.dataset.src === 'golden') return;
    sel.dataset.src = 'golden';
    sel.innerHTML = '<option value="">กำลังโหลดหมวด…</option>';
    try {
      const tree = await goldenCatTree();
      if (libSrc !== 'golden' || sel.dataset.src !== 'golden') return;
      // แบบเว็บต้นฉบับ: เฉพาะหมวดหลัก «ชื่อ - จำนวน» (เลือกหมวดหลัก = ได้หนังสือทั้งหมวดรวมหมวดย่อย)
      sel.innerHTML = '<option value="">كل التصنيفات</option>' + tree.map(t =>
        `<option value="${t.id}">${esc(t.name)} - ${t.n}</option>`).join('');
    } catch (e) {
      sel.dataset.src = '';
      sel.innerHTML = '<option value="">โหลดหมวดไม่ได้</option>';
      logRaw('! Golden หมวด: ' + e.message);
    }
  }

  async function goldenBrowse(q, cat, page) {
    const r = await getJSON(`${GOLDEN}/guest/book?filter[categories.categoryid]=${enc(cat)}` +
      `${q ? `&filter[bookname]=${enc(q)}` : ''}&per_page=50&page=${page}${gSortParam()}`);
    return { hits: (r.data || []).map(goldenBookFrom), total: r.meta?.total || 0, last: r.meta?.last_page || page };
  }

  // ---------- รายชื่อหนังสือ ----------
  const gList = { key: '', page: 0, last: 1, hits: [], total: 0 };
  async function renderGoldenList(more = false) {
    try { gSortUI2(true); } catch (e) { console.warn('gSortUI2', e); }
    const q = $('#bq').value.trim(), cat = $('#bcat').dataset.src === 'golden' ? $('#bcat').value : '';
    if (!q && !cat) {
      if (goldenTotal == null) getJSON(`${GOLDEN}/guest/statistic/book`)
        .then(r => { goldenTotal = r.data?.total_books_count || 0; if (libSrc === 'golden' && !$('#bq').value.trim() && !$('#bcat').value) renderGoldenList(); })
        .catch(() => { goldenTotal = 0; });
      $('#bcount').textContent = `Golden Shamela${goldenTotal ? ` · ${goldenTotal.toLocaleString()} เล่ม` : ''}`;
      $('#blist').innerHTML = recentHtml() + '<div class="empty">เลือกหมวด หรือพิมพ์ชื่อหนังสือ / ผู้แต่ง (อาหรับ) / เลข ID</div>';
      return;
    }
    const key = q + '|' + cat + '|' + goldenSort;
    if (more !== true || gList.key !== key) Object.assign(gList, { key, page: 0, last: 1, hits: [], total: 0 });
    const seq = ++goldenSeq;
    const box = $('#blist'), top = box.scrollTop;
    if (more !== true) box.innerHTML = '<div class="empty">กำลังค้นใน Golden Shamela…</div>';
    try {
      if (!cat) {                                   // ไม่ได้เลือกหมวด → ค้นชื่อ + ผู้แต่งแบบเดิม
        const { found, hits } = await goldenSearchBooks(q);
        if (seq === goldenSeq) { paintList(hits, found); gFillYears(hits, seq); }
        return;
      }
      const r = await goldenBrowse(q, cat, gList.page + 1);
      if (seq !== goldenSeq) return;
      gList.page++;
      gList.last = r.last;
      gList.total = r.total;
      gList.hits.push(...r.hits);
      paintList(gList.hits, gList.total);
      gFillYears(gList.hits, seq);
      if (more === true) box.scrollTop = top;
      if (gList.page < gList.last) {
        const btn = document.createElement('button');
        btn.className = 'gmore';
        btn.textContent = `โหลดเพิ่ม (${gList.hits.length.toLocaleString()} / ${gList.total.toLocaleString()})`;
        btn.onclick = () => { btn.disabled = true; btn.textContent = 'กำลังโหลด…'; renderGoldenList(true); };
        box.appendChild(btn);
      }
    } catch (e) {
      if (seq === goldenSeq) box.innerHTML = `<div class="empty">ค้น Golden ไม่สำเร็จ: ${esc(e.message)}</div>`;
    }
  }

  async function goldenShowInfo(b) {
    const pp = bcPopup(esc(b.name), '<div class="empty">กำลังโหลดข้อมูล…</div>');
    try {
      const d = await goldenMeta(b.id);
      const rows = [
        ['المؤلف', goldenAuthor(d) || b.author],
        ['التصنيف', (d.categories || []).map(c => c.categoryname).filter(Boolean).join('، ')],
        ['اللغة', d.lang?.langname],
        ['EPUB', d.isdownloadable && d.fileurl ? 'متوفر ✓' : 'غير متوفر'],
        ['المصدر', `Golden #${b.id}`],
      ].filter(r => r[1]);

  async function unzip(buf) {
    if (typeof DecompressionStream === 'undefined') {
      const z = await (await loadJSZip()).loadAsync(buf);
      return { names: Object.keys(z.files), read: n => z.file(n)?.async('string') ?? Promise.resolve(null) };
    }
    const dv = new DataView(buf), u8 = new Uint8Array(buf), td = new TextDecoder('utf-8');
    let e = buf.byteLength - 22;
    const stop = Math.max(0, e - 65557);
    while (e >= stop && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < stop) throw new Error('ไฟล์ไม่ใช่ EPUB/ZIP');
    const files = new Map();
    let p = dv.getUint32(e + 16, true);
    for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      files.set(td.decode(u8.subarray(p + 46, p + 46 + nl)),
        { m: dv.getUint16(p + 10, true), cs: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true) });
      p += 46 + nl + xl + cl;
    }
    const read = async name => {
      const f = files.get(name) || files.get([...files.keys()].find(k => k.toLowerCase() === String(name).toLowerCase()));
      if (!f) return null;
      const s = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
      const data = u8.subarray(s, s + f.cs);
      if (f.m === 0) return td.decode(data);
      if (f.m !== 8) throw new Error('EPUB บีบอัดแบบที่ไม่รองรับ (' + f.m + ')');
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    };
    return { names: [...files.keys()], read };
  }

  function goldenBlocks(html) {
    const d = new DOMParser().parseFromString(html || '', 'text/html');
    d.querySelectorAll('script,style,head').forEach(x => x.remove());
    const root = d.body || d.documentElement, blocks = [];
    const BLK = /^(P|H[1-6]|LI|BLOCKQUOTE|TR|PRE)$/;
    const walk = el => {
      for (const n of el.children) {
        const leafDiv = n.tagName === 'DIV' && !n.querySelector('p,div,h1,h2,h3,h4,h5,h6,li,table,blockquote');
        if (BLK.test(n.tagName) || leafDiv) {
          n.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
          const h = /^H/.test(n.tagName) || /title|head|عنوان/i.test(n.className || '');
          squash(n.textContent).split('\n').forEach(t => { t = t.trim(); if (t) blocks.push({ h, t }); });
        } else walk(n);
      }
    };
    walk(root);
    const all = squash(root.textContent || '');
    if (blocks.reduce((n, b) => n + b.t.length, 0) < all.length * 0.5) {
      blocks.length = 0;
      all.split('\n').forEach(t => { t = t.trim(); if (t) blocks.push({ h: false, t }); });
    }
    return blocks;
  }

      const dirOf = path => path.includes('/') ? path.replace(/[^/]+$/, '') : '';

        const base = clean.split('/').pop();
        return spine.findIndex(s => s.path.split('/').pop() === base);

      if (navItem) {

        const nd = dirOf(navItem.path);

        return out;

  const GOLD_STOP = new Set('من في على عن الى الي ما هل او ثم مع هو هي ان لا لم كان التي الذي ذلك هذا هذه كيف ماذا لماذا متي اين قال قد وقد'.split(' '));

  async function goldenLocalRaw(id, q, limit = PER_QUERY) {
    const toks = goldenToks(q);

    const nq = norm(q).replace(/[^\u0621-\u064A\u06A0-\u06FF\s]/g, ' ').replace(/\s+/g, ' ').trim();
    const phrase = nq.includes(' ') && nq.length <= 60 ? nq : '';
    const scan = minHit => {
      const arr = [];
      for (const c of chunks) {
        let hit = 0, s = 0;
        for (const t of toks) {
          const n = c.n.split(t).length - 1;
          if (n) { hit++; s += 1 + Math.log(n); }

        s *= hit / toks.length;
        if (phrase && c.n.includes(phrase)) s += 3;
        arr.push({ c, s });

      const hit = terms.filter(x => t.includes(x)).length;
      const cov = terms.length ? hit / terms.length : 0;
      e.score = e.score * (0.6 + cov) + Math.min(ems(e.marked), 6) * 0.4;
    }
    return entries.sort((a, b) => b.score - a.score);
  }
  function diversify(sorted, max, maxPerBook = Infinity) {
    const picked = [],
      seen = new Set(),
      per = new Map();
    for (const e of sorted) {
      if (picked.length >= max) break;
      if (seen.has(e.bookKey)) continue;
      seen.add(e.bookKey);
      picked.push(e);
      per.set(e.bookKey, 1);
    }
    for (const e of sorted) {
      if (picked.length >= max) break;
      if (picked.includes(e)) continue;
      const n = per.get(e.bookKey) || 0;
      if (n >= maxPerBook) continue;
      per.set(e.bookKey, n + 1);
      picked.push(e);
    }
    return picked.sort((a, b) => b.score - a.score);
  }
  const toSource = (e, ctxChars) => ({ ...e.base, score: +e.score.toFixed(4), excerpt: makeExcerpt(e.marked, ctxChars) });

  async function finalizeSources(entries, queries, question, qtype, auto, maxSources, ctxChars, img = false) {
    const maxPerBook = auto ? AUTO_MAX_PER_BOOK : Infinity;
    const sorted = localRank(entries, queries);
    let cand = diversify(sorted, auto ? AUTO_POOL : SEL_POOL, auto ? POOL_PER_BOOK : Infinity);
    if (auto && autoScope === 'all') {
      for (const src of ['golden', 'usul', 'turath']) {
        const topSrc = sorted.filter(e => e.base?.metadata?.src === src).slice(0, 4);
        for (const e of topSrc) {
          if (!cand.includes(e)) cand.push(e);
        }
      }
    }
    let usage = usageOf(null),
      picked = null;
    if (RERANK && cand.length > 2) {
      try {
        const r = await rerank(question, queries, qtype, cand, maxSources, auto, img);
        usage = r.usage;
        const out = [],
          per = new Map();
        for (const i of r.picked) {
          const e = cand[i];
          if (!e || out.includes(e)) continue;
          const n = per.get(e.bookKey) || 0;
          if (n >= maxPerBook) continue;
          per.set(e.bookKey, n + 1);
          out.push(e);
          if (out.length >= maxSources) break;
        }
        if (out.length) picked = out;
        else logRaw('· rerank: ไม่มีชิ้นที่ตรงคำถาม → ใช้คะแนนแทน');
      } catch (e) {
        logRaw(`! rerank ไม่สำเร็จ → ใช้คะแนน: ${e.message}`);
      }
    }
    const list = picked || diversify(sorted, maxSources, maxPerBook);
    return { sources: list.map(e => toSource(e, ctxChars)), usage, reranked: !!picked, pool: cand.length };
  }

  async function searchBooks(queries, books) {
    const dups = books.filter(b => dupOfTurath(b, books));
    if (dups.length) logRaw(`! ข้ามเล่มซ้ำ (Usul ที่เป็น version Turath เดียวกัน): ${dups.map(keyOf).join(', ')}`);
    books = books.filter(b => !dups.includes(b));

    const tasks = [];
    const semQ = queries.find(q => q.trim().split(/\s+/).length >= 4) || queries[queries.length - 1];
    for (const b of books) {
      for (const q of queries) tasks.push({ b, q, type: 'keyword' });
      if (USUL_SEMANTIC && b.src === 'usul') tasks.push({ b, q: semQ, type: 'semantic' });
    }
    const lists = await pool(tasks, CONCURRENCY, t => fetchHits(t).catch(e => {
      logRaw(`! search ${keyOf(t.b)} [${t.type}] ${e.message}`);
      return [];
    }));

    const map = new Map();
    lists.forEach(list => list.slice(0, PER_QUERY).forEach((h, rank) => {
      const e = map.get(h.key) || { ...h, score: 0 };
      e.score += 10 / (rank + 1);
      if (ems(h.marked) > ems(e.marked)) {
        e.marked = h.marked;
        e.base = h.base;
      }
      map.set(h.key, e);
    }));
    return [...map.values()];
  }

  const STOP = new Set(['في', 'من', 'علي', 'عن', 'الي', 'و', 'كتاب', 'شرح', 'ابو', 'بن']);
  const cleanTitle = s => norm(s).replace(/[^\u0621-\u064Aa-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

  function matchBooks(list, cat) {
    const out = [],
      seen = new Set();
    for (const s of list || []) {
      const title = cleanTitle(String(s.title || s).split(/\s[—–|]\s/)[0]);
      if (title.length < 3) continue;
      const toks = title.split(' ').filter(t => t.length >= 2 && !STOP.has(t));
      if (!toks.length) continue;
      const authToks = cleanTitle(s.author || '').split(' ').filter(t => t.length >= 3 && !STOP.has(t)).slice(0, 2);
      let best = null,
        bestScore = -Infinity;
      for (const b of cat.books) {
        if (!toks.every(t => b.key.includes(t))) continue;
        let sc = 0;
        if (b.nn === title) sc += 100;
        else if (b.nn.startsWith(title)) sc += 50;
        if (authToks.length && authToks.every(t => b.key.includes(t))) sc += 40;
        sc -= b.nn.length / 10;
        sc += Math.min(b.pc || 0, 3000) / 1000;
        if (sc > bestScore) {
          bestScore = sc;
          best = b;
        }
      }
      if (best && !seen.has(best.id)) {
        seen.add(best.id);
        out.push(best);
      }
      if (out.length >= AUTO_SUGGEST) break;
    }
    return out;
  }

  const QTYPE_GOLDEN_POOL = {
    sira: ['السيرة النبوية', 'زاد المعاد', 'البداية والنهاية', 'الرحيق المختوم', 'سبل الهدى والرشاد', 'عيون الأثر'],
    tafsir: ['تفسير الطبري', 'تفسير ابن كثير', 'تفسير القرطبي', 'تفسير السعدي', 'التحرير والتنوير', 'فتح القدير'],
    hadith: ['فتح الباري', 'شرح النووي على مسلم', 'رياض الصالحين', 'عون المعبود', 'تحفة الأحوذي', 'سبل السلام'],
    fiqh: ['المجموع شرح المهذب', 'إعانة الطالبين', 'مغني المحتاج', 'تحفة المحتاج', 'أسنى المطالب', 'كفاية الأخيار', 'الحاوي الكبير', 'المغني'],
    aqeedah: ['شرح العقيدة الطحاوية', 'لوامع الأنوار', 'فتح المجيد', 'تيسير العزيز الحميد', 'اعتقاد أهل السنة'],
    lugha: ['لسان العرب', 'القاموس المحيط', 'مقاييس اللغة', 'فقه اللغة', 'المزهر'],
    akhlaq: ['رياض الصالحين', 'الأذكار', 'إحياء علوم الدين', 'صيد الخاطر', 'الداء والدواء'],
    general: ['فتح الباري', 'رياض الصالحين', 'البداية والنهاية', 'المجموع شرح المهذب'],
  };

  const GENERIC_BOOK_WORDS = new Set(['حكم', 'ما', 'هل', 'في', 'من', 'على', 'عن', 'اليه', 'فقه', 'مذهب', 'عند', 'مسألة', 'بيان', 'باب', 'كتاب', 'شرح', 'حاشية', 'صلاة', 'الصلاة', 'الشافعي', 'الشافعية', 'الحنفي', 'المالكي', 'الحنبلي']);

  async function discoverGoldenBooks(queries, qtype, suggested, maxBooks = 5) {
    const cands = new Map(); // id -> { book, score }
    const qAllNorm = norm(queries.join(' '));
    const qToks = goldenToks(queries.slice(0, 3).join(' '));
    const specificToks = qToks.filter(t => t.length >= 3 && !GENERIC_BOOK_WORDS.has(t));

    const addCand = (x, baseScore) => {
      if (!x || !x.bookid || x.isdownloadable === false) return;
      const b = goldenBookFrom(x);
      const id = +b.id;
      if (!id) return;
      const descNorm = norm(`${b.name} ${b.author} ${x.bookdsecription || ''}`);
      let kwBonus = 0;
      for (const tk of specificToks) {
        if (descNorm.includes(tk)) kwBonus += 18;
      }
      for (const tk of qToks) {
        if (descNorm.includes(tk)) kwBonus += 6;
      }
      const prev = cands.get(id);
      const total = baseScore + kwBonus;
      if (!prev || total > prev.score) {
        cands.set(id, { book: b, score: total });
      }
    };

    const searchByTitle = async ({ t, a, weight = 50 }) => {
      try {
        const r = await getJSON(`${GOLDEN}/guest/book?filter[bookname]=${enc(t)}&per_page=8&page=1${gSortParam()}`);
        const rows = (r?.data || []).filter(x => x && x.bookid && x.isdownloadable !== false);
        if (!rows.length) return;
        const nt = cleanTitle(t), na = cleanTitle(a || '').split(' ').filter(w => w.length >= 3)[0] || '';
        for (let idx = 0; idx < rows.length; idx++) {
          const x = rows[idx];
          const nb = cleanTitle(goldenName(x.bookname));
          let sc = weight - idx * 3;
          if (nb === nt) sc += 60;
          else if (nb.startsWith(nt)) sc += 35;
          else if (nb.includes(nt)) sc += 15;
          if (na && cleanTitle(goldenAuthor(x)).includes(na)) sc += 35;
          sc -= Math.min(nb.length, 80) * 0.15;
          addCand(x, sc);
        }
      } catch {}
    };

    // 1) ค้นหนังสือในคลัง Golden ที่ชื่อเรื่องตรงกับ "หัวข้อเฉพาะของคำถาม" (เช่น السواك, الإمامة, الصبي ฯลฯ)
    const topicSearches = [];
    for (const tk of specificToks.slice(0, 4)) {
      topicSearches.push({ t: tk, a: '', weight: 75 });
    }
    for (const q of queries.slice(0, 3)) {
      const cleanQ = norm(q).replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !GENERIC_BOOK_WORDS.has(w)).slice(0, 2).join(' ');
      if (cleanQ.length >= 4 && !topicSearches.some(x => x.t === cleanQ)) {
        topicSearches.push({ t: cleanQ, a: '', weight: 80 });
      }
    }

    // 2) ค้นหนังสือจากรายชื่อที่ Gemini แนะนำสำหรับคำถามนี้โดยเฉพาะ (suggested)
    const sugSearches = [];
    for (let i = 0; i < (suggested || []).length; i++) {
      const s = suggested[i];
      const full = String(s?.title || s || '').split(/\s[—–|]\s/)[0].trim();
      const auth = String(s?.author || '').trim();
      const w = 90 - i * 4;
      if (full.length >= 3) sugSearches.push({ t: full, a: auth, weight: w });
      const short = full.replace(/^(?:كتاب|صحيح|سنن|مسند|تفسير|حاشية|فتح|شرح)\s+/, '').split(/\s+/).slice(0, 3).join(' ');
      if (short.length >= 4 && short !== full) sugSearches.push({ t: short, a: auth, weight: w - 5 });
    }

    await pool([...topicSearches.slice(0, 4), ...sugSearches.slice(0, 8)], 5, searchByTitle);

    // 3) ถ้ายังได้ผู้สมัครน้อยกว่า maxBooks จึงค่อยดึงจากคลังสำรองตามหมวดวิชา (สุ่มสลับลำดับไม่ให้ซ้ำเดิม)
    if (cands.size < maxBooks) {
      const poolList = [...(QTYPE_GOLDEN_POOL[qtype] || QTYPE_GOLDEN_POOL.general)];
      // หมุนลำดับตามความยาวคำถามเพื่อให้หลากหลายหากต้องใช้ตัวสำรอง
      const shift = qAllNorm.length % Math.max(1, poolList.length);
      const rotated = [...poolList.slice(shift), ...poolList.slice(0, shift)];
      await pool(rotated.slice(0, 3).map(t => ({ t, a: '', weight: 25 })), 3, searchByTitle);
    }

    // จัดอันดับผู้สมัครตามคะแนนความเกี่ยวข้องกับคำถาม แล้วเลือกหลากหลายผู้แต่ง
    const sorted = [...cands.values()].sort((a, b) => b.score - a.score);
    const picked = [], seenAuth = new Map();
    for (const item of sorted) {
      if (picked.length >= maxBooks) break;
      const au = cleanTitle(item.book.author || '').slice(0, 18);
      const cnt = au ? (seenAuth.get(au) || 0) : 0;
      if (cnt >= 2) continue;
      if (au) seenAuth.set(au, cnt + 1);
      picked.push(item.book);
    }
    return picked;
  }

  async function autoSearch(queries, qtype, suggested) {
    const scope = AUTO_SCOPES[autoScope] ? autoScope : 'all';
    const useT = scope === 'all' || scope === 'turath';
    const useU = (scope === 'all' && AUTO_USUL) || scope === 'usul';
    const useG = (scope === 'all' && AUTO_GOLDEN) || scope === 'golden';
    logRaw(`· autoSearch scope=${scope} (Turath=${useT}, Usul=${useU}, Golden=${useG})`);

    // ---------- 1) TURATH ----------
    let cat = null, picks = [], pickIds = new Set(), gLists = [], found = [], sLists = [];
    const nameOf = new Map();
    const nameFor = id => cat?.byId.get(+id)?.name || nameOf.get(+id) || `#${id}`;
    const catRx = CAT_RX[qtype] || null;
    const catOk = id => {
      const b = cat?.byId.get(+id);
      return !!(b && catRx && catRx.test(cat.catsN[b.cid] || ''));
    };
    const catW = (id, good, bad) => (cat && catRx) ? (catOk(id) ? good : bad) : 1;

    if (useT) {
      try {
        cat = await loadCatalog();
      } catch (e) {
        logRaw(`! โหลดแคตตาล็อก Turath ไม่สำเร็จ: ${e.message}`);
      }
      picks = cat ? matchBooks(suggested, cat) : [];
      pickIds = new Set(picks.map(b => +b.id));

      const runT = t => withRetry(() => getJSON(`${TURATH}/search?q=${enc(t.q)}${t.book ? `&book=${t.book}` : ''}&ver=3`))
        .then(r => (r.data || []).map(normTurath))
        .catch(e => {
          logRaw(`! auto search ${t.book ? '#' + t.book : 'all'} ${e.message}`);
          return [];
        });

      gLists = await pool(queries.map(q => ({ q, book: null })), CONCURRENCY, runT);

      const freq = new Map();
      gLists.forEach(list => list.slice(0, AUTO_GLOBAL_TOP).forEach((h, rank) => {
        const id = +h.bookKey.split(':')[1];
        freq.set(id, (freq.get(id) || 0) + (10 / (rank + 1)) * catW(id, 1.5, 0.7));
        if (h.base.book.primaryName) nameOf.set(id, h.base.book.primaryName);
      }));
      found = [...freq.entries()].filter(([id]) => !pickIds.has(id))
        .sort((a, b) => b[1] - a[1]).slice(0, scope === 'turath' ? 6 : AUTO_DISCOVER).map(([id]) => id);
      logRaw(`· auto Turath qtype=${qtype} · แนะนำ ${suggested.length} → จับคู่ได้ ${picks.length}: ${picks.map(b => `${b.name}#${b.id}`).join(' | ')}`);
      logRaw(`· auto Turath พบเนื้อหาในเล่ม: ${found.map(id => `${nameFor(id)}#${id}`).join(' | ') || '-'}`);

      const sTasks = [];
      for (const id of [...pickIds, ...found])
        for (const q of queries.slice(0, AUTO_SCOPED_QUERIES)) sTasks.push({ q, book: id });
      sLists = await pool(sTasks, CONCURRENCY, runT);
    }

    // ---------- 2) USUL ----------
    let uLists = [], uFound = [], uScoped = [];
    if (useU) {
      uLists = await pool(queries, CONCURRENCY, q =>
        withRetry(() => getJSON(`${USUL}/search?q=${enc(q)}&locale=ar`))
          .then(r => (r.content?.results || [])
            .filter(x => !(AUTO_USUL_SKIP_TURATH && useT && /^turath:/.test(x.node?.metadata?.sourceAndVersion || '')))
            .map(normUsulGlobal))
          .catch(e => { logRaw(`! usul global ${e.message}`); return []; }));
      const uFreq = new Map();
      uLists.forEach(l => l.slice(0, AUTO_GLOBAL_TOP).forEach((h, rank) => {
        const o = uFreq.get(h.bookKey) || { b: h.ubook, s: 0 };
        o.s += 10 / (rank + 1);
        uFreq.set(h.bookKey, o);
      }));
      const uMax = scope === 'usul' ? 5 : AUTO_USUL_DISCOVER;
      uFound = [...uFreq.values()].sort((a, b) => b.s - a.s).slice(0, uMax).map(o => o.b);

      if (scope === 'usul' && uFound.length < uMax && suggested?.length) {
        const sugU = await pool(suggested.slice(0, 5), 3, s => usulSearchBooks(s.title).then(r => r.hits?.[0]).catch(() => null));
        for (const b of sugU) {
          if (b && b.versionId && !uFound.some(x => x.id === b.id)) uFound.push(b);
          if (uFound.length >= uMax) break;
        }
      }
      uScoped = await pool(
        uFound.flatMap(b => queries.slice(0, AUTO_SCOPED_QUERIES).map(q => ({ b, q, type: 'keyword' }))),
        CONCURRENCY, t => fetchHits(t).catch(() => []));
      logRaw(`· auto Usul พบเนื้อหาในเล่ม: ${uFound.map(b => b.name).join(' | ') || '-'}`);
    }

    // ---------- 3) GOLDEN SHAMELA ----------
    let gsLists = [], gFound = [], gScoped = [];
    if (useG) {
      gsLists = await pool(queries, CONCURRENCY, q => goldenGlobal(q).catch(() => []));
      const maxGBooks = scope === 'golden' ? 5 : 3;
      gFound = await discoverGoldenBooks(queries, qtype, suggested, maxGBooks);
      if (gFound.length) {
        logRaw(`· auto Golden เลือกค้นในเล่ม: ${gFound.map(b => `${b.name}#${b.id}`).join(' | ')}`);
        $('#status').textContent = `กำลังค้นใน Golden Shamela (${gFound.map(b => b.name).slice(0, 3).join('، ')})…`;
        const combinedKw = goldenToks(queries.join(' ')).slice(0, 6).join(' ');
        const gQueries = [...new Set([...queries.slice(0, AUTO_SCOPED_QUERIES), combinedKw].filter(Boolean))];
        gScoped = await pool(
          gFound.flatMap(b => gQueries.map(q => ({ b, q }))),
          2,
          ({ b, q }) => goldenHits(b, q).catch(e => { logRaw(`! auto Golden #${b.id}: ${e.message}`); return []; })
        );
      }
      const gsN = gsLists.reduce((n, l) => n + l.length, 0) + gScoped.reduce((n, l) => n + l.length, 0);
      logRaw(`· auto Golden พบ ${gsN} ชิ้น`);
    }

    // ---------- 4) MERGE & SCORE ----------
    const foundSet = new Set(found);
    const uFoundKeys = new Set(uFound.map(keyOf));
    const gFoundKeys = new Set(gFound.map(keyOf));
    const map = new Map();
    const add = (list, scoped) => list.slice(0, scoped ? PER_QUERY : AUTO_GLOBAL_TOP).forEach((h, rank) => {
      const e = map.get(h.key) || { ...h, score: 0 };
      const isT = h.bookKey.startsWith('turath:');
      const id = isT ? +h.bookKey.split(':')[1] : NaN;
      let s = 10 / (rank + 1);
      if (scoped) s *= 0.85;
      if (isT) {
        s *= catW(id, 1.45, 0.7);
        if (pickIds.has(id)) s *= 1.3;
        if (foundSet.has(id)) s *= 1.2;
      } else {
        if (uFoundKeys.has(h.bookKey) || gFoundKeys.has(h.bookKey)) s *= 1.35;
      }
      e.score += s;
      if (ems(h.marked) > ems(e.marked)) {
        e.marked = h.marked;
        e.base = h.base;
      }
      map.set(h.key, e);
    });
    gLists.forEach(l => add(l, false));
    sLists.forEach(l => add(l, true));
    uLists.forEach(l => add(l, false));
    uScoped.forEach(l => add(l, true));
    gsLists.forEach(l => add(l, false));
    gScoped.forEach(l => add(l, true));

    const entries = [...map.values()];
    for (const e of entries) {
      if (e.base.metadata.src !== 'turath') continue;
      const b = cat?.byId.get(+e.base.metadata.bookId);
      if (b) {
        e.base.book.primaryName = e.base.book.primaryName || b.name;
        e.base.book.authorName = e.base.book.authorName || b.author;
      }
    }

    // จัดอันดับรายชื่อหนังสือที่แสดงใน "เล่มที่แนะนำ/พบเนื้อหา" จากเล่มที่พบเนื้อหาตรงคำถามจริง (คะแนนสูงสุดขึ้นก่อน)
    const bookScores = new Map();
    for (const e of entries) {
      const bk = e.bookKey;
      const src = e.base?.metadata?.src || 'turath';
      const rawName = e.base?.book?.primaryName || (src === 'turath' ? nameFor(e.base?.metadata?.bookId) : '');
      if (!rawName) continue;
      const label = src === 'golden' ? `${rawName} (Golden)` : src === 'usul' ? `${rawName} (Usul)` : rawName;
      const curBest = bookScores.get(bk);
      const sc = (curBest ? curBest.score : 0) + e.score;
      bookScores.set(bk, { label, score: sc });
    }
    const rankedBooks = [...bookScores.values()]
      .sort((a, b) => b.score - a.score)
      .slice(0, 8)
      .map(x => x.label);

    return {
      entries,
      books: rankedBooks,
    };
  }

  // ================= CATALOG (Turath) =================
  let catalog = null;

  function buildIndex(slim) {
    const books = slim.books.map(([id, name, aid, cid, pc, hp]) => {
      const author = slim.authors[aid] || '';
      return { src: 'turath', id, name, aid, cid, pc, hp: !!hp, author, key: norm(`${name} ${author} ${id}`), nn: cleanTitle(name) };
    });
    return {
      cats: slim.cats,
      catsN: Object.fromEntries(Object.entries(slim.cats).map(([k, v]) => [k, norm(v)])),
      books,
      byId: new Map(books.map(b => [+b.id, b])),
    };
  }
  async function loadCatalog() {
    if (catalog) return catalog;
    const cached = GM_getValue('catalogV3', null);
    if (cached && Date.now() - cached.t < 7 * 864e5) return (catalog = buildIndex(cached.d));
    const data = JSON.parse(await gmRequest({ method: 'GET', url: CATALOG_URL }));
    const slim = { cats: {}, books: [], authors: {} };
    for (const c of Object.values(data.cats || {})) slim.cats[c.id] = c.name;
    for (const b of Object.values(data.books || {})) slim.books.push([b.id, b.name, b.author_id, b.cat_id, b.page_count || 0, b.has_pdf ? 1 : 0]);
    for (const [k, a] of Object.entries(data.authors || {})) slim.authors[a?.id ?? k] = typeof a === 'string' ? a : (a?.name || '');
    GM_setValue('catalogV3', { t: Date.now(), d: slim });
    return (catalog = buildIndex(slim));
  }

  // ================= BOOK INFO (สารบัญ / จำนวนหน้า) =================
  const infoCache = new Map();

  function pmEntry(x) {
    if (x == null) return null;
    if (Array.isArray(x)) return [+x[0], +x[1]];
    if (typeof x === 'object') return [+(x.vol ?? x.volume ?? 1), +(x.page ?? x.pg)];
    const s = String(x).split(/[,\-:/]/);
    return s.length > 1 ? [+s[0], +s[1]] : [1, +s[0]];
  }

  function lookupPm(pm, v, p) {
    if (!Array.isArray(pm)) return null;
    for (let i = 0; i < pm.length; i++) {
      const e = pmEntry(pm[i]);
      if (e && e[0] === +v && e[1] === +p) return i + 1;
    }
    return null;
  }

  async function turathInfo(id) {
    if (reader.src === 'golden' && String(id) === String(reader.bookId)) return goldenInfo(id);
    // ต้องมี include=indexes ไม่งั้น API ส่งมาแค่ meta (ไม่มี headings / print_pg_to_pg)
    const r = await getJSON(`${TURATH}/book?id=${enc(id)}&include=indexes&ver=3`);
    const ix = r.indexes || {};
    const pm = Array.isArray(ix.page_map) ? ix.page_map : [];
    const hs = [ix.headings, r.headings, r.toc].find(x => Array.isArray(x) && x.length) || [];
    const pgOf = h => {
      const n = numOr(h.page?.id, h.page?.pg, h.page_id, h.pg, h.page);
      if (Number.isFinite(n)) return n;
      if (h.page && typeof h.page === 'object') {
        const m = lookupPm(pm, h.page.vol ?? h.page.volume ?? 1, h.page.page);
        if (m != null) return m;
      }
      return NaN;
    };
    const toc = hs.map(h => ({
      title: stripEm(stripTags(h.title || h.name || '')).trim(),
      level: +h.level || 1,
      index: pgOf(h),
    })).filter(h => h.title && Number.isFinite(h.index));
    tocDebug('turath', { headings: hs.length, ok: toc.length, sample: hs[0], pageMap: pm.length, mapSample: pm[0] });
    const pc = catalog?.byId.get(+id)?.pc;
    const p2p = ix.print_pg_to_pg && typeof ix.print_pg_to_pg === 'object' ? ix.print_pg_to_pg : null;
    const p2pMax = p2p ? Math.max(0, ...Object.values(p2p).map(v => +(v?.id ?? v)).filter(Number.isFinite)) : 0;
    const total = pm.length || pc || p2pMax || null;
    return { toc, p2p, pm, total, vols: (ix.volumes || []).length, name: r.meta?.name || '', pdf: pdfOf(r.meta) };
  }

  // PDF ของเล่ม (มีเฉพาะบางเล่ม): meta.pdf_links = { root, files:["htmsm01.pdf", "htmsm00.pdf|الغلاف", ...] }
  function pdfOf(meta) {
    const pl = meta?.pdf_links;
    if (!pl || !Array.isArray(pl.files) || !pl.files.length) return null;
    const base = 'https://files.turath.io/pdf/' +
      (pl.root ? String(pl.root).split('/').map(enc).join('/') + '/' : '');
    const files = pl.files.map(f => {
      const [file, label = ''] = String(f).split('|');
      const vol = label ? NaN : +(file.match(/(\d+)\D*\.pdf$/i) || [])[1];   // htmsm03.pdf → 3
      return { file, label, vol, url: base + enc(file) };
    });
    return { files, main: files.filter(f => !f.label) };
  }

  async function usulInfo(slug, versionId) {
    if (!slug && reader.src === 'golden') return goldenInfo(reader.bookId);
    const v = versionId ? `&versionId=${enc(versionId)}` : '';
    let r = {};
    try {
      r = await getJSON(`${USUL}/book/page/${enc(slug)}?index=0${v}&fields=headings,pdf&includeBook=true&locale=ar`);
    } catch (e) {
      logRaw(`! Usul page/headings: ${e.message} → ใช้ details แทน`);
    }
    let hs = r.content?.headings || r.headings || [];
    let book = r.book;
    if (!hs.length || !book) {
      const d = await getJSON(`${USUL}/book/details/${enc(slug)}?locale=ar`);
      if (!hs.length) hs = d.headings || [];
      book = book || d.book;
    }
    const curId = r.content?.id || versionId;
    const ver = (book?.versions || []).find(x => x.id === curId);
    const pdfUrl = r.content?.pdfUrl || r.content?.pdf?.url || ver?.pdfUrl || '';
    const toc = hs.map(h => ({
      title: stripEm(stripTags(h.title ?? h.text ?? h.content ?? '')).trim(),
      level: +h.level || 1,
      index: numOr(h.pageIndex, h.page?.index, h.index),
      vol: +arDigits(h.page?.vol ?? h.page?.volume ?? 1) || 1,
      pg: +arDigits(h.page?.page ?? ''),
    })).filter(h => h.title && Number.isFinite(h.index));
    tocDebug('usul', { want: versionId, got: curId, headings: hs.length, ok: toc.length, total: r.pagination?.total, pdf: !!pdfUrl });
    const f = pdfUrl ? { file: 'usul.pdf', label: '', vol: NaN, url: pdfUrl } : null;
    return {
      toc,
      versions: mapVersions(book?.versions),
      total: r.pagination?.total ?? null,
      mismatch: false,
      pdf: f ? { files: [f], main: [f] } : null,
    };
  }

  function lookupPrinted(info, v, p) {
    const map = info?.p2p;
    if (map && typeof map === 'object') {
      const val = x => {
        const n = +(x?.id ?? x?.page_id ?? x);
        return Number.isFinite(n) ? n : null;
      };
      for (const k of [`${v},${p}`, `${v}-${p}`, `${v}:${p}`, `${v}/${p}`])
        if (map[k] != null) return val(map[k]);
      const sub = map[v];
      if (sub && sub[p] != null) return val(sub[p]);
    }
    return lookupPm(info?.pm, v, p);
  }

  async function addFiles(files) {
    const list = [...(files || [])].filter(f => f && (/^image\//.test(f.type) || /\.(heic|heif|jpe?g|png|webp|gif|bmp)$/i.test(f.name || '')));
    if (!list.length) return;
    for (const f of list) {
      if (attach.length >= MAX_IMAGES) {
        $('#status').textContent = `แนบได้สูงสุด ${MAX_IMAGES} รูปต่อคำถาม`;

        alert(`แนบรูปไม่สำเร็จ: ${e.message}`);

        }).join('') + `<button class="sc-pill auto-back" data-scope="${autoScope}" title="ล้างเล่มที่ติ๊กแล้วสลับเป็นโหมดค้นทั้งคลังอัตโนมัติ">✨ ค้นอัตโนมัติ</button>` :
        `<span class="chip auto">✨ อัตโนมัติ · ค้นจาก ${esc(AUTO_SCOPES[autoScope]?.full || 'ทุกคลัง')} แล้วคัดข้อความที่สอดคล้องที่สุด</span>${scopeBar}`) +
      `<span class="chip add" data-go="lib">${selected.length ? '+ เพิ่มหนังสือ' : '+ หรือเลือกหนังสือเอง'}</span>`;

  $('#chips').addEventListener('click', e => {
    const sc = e.target.closest('[data-scope]');
    if (sc) {
      setAutoScope(sc.dataset.scope);

    const rm = e.target.closest('[data-rm]');
    if (rm) {
      selected = selected.filter(b => keyOf(b) !== rm.dataset.rm);
      saveSelected();
      renderChips();
      syncListCheck(rm.dataset.rm);
      return;
    }
    if (e.target.closest('[data-go]')) showTab('lib');

  function toggleBook(b, on) {
    const k = keyOf(b),
      has = selected.some(x => keyOf(x) === k);
    if (on && !has) {
      if (selected.length >= MAX_BOOKS) {
        alert(`เลือกได้สูงสุด ${MAX_BOOKS} เล่ม`);
        return false;
      }
      if (b.src === 'usul') {
        if (!b.versionId) {
          alert('เล่มนี้ไม่มี version ที่ค้นได้ใน Usul');
          return false;
        }
        const nb = slimBook(b);
        if (dupOfTurath(nb, selected) && !confirm('เล่มนี้ใน Usul ใช้ version จาก Turath ซึ่งคุณติ๊กไว้แล้ว (ข้อความเดียวกัน) — จะถูกข้ามตอนค้น\nยังจะเพิ่มอยู่ไหม? (แนะนำให้เปลี่ยน version เป็น OpenITI ถ้ามี)')) return false;
        selected.push(nb);
      } else {
        selected.push(slimBook(b));
        if (b.src === 'golden' && !b.author) goldenMeta(b.id).then(d => {
          const s = selected.find(x => keyOf(x) === k), au = goldenAuthor(d);
          if (s && au) { s.author = au; saveSelected(); renderChips(); }
        }).catch(() => {});
      }
    } else if (!on && has) selected = selected.filter(x => keyOf(x) !== k);
    saveSelected();
    renderChips();
    return true;
  }

  function syncListCheck(k) {
    const on = selected.some(x => keyOf(x) === k);
    root.querySelectorAll('#blist input[data-key]').forEach(cb => {
      if (cb.dataset.key !== k) return;
      cb.checked = on;
      cb.closest('.bk')?.classList.toggle('sel', on);
    });
    const bc = $('#bcount');
    bc.textContent = bc.textContent.replace(/ติ๊กแล้ว \d+/, `ติ๊กแล้ว ${selected.length}`);
  }
  renderChips();

  const urlBook = location.host === 'app.turath.io' && location.pathname.match(/\/book\/(\d+)/);
  if (urlBook && !selected.some(b => keyOf(b) === `turath:${+urlBook[1]}`)) {
    getJSON(`${TURATH}/book?id=${urlBook[1]}&ver=3`).then(r => {
      toggleBook({ src: 'turath', id: +urlBook[1], name: r.meta?.name || `#${urlBook[1]}`, author: '' }, true);
    }).catch(() => {});
  }
  const urlUsul = /(^|\.)usul\.ai$/.test(location.host) && location.pathname.match(/\/t\/([^/]+)/);
  if (urlUsul) {
    getJSON(`${USUL}/book/details/${enc(decodeURIComponent(urlUsul[1]))}?locale=ar`).then(r => {
      const bk = r.book;
      if (!bk || selected.some(b => keyOf(b) === `usul:${bk.id}`)) return;
      toggleBook(usulBookFrom({ ...bk, author: { primaryName: bk.author?.primaryName } }), true);
    }).catch(() => {});
  }

  let libReady = false,

  }
  // ---------- ป๊อปอัปจัดการหมวดรายการโปรด ----------

    const chips = body.querySelector('.fvd-chips');
    const paint = () => {

        `${c === cur ? '✓ ' : ''}${esc(c)}${used[c] ? ` <small>(${used[c]})</small>` : ''}` +
        `${c !== FAV_DEF ? `<b class="fvd-x" data-x="${esc(c)}" title="ลบหมวดนี้">✕</b>` : ''}</span>`).join('');
    };
    paint();

    chips.onclick = e => {
      const x = e.target.closest('[data-x]');
      if (x) {                                            // ลบหมวด
        e.stopPropagation();
        const c = x.dataset.x, n = favBooks.filter(f => f.cat === c).length;
        if (n && !confirm(`หมวด «${c}» มีหนังสือ ${n} เล่ม\nลบหมวดแล้วย้ายหนังสือไป «${FAV_DEF}»?`)) return;
        favBooks.forEach(f => { if (f.cat === c) f.cat = FAV_DEF; });
        cats.splice(cats.indexOf(c), 1);
        favCatSave(cats);
        if (GM_getValue('favLastCat', '') === c) GM_setValue('favLastCat', '');
        if (cur === c) cur = FAV_DEF;
        saveFavs(); updateFavCats(); renderBookList();

    const nw = body.querySelector('.fvd-new');

    const addCat = () => {
      const v = (inp?.value || '').trim().replace(/\s+/g, ' ');
      if (!v) return false;
      if (!cats.includes(v)) { cats.push(v); favCatSave(cats); }
      cur = v; inp.value = ''; paint();
      return true;

        favBooks.unshift({ key: k, cat: cur, book: bookToSave });

  function updateFavCats() {
    const cats = [...new Set(favBooks.map(f => f.cat).filter(Boolean))].sort();
    const cur = $('#favcat').value;
    $('#favcat').innerHTML = '<option value="">ทุกหมวด</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    if (cats.includes(cur)) $('#favcat').value = cur;
  }

  async function initLibrary() {
    updateFavCats();
    $('#bsrc').value = libSrc;
    $('#bcat').hidden = libSrc === 'usul';
    if (libSrc === 'golden') goldenFillCats();
    else if (libSrc === 'turath' && catalog?.cats && $('#bcat').dataset.src !== 'turath') {
      $('#bcat').innerHTML = '<option value="">كل التصنيفات</option>' +
        Object.entries(catalog.cats).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
      $('#bcat').dataset.src = 'turath';
    }
    $('#bq').placeholder = ({ usul: 'ค้นใน Usul เช่น نهاية المطلب', golden: 'ค้นใน Golden: ชื่อหนังสือ / ผู้แต่ง / ID' })[libSrc] ||
      'ค้นชื่อหนังสือ / ผู้แต่ง / ID เช่น فتح الباري';
    paintStats();
    usulCount().then(d => {

        paintStats();
      }

    if (!catalog && libSrc === 'usul' && GM_getValue('catalogV3', null)) loadCatalog().then(paintStats).catch(() => {});
    if (libSrc === 'turath' && !libReady) {

      try {
        const c = await loadCatalog();
        $('#bcat').innerHTML = '<option value="">كل التصنيفات</option>' +
          Object.entries(c.cats).map(([id, n]) => `<option value="${id}">${esc(n)}</option>`).join('');
        $('#bcat').dataset.src = 'turath';
        libReady = true;
        paintStats();
      } catch (e) {
        $('#blist').innerHTML = `โหลดไม่สำเร็จ: ${esc(e.message)}`;
        return;
      }
    }
    renderBookList();
  }
  $('#bsrc').onchange = () => {
    libSrc = $('#bsrc').value;
    GM_setValue('libSrc', libSrc);
    initLibrary();

  $('#bq').addEventListener('input', () => {

  $('#onlyfav').onchange = () => {

  $('#favcat').onchange = renderBookList;
  $('#onlysel').onchange = () => {

  $('#selall').className = $('#clearsel').className;      // ให้หน้าตาเหมือนปุ่มล้างที่ติ๊ก
  $('#selall').onclick = () => {
    const boxes = [...$('#blist').querySelectorAll('input[data-key]')].filter(cb => !cb.checked);
    if (!boxes.length) return alert('ไม่มีเล่มที่ยังไม่ได้ติ๊กในรายการนี้');
    let added = 0, skipped = 0, full = false;
    for (const cb of boxes) {
      if (selected.length >= MAX_BOOKS) { full = true; break; }
      const b = listIndex.get(cb.dataset.key);
      // ข้ามเล่ม Usul ที่ค้นไม่ได้ หรือซ้ำกับ Turath ที่ติ๊กไว้ (ไม่ให้เด้งถามทีละเล่ม)
      if (!b || (b.src === 'usul' && (!b.versionId || dupOfTurath(slimBook(b), selected)))) { skipped++; continue; }

      (full ? `\nครบขีดจำกัด ${MAX_BOOKS} เล่มแล้ว` : '') +
      (skipped ? `\nข้าม ${skipped} เล่ม (Usul ที่ค้นไม่ได้ หรือซ้ำกับ Turath)` : ''));

  function recentHtml() {
    const items = Object.entries(lastRead).filter(([, r]) => r?.book).sort((a, b) => b[1].t - a[1].t).slice(0, 8);
    if (!items.length) return '';
    return '<div class="rec"><div class="h">อ่านต่อจากครั้งก่อน</div>' + items.map(([k, r]) =>
      `<button class="recb" data-resume="${esc(k)}"><span><span class="badge ${r.book.src === 'usul' ? 'usul' : ''}">${badgeOf(r.book)}</span> ${esc(r.book.name || k)}</span> <i>${esc(r.loc || '')}</i></button>`).join('') + '</div>';

  function renderBookList() {
    try { gSortUI2(false); } catch (e) { console.warn('gSortUI2', e); }
    const isFavOnly = $('#onlyfav').checked;
    $('#favcat').style.display = isFavOnly ? 'inline-block' : 'none';

    if (isFavOnly) {
      const catFilter = $('#favcat').value;
      let list = favBooks;
      if (catFilter) list = list.filter(f => f.cat === catFilter);
      let books = list.map(f => {
        const b = f.book;
        return (b.src === 'turath' && catalog) ? { ...(catalog.byId.get(+b.id) || b), src: 'turath' } : b;
      });
      return paintList(books, books.length);
    }

    if ($('#onlysel').checked) {
      const list = selected.map(s => (s.src === 'turath' && catalog) ?
        { ...(catalog.byId.get(+s.id) || { ...s, cid: '', pc: 0 }), src: 'turath' } : s);
      return paintList(list, list.length);
    }
    if (libSrc === 'usul') return renderUsulList();
    if (libSrc === 'golden') return renderGoldenList();
    if (!libReady) return;
    const q = norm($('#bq').value),
      cat = $('#bcat').value;
    if (!q && !cat) {
      $('#bcount').textContent = `${catalog.books.length.toLocaleString()} เล่มใน Turath`;
      $('#blist').innerHTML = recentHtml() + '<div class="empty">พิมพ์ชื่อหนังสือหรือผู้แต่ง หรือเลือกหมวด<br><br>(ถ้าไม่ติ๊กเล่มใดเลย แชทจะค้นทั้งคลังแล้วคัดอ้างอิงให้เองอัตโนมัติ)</div>';
      return;
    }
    const selKeys = new Set(selected.map(keyOf));
    const toks = q.split(/\s+/).filter(Boolean);
    const list = catalog.books.filter(b => (!cat || String(b.cid) === cat) && toks.every(t => b.key.includes(t)));
    list.sort((a, b) => (selKeys.has(keyOf(b)) - selKeys.has(keyOf(a))) ||
      (norm(b.name).startsWith(q) - norm(a.name).startsWith(q)) || a.name.length - b.name.length);
    paintList(list, list.length);
  }

  async function renderUsulList() {
    const q = $('#bq').value.trim();
    if (!q) {
      $('#bcount').textContent = 'Usul · OpenITI / Shamela / Turath';
      $('#blist').innerHTML = recentHtml() + '<div class="empty">พิมพ์ชื่อหนังสือหรือผู้แต่ง (อาหรับหรืออังกฤษ)</div>';
      return;
    }
    const seq = ++usulSeq;
    $('#blist').innerHTML = '<div class="empty">กำลังค้นใน Usul…</div>';
    try {
      const { found, hits } = await usulSearchBooks(q);
      if (seq !== usulSeq) return;
      paintList(hits, found);
    } catch (e) {
      if (seq === usulSeq) $('#blist').innerHTML = `<div class="empty">ค้น Usul ไม่สำเร็จ: ${esc(e.message)}</div>`;
    }
  }

  function paintList(list, total) {
    const selMap = new Map(selected.map(b => [keyOf(b), b]));
    listIndex.clear();
    $('#bcount').textContent = `พบ ${Number(total || 0).toLocaleString()} เล่ม · ติ๊กแล้ว ${selected.length}/${MAX_BOOKS}`;
    const shown = list.slice(0, 150);
    $('#blist').innerHTML = shown.length ? shown.map(b => {
        const k = keyOf(b),
          sel = selMap.get(k),
          fav = favBooks.find(f => f.key === k);
        listIndex.set(k, b);
        const curVer = sel?.versionId || b.versionId;
        const sub = b.src === 'usul' ?
          [b.author, b.year > 1 ? `ت ${b.year}هـ` : '', `v: ${srcLabel(sel?.vsrc || b.vsrc) || '—'}`].filter(Boolean).join(' · ') :
          b.src === 'golden' ? [b.author, `#${b.id}`].filter(Boolean).join(' · ') :
          [b.author, catalog?.cats?.[b.cid], b.pc ? `${b.pc} ص` : '', `#${b.id}`].filter(Boolean).join(' · ');

  async function showBookInfo(b) {
    if (b.src === 'golden') return goldenShowInfo(b);
    const pp = bcPopup(esc(b.name), '<div class="empty">กำลังโหลดข้อมูล…</div>');
    const c = b.src === 'turath' ? catalog?.byId.get(+b.id) : null;
    const rows = [
      ['المؤلف', b.author || c?.author],
      ['التصنيف', c && catalog?.cats?.[c.cid]],
      ['الصفحات', c?.pc || b.pc],
      ['PDF', b.src === 'turath' ? (c?.hp ? 'متوفر ✓' : 'غير متوفر') : ''],
      ['المصدر', b.src === 'usul' ? `Usul · ${srcLabel(b.vsrc)}` : `Turath #${b.id}`],
      ['الوفاة', b.year > 1 ? `${b.year}هـ` : ''],
    ].filter(r => r[1]);
    const meta = `<div class="bmeta">${rows.map(([k, v]) => `<b>${k}</b><span>${esc(v)}</span>`).join('')}</div>`;
    if (b.src !== 'turath') { pp.body.innerHTML = meta; return; }
    try {
      const r = await getJSON(`${TURATH}/book?id=${enc(b.id)}&ver=3`);
      const info = [r.meta?.info, r.meta?.info_long].filter(Boolean).join('\n\n');
      pp.body.innerHTML = meta + (info ? `<div class="binfo" dir="rtl">${esc(info)}</div>` : '');
    } catch (e) {
      pp.body.innerHTML = meta + `<div class="err">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div>`;
    }
  }

      const files = info.pdf?.files || [];
      pp.body.innerHTML = files.length ? files.map(f =>
        `<a class="pdfl" href="${esc(f.url)}" target="_blank" rel="noopener" download>⤓ ${esc(f.label || (Number.isFinite(f.vol) ? `ج${f.vol}` : f.file))}</a>`).join('') :

  function srcToBook(s) {
    const m = s.metadata,

    if (m.src === 'golden') return { src: 'golden', id: +m.bookId, name: s.book.primaryName || '', author: s.book.authorName || '' };

      { src: 'usul', id: m.bookId, slug: m.slug || '', versionId: m.versionId || '', vsrc: vsrc || '', vval: vsrc === 'turath' ? (vval || '') : '', name: s.book.primaryName || '', author: s.book.authorName || '' } :
      { src: 'turath', id: +m.bookId, name: s.book.primaryName || '', author: s.book.authorName || '' };
  }

  function pinSources(list) {
    const seen = new Set();
    let added = 0;
    for (const s of list) {
      const b = srcToBook(s),
        k = keyOf(b);
      if (seen.has(k)) continue;
      seen.add(k);
      if (selected.some(x => keyOf(x) === k)) continue;
      if (selected.length >= MAX_BOOKS) break;
      if (toggleBook(b, true)) added++;
    }
    $('#status').textContent = added ?
      `ปักแล้ว ${added} เล่ม — คำถามต่อไปจะค้นเฉพาะเล่มเหล่านี้ (ลบออกทั้งหมดเพื่อกลับเป็นโหมดอัตโนมัติ)` :

  function render(raw, n, ar) {
    let h = esc(raw);
    h = h.replace(/&lt;hadith&gt;([\s\S]*?)(?:&lt;\/hadith&gt;|$)/g, (_, t) =>
      `<span class="hadith">«${t.replace(/^(?:\s|«|&quot;)+|(?:\s|»|&quot;)+$/g, '')}»</span>`);
    h = h.replace(/&lt;ayah&gt;([\s\S]*?)(?:&lt;\/ayah&gt;|$)/g, (_, t) =>
      `<span class="ayah">﴿${t.replace(/^[\s﴿]+|[\s﴾]+$/g, '')}﴾</span>`);
    h = h.replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
    h = h.replace(/\*\*/g, '');
    h = h.replace(/[ \t]((?:\[\d+(?:\s*[,،]\s*\d+)*\][ \t]*)+)([.!؟?؛])/g, (_, c, p) => `${p} ${c.replace(/\s+/g, '')}`);
    h = h.replace(/\[(\d+(?:\s*[,،]\s*\d+)*)\]/g, (_, nums) => nums.split(/[,،]/).map(x => x.trim())
      .map(x => (+x >= 1 && +x <= n) ? `<button class="cite" data-n="${x}">${ar ? toArNum(x) : x}</button>` : `[${x}]`).join(''));
    let out = '',
      list = '',
      first = true;
    const close = () => {
      if (list) {
        out += `</${list}>`;
        list = '';
      }
    };
    for (const ln of h.split('\n')) {
      if (!ln.trim()) continue;
      const ol = ln.match(/^\s*\(?([0-9٠-٩]{1,2})\s*[.)\-–]\s+(.*)/);
      if (ol) {
        if (list !== 'ol') {
          close();
          out += '<ol>';
          list = 'ol';
        }
        out += `<li>${ol[2]}</li>`;
        first = false;
        continue;
      }
      const li = ln.match(/^\s*[-•]\s+(.*)/);
      if (li) {
        if (list !== 'ul') {
          close();
          out += '<ul>';
          list = 'ul';
        }
        out += `<li>${li[1]}</li>`;
        first = false;
        continue;
      }
      close();
      const t = ln.trim();
      if (first && /^<b>[\s\S]*<\/b>:?$/.test(t)) {
        out += `<div class="atitle">${t.replace(/^<b>|<\/b>:?$/g, '')}</div>`;
      } else if (first && /^#+\s+/.test(t)) {
        out += `<div class="atitle">${t.replace(/^#+\s+/, '')}</div>`;
      } else {
        const hd = t.match(/^#{1,4}\s+(.*)/);
        if (hd) out += `<h4>${hd[1]}</h4>`;
        else out += `<p>${ln}</p>`;
      }
      first = false;
    }
    close();
    return out;
  }

  function paintQueries(c) {
    const ul = GM_getValue('bc_ui_lang', '') || localStorage.getItem('bc_ui_lang') || 'th';
    const L = LANG_I18N[ul] || LANG_I18N.th;
    const QT = QTYPE_I18N[ul] || QTYPE_TH;
    const SC = SCOPE_I18N[ul] || SCOPE_I18N.th;
    const parts = [];
    if (c.qtype) parts.push(`<span class="qt">${esc(QT[c.qtype] || c.qtype)}</span>`);
    if (c.langShown) parts.push(`<span class="ql">${L.reply}: ${esc(L[c.lang] || c.lang)}${c.langAuto ? ` (${L.auto})` : ''}</span>`);
    if (c.queries?.length) parts.push(`<b class="qlbl">${L.qBy}</b> ` + c.queries.map(q => `<span>${esc(q)}</span>`).join(''));
    if (c.failed) parts.push(`<span class="warn" title="${esc(c.err)}">⚠</span>`);
    if (c.auto) {
      const scLbl = SC[autoScope] || SC.all;
      parts.push(`<div class="auto"><span class="qt">${esc(scLbl)}</span> ${c.picks?.length
        ? `<b class="qlbl">${L.picks}</b> ` + c.picks.map(n => `<span>${esc(n)}</span>`).join('')

    'ranking': 'กำลังคัดข้อความที่สอดคล้องที่สุด…',
