        bk.biblio.forEach((b, i) => {
          out.push(`${num(i + 1)}. «${b.bookName}»${b.authorName ? ' — ' + b.authorName : ''}.`);
        });
      }
      return out.join('\n');
    }

    function triggerDownloadBlob(filename, blob) {
      const isAndroidOrWv = /Android|wv|Via/i.test(navigator.userAgent || '');
      const clickLink = href => {
        const a = document.createElement('a');
        a.href = href;
        a.download = filename;
        a.dataset.directDownload = '1';
        a.style.display = 'none';
        document.body.appendChild(a);
        if (window.__bcNativeAnchorClick) window.__bcNativeAnchorClick.call(a);
        else a.click();
        a.remove();
      };
      // บน Via Browser / Android WebView การใช้ data:...;base64,... จะทำให้ตัวจัดการดาวน์โหลดของเบราว์เซอร์บันทึกไฟล์ .pdf/.html/.doc จริงลงเครื่องได้โดยตรง
      if (isAndroidOrWv && blob.size < 25 * 1024 * 1024) {
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === 'string') clickLink(reader.result);
        };
        reader.onerror = () => {
          const url = URL.createObjectURL(blob);
          clickLink(url);
          setTimeout(() => URL.revokeObjectURL(url), 15000);
        };
        reader.readAsDataURL(blob);
        return;
      }
      const url = URL.createObjectURL(blob);
      clickLink(url);
      setTimeout(() => URL.revokeObjectURL(url), 15000);
    }

    function triggerDownloadFile(filename, content, mime) {
      const blob = new Blob([content], { type: `${mime};charset=utf-8` });
      triggerDownloadBlob(filename, blob);
    }

    let pdfLibsPromise = null;
    function loadScriptWithFallback(urls) {
      return new Promise((resolve, reject) => {
        let idx = 0;
        const tryNext = () => {
          if (idx >= urls.length) return reject(new Error('โหลดไลบรารีสร้าง PDF ไม่สำเร็จ'));
          const s = document.createElement('script');
          s.src = urls[idx++];
          s.onload = () => resolve();
          s.onerror = () => { s.remove(); tryNext(); };
          document.head.appendChild(s);
        };
        tryNext();
      });
    }

    function ensurePdfExportLibs() {
      if (window.html2canvas && (window.jspdf?.jsPDF || window.jsPDF)) {

      return pdfLibsPromise ||= (async () => {

        }
      })().catch(err => {

        throw err;
      });
    }

      sr.appendChild(progOverlay);

        sheets.forEach(s => { s.style.setProperty('display', 'none', 'important'); });

        for (let i = 0; i < sheets.length; i++) {

              const fnRect = fnBox.getBoundingClientRect();
              const lastRect = bodyBox.lastElementChild.getBoundingClientRect();
              if (fnRect.top - lastRect.bottom < 10) fnGapTooSmall = true;
            }
            if (!topOverflow && !sheetOverflow && !fnGapTooSmall) break;
            curSheetFs = Math.max(14.5, +(curSheetFs - 0.5).toFixed(2));
            curSheetLh = Math.max(1.52, +(curSheetLh - 0.03).toFixed(2));
            sheetEl.style.setProperty('--bk-fs', curSheetFs + 'px');
            sheetEl.style.fontSize = curSheetFs + 'px';
            sheetEl.style.lineHeight = String(curSheetLh);
            if (bodyBox) {
              bodyBox.style.fontSize = curSheetFs + 'px';
              bodyBox.style.lineHeight = String(curSheetLh);
            }
            if (fnBox) {
              fnBox.style.fontSize = Math.round(curSheetFs * 0.7) + 'px';
            }
          }

          const canvas = await window.html2canvas(sheetEl, {
            scale: 2,
            useCORS: true,
            allowTaint: true,
            backgroundColor: '#ffffff',
            width: 794,
            height: 1123,
            windowWidth: 794,
            windowHeight: 1123,
            scrollX: 0,
            scrollY: 0,
            logging: false,
          });

          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          if (i > 0) pdf.addPage('a4', 'portrait');
          pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');

          sheetEl.style.setProperty('display', 'none', 'important');
        }

        if (progSub) {
          progSub.textContent = isArUi ? 'جاري حفظ وتنزيل ملف PDF…' : 'กำลังบันทึกและดาวน์โหลดไฟล์ .pdf…';
        }
        const pdfBlob = pdf.output('blob');
        triggerDownloadBlob(`${safeName}.pdf`, pdfBlob);
      } catch (err) {
        console.error('PDF export error:', err);
        alert(`สร้างไฟล์ PDF โดยตรงไม่สำเร็จ (${err?.message || err})\nระบบจะเปิดหน้าพิมพ์เพื่อบันทึกเป็น PDF แทนครับ`);
        const fullHtml = buildStandaloneBookHtml(bk, false);
        const w = window.open('', '_blank');
        if (w && w.document) {
          w.document.open();
          w.document.write(fullHtml);
          w.document.close();
          setTimeout(() => { try { w.focus(); w.print(); } catch (_) {} }, 600);
        }
      } finally {
        pdfStage?.remove();
        progOverlay.remove();
        isGeneratingPdf = false;
      }
    }

    // ===== ฟังก์ชันโหมดหนังสือ مقاصد التأليف & โหมดงานวิจัยของ แผนที่ 2 =====
    const MAX_MATN_PAGES_PER_RUN = 20;

    async function loadMatnSegments(matn, range, maxChars = 900) {
      const eng = window.__bcAuthorEngine;
      if (!eng || !matn || !matn.id) return { segs: [], nextFrom: null };
      const fromP = Math.max(1, +(range?.from || matn.fromPage || 1));
      const rawTo = Math.max(fromP, +(range?.to || matn.toPage || fromP));
      const cappedTo = Math.min(rawTo, fromP + MAX_MATN_PAGES_PER_RUN - 1);
      const nextFrom = rawTo > cappedTo ? (cappedTo + 1) : null;
      const pages = [];
      for (let p = fromP; p <= cappedTo; p++) {
        const txt = await eng.getBookPage(matn, p);
        if (txt && txt.trim()) pages.push(txt.trim());
      }
      const full = pages.join(' ').replace(/\s+/g, ' ').trim();
      if (!full) return { segs: [], nextFrom };
      const sents = full.split(/(?<=[.!\u061F\u061B:»﴾])\s+/);
      const segs = [];
      let buf = '';
      for (const s of sents) {
        if ((buf.length + s.length) > maxChars && buf) {
          segs.push(buf.trim());
          buf = '';
        }
        buf += s + ' ';
      }
      if (buf.trim()) segs.push(buf.trim());
      return { segs, nextFrom, targetTo: rawTo };
    }

    const matnQueries = seg => {
      const nFn = window.__bcAuthorEngine?.norm || (s => String(s || '').trim());
      const words = nFn(seg).replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(w => w.length > 3);
      return [
        words.slice(0, 5).join(' '),
        words.slice(5, 10).join(' '),
        words.length ? `قوله ${words.slice(0, 3).join(' ')}` : '',
      ].filter(Boolean);
    };

    const getEffectiveScienceLabel = c => {
      if (c.scienceAr) return c.scienceAr;
      if (c.science && c.science !== 'auto' && BOOK_SCIENCES[c.science]) return BOOK_SCIENCES[c.science].ar;
      return c.topic || c.title || 'العلم الشرعي';
    };

      tarjama: c => `Biography of ${c.matn?.author || c.leadScholar || ('أبرز أئمة وأعلام ' + getEffectiveScienceLabel(c))} ONLY from <sources>, covering: نسبه ومولده ونشأته، رحلاته العلمية وشيوخه، مكانته العلمية ومناقبه، تلاميذه ومؤلفاته، ووفاته. Cite every fact with [n].`,

    async function runWriteSingleChapterP2(idx, fromBatch = false, continueMatn = false) {
      const ch = p2State.chapters[idx];
      if (!ch) return false;
      const eng = window.__bcAuthorEngine;
      if (!eng) return false;
      if (!eng.getScopeInfo().hasKey) {
        openSettings(true);
        return false;
      }
      if (!fromBatch) {
        p2State.running = true;
        p2State.stopRequested = false;
      }
      ch.status = 'running';
      if (!continueMatn) {
        ch.raw = '';
        ch.sources = [];
      }
      const isBook = p2State.docType === 'book';
      p2State.statusMsg = uiLang === 'th'
        ? `🔍 บทที่ ${idx + 1}/${p2State.chapters.length}: กำลังค้นคว้าและเขียน «${ch.title}»…`
        : `🔍 الباب ${idx + 1}/${p2State.chapters.length}: جاري البحث وتأليف «${ch.title}»…`;
      renderBookStudio();

      const allChaptersOutline = p2State.chapters.map(c => c.title);
      const prevDigestLines = [];
      for (let i = 0; i < idx; i++) {
        const prev = p2State.chapters[i];
        if (!prev || !(prev.raw || '').trim()) continue;
        const subHds = [...prev.raw.matchAll(/^#{1,4}\s+(.+)$/gm)].map(m => m[1].trim()).join('، ');
        const tail = prev.raw.trim().split(/\n+/).slice(-1)[0]?.slice(0, 220) || '';
        prevDigestLines.push(`- ${prev.unit || 'باب'} ${i + 1} («${prev.title}»): تناول المحاور: [${subHds || prev.prompt || ''}]. وخُتم بـ: «${tail}»`);
      }
      const prevChaptersDigest = prevDigestLines.join('\n');

      const upcomingLines = [];
      for (let j = idx + 1; j < p2State.chapters.length; j++) {
        const up = p2State.chapters[j];
        if (!up || up.include === false) continue;
        upcomingLines.push(`- ${up.unit || 'باب'} ${j + 1} («${up.title}»): سيتناول لاحقاً: [${up.prompt || up.title}]`);
      }
      const upcomingChaptersOutline = upcomingLines.join('\n');
      const nextChapterTitle = p2State.chapters[idx + 1]?.title || '';

      try {
        if (isBook) {
          p2State.styleSheet ||= await eng.buildStyleSheet({
            kind: p2State.bookKind,
            level: p2State.level,
            science: p2State.science || 'auto',
            lang: p2State.lang,
            matn: p2State.matn,
            topic: p2State.topic || p2State.bookTitle || ch.title,
            draftContext: p2State.draftContext || '',
          });
        }

        const useMatnSegs = isBook && (BOOK_KINDS[p2State.bookKind]?.needsMatn || BOOK_KINDS[p2State.bookKind]?.optionalMatn) && p2State.matn?.id && ch.matnRange;
        if (useMatnSegs) {
          const baseRange = ch.matnRange;
          const activeRange = (continueMatn && ch.matnNextFrom)
            ? { from: ch.matnNextFrom, to: baseRange.to }
            : baseRange;
          const { segs, nextFrom } = await loadMatnSegments(p2State.matn, activeRange, 900);
          ch.matnNextFrom = nextFrom;
          if (segs.length) {
            for (let sIdx = 0; sIdx < segs.length; sIdx++) {
              if (p2State.stopRequested) break;
              const seg = segs[sIdx];
              const isLastMatnSeg = (sIdx === segs.length - 1);
              const extraRules = eng.BOOK_BAB_RULES({
                kind: p2State.bookKind,
                level: p2State.level,
                science: p2State.science || 'auto',
                styleSheet: p2State.styleSheet,
                matnText: seg,
                incQuestions: !!p2State.incQuestions && isLastMatnSeg,
                incFootnotes: p2State.incFootnotes !== false,
                draftContext: p2State.draftContext || '',
                chapterPurpose: ch.purpose || '',
                chapterScopeNote: ch.scope_note || '',
              });
              const r = await eng.writeChapter({
                bookTitle: p2State.bookTitle || p2State.topic || p2State.matn.name || 'كتاب',
                chapterIndex: idx,
                totalChapters: p2State.chapters.length,
                chapterTitle: `${ch.title} (المقطع ${sIdx + 1}/${segs.length})`,
                chapterPrompt: `${ch.prompt || ch.title}\nالنص المشروح: (${seg})`,
                allChaptersOutline,
                prevChaptersDigest,
                upcomingChaptersOutline,
                nextChapterTitle,
                len: segs.length > 2 ? 'medium' : (p2State.len || 'adaptive'),
                langSetting: p2State.lang || 'auto',
                seedQueries: matnQueries(seg),
                extraRules,
                incQuestions: !!p2State.incQuestions && isLastMatnSeg,
                incFootnotes: p2State.incFootnotes !== false,
                kind: p2State.bookKind,
                science: p2State.science || 'auto',
                level: p2State.level,
                targetWeight: ch.target_weight || '',
                autoSelfReview: p2State.autoSelfReview !== false && isLastMatnSeg,
                onStatus: (_code, msg) => {
                  p2State.statusMsg = `📜 ${ch.title} (ท่อน متن ${sIdx + 1}/${segs.length}) · ${msg}`;
                  const stEl = studio.querySelector('#p2-live-status');
                  if (stEl) stEl.textContent = p2State.statusMsg;
                },
                onDelta: (_delta, segRaw) => {
                  const liveBox = studio.querySelector(`#p2-live-stream-${idx}`);
                  if (liveBox) liveBox.textContent = segRaw.slice(-320);
                },
              });
              const offset = (ch.sources || []).length;
              const shiftedRaw = String(r.raw || '').trim().replace(/\[(\d+)\]/g, (_, n) => `[${+n + offset}]`);
              if (shiftedRaw) {
                ch.raw = (ch.raw ? ch.raw.trim() + '\n\n' : '') + shiftedRaw;
                ch.sources.push(...(r.sources || []));
                ch.lang = r.lang || ch.lang || 'ar';
              }
              if (r.reviewReport) {
                ch.reviewSummary = r.reviewReport.summary || '';
                ch.reviewScore = r.reviewReport.score || 0;
              }
            }
            ch.status = (ch.raw || '').trim() ? 'done' : 'error';
            ch.issues = validateBookChapter(ch);
            saveP2State();
            return ch.status === 'done';
          }
        }

        const extraRules = isBook
          ? eng.BOOK_BAB_RULES({
              kind: p2State.bookKind,
              level: p2State.level,
              science: p2State.science || 'auto',
              styleSheet: p2State.styleSheet,
              matnText: '',
              incQuestions: !!p2State.incQuestions,
              incFootnotes: p2State.incFootnotes !== false,
              draftContext: p2State.draftContext || '',
              chapterPurpose: ch.purpose || '',
              chapterScopeNote: ch.scope_note || '',
            })
          : '';

        const res = await eng.writeChapter({
          bookTitle: p2State.bookTitle || p2State.topic || 'كتاب',
          chapterIndex: idx,
          totalChapters: p2State.chapters.length,
          chapterTitle: ch.title,
          chapterPrompt: ch.prompt,
          allChaptersOutline,
          prevChaptersDigest,
          upcomingChaptersOutline,
          nextChapterTitle,
          len: p2State.len || 'adaptive',
          langSetting: p2State.lang || 'auto',
          seedQueries: ch.search_terms || [],
          extraRules,
          incQuestions: !!p2State.incQuestions,
          incFootnotes: p2State.incFootnotes !== false,
          kind: p2State.bookKind || 'talif',
          science: p2State.science || 'auto',
          level: p2State.level || 'mutawassit',
          targetWeight: ch.target_weight || '',
          autoSelfReview: p2State.autoSelfReview !== false,
          onStatus: (_code, msg) => {
            p2State.statusMsg = `${uiLang === 'th' ? `บทที่ ${idx + 1}/${p2State.chapters.length}` : `الباب ${idx + 1}/${p2State.chapters.length}`} · ${msg}`;
            const stEl = studio.querySelector('#p2-live-status');
            if (stEl) stEl.textContent = p2State.statusMsg;
          },
          onDelta: (_delta, fullRaw) => {
            ch.raw = fullRaw;
            const liveBox = studio.querySelector(`#p2-live-stream-${idx}`);
            if (liveBox) liveBox.textContent = fullRaw.slice(-320);
          },
        });
        const finalRaw = (res.raw || '').trim();
        if (finalRaw.length < 20) {
          throw new Error(uiLang === 'th' ? 'ระบบยังไม่ได้รับเนื้อหาสำหรับบทนี้ กรุณากดเขียนบทนี้อีกครั้ง' : 'لم يرجع النموذج نصاً مكتملًا لهذا الفصل — يرجى الضغط على إعادة التأليف');
        }
        ch.raw = finalRaw;
        ch.sources = res.sources || [];
        ch.lang = res.lang || 'ar';
        ch.status = 'done';
        if (res.reviewReport) {
          ch.reviewSummary = res.reviewReport.summary || '';
          ch.reviewScore = res.reviewReport.score || 0;
        }
        ch.issues = validateBookChapter(ch);
        saveP2State();
        return true;
      } catch (e) {
        ch.status = 'error';
        ch.err = e.message || String(e);
        saveP2State();
        if (!fromBatch) alert(`เขียนบทที่ ${idx + 1} ไม่สำเร็จ: ${ch.err}`);
        return false;
      } finally {
        if (!fromBatch) {
          p2State.running = false;
          p2State.statusMsg = '';
          renderBookStudio();
        }
      }
    }

    async function generateFrontAndBackPartsP2(fromPipeline = false) {
      const S = p2State, eng = window.__bcAuthorEngine;
      if (!eng) return;
      if (!eng.getScopeInfo().hasKey) {
        openSettings(true);
        return;
      }
      if (!fromPipeline) {
        S.running = true;
        S.stopRequested = false;
        renderBookStudio();
      }
      try {
        const ctx = {
          title: S.bookTitle || S.topic || S.matn?.name || 'كتاب علمي مؤصل',
          topic: S.topic || S.bookTitle || '',
          science: S.science || 'auto',
          scienceAr: S.scienceAr || S.styleSheet?.science_ar || '',
          leadScholar: S.styleSheet?.scholar_names?.[0]?.full || '',
          kind: S.bookKind || 'talif',
          level: S.level || 'mutawassit',
          matn: S.matn,
          sabab: S.sabab || S.topic || '',
          unitTitles: S.chapters.filter(c => c.include !== false).map(c => c.title),
          sourceBooks: [...new Set(S.chapters.flatMap(c => (c.sources || []).map(s => s.book?.primaryName)).filter(Boolean))],
        };
        const commonCtx = () => ({
          bookTitle: ctx.title,
          chapterIndex: 0,
          totalChapters: 1,
          allChaptersOutline: ctx.unitTitles,
          len: 'medium',
          langSetting: S.lang || 'auto',
          extraRules: eng.BOOK_BAB_RULES({ kind: S.bookKind, level: S.level, science: S.science || 'auto', styleSheet: S.styleSheet, incQuestions: false, incFootnotes: S.incFootnotes !== false }),
          incQuestions: false,
          incFootnotes: S.incFootnotes !== false,
        });

        for (const k of Object.keys(FRONT_PARTS)) {
          if (S.stopRequested) break;
          if (!S.front?.[k]) continue;
          S.statusMsg = uiLang === 'th'
            ? `📜 กำลังเขียนส่วนหน้าเล่ม: «${FRONT_PARTS[k].ar}»…`
            : `📜 جاري كتابة المقدمات: «${FRONT_PARTS[k].ar}»…`;
          const stEl = studio.querySelector('#p2-live-status');
          if (stEl) stEl.textContent = S.statusMsg;
          renderBookStudio();

          if (FRONT_SEEDS[k]) {
            const r = await eng.writeChapter({
              ...commonCtx(),
              chapterTitle: FRONT_PARTS[k].ar,
              chapterPrompt: FRONT_PROMPTS[k](ctx),
              seedQueries: FRONT_SEEDS[k](ctx),
            });
            S.frontRaw[k] = r.raw || '';
            S.frontSources[k] = r.sources || [];
          } else {
            S.frontRaw[k] = await eng.streamPlain(FRONT_PROMPTS[k](ctx));
            S.frontSources[k] = [];
          }
          saveP2State();
        }

        if (!S.stopRequested && S.back?.khatima) {
          S.statusMsg = uiLang === 'th' ? '📜 กำลังเขียนบทส่งท้าย (خاتمة الكتاب)…' : '📜 جاري كتابة خاتمة الكتاب…';
          const stEl = studio.querySelector('#p2-live-status');
          if (stEl) stEl.textContent = S.statusMsg;
          renderBookStudio();
          S.backRaw.khatima = await eng.streamPlain(BACK_PROMPTS.khatima(ctx));
          saveP2State();
        }
      } finally {
        if (!fromPipeline) {
          S.running = false;
          S.statusMsg = '';
          saveP2State();
          renderBookStudio();
        }
      }
    }

    async function runBookPipeline(forceAll = false) {
      const S = p2State, eng = window.__bcAuthorEngine;
      if (S.running || !S.chapters.length) return;
      if (!eng?.getScopeInfo().hasKey) {
        openSettings(true);
        return;
      }
      S.running = true;
      S.stopRequested = false;
      renderBookStudio();

      try {
        // 1) Style Sheet (สร้างครั้งเดียว แล้วแนบไปทุกบท)
        if (!S.styleSheet) {
          S.statusMsg = uiLang === 'th' ? '🎨 กำลังสร้าง Style Sheet ประจำเล่ม…' : '🎨 جاري إعداد دليل الأسلوب الموحد للكتاب (Style Sheet)…';
          renderBookStudio();
          S.styleSheet = await eng.buildStyleSheet({
            kind: S.bookKind,
            level: S.level,
            science: S.science || 'auto',
            lang: S.lang,
            matn: S.matn,
            topic: S.topic || S.bookTitle,
          });
          saveP2State();
          renderBookStudio();
        }

        // 2) เนื้อหาหลัก (เขียนก่อน เพื่อให้ منهج/خاتمة อิงของจริง)
        for (let i = 0; i < S.chapters.length; i++) {
          if (S.stopRequested) break;
          const ch = S.chapters[i];
          if (!ch || ch.include === false) continue;
          if (!forceAll && ch.status === 'done' && (ch.raw || '').trim() && !ch.matnNextFrom) continue;
          await runWriteSingleChapterP2(i, true, !!ch.matnNextFrom);
          saveP2State();
          renderBookStudio();
        }

        // 3) ส่วนหน้า / ส่วนท้ายเล่ม
        if (!S.stopRequested) {
          await generateFrontAndBackPartsP2(true);
        }

        // 4) ตรวจคุณภาพ → compile
        S.chapters.forEach(c => { c.issues = validateBookChapter(c); });
        saveP2State();
      } catch (e) {
        alert(`เกิดข้อผิดพลาดใน Pipeline: ${e.message || e}`);
      } finally {
        S.running = false;
        S.stopRequested = false;
        S.statusMsg = '';
        saveP2State();
        renderBookStudio();
      }
    }

    async function runWriteAllChaptersP2(forceAll = false) {
      if (p2State.docType === 'book') {
        return runBookPipeline(forceAll);
      }
      if (p2State.running || !p2State.chapters.length) return;
      const eng = window.__bcAuthorEngine;
      if (!eng?.getScopeInfo().hasKey) {
        openSettings(true);
        return;
      }
      p2State.running = true;
      p2State.stopRequested = false;
      renderBookStudio();

      for (let i = 0; i < p2State.chapters.length; i++) {
        if (p2State.stopRequested) break;
        const ch = p2State.chapters[i];
        if (!ch || ch.include === false) continue;
        if (!forceAll && ch.status === 'done' && (ch.raw || '').trim()) continue;
        await runWriteSingleChapterP2(i, true);
        renderBookStudio();
      }

      p2State.running = false;
      p2State.stopRequested = false;
      p2State.statusMsg = '';
      saveP2State();
      renderBookStudio();
    }

                            ${ch.q ? `<span>💬 <b>${isArUi ? 'السؤال:' : 'คำถาม:'}</b> ${escH(ch.q.slice(0, 75))}${ch.q.length > 75 ? '…' : ''}</span>` : ''}

                    : 'พื้นที่สำหรับ แผนที่ 3 (เรียงตัวบท المتن คู่คำอธิบาย الشرح จากภาพถ่ายหน้ากีตาบ) — พร้อมเริ่มพัฒนาต่อในลำดับถัดไปครับ'}

            <!-- คลังหนังสือที่แต่งและบันทึกไว้ในแอป (แสดงทั้งในแผนที่ 1 และ 2) -->
            ${savedBooks.length ? `
              <div class="bs-card">
                <div class="bs-card-hd">
                  <h3>📚 ${isArUi ? `مكتبة المؤلفات المحفوظة (${savedBooks.length})` : `หนังสือที่คุณสร้างและบันทึกไว้ (${savedBooks.length})`}</h3>

      // ผูก Event สลับแผน 1 / 2 / 3 และปุ่มซ่อน/แสดง خيارات ใน تأليف
      studio.querySelector('#bs-opt-toggle')?.addEventListener('click', () => {
        p2State.showStudioOpts = !p2State.showStudioOpts;
        renderBookStudio();
      });

          renderBookStudio();
        };

      // ผูก Event คลังหนังสือที่บันทึกไว้
      studio.querySelectorAll('[data-sb-open]').forEach(b => {
        b.onclick = () => {
          const sb = getSavedCompiledBooks()[+b.dataset.sbOpen];
          if (sb) openBookPreviewModal(sb);
        };
      });
      studio.querySelectorAll('[data-sb-pdf]').forEach(b => {
        b.onclick = () => {
          const sb = getSavedCompiledBooks()[+b.dataset.sbPdf];
          if (sb) downloadCompiledBookPdf(sb);
        };
      });
      studio.querySelectorAll('[data-sb-html]').forEach(b => {
        b.onclick = () => {
          const sb = getSavedCompiledBooks()[+b.dataset.sbHtml];
          if (!sb) return;
          const safeName = String(sb.title || 'kitab').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 45);
          triggerDownloadFile(`${safeName}.html`, buildStandaloneBookHtml(sb, false), 'text/html');
        };
      });
      studio.querySelectorAll('[data-sb-del]').forEach(b => {
        b.onclick = () => {
          const idx = +b.dataset.sbDel;
          const list = getSavedCompiledBooks();
          if (!list[idx] || !confirm(`ลบหนังสือ «${list[idx].title}» ที่บันทึกไว้?`)) return;
          list.splice(idx, 1);
          saveCompiledBooks(list);
          renderBookStudio();
        };
      });

      // ผูก Event ของ แผนที่ 2 (ทั้งโหมดสร้างหนังสือ docType === 'book' และโหมดงานวิจัย)
      if (activePlan === 2) {
        studio.querySelectorAll('[data-p2-doctype]').forEach(b => {
          b.onclick = () => {
            p2State.docType = b.dataset.p2Doctype;
            saveP2State();
            renderBookStudio();
          };
        });
        studio.querySelector('#p2-sel-science')?.addEventListener('change', e => {
          p2State.science = e.target.value;
          p2State.scienceAr = '';
          p2State.styleSheet = null;
          saveP2State();
          renderBookStudio();
        });
        studio.querySelector('#p2-sel-bookkind')?.addEventListener('change', e => {
          p2State.bookKind = e.target.value;
          saveP2State();
          renderBookStudio();
        });
        studio.querySelector('#p2-sel-level')?.addEventListener('change', e => {
          p2State.level = e.target.value;
          saveP2State();

        studio.querySelector('#p2-sel-volumes')?.addEventListener('change', e => {
          p2State.volumes = +e.target.value || 1;
          saveP2State();
        });
        studio.querySelectorAll('[data-p2-front]').forEach(cb => {
          cb.addEventListener('change', () => {
            p2State.front[cb.dataset.p2Front] = cb.checked;
            saveP2State();
          });
        });
        studio.querySelectorAll('[data-p2-back]').forEach(cb => {
          cb.addEventListener('change', () => {
            p2State.back[cb.dataset.p2Back] = cb.checked;
            saveP2State();
          });
        });
        studio.querySelector('#p2-chk-fn')?.addEventListener('change', e => {
          p2State.incFootnotes = e.target.checked;
          bsState.incFootnotes = e.target.checked;
          saveP2State();
        });
        studio.querySelector('#p2-chk-questions')?.addEventListener('change', e => {
          p2State.incQuestions = e.target.checked;
          bsState.incQuestions = e.target.checked;
          saveP2State();
        });

        // เลือก المتن จากปุ่มลัดหรือค้นหา
        const scopeBooks = window.__bcAuthorEngine?.getScopeInfo()?.selectedBooks || [];
        studio.querySelectorAll('[data-matn-pick-sel]').forEach(btn => {
          btn.onclick = () => {
            const b = scopeBooks[+btn.dataset.matnPickSel];
            if (!b) return;
            p2State.matn = {
              ...b,
              fromPage: +(p2State.matn?.fromPage || 1),
              toPage: +(p2State.matn?.toPage || 20),
            };
            if (!p2State.topic) p2State.topic = b.name;
            saveP2State();
            renderBookStudio();
          };
        });
        studio.querySelectorAll('[data-matn-preset]').forEach(btn => {
          btn.onclick = () => {
            const mp = MATN_PRESETS[+btn.dataset.matnPreset];
            if (!mp) return;
            p2State.matn = { ...mp };
            if (!p2State.topic) p2State.topic = mp.name;
            saveP2State();
            renderBookStudio();
          };
        });
        studio.querySelector('#p2-clear-matn-btn')?.addEventListener('click', () => {
          p2State.matn = null;
          saveP2State();
          renderBookStudio();
        });
        studio.querySelector('#p2-matn-src')?.addEventListener('change', e => {
          p2State.matnSearchSrc = e.target.value;
        });
        studio.querySelector('#p2-matn-q')?.addEventListener('input', e => {
          p2State.matnSearchQuery = e.target.value;
        });
        const runMatnSearch = async () => {
          const q = (studio.querySelector('#p2-matn-q')?.value || '').trim();
          const src = studio.querySelector('#p2-matn-src')?.value || 'turath';
          p2State.matnSearchQuery = q;
          p2State.matnSearchSrc = src;
          try {
            const hits = await window.__bcAuthorEngine?.searchBooksForMatn(q, src);
            p2State.matnSearchHits = hits || [];
            renderBookStudio();
          } catch (err) {
            alert(`ค้นหา متن ไม่สำเร็จ: ${err.message || err}`);
          }
        };
        studio.querySelector('#p2-matn-search-btn')?.addEventListener('click', runMatnSearch);
        studio.querySelector('#p2-matn-q')?.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); runMatnSearch(); }
        });
        studio.querySelectorAll('[data-matn-hit]').forEach(btn => {
          btn.onclick = () => {
            const h = (p2State.matnSearchHits || [])[+btn.dataset.matnHit];
            if (!h) return;
            p2State.matn = {
              ...h,
              fromPage: +(p2State.matn?.fromPage || 1),
              toPage: +(p2State.matn?.toPage || 20),
            };
            p2State.matnSearchHits = [];
            if (!p2State.topic) p2State.topic = h.name;
            saveP2State();
            renderBookStudio();
          };
        });
        studio.querySelector('#p2-matn-from')?.addEventListener('input', e => {
          const v = Math.max(1, +e.target.value.replace(/\D/g, '') || 1);
          p2State.matn = { ...(p2State.matn || { src: 'turath', id: 963, name: 'فتح المعين' }), fromPage: v };
          saveP2State();
        });
        studio.querySelector('#p2-matn-to')?.addEventListener('input', e => {
          const v = Math.max(1, +e.target.value.replace(/\D/g, '') || 20);
          p2State.matn = { ...(p2State.matn || { src: 'turath', id: 963, name: 'فتح المعين' }), toPage: v };
          saveP2State();
        });

        // Style Sheet viewer / editor
        const syncStyleSheetFromInputs = () => {
          const voice = studio.querySelector('#p2-ss-voice')?.value || '';
          const honorifics = studio.querySelector('#p2-ss-hon')?.value || '';
          const namesRaw = studio.querySelector('#p2-ss-names')?.value || '';
          const termsRaw = studio.querySelector('#p2-ss-terms')?.value || '';
          const markersRaw = studio.querySelector('#p2-ss-markers')?.value || '';
          const scholar_names = namesRaw.split('\n').map(l => {
            const [full, short] = l.split(/[=→]/).map(s => (s || '').trim());
            return full ? { full, short: short || full } : null;
          }).filter(Boolean);
          const terms = termsRaw.split('\n').map(l => {
            const [term, usage] = l.split('=').map(s => (s || '').trim());
            return term ? { term, usage: usage || '' } : null;
          }).filter(Boolean);
          const markers = markersRaw.split(/[،,]/).map(s => s.trim()).filter(Boolean);
          p2State.styleSheet = { voice, honorifics, scholar_names, terms, markers };
          saveP2State();
        };
        studio.querySelector('#p2-toggle-ss-btn')?.addEventListener('click', () => {
          p2State.showStyleSheet = !p2State.showStyleSheet;
          if (p2State.showStyleSheet && !p2State.styleSheet) {
            p2State.styleSheet = {
              voice: 'بأسلوب المتون والشروح الشافعية المتأخرة، بضمير الغائب',
              honorifics: 'ﷺ، رضي الله عنه، رحمه الله تعالى',
              scholar_names: [
                { full: 'الإمام النووي', short: 'النووي' },
                { full: 'ابن حجر الهيتمي صاحب التحفة', short: 'ابن حجر' },
                { full: 'شمس الدين الرملي صاحب النهاية', short: 'الرملي' },
              ],
              terms: [
                { term: 'المعتمد', usage: 'القول المرجح للفتوى عند المتأخرين' },
                { term: 'الأظهر', usage: 'الراجح من قولي الشافعي لقوة الخلاف' },
                { term: 'الأصح', usage: 'الراجح من أوجه الأصحاب لقوة الخلاف' },
              ],
              markers: ['فرع', 'تنبيه', 'فائدة', 'تتمة', 'تكملة'],
            };
          }
          renderBookStudio();
        });
        studio.querySelector('#p2-close-ss-btn')?.addEventListener('click', () => {
          syncStyleSheetFromInputs();
          p2State.showStyleSheet = false;
          renderBookStudio();
        });
        ['#p2-ss-voice', '#p2-ss-hon', '#p2-ss-names', '#p2-ss-terms', '#p2-ss-markers'].forEach(sel => {
          studio.querySelector(sel)?.addEventListener('input', syncStyleSheetFromInputs);
        });
        studio.querySelector('#p2-gen-ss-btn')?.addEventListener('click', async () => {
          const eng = window.__bcAuthorEngine;
          if (!eng?.getScopeInfo().hasKey) return openSettings(true);
          const btn = studio.querySelector('#p2-gen-ss-btn');
          if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังสร้าง Style Sheet…'; }
          try {
            p2State.styleSheet = await eng.buildStyleSheet({
              kind: p2State.bookKind,
              level: p2State.level,
              science: p2State.science || 'auto',
              lang: p2State.lang,
              matn: p2State.matn,
              topic: p2State.topic || p2State.bookTitle || 'موضوع علمي',

            }

          else if (act === 'raw') {

        p2List?.addEventListener('change', e => {
          const item = e.target.closest('[data-p2-idx]');

              p2State.statusMsg = `🔍 ${isArUi ? 'جاري المراجعة الذاتية وتدقيق الفصل:' : 'กำลังตรวจสอบและขัดเกลาบท:'} «${ch.title}»…`;

                p2State.running = false;
                p2State.statusMsg = '';

            })();
          } else if (act === 'write') {
            runWriteSingleChapterP2(idx, false, false);

            runWriteSingleChapterP2(idx, false, true);
          } else if (act === 'edit') {

          } else if (act === 'up' && idx > 0) {
            const tmp = p2State.chapters[idx - 1];

            p2State.chapters[idx] = tmp;
            saveP2State();
            renderBookStudio();

            p2State.chapters.splice(idx, 1);
            saveP2State();
            renderBookStudio();

    function syncStudioHeader() {
      const isStudio = !studio.hidden;
      const hd = $('.hd');
      const nameEl = $('#hd-appname');
      const subEl = $('#hd-appsub');
      const lblEl = $('#authorbtn-lbl');
      const icEl = authorBtn.querySelector('.ab-ic');
      const t = T();
      hd?.classList.toggle('studio-on', isStudio);
      authorBtn.classList.toggle('on', isStudio);
      if (isStudio) {
        if (nameEl) nameEl.textContent = 'تأليف الكتاب';
        if (subEl) subEl.textContent = uiLang === 'th' ? 'สตูดิโอสร้างหนังสือ · แผนที่ 1, 2, 3' : 'من المحادثة · بناء الفهرس · شرح المتن';
        if (icEl) icEl.textContent = '🔄';
        if (lblEl) lblEl.textContent = uiLang === 'th' ? 'ค้นหาปกติ' : 'البحث العادي';
      } else {
        if (nameEl) nameEl.textContent = t.appName;
        if (subEl) subEl.textContent = t.appSub;
        if (icEl) icEl.textContent = '✍️';
        if (lblEl) lblEl.textContent = 'تأليف الكتاب';
      }
    }
    window.__bcSyncStudioHeader = syncStudioHeader;
    window.__bcOnAiToolsChange = () => {
      const info = window.__bcAuthorEngine?.getScopeInfo?.() || {};
      studio.querySelectorAll('input[data-ai-toggle="tavily"]').forEach(cb => { cb.checked = !!info.useTavily; });
      studio.querySelectorAll('input[data-ai-toggle="think"]').forEach(cb => { cb.checked = info.thinkEnabled !== false; });
      studio.querySelectorAll('[data-think]').forEach(b => {
        const en = info.thinkEnabled !== false;
        b.classList.toggle('on', en && b.dataset.think === info.thinkMode);
        b.disabled = !en;
        b.style.opacity = en ? '1' : '.45';
      });
    };

    function triggerFlipAnim(targetEl) {
      authorBtn.classList.remove('spinning');
      void authorBtn.offsetWidth;
      authorBtn.classList.add('spinning');
      setTimeout(() => authorBtn.classList.remove('spinning'), 480);

      if (targetEl) {
        targetEl.classList.remove('bc-flip-anim');
        void targetEl.offsetWidth;
        targetEl.classList.add('bc-flip-anim');
      }
    }

    function openBookStudio() {
      $('#chat').hidden = true;
      $('#lib').hidden = true;
      $('#hist').hidden = true;
      studio.hidden = false;
      syncStudioHeader();
      triggerFlipAnim(studio);
      loadChaptersFromSelection(bsState.chatSourceId, false);
      renderBookStudio();
    }

    function closeBookStudio(restoreTab = true) {
      if (studio.hidden) return false;
      studio.hidden = true;
      syncStudioHeader();
      if (restoreTab) {
        const curTab = sr.querySelector('.hd .tab.on')?.dataset.tab || 'chat';
        sr.querySelector(`.hd .tab[data-tab="${curTab}"]`)?.click();
        const activeView = $(`#${curTab}`) || $('#chat');
        triggerFlipAnim(activeView);
      }
      return true;
    }

    authorBtn.onclick = () => {
      if (studio.hidden) openBookStudio();
      else closeBookStudio(true);
    };

    window.__bcCloseBookStudio = closeBookStudio;
    window.__bcCloseBookPreview = () => {
      if (!previewModal.hidden) {
        previewModal.hidden = true;
        return true;
      }
      return false;
    };
  })();

  // ---------- ปุ่ม Back ของ Android (ผ่าน history) ----------
  const back = () => {
    if (window.__bcDlgClose?.()) return true;
    if (window.__bcCloseBookPreview?.()) return true;
    if (!sheet.hidden) { closeSheet(); return true; }
    if (window.__bcCloseBookStudio?.(true)) return true;
    const pop = sr.querySelector('.reflist-popup');
    if (pop) { pop.remove(); sr.querySelector('.reflist-overlay')?.remove(); return true; }
    if (!$('#reader').hidden) {
      if (!$('#rside').hidden && innerWidth < 900) { $('#rsclose').click(); return true; }
      $('#rclose').click(); return true;
    }
    if (!$('#options-panel').hidden) { $('#opt-toggle').click(); return true; }
    if ($('#chat').hidden) { sr.querySelector('.tab[data-tab="chat"]').click(); return true; }
    return false;
  };
  window.__bcBack = back;
  try { history.pushState({ bc: 1 }, ''); } catch (_) {}
  addEventListener('popstate', () => {
    if (back()) { try { history.pushState({ bc: 1 }, ''); } catch (_) {} }
    else history.back();
  });
})();
</script>
</body>
</html>
