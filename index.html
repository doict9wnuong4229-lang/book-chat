    function extractCurrentDomTurns() {
      const turns = [];
      let lastQ = '';
      let lastImgTxt = '';
      for (const node of sr.querySelectorAll('#msgs > .u, #msgs > .a')) {
        if (node.classList.contains('u')) {
          const clone = node.cloneNode(true);
          clone.querySelector('.uimg')?.remove();
          lastQ = (clone.textContent || '').trim();
          lastImgTxt = '';
        } else if (node.classList.contains('a')) {
          const c = node._c || {};
          const raw = (c.raw || '').trim();
          if (!raw) continue;
          turns.push({
            q: lastQ,
            raw,
            sources: Array.isArray(c.sources) ? c.sources : [],
            lang: c.lang || (node.classList.contains('th') ? 'th' : node.classList.contains('jw') ? 'jawi' : 'ar'),
            imageText: c.imageText || lastImgTxt || '',
          });
        }
      }
      return turns;
    }

    function extractTurnsFromSavedChat(chatObj) {
      const turns = [];
      let lastQ = '';
      let lastImgTxt = '';
      for (const m of (chatObj?.msgs || [])) {
        if (m.role === 'user') {
          lastQ = (m.content || '').trim();
          lastImgTxt = m.imageText || '';
        } else if (m.role === 'assistant') {
          const raw = (m.content || '').trim();
          if (!raw) continue;
          turns.push({
            q: lastQ,
            raw,
            sources: Array.isArray(m.sources) ? m.sources : [],
            lang: m.lang || (m.ar === false ? 'th' : 'ar'),
            imageText: m.imageText || lastImgTxt || '',
          });
        }
      }
      return turns;
    }

    function guessChapterTitle(raw, q, idx) {
      const lines = String(raw || '').split('\n').map(l => l.trim()).filter(Boolean);
      if (lines.length) {
        const first = lines[0];
        if (/^\*\*[^*]+\*\*:?$/.test(first)) {
          return first.replace(/^\*\*|\*\*:?$/g, '').trim();
        }
        if (/^#{1,4}\s+/.test(first)) {
          return first.replace(/^#{1,4}\s+/, '').replace(/\*\*/g, '').trim();
        }
      }
      if (q && q.length <= 90) return q;
      return `المبحث ${idx + 1}`;
    }

    function stripLeadingTitleLine(raw, chTitle) {
      const lines = String(raw || '').split('\n');
      for (let i = 0; i < lines.length; i++) {
        const t = lines[i].trim();
        if (!t) continue;
        const cleanFirst = t.replace(/^\*\*|\*\*:?$/g, '').replace(/^#{1,4}\s+/, '').trim();
        if ((/^\*\*[^*]+\*\*:?$/.test(t) || /^#{1,4}\s+/.test(t)) && (cleanFirst === chTitle || i === 0)) {
          lines.splice(i, 1);
        }
        break;
      }
      return lines.join('\n').trim();
    }

    function loadChaptersFromSelection(sourceId, forceReset = false) {
      const sameSource = !forceReset && bsState.chatSourceId === sourceId && bsState.chapters.length > 0;
      const prevChapters = sameSource ? bsState.chapters.slice() : [];
      bsState.chatSourceId = sourceId;
      const savedChats = GM_getValue('chats', []) || [];
      let turns = [];
      let defaultTitle = '';

      if (sourceId === '__current__') {
        turns = extractCurrentDomTurns();
        if (!turns.length && savedChats.length) {
          turns = extractTurnsFromSavedChat(savedChats[0]);
          defaultTitle = savedChats[0]?.title || '';
        }
      } else {
        const found = savedChats.find(c => c.id === sourceId);
        if (found) {
          turns = extractTurnsFromSavedChat(found);
          defaultTitle = found.title || '';
        }
      }

      bsState.chapters = turns.map((t, i) => {
        const prev = prevChapters[i];
        if (prev && prev.q === (t.q || '') && prev.origRaw === (t.raw || '')) {
          return { ...prev, sources: t.sources || prev.sources || [] };
        }
        const title = guessChapterTitle(t.raw, t.q, i);
        const isShortFollowup = i > 0 && t.q && t.q.length < 40 && FOLLOWUP_RX.test(t.q.trim());
        return {
          id: 'ch_' + i + '_' + Date.now(),
          include: true,
          mergePrev: isShortFollowup,
          title,
          q: t.q || '',
          raw: t.raw || '',
          origRaw: t.raw || '',
          sources: t.sources || [],
          lang: t.lang || 'ar',
          imageText: t.imageText || '',
          editing: false,
        };
      });

      if (!sameSource || !bsState.bookTitle) {
        const firstTitle = bsState.chapters.find(c => c.include)?.title || defaultTitle || 'كتاب المباحث العلمية';
        bsState.bookTitle = firstTitle;
      }
    }

    function renderBookChapterBody(rawText, resolveFnNo, useArNums, opts = {}) {
      const wantQuestions = opts.incQuestions !== undefined ? !!opts.incQuestions : (activePlan === 2 ? !!p2State.incQuestions : !!bsState.incQuestions);
      const wantFootnotes = opts.incFootnotes !== undefined ? !!opts.incFootnotes : (activePlan === 2 ? (p2State.incFootnotes !== false) : (bsState.incFootnotes !== false));

      // 1. ล้างตัวอักษร CJK แปลกปลอมที่อาจหลุดมาจาก tokenizer
      let cleaned = String(rawText || '').replace(/[\u4E00-\u9FFF\u3400-\u4DBF]+/g, '');

      // 1.1 หากไม่ได้ติ๊กเลือก أسئلة للمراجعة ให้ตัดส่วนคำถามทบทวนท้ายบทออกทันที (ไม่แสดงในหน้ากระดาษและสารบัญ)
      if (!wantQuestions) {
        cleaned = cleaned.replace(/(?:^|\n)\s*(?:#{1,4}\s*|\*\*)?أسئلة\s+للمراجعة(?:\*\*)?\s*:?[\s\S]*$/m, '').trim();
      } else {
        // 1.2 ลบเลขอ้างอิง [n] ออกจากช่วงคำถามทบทวนท้ายบท (أسئلة للمراجعة) เพราะคำถามทบทวนไม่ต้องมีเชิงอรรถซ้ำซ้อน
        cleaned = cleaned.replace(/((?:^|\n)\s*(?:#{1,4}\s*|\*\*)?أسئلة\s+للمراجعة[\s\S]*)$/m, m => m.replace(/\s*\[\d+(?:\s*[,،]\s*\d+)*\]/g, ''));
      }

      // 1.5 ป้องกันเลขอ้างอิง [n] หลุดไปอยู่บรรทัดใหม่เดี่ยวๆ (แก้ปัญหา <p>(١)</p> ท้ายหน้า)
      cleaned = cleaned.replace(/([.؟!؛:،])\s*\n+\s*((?:\[\d+(?:\s*[,،]\s*\d+)*\]\s*)+)/g, '$1 $2');
      cleaned = cleaned.replace(/([^\n])\n+((?:\[\d+(?:\s*[,،]\s*\d+)*\]\s*)+)(?=\n|$)/g, '$1 $2');

      // 2. จัดบรรทัดและย่อหน้าอัตโนมัติแบบหนังสือฟิกฮ์มาตรฐาน (Smart Classical Book Typesetter):
      // 2.1 แยกหัวข้อย่อย ### ที่ติดอยู่ท้ายประโยคหรือหลังเลขอ้างอิง ให้ขึ้นบรรทัดใหม่เสมอ
      cleaned = cleaned.replace(/([^\n])\s*(#{1,4}\s+)/g, '$1\n\n$2');

      // 2.2 แยกรายการตัวเลข 1. 2. 3. (เฉพาะจุดหรือขีด 1. / 1- เท่านั้น ห้ามจับวงเล็บปิดของเลขอายะฮ์ เช่น (التوبة: 60))
      cleaned = cleaned.replace(/([:：.؛!؟]\s*(?:\[\d+(?:\s*[,،]\s*\d+)*\]\s*)*)\s+((?:[1-9]|1[0-9]|[١-٩]|١[٠-٩])\s*[.\-–]\s+(?=\*\*|[\u0600-\u06FF]))/g, '$1\n$2');

      // 2.24 إزالة العناوين الجانبية المصطنعة (تنبيه سيري / تحقيق تاريخي / فائدة أثرية) لتندمج في النثر المتصل
      cleaned = cleaned.replace(/(?:^|\n)[ \t]*(?:\*\*)?(?:تنبيه\s+سيري|تحقيق\s+تاريخي|فائدة\s+أثرية|لمحة\s+تاريخية|إضاءة\s+تاريخية|وقفة\s+تحليلية|ملحظ\s+تشريعي|تنبيه\s+منهجي)[ \t]*:[ \t]*(?:\*\*)?[ \t]*/gm, '\n');

      // 2.25 دمج الفواصل التراثية (فرع / تنبيه / فائدة / تتمة / تكملة / مسألة / ضابط / قاعدة) إن جاءت في سطر منفرد مع الفقرة التي تليها في فقرة نثرية طبيعية متصلة دون تحويلها إلى صناديق جانبية مقطعة
      cleaned = cleaned.replace(/(?:^|\n)[ \t]*(?:#{1,4}[ \t]+)?(?:\*\*)?(و?(?:فرع|فروع|تنبيه|تنبيهات|فائدة|فوائد|تتمة|تكملة|خاتمة|مسألة|مسائل|ضابط|قاعدة|لطيفة))[ \t]*:?[ \t]*(?:\*\*)?[ \t]*:?\s*\n+[ \t]*(?=\S)/g, '\n**$1:** ');

      // 2.3 تفريغ التقسيمات الصريحة الكبرى فقط (مثل الركن الأول: / الضرب الأول: / القسم الأول: / الشرط الأول:) في سطر مستقل واضح، مع إبقاء (فرع / تنبيه / مسألة / ضابط) فقرات نثرية متصلة غير مؤطرة بصناديق
      const DIV_NOUNS = '(?:الضرب|القسم|النوع|الحالة|الحال|الشق|المرتبة|الشرط|الركن|الفرض|المسلك|المقام)';
      const DIV_ORDS = '(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|الأولى|الثانية|الثالثة|الرابعة|الخامسة|السادسة|السابعة|الثامنة|التاسعة|العاشرة)';
      const DIV_SINGLE = '(?:أولاً|ثانياً|ثالثاً|رابعاً|خامساً|سادساً|سابعاً|ثامناً|تاسعاً|عاشراً)';
      const divRx = new RegExp(`(?:^|([،,؛.:!؟\\n])\\s*)(?:\\*\\*)?(و?(${DIV_NOUNS}\\s+${DIV_ORDS}|${DIV_SINGLE})\\s*:)(?:\\*\\*)?`, 'gm');
      cleaned = cleaned.replace(divRx, (m, punc, fullLbl) => {
        const cleanLbl = fullLbl.replace(/^و(?=(?:الضرب|القسم|النوع|الحالة|الحال|الشق|الجهة|المرتبة|الشرط|الركن|الفرض|الأمر|المسلك|الوجه|المقام|الفرع|المسألة|المطلب|المبحث|الصورة|المذهب|القول|السبب|الموجب|التنبيه|الفائدة|القاعدة|الضابط|أول|ثان|ثالث|رابع|خامس|أحد|إحدى))/, '');
        const prefix = punc && punc !== '\n' ? `${punc === '،' || punc === ',' ? '.' : punc}\n` : '\n';
        return `${prefix}@@DIV@@${cleanLbl}@@/DIV@@ `;
      });
      // กรณี @@DIV@@...@@/DIV@@ มีการขึ้นบรรทัดใหม่คั่นก่อนเนื้อหา ให้ดึงเนื้อหาขึ้นมาต่อท้ายทันที
      cleaned = cleaned.replace(/(@@DIV@@[^\n]+?@@\/DIV@@)[ \t]*\n+[ \t]*(?=\S)/g, '$1 ');

      // 2.4 แยกย่อหน้าอัตโนมัติเมื่อเปลี่ยนประเด็นย่อยสำคัญ (เช่น وأما / أما / ويشترط / ويستثنى / وقد اختلف / واختلف / ومحل هذا الخلاف / ويجب نقض) หลังจบประโยคที่มีอ้างอิง [n]
      cleaned = cleaned.replace(/([.؟!]\s*(?:\[\d+(?:\s*[,،]\s*\d+)*\]\s*)+)\s*((?:وأما|أما|ويشترط|وشرط|ويستثنى|وخرج بـ|واحترز بـ|وقد اختلف|واختلف|ومحل هذا الخلاف|ويجب نقض|وكذلك يجب)\s+[\u0600-\u06FF])/g, '$1\n$2');

      let h = escH(cleaned);
      // ป้องกันเครื่องหมาย ««...»» ซ้อนกัน ๒ ชั้น และป้องกัน <span class="ayah bc-ayah"> ซ้อนกัน ๒ ชั้น
      h = h.replace(/(?:«|&quot;)?\s*&lt;hadith&gt;([\s\S]*?)(?:&lt;\/hadith&gt;|$)\s*(?:»|&quot;)?/g, (_, t) =>
        `<span class="hadith">«${t.replace(/^(?:\s|«|&quot;)+|(?:\s|»|&quot;)+$/g, '')}»</span>`);
      h = h.replace(/(?:﴿)?\s*&lt;ayah&gt;([\s\S]*?)(?:&lt;\/ayah&gt;|$)\s*(?:﴾)?/g, (_, t) =>
        `@@AYAH_OPEN@@${t.replace(/^(?:\s|﴿|«|&quot;)+|(?:\s|﴾|»|&quot;)+$/g, '')}@@AYAH_CLOSE@@`);
      h = h.replace(/﴿([^﴾\n]{2,500})﴾/g, (m, t) => `<span class="ayah bc-ayah">﴿${t.trim()}﴾</span>`);
      h = h.replace(/@@AYAH_OPEN@@([\s\S]*?)@@AYAH_CLOSE@@/g, '<span class="ayah bc-ayah">﴿$1﴾</span>');
      h = h.replace(/&lt;([\u0600-\u06FF][^&<>]{8,350}?)&gt;/g, (_, t) =>
        `<span class="hadith">«${t.trim()}»</span>`);
      h = h.replace(/\*\*\s*(\([^\n*]{2,450}?\))\s*\*\*/g, '<span class="bc-matn">$1</span>');
      h = h.replace(/\*\*([^*\n]+?)\*\*/g, '<b>$1</b>');
      h = h.replace(/\*\*/g, '');
      h = h.replace(/<b>\s*(\([^<\n]{2,450}?\))\s*<\/b>/g, '<span class="bc-matn">$1</span>');
      h = h.replace(/(^|[\s>«"(\n])(?:<b>\s*(قوله\s*:\s*)(\([^)\n]{2,450}\))\s*<\/b>|(قوله\s*:\s*)(?:<b>)?(\([^)\n]{2,450}\))(?:<\/b>)?)/gm, (_, pre, q1, m1, q2, m2) =>
        `${pre}<span class="bc-side">${q1 || q2}</span><span class="bc-matn">${m1 || m2}</span>`);
      // จับเฉพาะคำขึ้นต้นย่อหน้า/ประโยคที่มีขอบเขตคำชัดเจน ป้องกันไม่ให้จับคำว่า س: ใน الرأس: หรือ قاعدة: ใน لقاعدة: และไม่ทำให้แท็ก <b>...</b> แหว่ง
      h = h.replace(/(^|[\s>«"(\n])(?:<b>\s*((?:فرع|فروع|تنبيه|تنبيهات|فائدة|فوائد|تتمة|تكملة|خاتمة|مسألة|مسائل|ضابط|قاعدة|لطيفة)\s*:)\s*<\/b>|((?:فرع|فروع|تنبيه|تنبيهات|فائدة|فوائد|تتمة|تكملة|خاتمة|مسألة|مسائل|ضابط|قاعدة|لطيفة)\s*:))/gm, (_, pre, b1, b2) =>
        `${pre}<span class="bc-side">${b1 || b2}</span>`);
      h = h.replace(/(^|\n)\s*(?:<b>\s*([سج]\s*:)\s*<\/b>|([سج]\s*:))/g, (_, pre, b1, b2) =>
        `${pre}<span class="bc-side">${b1 || b2}</span>`);
      // ลบเครื่องหมายจุลภาคคั่นระหว่างเลขอ้างอิง เช่น [6]، [7]. → [6][7]. เพื่อไม่ให้เกิด "،."
      h = h.replace(/\]\s*[,،;؛]\s*\[/g, '][');
      h = h.replace(/[ \t]*((?:\[\d+(?:\s*[,،]\s*\d+)*\][ \t]*)+)([.!؟?؛])/g, (_, c, p) => `${p} ${c.replace(/\s+/g, '')}`);
      h = h.replace(/[,،]\s*([.!؟?؛])/g, '$1');
      // แปลงเลขอ้างอิง [1] เป็น <a class="bk-fn-ref">(١)</a> แบบเรียงลำดับต่อเนื่อง 1, 2, 3...99 ทุกหน้า (หรือลบออกถ้าไม่ติ๊กอ้างอิงใต้หน้า)
      h = h.replace(/(?:\[\d+(?:\s*[,،]\s*\d+)*\][ \t]*)+/g, (match, offset, fullStr) => {
        if (!wantFootnotes) {
          const nextCh = fullStr[offset + match.length] || '';
          return (/[ \t]$/.test(match) && nextCh && !/[\n\r.,،؛:!؟?)\]»﴾]/.test(nextCh)) ? ' ' : '';
        }
        const rawNums = [...match.matchAll(/\d+/g)].map(m => +m[0]);
        const uniqRaw = [...new Set(rawNums)];
        const lineStart = fullStr.lastIndexOf('\n', offset) + 1;
        const rawSlice = fullStr.slice(lineStart, offset);
        const lastCiteIdx = Math.max(rawSlice.lastIndexOf('</a>'), rawSlice.lastIndexOf(']'));
        const immediateRaw = lastCiteIdx >= 0 ? rawSlice.slice(lastCiteIdx + 1) : rawSlice;
        const cleanCtx = s => s
          .replace(/&lt;(?:\/?)(?:ayah|hadith)&gt;/gi, ' ')
          .replace(/@@AYAH_(?:OPEN|CLOSE)@@/g, ' ')
          .replace(/@@DIV@@([\s\S]+?)@@\/DIV@@/g, '$1 ')
          .replace(/<[^>]*>/g, ' ')
          .replace(/&(quot|amp|lt|gt|#39);/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        const immediateCtx = cleanCtx(immediateRaw);
        const widerCtx = cleanCtx(rawSlice);
        const resolvedList = resolveFnNo(uniqRaw, immediateCtx, widerCtx);
        const outLinks = [];
        for (const fnNo of (Array.isArray(resolvedList) ? resolvedList : [resolvedList])) {
          if (!fnNo) continue;
          const disp = useArNums ? toArNumStr(fnNo) : String(fnNo);
          outLinks.push(`<a class="bk-fn-ref" data-fn="${fnNo}" title="هامش (${disp})">(${disp})</a>`);
        }
        if (!outLinks.length) return '';
        const nextCh = fullStr[offset + match.length] || '';
        const needTrailingSpace = /[ \t]$/.test(match) || (nextCh && !/[\n\r.,،؛:!؟?)\]»﴾]/.test(nextCh));
        return outLinks.join(' ') + (needTrailingSpace ? ' ' : '');
      });

      let out = '', list = '', tbl = [];
      const isTblRow = s => /^\|/.test(s) && s.indexOf('|', 1) > 0;
      const isSepCell = c => /^[\s:\-–—]+$/.test(c) && /[\-–—]/.test(c);
      const isSepRow = cells => cells.length > 0 && cells.every(isSepCell);
      const parseCells = rowStr => {
        let s = rowStr.trim().replace(/^\|/, '');
        s = s.replace(/\|\s*((?:<a class="bk-fn-ref"[^>]*>[\s\S]*?<\/a>\s*)+)$/, ' $1').replace(/\|$/, '');
        return s.split('|').map(c => c.trim().replace(/&lt;br\s*\/?&gt;/gi, '<br>').replace(/@@\/?DIV@@/g, ''));
      };
      const flushTbl = () => {
        if (!tbl.length) return;
        const rows = tbl.map(parseCells);
        tbl = [];
        const sepIdx = rows.findIndex(isSepRow);
        let headRows = [], bodyRows = [], aligns = [];
        if (sepIdx >= 1) {
          headRows = rows.slice(0, sepIdx);
          aligns = rows[sepIdx].map(c => /^:.*:$/.test(c.trim()) ? 'center' : '');
          bodyRows = rows.slice(sepIdx + 1).filter(r => !isSepRow(r));
        } else if (sepIdx === 0) {
          aligns = rows[0].map(c => /^:.*:$/.test(c.trim()) ? 'center' : '');
          bodyRows = rows.slice(1).filter(r => !isSepRow(r));
        } else {
          headRows = [rows[0]];
          bodyRows = rows.slice(1);
        }
        const colCount = Math.max(1, ...headRows.map(r => r.length), ...bodyRows.map(r => r.length));
        let thHtml = '';
        for (const hr of headRows) {
          if (hr.every(c => !c)) continue;
          thHtml += '<tr>' + Array.from({ length: colCount }, (_, i) => {
            const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
            return `<th${al}>${hr[i] ?? ''}</th>`;
          }).join('') + '</tr>';
        }
        let tbHtml = '';
        for (const br of bodyRows) {
          if (br.every(c => !c)) continue;
          tbHtml += '<tr>' + Array.from({ length: colCount }, (_, i) => {
            const al = aligns[i] ? ` style="text-align:${aligns[i]}"` : '';
            return `<td${al}>${br[i] ?? ''}</td>`;
          }).join('') + '</tr>';
        }
        out += `<div class="tbl-wrap"><table class="atbl">${thHtml ? `<thead>${thHtml}</thead>` : ''}${tbHtml ? `<tbody>${tbHtml}</tbody>` : ''}</table></div>`;
      };
      const close = () => {
        if (list) { out += `</${list}>`; list = ''; }
        flushTbl();
      };
      const hLines = h.split('\n');
      for (let liIdx = 0; liIdx < hLines.length; liIdx++) {
        const ln = hLines[liIdx];
        if (!ln.trim()) continue;
        const t = ln.trim();
        if (isTblRow(t)) {
          if (list) { out += `</${list}>`; list = ''; }
          tbl.push(t);
          continue;
        }
        if (tbl.length) flushTbl();

        // ตรวจจับบรรทัดที่เป็นหัวข้อจำแนก @@DIV@@الضرب الأول:@@/DIV@@
        const divMatch = t.match(/^@@DIV@@([\s\S]+?)@@\/DIV@@\s*(.*)/);
        if (divMatch) {
          close();
          const lbl = divMatch[1].replace(/<[^>]*>/g, '').trim();
          let rest = divMatch[2].replace(/@@\/?DIV@@/g, '').trim();
          // หากบรรทัดนี้มีแต่หัวข้อ فرع: / تنبيه: โดยไม่มีเนื้อหาต่อท้าย ให้ดึงบรรทัดถัดไปมารวมในกล่องเดียวกันทันที
          while (!rest && liIdx + 1 < hLines.length) {
            const nxt = hLines[liIdx + 1].trim();
            if (!nxt) { liIdx++; continue; }
            if (/^#{1,4}\s+/.test(nxt) || isTblRow(nxt) || /^@@DIV@@/.test(nxt)) break;
            rest = nxt.replace(/@@\/?DIV@@/g, '').trim();
            liIdx++;
          }
          const isSideMarker = /^(?:فرع|فروع|تنبيه|تنبيهات|فائدة|فوائد|تتمة|تكملة|خاتمة|مسألة|مسائل|ضابط|قاعدة|لطيفة)\s*:/.test(lbl);
          out += `<div class="bk-div-item"><span class="${isSideMarker ? 'bc-side' : 'bk-div-lbl'}">${lbl}</span> ${rest}</div>`;
          continue;
        }

        const cleanLine = t.replace(/@@DIV@@([\s\S]+?)@@\/DIV@@/g, '<b class="bk-div-lbl">$1</b>');
        // จับรายการตัวเลขเฉพาะกรณี (1) หรือ 1. หรือ 1- (ไม่จับ 60) ที่มาจากเลขอายะฮ์) และคงลำดับเลขข้อ (start/value) แม้มี فرع:/تنبيه: คั่นกลาง
        const ol = cleanLine.match(/^\s*(?:\(([0-9٠-٩]{1,2})\)|([0-9٠-٩]{1,2})\s*[.\-–])\s+(.*)/);
        if (ol) {
          const rawNumStr = String(ol[1] || ol[2] || '1').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
          const itemNo = parseInt(rawNumStr, 10) || 1;
          if (list !== 'ol') { close(); out += `<ol class="bk-ol" start="${itemNo}">`; list = 'ol'; }
          const itemBody = ol[3].replace(/^([^:：<>]{2,35}:)(?!<\/b>)/, '<b>$1</b>');
          const numDisp = useArNums ? toArNumStr(itemNo) : String(itemNo);
          out += `<li value="${itemNo}" data-li-num="${escH(numDisp)}"><b class="bk-li-num">${numDisp}. </b>${itemBody}</li>`;
          continue;
        }
        const li = cleanLine.match(/^\s*[-•]\s+(.*)/);
        if (li) {
          if (list !== 'ul') { close(); out += '<ul class="bk-ul">'; list = 'ul'; }
          const itemBody = li[1].replace(/^([^:：<>]{2,35}:)(?!<\/b>)/, '<b>$1</b>');
          out += `<li><b class="bk-li-num">• </b>${itemBody}</li>`;
          continue;
        }
        // ข้ามเส้นคั่น --- หรือ *** ดิบๆ ไม่ให้แสดงเป็นตัวอักษรรกหน้ากระดาษ
        if (/^(?:[-*_─━═]{3,}|&mdash;{2,})$/.test(cleanLine.replace(/<[^>]*>/g, '').trim())) {
          close();
          continue;
        }
        close();
        const hd = cleanLine.match(/^#{1,4}\s+(.*)/);
        const plainForHd = cleanLine.replace(/<[^>]*>/g, '').trim();
        const mabhathHd = !hd && plainForHd.length <= 130 && plainForHd.match(/^((?:المبحث|المطلب)\s+(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|[1-9٠-٩]+)\s*[:：\-–].*)$/);
        const conclHd = !hd && !mabhathHd && plainForHd.match(/^(خاتمة(?:\s+الكتاب|\s+الفصل|\s+البحث)?|خلاصة(?:\s+الفصل|\s+المبحث|\s+الكتاب)?|تمهيد)\s*[:：]?$/);
        if (hd) {
          out += `<h4>${hd[1].replace(/^<b>|<\/b>$/g, '').replace(/#+$/g, '').trim()}</h4>`;
        } else if (mabhathHd) {
          out += `<h4>${mabhathHd[1].trim()}</h4>`;
        } else if (conclHd) {
          out += `<h4>${conclHd[1].trim()}</h4>`;
        } else {
          const plainTxt = cleanLine.replace(/<[^>]*>/g, '').trim();
          const isLeadIn = plainTxt.length <= 140 && /[:：]\s*(?:\([\d٠-٩]+\)\s*)*$/.test(plainTxt);
          out += `<p${isLeadIn ? ' class="bk-no-indent"' : ''}>${cleanLine}</p>`;
        }
      }
      close();
      return out;
    }

    const fmtLoc = p => p?.label ? String(p.label) :
      [p?.volume ? `ج${p.volume}` : '', p?.page != null && p.page !== '' ? `ص${p.page}` : ''].filter(Boolean).join(' ');

    const fmtVolPageOnly = p => [p?.volume ? `ج${p.volume}` : '', p?.page != null && p.page !== '' ? `ص${p.page}` : ''].filter(Boolean).join(' ');

    const cleanShortBookName = rawName => {
      let s = String(rawName || '').split('=')[0].trim();
      s = s.replace(/\s*\(\d{3,4}\s*هـ?\)\s*$/g, '').replace(/\s*\(\d{3,4}\)\s*$/g, '').trim();
      return s || String(rawName || '').trim();
    };

    const FN_STOP_WORDS = new Set([
      'من','في','على','عن','إلى','الى','ما','هل','أو','او','ثم','مع','هو','هي','أن','ان','إن','لا','لم','كان',
      'التي','الذي','ذلك','هذا','هذه','تلك','فهو','فهي','وهو','وهي','كما','لأن','لان','إذ','اذ','إذا','اذا',
      'بل','قد','وقد','ولو','حتى','أي','اي','عند','غير','بعد','قبل','دون','بين','فإن','فان','وإن','وان','أما',
      'اما','وأما','واما','قال','قوله','تعالى','صلى','الله','عليه','وسلم','رضي','عنه','عنها','عنهما','عنهم',
      'رحمه','بان','بأن','لأنه','لانه','فيجب','ويجب','ويسن','يسن','يكره','ويكره','يحرم','ويحرم','يجوز','ويجوز',
      'أنه','انه','أنها','انها','فلا','ولا','ولم','فلو','ولو','منه','منها','فيه','فيها','به','بها','له','لها'
    ]);

    const normArForMatch = s => String(s || '')
      .replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي');

    const stemArWord = w => {
      let s = normArForMatch(w).replace(/[^\u0621-\u064A]/g, '');
      if (s.length > 4) s = s.replace(/^(?:وال|بال|فال|كال|ولل|فلل|لل|ال)/, '');
      if (s.length > 4 && /^[وفبكل]/.test(s)) s = s.slice(1).replace(/^ال/, '');
      if (s.length > 4) s = s.replace(/(?:ها|هم|هن|كم|كن|نا|ان|ين|ون|ات|ه|ي|ك)$/, '');
      return s;
    };

    const extractContextTokens = ctxStr => {
      const rawWords = String(ctxStr || '')
        .replace(/[^\u0621-\u064A\s]/g, ' ')
        .split(/\s+/)
        .map(w => w.trim())
        .filter(Boolean);
      const tokens = [];
      const seen = new Set();
      for (let i = rawWords.length - 1; i >= 0; i--) {
        const rw = rawWords[i];
        const normW = normArForMatch(rw);
        if (normW.length < 3 || FN_STOP_WORDS.has(rw) || FN_STOP_WORDS.has(normW)) continue;
        const st = stemArWord(rw);
        if (st.length < 2 || FN_STOP_WORDS.has(st)) continue;
        const distFromEnd = rawWords.length - 1 - i;
        const posWeight = distFromEnd <= 5 ? 3.2 : distFromEnd <= 11 ? 2.1 : 1.2;
        if (!seen.has(st)) {
          seen.add(st);
          tokens.push({ raw: rw, norm: normW, stem: st, weight: posWeight });
        }
        if (tokens.length >= 14) break;
      }
      return tokens;
    };

    // ดึงข้อความต้นฉบับของอ้างอิงให้ขึ้นต้นตรงจุดที่พูดเรื่องเดียวกับประโยคที่อ้างเลข [n] บนเนื้อหาอย่างแม่นยำ
    const extractMatchingSourceQuote = (srcObj, immediateCtx = '', widerCtx = '', maxLen = 96) => {
      let raw = String(srcObj?.text || srcObj?.excerpt || '')
        .replace(/<[^>]*>/g, ' ')
        .replace(/⦗[^⦘]*⦘/g, ' ')
        .replace(/^[…\.\s،,؛:\-–—]+|[…\.\s،,؛:\-–—]+$/g, '')
        .replace(/\s+/g, ' ')
        .trim();
      if (!raw) return { quote: '', score: 0 };

      // ตัดหัวข้อลอยๆ เช่น "(فصل) في شروط الصلاة" ที่ติดมาด้านหน้าออกหากมีเนื้อหาอธิบายต่อท้าย
      const strippedLead = raw.replace(/^\(?\s*(?:فصل|باب|كتاب|فرع|تنبيه|تتمة|فائدة|مطلب|مسألة)\s*\)?(?:\s+في\s+[^.:؛،(\n]{3,35})?\s*[:.\-–—]?\s*/, '').trim();
      if (strippedLead.length >= 20) raw = strippedLead;

      const activeCtx = immediateCtx.length >= 8 ? immediateCtx : widerCtx;
      const primaryTokens = extractContextTokens(activeCtx);
      const secondaryTokens = immediateCtx.length >= 8 ? extractContextTokens(widerCtx) : [];

      // สร้าง bigram ของคำติดกันในประโยคเพื่อเพิ่มความแม่นยำเวลาจับคู่เนื้อหาเฉพาะจุด
      const ctxNormWords = normArForMatch(activeCtx).replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(w => w.length >= 3 && !FN_STOP_WORDS.has(w));
      const ctxBigrams = [];
      for (let i = 0; i < ctxNormWords.length - 1; i++) {
        ctxBigrams.push(`${ctxNormWords[i]} ${ctxNormWords[i + 1]}`);
      }

      // แยกประโยค/อนุประโยคในแหล่งอ้างอิงเพื่อให้ตัดขึ้นต้นตรงจุดที่ตรงกับเนื้อหาทันที
      const rawClauses = raw
        .split(/(?:[.!؟؛\n]|\s+—\s+|(?=[\(«]?(?:قوله|فرع|تنبيه|فائدة|تتمة|مسألة|والأصل|وفروض|وشروط|وسنن|ومكروهات|ونواقض)\b)|(?<=\))\s+(?=\())/)
        .map(c => c.replace(/^[…\s،,؛:\-–—]+/, '').trim())
        .filter(c => c.length >= 8);

      const candidates = rawClauses.length ? rawClauses : [raw];

      let bestClause = candidates[0];
      let bestScore = 0;

      const scoreTextSegment = seg => {
        const normSeg = normArForMatch(seg);
        if (!normSeg) return 0;
        const segWords = normSeg.replace(/[^\u0621-\u064A\s]/g, ' ').split(/\s+/).filter(Boolean);
        const segStems = segWords.map(stemArWord);
        const normSegClean = segWords.join(' ');
        let sc = 0;
        let matchedCount = 0;
        for (const tk of primaryTokens) {
          if (normSeg.includes(tk.norm)) {
            sc += tk.weight * 3.2;
            matchedCount++;
          } else if (tk.stem.length >= 3 && segStems.some(ss => ss === tk.stem || (ss.length >= 3 && (ss.includes(tk.stem) || tk.stem.includes(ss))))) {
            sc += tk.weight * 2.1;
            matchedCount++;
          }
        }
        for (const bg of ctxBigrams) {
          if (normSegClean.includes(bg)) {
            sc += 5.5;
            matchedCount++;
          }
        }
        for (const tk of secondaryTokens) {
          if (primaryTokens.some(p => p.stem === tk.stem)) continue;
          if (normSeg.includes(tk.norm) || (tk.stem.length >= 3 && segStems.includes(tk.stem))) {
            sc += 0.85;
          }
        }
        // โบนัสพิเศษหากคำค้นอยู่ในวงเล็บตัวบท (...) หรือหลังคำว่า قوله:
        const matnSpans = [...seg.matchAll(/\(([^)]{2,90})\)/g)].map(m => normArForMatch(m[1])).join(' ');
        if (matnSpans) {
          for (const tk of primaryTokens) {
            if (matnSpans.includes(tk.norm) || (tk.stem.length >= 3 && matnSpans.includes(tk.stem))) {
              sc += tk.weight * 2.0;
            }
          }
        }
        if (matchedCount >= 2) sc += matchedCount * 1.8;
        return sc;
      };

      if (primaryTokens.length) {
        for (let i = 0; i < candidates.length; i++) {
          const cl = candidates[i];
          const combined = (cl.length < 36 && candidates[i + 1]) ? `${cl} ${candidates[i + 1]}` : cl;
          const sc = scoreTextSegment(combined);
          if (sc > bestScore) {
            bestScore = sc;
            bestClause = combined;
          }
        }
      }

      // หากประโยคที่เลือกมายาวเกินไป ให้เลื่อนจุดเริ่มต้นเข้าไปหาจุดแรกที่พบคำสำคัญหรือวงเล็บตัวบท (...)
      let result = bestClause.replace(/^[…\s،,؛:\-–—]+/, '').trim();
      if (result.length > maxLen && primaryTokens.length) {
        const subParts = result.split(/(?:[،؛:]|\s+(?=\([^)]{2,60}\))|\s+(?=قوله\b))/).map(s => s.trim()).filter(Boolean);
        if (subParts.length > 1) {
          let bestSubIdx = 0;
          let bestSubSc = -1;
          for (let j = 0; j < subParts.length; j++) {
            const subSc = scoreTextSegment(subParts.slice(j, j + 2).join(' '));
            if (subSc > bestSubSc) {
              bestSubSc = subSc;
              bestSubIdx = j;
            }
          }
          if (bestSubIdx > 0 && bestSubSc > 0) {
            const sliced = subParts.slice(bestSubIdx).join('، ').replace(/^[…\s،,؛:\-–—]+/, '').trim();
            if (sliced.length >= 16) result = sliced;
          }
        }
      }

      // ทำความสะอาดคำเชื่อมลอยๆ ที่ต้นและท้ายข้อความที่ตัดมา
      result = result.replace(/^(?:و|ف)?(?:قوله\s*:\s*)?(?=[«(])/, '').replace(/^[…\s،,؛:\-–—*]+/, '').trim();
      if (result.length > maxLen) {
        result = result.slice(0, maxLen).replace(/\s+\S*$/, '').replace(/[،,؛:\-–—]+$/, '').trim() + '…';
      }
      // ปิดวงเล็บ ( ) หากถูกตัดขาดกลางคัน
      const openPar = (result.match(/\(/g) || []).length;
      const closePar = (result.match(/\)/g) || []).length;
      if (openPar > closePar) result = result.replace(/…$/, '') + ')…';
      return { quote: result, score: bestScore };
    };

    const extractShortSourceQuote = (srcObj, contextText = '', maxLen = 96) =>
      extractMatchingSourceQuote(srcObj, contextText, contextText, maxLen).quote;

    const CANONICAL_AUTHORS_FALLBACK = [
      [/السيرة النبوية لابن هشام|سيرة ابن هشام/, 'ابن هشام (ت ٢١٨ هـ)'],
      [/^زاد المعاد/, 'ابن قيم الجوزية (ت ٧٥١ هـ)'],
      [/^الطبقات الكبرى|^الطبقات الكبير/, 'محمد بن سعد البغدادي (ت ٢٣٠ هـ)'],
      [/^سبل الهدى والرشاد/, 'محمد بن يوسف الصالحي الشامي (ت ٩٤٢ هـ)'],
      [/^عيون الأثر/, 'ابن سيد الناس اليعمري (ت ٧٣٤ هـ)'],
      [/^الرحيق المختوم/, 'صفي الرحمن المباركفوري'],
      [/^البداية والنهاية/, 'الحافظ ابن كثير الدمشقي (ت ٧٧٤ هـ)'],
      [/^المغازي للواقدي|^مغازي الواقدي/, 'محمد بن عمر الواقدي (ت ٢٠٧ هـ)'],
      [/^دلائل النبوة/, 'أبو بكر البيهقي (ت ٤٥٨ هـ)'],
      [/^فتح الباري/, 'الحافظ ابن حجر العسقلاني (ت ٨٥٢ هـ)'],
      [/^المجموع شرح المهذب/, 'الإمام يحيى بن شرف النووي (ت ٦٧٦ هـ)'],
      [/^روضة الطالبين|^منهاج الطالبين/, 'الإمام يحيى بن شرف النووي (ت ٦٧٦ هـ)'],
      [/^إعانة الطالبين/, 'البكري الدمياطي (ت ١٣١٠ هـ)'],
      [/^فتح المعين/, 'زين الدين المليباري (ت ٩٨٧ هـ)'],
      [/^كفاية الأخيار/, 'تقي الدين الحصني (ت ٨٢٩ هـ)'],
      [/^تحفة المحتاج/, 'ابن حجر الهيتمي (ت ٩٧٤ هـ)'],
      [/^نهاية المحتاج/, 'شمس الدين الرملي (ت ١٠٠٤ هـ)'],
      [/^مغني المحتاج/, 'الخطيب الشربيني (ت ٩٧٧ هـ)'],
      [/^الحاوي الكبير/, 'أبو الحسن الماوردي (ت ٤٥٠ هـ)'],
      [/^المغني لابن قدامة|^المغني$/, 'موفق الدين ابن قدامة المقدسي (ت ٦٢٠ هـ)'],
      [/^تفسير الطبري|^جامع البيان/, 'الإمام ابن جرير الطبري (ت ٣١٠ هـ)'],
      [/^تفسير ابن كثير/, 'الحافظ ابن كثير الدمشقي (ت ٧٧٤ هـ)'],
      [/^تفسير القرطبي|^الجامع لأحكام القرآن/, 'الإمام أبو عبد الله القرطبي (ت ٦٧١ هـ)'],
      [/^لسان العرب/, 'ابن منظور الأفريقي (ت ٧١١ هـ)'],
    ];

    const inferCanonicalAuthor = (bookName, existingAuthor) => {
      const ex = String(existingAuthor || '').trim();
      if (ex && ex !== 'مجهول') return ex;
      const bn = String(bookName || '').trim();
      for (const [rx, au] of CANONICAL_AUTHORS_FALLBACK) {
        if (rx.test(bn)) return au;
      }
      return '';
    };

    const normalizeBiblioTitle = rawName => {
      let s = cleanShortBookName(rawName);
      // توحيد اسم الكتاب عند تعدد طبعاته (مثل: الطبقات الكبرى - ط الخانجي / ط العلمية / ط دار صادر) لمنع تكرار الكتاب نفسه في قائمة المصادر
      s = s.replace(/\s+[-–—]\s+(?:ط|ت|تحقيق|طبعة)\s+[^-–—()]+$/g, '').trim();
      s = s.replace(/\s+[-–—]\s+(?:الجيل|دار صادر|الرسالة|العلمية|الخانجي|عطاءات العلم|دار الفكر|دار الكتب العلمية)$/g, '').trim();
      return s || cleanShortBookName(rawName);
    };

    function compileChaptersToBook({ title, subtitle, author, styleMode = 'continuous', chaptersList, incQuestions, incFootnotes }) {
      const wantQuestions = incQuestions !== undefined ? !!incQuestions : (activePlan === 2 ? !!p2State.incQuestions : !!bsState.incQuestions);
      const wantFootnotes = incFootnotes !== undefined ? !!incFootnotes : (activePlan === 2 ? (p2State.incFootnotes !== false) : (bsState.incFootnotes !== false));
      const stripPref = window.__bcAuthorEngine?.stripLeadingChapterPrefix || (x => String(x || '').trim());

      const groups = [];
      const allBookSources = [];
      const seenGlobalSrcKeys = new Set();
      for (const ch of (chaptersList || [])) {
        if (ch.include === false || !(ch.raw || '').trim()) continue;
        for (const s of (ch.sources || [])) {
          if (!s) continue;
          if (s.book && !s.book.authorName) {
            s.book.authorName = inferCanonicalAuthor(s.book.primaryName, '');
          }
          const sk = `${s.book?.primaryName || ''}|${s.metadata?.pages?.[0]?.volume || ''}|${s.metadata?.pages?.[0]?.page || ''}|${(s.text || s.excerpt || '').slice(0, 60)}`;
          if (!seenGlobalSrcKeys.has(sk)) {
            seenGlobalSrcKeys.add(sk);
            allBookSources.push(s);
          }
        }
        const cleanedChTitle = (ch.isFrontMatter || ch.isBackMatter) ? (ch.title || 'مبحث') : (stripPref(ch.title) || ch.title || 'مبحث');
        if (ch.mergePrev && groups.length > 0) {
          groups[groups.length - 1].parts.push(ch);
        } else {
          groups.push({
            title: cleanedChTitle,
            lang: ch.lang || 'ar',
            parts: [ch],
          });
        }
      }

      const biblioMap = new Map();
      const addSourceToBiblio = s => {
        if (!s || !s.book?.primaryName) return;
        const rawFullName = s.book.primaryName;
        const canonTitle = normalizeBiblioTitle(rawFullName);
        const aName = inferCanonicalAuthor(rawFullName, s.book.authorName);
        const srcType = s.metadata?.src || 'turath';
        const bibKey = normArForMatch(canonTitle);
        const prev = biblioMap.get(bibKey);
        if (!prev) {
          biblioMap.set(bibKey, { bookName: canonTitle, authorName: aName, src: srcType });
        } else if (!prev.authorName && aName) {
          prev.authorName = aName;
        }
      };
      for (const s of allBookSources) addSourceToBiblio(s);
      let globalFnCounter = 0;

      const compiledChapters = groups.map((g, chIdx) => {
        const footnotes = [];
        const useAr = g.lang !== 'th';
        let bodyHtml = '';

        g.parts.forEach((part, pIdx) => {
          const sourcesArr = part.sources || [];
          const resolveFnNo = (oldNumsInput, immediateCtx = '', widerCtx = '') => {
            if (!wantFootnotes) return [];
            const numsList = Array.isArray(oldNumsInput) ? oldNumsInput : [oldNumsInput];
            const scoredCandidates = [];

            for (const oldNum of numsList) {
              let s = sourcesArr[oldNum - 1];
              if (!s) continue;
              let { quote, score } = extractMatchingSourceQuote(s, immediateCtx, widerCtx, 96);

              // หาก AI อ้างเลข [oldNum] คลาดเคลื่อนไปที่หน้าข้างเคียง (score ต่ำ) ให้ค้นหาใน sourcesArr ของบทนี้และทั้งเล่มว่ามีหน้าไหนในตำราเดียวกันที่มีข้อความตรงกับประโยคนี้มากกว่าหรือไม่
              if (score < 7.5 && (immediateCtx.length >= 10 || widerCtx.length >= 14)) {
                const targetBook = s.book?.primaryName || '';
                const poolToCheck = [...sourcesArr, ...allBookSources.filter(x => !targetBook || x.book?.primaryName === targetBook)];
                let bestAlt = null;
                let bestAltSc = score;
                for (const altS of poolToCheck) {
                  if (!altS || altS === s) continue;
                  if (targetBook && altS.book?.primaryName && altS.book.primaryName !== targetBook) continue;
                  const altRes = extractMatchingSourceQuote(altS, immediateCtx, widerCtx, 96);
                  if (altRes.score > bestAltSc && altRes.score >= Math.max(4.5, score * 1.35)) {
                    bestAltSc = altRes.score;
                    bestAlt = { s: altS, quote: altRes.quote, score: altRes.score };
                  }
                }
                if (bestAlt) {
                  s = bestAlt.s;
                  quote = bestAlt.quote;
                  score = bestAlt.score;
                }
              }

              // หากคะแนนความตรงยังต่ำมาก (< 2.2) แปลว่า excerpt ที่ตัดมาไม่มีถ้อยคำของประโยคนี้โดยตรง ให้แสดงเฉพาะชื่อหนังสือและ (جX صY) โดยไม่ใส่โควตที่อาจคนละเรื่อง
              if (score < 2.2) {
                quote = '';
              }

              scoredCandidates.push({ oldNum, s, quote, score });
            }
            if (!scoredCandidates.length) return [];

            // เรียงลำดับจากแหล่งอ้างอิงที่ตรงกับเนื้อหาที่สุด และตัดแหล่งอ้างอิงซ้ำจากเล่มเดียวกันในจุดเดียวกันออก (ไม่ให้เกิด (٢١)(٢٢) ซ้ำเล่มเดิมท้ายประโยคเดียว)
            scoredCandidates.sort((a, b) => b.score - a.score);
            const chosen = [];
            const seenBooksInCluster = new Set();
            const maxSc = scoredCandidates[0]?.score || 0;
            for (const cand of scoredCandidates) {
              if (chosen.length >= 2) break;
              if (chosen.length > 0 && maxSc > 0 && cand.score < Math.max(2.5, maxSc * 0.5)) continue;
              const bName = cand.s.book?.primaryName || '';
              if (bName && seenBooksInCluster.has(bName)) continue;
              if (bName) seenBooksInCluster.add(bName);
              chosen.push(cand);
            }

            const outFnNos = [];
            for (const item of chosen) {
              const { s, quote } = item;
              const pg = s.metadata?.pages?.[0] || {};
              const volPage = fmtVolPageOnly(pg);
              const fullName = s.book?.primaryName || '';
              const shortName = cleanShortBookName(fullName);
              const aName = s.book?.authorName || '';
              const srcType = s.metadata?.src || 'turath';

              const prevFn = footnotes[footnotes.length - 1];
              const isSameBook = prevFn && prevFn.fullBookName === fullName;
              const isExactSameQuote = isSameBook && prevFn.rawVolPage === volPage && (!quote || prevFn.rawQuote === quote);
              const fnNo = ++globalFnCounter;
              footnotes.push({
                no: fnNo,
                bookName: isSameBook ? 'المصدر السابق' : shortName,
                shortBookName: shortName,
                fullBookName: fullName,
                authorName: aName,
                volPage: isExactSameQuote ? 'نفسه' : volPage,
                rawVolPage: volPage,
                quote: isExactSameQuote ? '' : quote,
                rawQuote: quote,
                src: srcType,
              });

              addSourceToBiblio(s);
              outFnNos.push(fnNo);
            }
            return outFnNos;
          };

          if (styleMode === 'qa' && part.q) {
            bodyHtml += `<div class="bk-qbox"><b>${useAr ? 'السؤال:' : 'คำถาม:'}</b> ${escH(part.q)}</div>`;
          }
          const cleanedRaw = pIdx === 0 ? stripLeadingTitleLine(part.raw, g.title) : stripLeadingTitleLine(part.raw, part.title);
          bodyHtml += renderBookChapterBody(cleanedRaw, resolveFnNo, useAr, { incQuestions: wantQuestions, incFootnotes: wantFootnotes });
        });

        const p0 = g.parts[0] || {};
        return {
          index: chIdx,
          label: p0.customLabel || arChapterLabel(chIdx, g.lang),
          title: g.title,
          prompt: g.parts.map(p => p.prompt || '').filter(Boolean).join(' ، '),
          lang: g.lang,
          useAr,
          bodyHtml,
          footnotes,
          juz: p0.juz ?? 0,
          isVolumeStart: !!p0.isVolumeStart,
          volTitle: p0.volTitle || '',
          isFrontMatter: !!p0.isFrontMatter,
          isBackMatter: !!p0.isBackMatter,
          runHeadRight: p0.runHeadRight || '',
        };
      });

      const biblio = [...biblioMap.values()].sort((a, b) => a.bookName.localeCompare(b.bookName, 'ar'));
      const mainLang = compiledChapters[0]?.lang || 'ar';
      return {
        title: title || 'كتاب المباحث العلمية',
        subtitle: subtitle || '',
        author: author || '',
        dateStr: new Date().toLocaleDateString(mainLang === 'th' ? 'th-TH' : 'ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
        mainLang,
        chapters: compiledChapters,
        biblio,
        incQuestions: wantQuestions,
        incFootnotes: wantFootnotes,
      };
    }

    function compileBookStructure() {
      return compileChaptersToBook({
        title: bsState.bookTitle,
        subtitle: bsState.bookSubtitle,
        author: bsState.bookAuthor,
        styleMode: bsState.styleMode,
        chaptersList: bsState.chapters,
        incQuestions: !!bsState.incQuestions,
        incFootnotes: bsState.incFootnotes !== false,
      });
    }

    // แบ่งเล่ม: จำนวนบท/volumes หรือแบ่งตาม كتاب (3.9)
    const splitVolumes = (chapters, vols) => {
      const vCount = Math.max(1, Math.min(5, +vols || 1));
      if (vCount <= 1 || chapters.length <= 1) return [chapters];
      const kitabIdxs = chapters.map((c, i) => (/^كتاب/.test(c.title || '') || c.unit === 'كتاب') ? i : -1).filter(i => i > 0);
      if (kitabIdxs.length >= vCount - 1 && kitabIdxs.length <= vCount + 2) {
        const out = [];
        let last = 0;
        const step = Math.max(1, Math.floor(kitabIdxs.length / (vCount - 1)));
        for (let k = 0; k < vCount - 1 && k * step < kitabIdxs.length; k++) {
          const cut = kitabIdxs[k * step];
          if (cut > last) {
            out.push(chapters.slice(last, cut));
            last = cut;
          }
        }
        if (last < chapters.length) out.push(chapters.slice(last));
        if (out.length > 1) return out;
      }
      const perVol = Math.ceil(chapters.length / vCount);
      const out = [];
      for (let v = 0; v < vCount; v++) {
        const slice = chapters.slice(v * perVol, (v + 1) * perVol);
        if (slice.length) out.push(slice);
      }
      return out;
    };

    const cleanHeaderBookTitle = (rawTitle, maxChars = 38) => {
      let t = String(rawTitle || '').replace(/\s+/g, ' ').trim();
      if (!t) return '';
      if (t.length <= maxChars) return t;
      // ตัดเฉพาะคำเต็ม (ไม่ตัดกลางคำอาหรับเด็ดขาด)
      const cut = t.slice(0, maxChars).replace(/\s+\S*$/, '').trim();
      return cut || t.slice(0, maxChars);
    };

    const cleanHeaderSubLabel = (rawSub, maxChars = 30) => {
      let s = String(rawSub || '').replace(/\s+/g, ' ').trim();
      if (!s) return '';
      // แก้กรณีไม่มีเว้นวรรคหลัง : เช่น "كتاب الطهارة:باب" และย่อ "كتاب الطهارة: باب..." ให้เหลือเฉพาะชื่อ باب ที่กระชับชัดเจน
      s = s.replace(/:(?!\s)/g, ': ');
      s = s.replace(/^كتاب\s+[^:：]{2,25}:\s*(?=باب\b|فصل\b)/, '');
      if (s.length <= maxChars) return s;
      const cut = s.slice(0, maxChars).replace(/\s+\S*$/, '').trim();
      return cut || s.slice(0, maxChars);
    };

    const renderRunningHeadHtml = (title, juz = 0, subLabel = '') => {
      const rightTxt = cleanHeaderBookTitle(title, 38);
      const leftSub = cleanHeaderSubLabel(subLabel, 30);
      const leftTxt = `الجزء ${AR_JUZ[juz] || toArNumStr(juz + 1)}${leftSub ? ` · ${leftSub}` : ''}`;
      return `<div class="bc-run-head" dir="rtl"><span>${escH(rightTxt)}</span><span>${escH(leftTxt)}</span></div>`;
    };

    function compilePlan2BookStructure() {
      if (p2State.docType === 'book') {
        const S = p2State;
        const itemsList = [];
        const mainLang = S.lang === 'auto' ? 'ar' : S.lang;

        // 1) ส่วนหน้าของเล่ม (المقدمات: خطبة ← سبب التأليف ← منهج ← ترجمة ← مبادئ ← مصطلحات)
        for (const k of Object.keys(FRONT_PARTS)) {
          if (S.front?.[k] && (S.frontRaw?.[k] || '').trim()) {
            itemsList.push({
              include: true,
              mergePrev: false,
              title: FRONT_PARTS[k].ar,
              customLabel: 'المقدمات',
              raw: S.frontRaw[k],
              sources: S.frontSources?.[k] || [],
              lang: mainLang,
              juz: 0,
              isFrontMatter: true,
              runHeadRight: `الجزء ${AR_JUZ[0]} · ${FRONT_PARTS[k].ar}`,
            });
          }
        }

        // 2) เนื้อหาหลัก แบ่งตาม الجزء (volumes)
        const activeChs = (S.chapters || []).filter(c => c.include !== false && (c.raw || '').trim());
        const volGroups = splitVolumes(activeChs, S.volumes || 1);
        let globalBabIdx = 0;
        volGroups.forEach((grp, vIdx) => {
          grp.forEach((ch, idxInVol) => {
            globalBabIdx++;
            const rawUnit = String(ch.unit || '').trim();
            const unitName = ['كتاب', 'باب', 'فصل'].includes(rawUnit)
              ? rawUnit
              : (/^كتاب/.test(ch.title || '') ? 'كتاب' : 'باب');
            const defUnit = unitName === 'كتاب' ? 'الكتاب' : unitName === 'فصل' ? 'الفصل' : 'الباب';
            const ordWord = AR_ORDS_FULL[globalBabIdx - 1] || toArNumStr(globalBabIdx);
            const juzName = `الجزء ${AR_JUZ[vIdx] || toArNumStr(vIdx + 1)}`;
            const customLabel = (volGroups.length > 1)
              ? `${juzName} · ${defUnit} ${ordWord}`
              : `${defUnit} ${ordWord}`;
            itemsList.push({
              ...ch,
              include: true,
              mergePrev: false,
              customLabel,
              juz: vIdx,
              isVolumeStart: volGroups.length > 1 && idxInVol === 0,
              volTitle: juzName,
              runHeadRight: `${juzName} · ${ch.title}`,
            });
          });
        });

        // 3) ส่วนท้ายเล่ม (خاتمة الكتاب)
        if (S.back?.khatima && (S.backRaw?.khatima || '').trim()) {
          const lastJuz = Math.max(0, volGroups.length - 1);
          itemsList.push({
            include: true,
            mergePrev: false,
            title: BACK_PARTS.khatima.ar,
            customLabel: 'الخاتمة',
            raw: S.backRaw.khatima,
            sources: [],
            lang: mainLang,
            juz: lastJuz,
            isBackMatter: true,
            runHeadRight: `الجزء ${AR_JUZ[lastJuz] || toArNumStr(lastJuz + 1)} · خاتمة الكتاب`,
          });
        }

        const compiled = compileChaptersToBook({
          title: S.bookTitle || S.topic || S.matn?.name || 'كتاب التسهيل والتكملة',
          subtitle: S.bookSubtitle || `${BOOK_KINDS[S.bookKind]?.ar || ''}${S.matn?.name ? ` على «${S.matn.name}»` : ''}`,
          author: S.bookAuthor,
          styleMode: 'continuous',
          chaptersList: itemsList,
          incQuestions: !!S.incQuestions,
          incFootnotes: S.incFootnotes !== false,
        });
        compiled.docType = 'book';
        compiled.bookKind = S.bookKind;
        compiled.level = S.level;
        compiled.volumes = S.volumes || 1;
        compiled.matn = S.matn;
        compiled.incToc = S.back?.fihris !== false;
        compiled.incBiblio = S.back?.masadir !== false;
        compiled.incQuestions = !!S.incQuestions;
        compiled.incFootnotes = S.incFootnotes !== false;
        return compiled;
      }

      return compileChaptersToBook({
        title: p2State.bookTitle || p2State.topic || 'كتاب المباحث العلمية',
        subtitle: p2State.bookSubtitle,
        author: p2State.bookAuthor,
        styleMode: 'continuous',
        chaptersList: p2State.chapters,
        incQuestions: !!p2State.incQuestions,
        incFootnotes: p2State.incFootnotes !== false,
      });
    }

    // ตรวจสอบว่า HTML ย่อยมีแท็กเปิด-ปิดสมดุลกันครบถ้วน (ไม่ตัดกลาง <span class="hadith"> หรือ <b> หรือ <a>)
    function isHtmlTagsBalanced(s) {
      const lt = (s.match(/</g) || []).length;
      const gt = (s.match(/>/g) || []).length;
      if (lt !== gt) return false;
      const opens = (s.match(/<(?:span|b|strong|em|i|a)\b[^>]*>/gi) || []).length;
      const closes = (s.match(/<\/(?:span|b|strong|em|i|a)>/gi) || []).length;
      return opens === closes;
    }

    // แยก HTML ภายในย่อหน้าออกเป็นหน่วยประโยค/อนุประโยคที่สมดุล เพื่อใช้ตัดแบ่งตรงขอบล่างของกระดาษ A4 พอดีเป๊ะ
    function splitHtmlIntoBalancedUnits(rawInner, byWords = false) {
      const rawParts = byWords
        ? rawInner.split(/(\s+)/)
        : rawInner.split(/(?<=(?:[.؟!؛](?:[»﴾)"']|\s)*(?:<a class="bk-fn-ref"[^>]*>[\s\S]*?<\/a>\s*)*)\s+)(?!<a\b|<\/)/);
      if (rawParts.length <= 1) return [rawInner];
      const units = [];
      let buf = '';
      for (const part of rawParts) {
        buf += part;
        if (buf.trim() && isHtmlTagsBalanced(buf)) {
          units.push(buf);
          buf = '';
        }
      }
      if (buf) {
        if (units.length) units[units.length - 1] += buf;
        else units.push(buf);
      }
      return units.length ? units : [rawInner];
    }

    function extractFnNumsFromHtml(htmlStr) {
      return [...new Set([...String(htmlStr || '').matchAll(/data-fn="(\d+)"/g)].map(m => +m[1]).filter(Boolean))];
    }

    function makeBlockDescriptor(el, kind) {
      const html = el.outerHTML;
      const innerHtml = el.innerHTML;
      const text = (el.textContent || '').trim();
      const fnNums = extractFnNumsFromHtml(html);
      const isShortColonLead = (kind === 'P' || kind === 'DIV_ITEM') && text.length <= 155 && /[:：]\s*(?:\([\d٠-٩]+\)\s*)*$/.test(text);
      const isShortMarkerOnly = (kind === 'DIV_ITEM' || kind === 'P') && text.length <= 40;
      const keepWithNext = (kind === 'H4') || isShortColonLead || isShortMarkerOnly;
      return {
        html,
        innerHtml,
        tagName: el.tagName,
        className: el.className || '',
        listStart: el.getAttribute?.('start') || '',
        text,
        kind,
        isHeading: kind === 'H4',
        keepWithNext,
        fnNums,
        splitCount: 0,
      };
    }

    function rebuildSubBlock(origBlk, subInnerHtml, isContinuation = false) {
      const tag = origBlk.tagName.toLowerCase();
      const el = document.createElement(tag);
      if (origBlk.kind === 'LI') {
        if (isContinuation) {
          const contP = document.createElement('p');
          contP.className = 'bk-li-cont';
          contP.innerHTML = subInnerHtml.trim();
          const b = makeBlockDescriptor(contP, 'P');
          b.splitCount = (origBlk.splitCount || 0) + 1;
          return b;
        }
        el.className = origBlk.className;
        if (origBlk.listStart) el.setAttribute('start', origBlk.listStart);
        const li = document.createElement('li');
        li.innerHTML = subInnerHtml.trim();
        el.appendChild(li);
        const b = makeBlockDescriptor(el, 'LI');
        b.splitCount = (origBlk.splitCount || 0) + 1;
        return b;
      }
      el.className = origBlk.className;
      if (isContinuation && tag === 'p' && !el.classList.contains('bk-li-cont')) {
        el.classList.add('bk-p-cont');
      }
      el.innerHTML = subInnerHtml.trim();
      const b = makeBlockDescriptor(el, origBlk.kind);
      b.keepWithNext = false;
      b.splitCount = (origBlk.splitCount || 0) + 1;
      return b;
    }

    // แยกบล็อก HTML ของแต่ละบทออกเป็นบล็อกมาตรฐาน เพื่อนำไปวัดความสูงจริงบนแผ่นกระดาษ A4 (794px × 1123px)
    function splitChapterHtmlToBlocks(bodyHtml) {
      const wrap = document.createElement('div');
      wrap.innerHTML = bodyHtml || '';
      const blocks = [];

      for (const el of [...wrap.children]) {
        const tag = el.tagName;
        if ((tag === 'OL' || tag === 'UL') && el.children.length >= 1) {
          const items = [...el.children];
          let runNum = +(el.getAttribute('start') || 1);
          for (let i = 0; i < items.length; i++) {
            const li = items[i];
            const explicitVal = +(li.getAttribute('value') || 0);
            const itemNum = explicitVal > 0 ? explicitVal : (runNum + i);
            const subList = document.createElement(tag.toLowerCase());
            subList.className = el.className;
            if (tag === 'OL') subList.setAttribute('start', String(itemNum));
            subList.style.marginTop = i === 0 ? '4px' : '2px';
            subList.style.marginBottom = i === items.length - 1 ? '8px' : '2px';
            const newLi = document.createElement('li');
            if (tag === 'OL') newLi.setAttribute('value', String(itemNum));
            newLi.innerHTML = li.innerHTML;
            subList.appendChild(newLi);
            blocks.push(makeBlockDescriptor(subList, 'LI'));
          }
          continue;
        }

        if (el.classList.contains('tbl-wrap')) {
          const tbl = el.querySelector('table');
          const tbodyRows = tbl ? [...tbl.querySelectorAll('tbody tr')] : [];
          if (tbl && tbodyRows.length > 5) {
            const theadHtml = tbl.querySelector('thead')?.outerHTML || '';
            const chunkSize = 5;
            for (let i = 0; i < tbodyRows.length; i += chunkSize) {
              const sliceRows = tbodyRows.slice(i, i + chunkSize).map(r => r.outerHTML).join('');
              const subWrap = document.createElement('div');
              subWrap.className = 'tbl-wrap';
              subWrap.innerHTML = `<table class="${tbl.className}">${theadHtml}<tbody>${sliceRows}</tbody></table>`;
              blocks.push(makeBlockDescriptor(subWrap, 'TABLE'));
            }
            continue;
          }
          blocks.push(makeBlockDescriptor(el, 'TABLE'));
          continue;
        }

        const kind = el.classList.contains('bk-div-item') ? 'DIV_ITEM' : tag;
        blocks.push(makeBlockDescriptor(el, kind));
      }
      return blocks;
    }

    function estimateChapterA4Count(rawText) {
      const len = String(rawText || '').trim().length;
      if (!len) return 0;
      return Math.max(1, Math.ceil(len / 1100));
    }

    function mergePageBlocksHtml(blks) {
      const rawHtml = blks.map(b => b.html).join('');
      const tmp = document.createElement('div');
      tmp.innerHTML = rawHtml;
      const chNodes = [...tmp.children];
      for (let i = 0; i < chNodes.length - 1; i++) {
        const curEl = chNodes[i];
        const nxtEl = chNodes[i + 1];
        if (curEl.tagName === 'OL' && nxtEl.tagName === 'OL' && curEl.className === nxtEl.className) {
          while (nxtEl.firstChild) curEl.appendChild(nxtEl.firstChild);
          curEl.style.marginBottom = nxtEl.style.marginBottom || '8px';
          nxtEl.remove();
          chNodes.splice(i + 1, 1);
          i--;
        }
      }
      return tmp.innerHTML;
    }

    // วัดความสูงจริงบน DOM ของกระดาษ A4 มาตรฐาน (794px × 1123px = 210mm × 297mm) เพื่อให้ทุกแผ่นยาวเท่ากัน 100% และเนื้อหาไม่ล้นไม่แหว่ง
    function paginateBookToA4Sheets(bk, fontSizePx = 22) {
      const isAr = bk.mainLang !== 'th';
      const fs = Math.max(16, Math.min(28, +fontSizePx || 22));
      const A4_H = 1123;
      const PAD_TOP = 56;
      const PAD_SIDE = 66;
      const PAD_BOT = 48;
      const MAX_INNER_H = A4_H - PAD_TOP - PAD_BOT - 135; // 884px เผื่อระยะปลอดภัยสำหรับสระภาษาอาหรับ (تشكيل) และเชิงอรรถใน html2canvas ไม่ให้ทับกันเด็ดขาด

      // สร้างแผ่น A4 จำลองแบบซ่อน (794px × 1123px) ใน Shadow Root เพื่อวัดความสูงพิกเซลจริงของทุกย่อหน้าและเชิงอรรถ
      const probeHost = sr || document.body;
      const probeWrap = document.createElement('div');
      probeWrap.style.cssText = 'position:fixed;left:-19999px;top:0;width:794px;height:1123px;visibility:hidden;pointer-events:none;z-index:-9999;overflow:visible;';
      probeWrap.innerHTML = `
        <article class="bk-a4-sheet bk-chapter-sheet" id="probe-sheet" style="--bk-fs:${fs}px;font-size:${fs}px;line-height:1.78;width:794px!important;height:auto!important;min-height:0!important;max-height:none!important;padding:${PAD_TOP}px ${PAD_SIDE}px ${PAD_BOT}px!important;box-sizing:border-box!important;display:block!important;overflow:visible!important;" dir="${isAr ? 'rtl' : 'ltr'}">
          <div class="bk-page-top" id="probe-top" style="display:flex;flex-direction:column;flex:0 0 auto;">
            <div class="bk-page-hd" id="probe-hd"><span>${escH(bk.title)}</span><span class="ph-ch" id="probe-hd-ch"></span></div>
            <div class="bk-ch-banner" id="probe-banner"><div class="bk-ch-num" id="probe-b-num"></div><div class="bk-ch-name" id="probe-b-name"></div></div>
            <div class="bk-ch-body" id="probe-body"></div>
          </div>
          <div class="bk-fn-sec" id="probe-fn" style="margin-top:10px;"></div>
          <div class="bk-page-ft" id="probe-ft" style="margin-top:10px;"><span class="pf-num">— ١ —</span></div>
        </article>`;
      probeHost.appendChild(probeWrap);

      const probeTop = probeWrap.querySelector('#probe-top');
      const probeHdCh = probeWrap.querySelector('#probe-hd-ch');
      const probeBanner = probeWrap.querySelector('#probe-banner');
      const probeBNum = probeWrap.querySelector('#probe-b-num');
      const probeBName = probeWrap.querySelector('#probe-b-name');
      const probeBody = probeWrap.querySelector('#probe-body');
      const probeFn = probeWrap.querySelector('#probe-fn');
      const probeFt = probeWrap.querySelector('#probe-ft');

      const wantFn = bk.incFootnotes !== undefined ? !!bk.incFootnotes : !!bsState.incFootnotes;
      const collectFootnotes = (blks, fnMap) => {
        if (!wantFn) return [];
        const fnSet = new Set();
        for (const blk of blks) {
          for (const no of blk.fnNums) fnSet.add(no);
        }
        return [...fnSet].map(no => fnMap.get(no)).filter(Boolean);
      };

      const renderFnHtml = (fns, useAr) => {
        if (!wantFn || !fns.length) return '';
        const chNum = n => useAr ? toArNumStr(n) : String(n);
        return fns.map((f, fIdx) => {
          const dispBook = (fIdx === 0 && f.shortBookName) ? f.shortBookName : f.bookName;
          const dispLoc = (fIdx === 0 && f.volPage === 'نفسه' && f.rawVolPage) ? f.rawVolPage : f.volPage;
          const dispQuote = (fIdx === 0 && !f.quote && f.rawQuote) ? f.rawQuote : f.quote;
          return `
          <div class="bk-fn-item" data-fn-item="${f.no}">
            <span class="fn-no">(${chNum(f.no)})</span>
            <b class="fn-bk">«${escH(dispBook)}»</b>${dispLoc ? ` <span class="fn-loc">(${escH(dispLoc)})</span>` : ''}${dispQuote ? `: <span class="fn-qt">«${escH(dispQuote)}»</span>` : '.'}
          </div>`;
        }).join('');
      };

      const measureBlocksHeight = (blks, ch, isFirstPageOfCh, fnMap) => {
        probeBanner.style.display = isFirstPageOfCh ? '' : 'none';
        probeBody.innerHTML = mergePageBlocksHtml(blks);
        const fns = collectFootnotes(blks, fnMap);
        if (fns.length) {
          probeFn.style.display = '';
          probeFn.innerHTML = renderFnHtml(fns, ch.useAr);
        } else {
          probeFn.style.display = 'none';
          probeFn.innerHTML = '';
        }
        const topH = probeTop.offsetHeight;
        const fnH = fns.length ? (probeFn.offsetHeight + 10) : 0;
        const ftH = probeFt.offsetHeight + 10;
        return topH + fnH + ftH;
      };

      const trySplitBlockToFit = (curBlocks, blk, ch, isFirstPageOfCh, fnMap) => {
        if ((blk.splitCount || 0) >= 6) return null;
        if (blk.kind !== 'P' && blk.kind !== 'DIV_ITEM' && blk.kind !== 'LI') return null;
        const sourceInner = blk.kind === 'LI'
          ? (blk.html.match(/<li[^>]*>([\s\S]*?)<\/li>/i)?.[1] || blk.innerHtml)
          : blk.innerHtml;

        for (const byWords of [false, true]) {
          // ถ้าย่อหน้ายังมีประโยคหลายประโยค ให้ตัดตามจุดจบประโยคก่อนเสมอ; ใช้การตัดตามคำเฉพาะกรณีประโยคเดียวยาวเกินหน้ากระดาษ
          if (byWords && curBlocks.length > 0) continue;
          const units = splitHtmlIntoBalancedUnits(sourceInner, byWords);
          if (units.length < 2) continue;

          let lo = 1, hi = units.length - 1, bestK = 0;
          while (lo <= hi) {
            const mid = (lo + hi) >> 1;
            const prefixHtml = units.slice(0, mid).join('').trim();
            const suffixHtml = units.slice(mid).join('').trim();
            const prefixPlainLen = prefixHtml.replace(/<[^>]*>/g, '').trim().length;
            const suffixPlainLen = suffixHtml.replace(/<[^>]*>/g, '').trim().length;
            if (prefixPlainLen < 38) {
              lo = mid + 1;
              continue;
            }
            const candBlk = rebuildSubBlock(blk, prefixHtml, false);
            const h = measureBlocksHeight([...curBlocks, candBlk], ch, isFirstPageOfCh, fnMap);
            if (h <= MAX_INNER_H) {
              if (suffixPlainLen >= 35 || curBlocks.length === 0) bestK = mid;
              lo = mid + 1;
            } else {
              hi = mid - 1;
            }
          }

          if (bestK > 0) {
            const prefixHtml = units.slice(0, bestK).join('').trim();
            const suffixHtml = units.slice(bestK).join('').trim();
            const part1 = rebuildSubBlock(blk, prefixHtml, false);
            const part2 = rebuildSubBlock(blk, suffixHtml, true);
            return [part1, part2];
          }
        }
        return null;
      };

      const chapterPages = [];
      const chStartPageOffset = [];

      try {
        for (const ch of (bk.chapters || [])) {
          chStartPageOffset.push(chapterPages.length);
          const fnMap = new Map((ch.footnotes || []).map(f => [f.no, f]));
          const blocks = splitChapterHtmlToBlocks(ch.bodyHtml);

          probeHdCh.textContent = `${ch.label}: ${ch.title}`;
          probeBNum.textContent = ch.label;
          probeBName.textContent = ch.title;

          if (!blocks.length) {
            chapterPages.push({
              ch,
              pageInCh: 0,
              blocksHtml: '',
              pageFootnotes: [],
            });
            continue;
          }

          let curBlocks = [];
          let pageInCh = 0;
          const chPagesRaw = [];

          const flushPage = (blocksToFlush) => {
            if (!blocksToFlush.length) return;
            chPagesRaw.push([...blocksToFlush]);
            pageInCh++;
          };

          for (let i = 0; i < blocks.length; i++) {
            const b = blocks[i];
            const isFirst = (pageInCh === 0);
            const hWithB = measureBlocksHeight([...curBlocks, b], ch, isFirst, fnMap);

            if (hWithB <= MAX_INNER_H) {
              curBlocks.push(b);
              continue;
            }

            // กรณีใส่ b แล้วล้นหน้า A4:
            // 1) วัดพื้นที่ว่างที่เหลือในหน้าปัจจุบันก่อน (แม้มีหัวข้อ <h4> นำหน้า) ถ้ามีพื้นที่ว่างเพียงพอ (>= 65px) ให้ลองตัดแบ่งย่อหน้า b ตามจุดจบประโยคเพื่อให้วางต่อจากหัวข้อในหน้านี้ได้เลย (ป้องกันหน้าแหว่งเหลือ 2 บรรทัดอย่างหน้า 6)
            const curH = curBlocks.length ? measureBlocksHeight(curBlocks, ch, isFirst, fnMap) : 0;
            const freePx = MAX_INNER_H - curH;
            if (freePx >= 65 || curBlocks.length === 0) {
              const splitPair = trySplitBlockToFit(curBlocks, b, ch, isFirst, fnMap);
              if (splitPair) {
                curBlocks.push(splitPair[0]);
                flushPage(curBlocks);
                curBlocks = [];
                blocks.splice(i + 1, 0, splitPair[1]);
                continue;
              }
            }

            // 2) ถ้าแบ่งย่อหน้า b ลงในหน้านี้ไม่ได้ และท้าย curBlocks มีหัวข้อย่อย <h4> หรือประโยคนำสั้นๆ (keepWithNext) ค้างอยู่ ให้ย้ายหัวข้อนั้นไปขึ้นหน้าใหม่พร้อม b
            const carryOver = [];
            while (curBlocks.length > 1 && curBlocks[curBlocks.length - 1].keepWithNext) {
              carryOver.unshift(curBlocks.pop());
            }
            if (carryOver.length > 0) {
              flushPage(curBlocks);
              curBlocks = [...carryOver];
              i--;
              continue;
            }

            // 3) ถ้าแบ่งย่อหน้าไม่ได้และมีบล็อกในหน้าปัจจุบันแล้ว ให้ปิดหน้านี้แล้วนำ b ไปขึ้นหน้าใหม่
            if (curBlocks.length > 0 && !curBlocks.every(x => x.keepWithNext)) {
              flushPage(curBlocks);
              curBlocks = [];
              i--;
              continue;
            }

            // 4) กรณีหน้าว่างเปล่า (หรือมีแต่หัวข้อนำ) แต่บล็อกเดียวสูงเกินหน้า (เช่น ตารางใหญ่) ให้วางลงหน้านี้แล้วปิดหน้าทันที
            curBlocks.push(b);
            flushPage(curBlocks);
            curBlocks = [];
          }

          if (curBlocks.length > 0) {
            flushPage(curBlocks);
          }

          const chSubToc = [];
          chPagesRaw.forEach((blks, pIdx) => {
            const relPg = chStartPageOffset[chStartPageOffset.length - 1] + pIdx;
            for (const b of blks) {
              if (b.kind === 'H4' && b.text) {
                const rawH = b.text.replace(/^#+|\*+/g, '').trim();
                if (!rawH) continue;
                const colonMatch = rawH.match(/^((?:الفصل|فصل|المبحث|مبحث|المطلب|مطلب|الفرع|فرع|المسألة|مسألة)(?:\s+(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|السابع|الثامن|التاسع|العاشر|[1-9٠-٩]+))?)\s*[:：\-–]\s*(.+)$/);
                const faslMatch = !colonMatch && rawH.match(/^(فصل|مبحث|مطلب|فرع|مسألة|خاتمة|تتمة)\s+(في\s+.+)$/);
                if (colonMatch) {
                  chSubToc.push({ label: colonMatch[1].trim(), title: colonMatch[2].trim(), relPage: relPg });
                } else if (faslMatch) {
                  chSubToc.push({ label: faslMatch[1].trim(), title: faslMatch[2].trim(), relPage: relPg });
                } else {
                  chSubToc.push({ label: '', title: rawH, relPage: relPg });
                }
              }
            }
            const pageFootnotes = collectFootnotes(blks, fnMap);
            chapterPages.push({
              ch,
              pageInCh: pIdx,
              blocksHtml: mergePageBlocksHtml(blks),
              pageFootnotes,
            });
          });
          ch._subToc = chSubToc;
        }
      } finally {
        probeWrap.remove();
      }

      // สร้างรายการสารบัญ (فهرس الموضوعات) ที่มีทั้งระดับบท (الفصل) และหัวข้อย่อย (المبحث) ย่อยภายใต้แต่ละบท พร้อมเลขหน้า A4 จริง
      const tocRows = [];
      (bk.chapters || []).forEach((ch, idx) => {
        const chRelPg = chStartPageOffset[idx] ?? 0;
        tocRows.push({
          type: 'ch',
          chIdx: idx,
          label: ch.label,
          title: ch.title,
          relPage: chRelPg,
        });
        let subs = Array.isArray(ch._subToc) && ch._subToc.length ? ch._subToc : [];
        if (!subs.length && ch.prompt) {
          const promptParts = String(ch.prompt)
            .split(/(?=المبحث\s+(?:الأول|الثاني|الثالث|الرابع|الخامس|السادس|[1-9٠-٩]+)|المطلب\s+(?:الأول|الثاني|الثالث|الرابع))|[؛\n]+/)
            .map(s => s.replace(/^[،,\s\-•]+|[،,\s]+$/g, '').trim())
            .filter(s => s.length >= 6);
          subs = promptParts.map((sp, sIdx) => {
            const m = sp.match(/^((?:المبحث|المطلب)\s+[^:：\-–]{1,22})\s*[:：\-–]\s*(.+)$/);
            return m
              ? { label: m[1].trim(), title: m[2].trim(), relPage: chRelPg }
              : { label: isAr ? `المبحث ${AR_ORDS_FULL[sIdx] || toArNumStr(sIdx + 1)}` : `หัวข้อย่อยที่ ${sIdx + 1}`, title: sp, relPage: chRelPg };
          });
        }
        for (const sub of subs) {
          tocRows.push({
            type: 'sub',
            chIdx: idx,
            label: sub.label,
            title: sub.title,
            relPage: sub.relPage ?? chRelPg,
          });
        }
      });

      const isBookMode = bk.docType === 'book';
      const wantToc = isBookMode ? (bk.incToc !== false) : bsState.incToc;
      const wantBib = isBookMode ? (bk.incBiblio !== false) : bsState.incBiblio;

      const MAX_TOC_WEIGHT = 14.2;
      const tocPages = [];
      if (wantToc && tocRows.length > 0) {
        let curPage = [];
        let curWeight = 0;
        for (let i = 0; i < tocRows.length; i++) {
          const r = tocRows[i];
          const w = r.type === 'ch' ? 1.15 : 0.78;
          const nextIsSub = tocRows[i + 1]?.type === 'sub';
          const needRoom = r.type === 'ch' && nextIsSub ? (w + 0.78) : w;
          if (curPage.length > 0 && (curWeight + needRoom > MAX_TOC_WEIGHT)) {
            tocPages.push(curPage);
            curPage = [];
            curWeight = 0;
          }
          curPage.push(r);
          curWeight += w;
        }
        if (curPage.length > 0) tocPages.push(curPage);
      }

      const BIB_PER_PAGE = 12;
      const bibPages = [];
      if (wantBib && (bk.biblio || []).length > 0) {
        for (let i = 0; i < bk.biblio.length; i += BIB_PER_PAGE) {
          bibPages.push({
            startNo: i + 1,
            items: bk.biblio.slice(i, i + BIB_PER_PAGE),
          });
        }
      }

      const coverCount = bsState.incCover ? 1 : 0;
      const tocCount = tocPages.length;
      // ในโหมดหนังสือ (docType === 'book') ลำดับคือ: صفحة العنوان ← المقدمات ← الأجزاء/الأبواب ← خاتمة ← المصادر ← فهرس الموضوعات
      const firstContentPageNo = isBookMode ? (coverCount + 1) : (coverCount + tocCount + 1);
      const bibStartPageNo = firstContentPageNo + chapterPages.length;
      const tocStartPageNo = isBookMode ? (bibStartPageNo + bibPages.length) : (coverCount + 1);
      const totalSheets = coverCount + tocCount + chapterPages.length + bibPages.length;

      return {
        isAr,
        isBookMode,
        totalSheets,
        coverCount,
        tocPages,
        chapterPages,
        bibPages,
        firstContentPageNo,
        bibStartPageNo,
        tocStartPageNo,
        chStartSheetNo: chStartPageOffset.map(off => firstContentPageNo + off),
      };
    }

    function buildBookInnerHtml(bk, fontSizePx = bsState.previewFontSize || 22, useSlot = true) {
      const pag = paginateBookToA4Sheets(bk, fontSizePx);
      const isAr = pag.isAr;
      const num = n => isAr ? toArNumStr(n) : String(n);
      const totalN = num(pag.totalSheets);
      const wrapSheet = (sheetNo, innerSheetHtml) => useSlot
        ? `<div class="bk-a4-slot" data-sheet="${sheetNo}">${innerSheetHtml}</div>`
        : innerSheetHtml;
      let sheetNo = 0;
      let html = `<div class="bk-paper" dir="${isAr ? 'rtl' : 'ltr'}" data-total-sheets="${pag.totalSheets}">`;

      // 1. แผ่นปกหนังสือ (A4 Sheet #1)
      if (bsState.incCover) {
        sheetNo++;
        html += wrapSheet(sheetNo, `
          <section class="bk-a4-sheet bk-cover-sheet" id="bk-sheet-${sheetNo}" data-sheet="${sheetNo}" dir="${isAr ? 'rtl' : 'ltr'}">
            <div class="bk-cover-bsm">بسم الله الرحمن الرحيم</div>
            <div class="bk-cover-orn">❁ ❁ ❁</div>
            <div class="bk-cover-title">${escH(bk.title)}</div>
            ${bk.subtitle ? `<div class="bk-cover-sub">${escH(bk.subtitle)}</div>` : ''}
            <div class="bk-cover-orn">✦ ─── ✦ ─── ✦</div>
            <div class="bk-cover-meta">
              ${bk.author ? `<div><b>${isAr ? 'إعداد وتأليف:' : 'เรียบเรียงโดย:'}</b> ${escH(bk.author)}</div>` : ''}
              <div>${isAr ? 'عدد الفصول:' : 'จำนวนบท:'} ${num(bk.chapters.length)} · ${isAr ? 'عدد صفحات A4:' : 'จำนวนหน้า A4:'} ${totalN} · ${isAr ? 'المصادر:' : 'แหล่งอ้างอิง:'} ${num(bk.biblio.length)}</div>
              <div>${escH(bk.dateStr)}</div>
            </div>
          </section>`);
      }

      const buildTocSheetsHtml = () => {
        let outToc = '';
        pag.tocPages.forEach((rows, tIdx) => {
          sheetNo++;
          const headHtml = pag.isBookMode
            ? renderRunningHeadHtml(bk.title, Math.max(0, (bk.volumes || 1) - 1), 'فهرس الموضوعات')
            : `<div class="bk-page-hd" dir="rtl"><span>${escH(cleanHeaderBookTitle(bk.title, 38))}</span><span class="ph-ch">${isAr ? 'فهرس الموضوعات' : 'สารบัญ'}${pag.tocPages.length > 1 ? ` (${num(tIdx + 1)})` : ''}</span></div>`;
          outToc += wrapSheet(sheetNo, `
            <section class="bk-a4-sheet bk-toc-sheet" id="bk-sheet-${sheetNo}" data-sheet="${sheetNo}" dir="${isAr ? 'rtl' : 'ltr'}">
              <div class="bk-page-top">
                ${headHtml}
                <h3 class="bk-sec-hd">
                  <span>${isAr ? 'فهرس الموضوعات' : 'สารบัญ'}${tIdx > 0 ? (isAr ? ' (تابع)' : ' (ต่อ)') : ''}</span>
                  <span style="font-size:.72em;color:var(--mut)">${isAr ? 'الصفحة' : 'หน้า'}</span>
                </h3>
                <ul class="bk-toc-list">
                  ${rows.map(r => {
                    const targetSheet = pag.firstContentPageNo + (r.relPage ?? 0);
                    if (r.type === 'sub') {
                      const cleanSubLbl = (r.label && r.label !== '•') ? `${escH(r.label)}:` : '';
                      return `
                        <li class="bk-toc-item bk-toc-sub" data-jump-ch="${r.chIdx}" data-jump-sheet="${targetSheet}">
                          <b class="toc-sub-lbl">↳${cleanSubLbl ? ' ' + cleanSubLbl : ''}</b>
                          <span>${escH(r.title)}</span>
                          <i class="bk-toc-pg">${isAr ? `ص ${num(targetSheet)}` : `หน้า ${targetSheet}`}</i>
                        </li>`;
                    }
                    return `
                      <li class="bk-toc-item bk-toc-ch" data-jump-ch="${r.chIdx}" data-jump-sheet="${targetSheet}">
                        <b>${escH(r.label)}:</b>
                        <span>${escH(r.title)}</span>
                        <i class="bk-toc-pg">${isAr ? `ص ${num(targetSheet)}` : `หน้า ${targetSheet}`}</i>
                      </li>`;
                  }).join('')}
                  ${tIdx === pag.tocPages.length - 1 && pag.bibPages.length ? `
                    <li class="bk-toc-item" data-jump-bib="1" data-jump-sheet="${pag.bibStartPageNo}">
                      <b>${isAr ? 'المصادر:' : 'บรรณานุกรม:'}</b>
                      <span>${isAr ? (pag.isBookMode ? 'المصادر المعتمدة' : 'فهرس المصادر والمراجع') : 'บรรณานุกรมและแหล่งอ้างอิง'} (${num(bk.biblio.length)})</span>
                      <i class="bk-toc-pg">${isAr ? `ص ${num(pag.bibStartPageNo)}` : `หน้า ${pag.bibStartPageNo}`}</i>
                    </li>` : ''}
                </ul>
              </div>
              <div class="bk-page-ft">
                <span class="pf-num">— ${num(sheetNo)} —</span>
              </div>
            </section>`);
        });
        return outToc;
      };

      const buildContentSheetsHtml = () => {
        let outCh = '';
        for (const pg of pag.chapterPages) {
          sheetNo++;
          const ch = pg.ch;
          const chNum = n => ch.useAr ? toArNumStr(n) : String(n);
          const isFirstPageOfCh = pg.pageInCh === 0;
          const contLabel = !isFirstPageOfCh ? (ch.useAr ? ' (تابع)' : ' (ต่อ)') : '';
          const headHtml = pag.isBookMode
            ? renderRunningHeadHtml(bk.title, ch.juz || 0, `${ch.title}${contLabel}`)
            : `<div class="bk-page-hd" dir="rtl"><span>${escH(cleanHeaderBookTitle(bk.title, 38))}</span><span class="ph-ch">${escH(ch.label)}: ${escH(cleanHeaderSubLabel(ch.title, 28))}${contLabel}</span></div>`;
          outCh += wrapSheet(sheetNo, `
            <article class="bk-a4-sheet bk-chapter-sheet" id="${isFirstPageOfCh ? `bk-ch-${ch.index}` : `bk-ch-${ch.index}-p${pg.pageInCh + 1}`}" data-sheet="${sheetNo}" data-ch-idx="${ch.index}" dir="${ch.useAr ? 'rtl' : 'ltr'}">
              <div class="bk-page-top">
                ${headHtml}
                ${isFirstPageOfCh && ch.isVolumeStart ? `<div class="bk-juz-banner">۞ ${escH(ch.volTitle)} ۞</div>` : ''}
                ${isFirstPageOfCh ? `
                  <div class="bk-ch-banner">
                    <div class="bk-ch-num">${escH(ch.label)}</div>
                    <div class="bk-ch-name">${escH(ch.title)}</div>
                  </div>
                ` : ''}
                <div class="bk-ch-body">${pg.blocksHtml}</div>
              </div>
              ${(bk.incFootnotes !== undefined ? bk.incFootnotes : bsState.incFootnotes) && pg.pageFootnotes.length ? `
                <div class="bk-fn-sec">
                  ${pg.pageFootnotes.map((f, fIdx) => {
                    const dispBook = (fIdx === 0 && f.shortBookName) ? f.shortBookName : f.bookName;
                    const dispLoc = (fIdx === 0 && f.volPage === 'نفسه' && f.rawVolPage) ? f.rawVolPage : f.volPage;
                    const dispQuote = (fIdx === 0 && !f.quote && f.rawQuote) ? f.rawQuote : f.quote;
                    return `
                    <div class="bk-fn-item" data-fn-item="${f.no}">
                      <span class="fn-no">(${chNum(f.no)})</span>
                      <b class="fn-bk">«${escH(dispBook)}»</b>${dispLoc ? ` <span class="fn-loc">(${escH(dispLoc)})</span>` : ''}${dispQuote ? `: <span class="fn-qt">«${escH(dispQuote)}»</span>` : '.'}
                    </div>`;
                  }).join('')}
                </div>` : ''}
              <div class="bk-page-ft">
                <span class="pf-num">— ${chNum(sheetNo)} —</span>
              </div>
            </article>`);
        }
        return outCh;
      };

      const buildBibSheetsHtml = () => {
        let outBib = '';
        pag.bibPages.forEach((bp, bIdx) => {
          sheetNo++;
          const headHtml = pag.isBookMode
            ? renderRunningHeadHtml(bk.title, Math.max(0, (bk.volumes || 1) - 1), 'المصادر')
            : `<div class="bk-page-hd" dir="rtl"><span>${escH(cleanHeaderBookTitle(bk.title, 38))}</span><span class="ph-ch">${isAr ? 'فهرس المصادر والمراجع' : 'บรรณานุกรม'}${pag.bibPages.length > 1 ? ` (${num(bIdx + 1)})` : ''}</span></div>`;
          outBib += wrapSheet(sheetNo, `
            <section class="bk-a4-sheet bk-biblio-sheet" id="${bIdx === 0 ? 'bk-biblio-sec' : `bk-biblio-sec-${bIdx + 1}`}" data-sheet="${sheetNo}" dir="${isAr ? 'rtl' : 'ltr'}">
              <div class="bk-page-top">
                ${headHtml}
                <h3 class="bk-sec-hd">
                  <span>${isAr ? (pag.isBookMode ? 'المصادر' : 'فهرس المصادر والمراجع') : 'บรรณานุกรม (المصادر)'} (${num(bk.biblio.length)})${bIdx > 0 ? (isAr ? ' — تابع' : ' — ต่อ') : ''}</span>
                </h3>
                <ol class="bk-bib-list" start="${bp.startNo}">
                  ${bp.items.map((b, idx) => `
                    <li><b class="bk-li-num">${num(bp.startNo + idx)}. </b><b>«${escH(b.bookName)}»</b>${b.authorName ? ` — ${escH(b.authorName)}` : ''}.</li>`).join('')}
                </ol>
              </div>
              <div class="bk-page-ft">
                <span class="pf-num">— ${num(sheetNo)} —</span>
              </div>
            </section>`);
        });
        return outBib;
      };

      // ลำดับในเล่มโหมดหนังสือ: صفحة العنوان ← المقدمات ← الأجزاء/الأبواب ← خاتمة ← المصادر ← فهرس الموضوعات
      if (pag.isBookMode) {
        html += buildContentSheetsHtml();
        html += buildBibSheetsHtml();
        html += buildTocSheetsHtml();
      } else {
        html += buildTocSheetsHtml();
        html += buildContentSheetsHtml();
        html += buildBibSheetsHtml();
      }

      html += `</div>`;
      return html;
    }

    function buildBookPlainText(bk) {
      const isAr = bk.mainLang !== 'th';
      const num = n => isAr ? toArNumStr(n) : String(n);
      const out = [];
      out.push('بسم الله الرحمن الرحيم');
      out.push(`=== ${bk.title} ===`);
      if (bk.subtitle) out.push(bk.subtitle);
      if (bk.author) out.push(`${isAr ? 'إعداد وتأليف:' : 'เรียบเรียงโดย:'} ${bk.author}`);
      out.push('');
      if (bsState.incToc && bk.chapters.length) {
        out.push(isAr ? '--- فهرس الموضوعات ---' : '--- สารบัญ ---');
        bk.chapters.forEach(c => {
          out.push(`• ${c.label}: ${c.title}`);
          const tmpH = document.createElement('div');
          tmpH.innerHTML = c.bodyHtml || '';
          for (const h4 of tmpH.querySelectorAll('h4')) {
            const ht = (h4.textContent || '').trim();
            if (ht) out.push(`   ↳ ${ht}`);
          }
        });
        out.push('');
      }
      for (const ch of bk.chapters) {
        out.push(`==============================`);
        out.push(`${ch.label}: ${ch.title}`);
        out.push(`==============================`);
        const tmp = document.createElement('div');
        tmp.innerHTML = ch.bodyHtml;
        out.push(tmp.textContent.trim());
        if ((bk.incFootnotes !== undefined ? bk.incFootnotes : bsState.incFootnotes) && ch.footnotes.length) {
          out.push('────────────────────');
          ch.footnotes.forEach(f => {
            out.push(`(${ch.useAr ? toArNumStr(f.no) : f.no}) «${f.bookName}»${f.volPage ? ' (' + f.volPage + ')' : ''}${f.quote ? ': «' + f.quote + '»' : '.'}`);
          });
        }
        out.push('');
      }
      if (bsState.incBiblio && bk.biblio.length) {
        out.push(`==============================`);
        out.push(`${isAr ? 'فهرس المصادر والمراجع' : 'บรรณานุกรม'} (${num(bk.biblio.length)})`);
